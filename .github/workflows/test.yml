name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run kerr-geodesics tests
        run: node src/notebooks/kerr-geodesics/integrator.test.js

      - name: Run line-sweep-terrain-lighting solar-day gates
        run: node src/notebooks/line-sweep-terrain-lighting/verify-solar-day.mjs

      - name: Run line-sweep-terrain-lighting night-shading gates
        run: node src/notebooks/line-sweep-terrain-lighting/verify-night-shading.mjs
