  <script id="intro" type="text/markdown">
In September 2026 OpenAI announced that one of its systems had produced a proof that the three-dimensional incompressible Navier–Stokes equations can lose smoothness in finite time, with a complete formalization in Lean 4. The claim resolves alternatives **(C)** and **(D)** of the Clay Millennium Prize problem, the two that ask for a *breakdown* example rather than a proof that solutions stay smooth forever. Priority and independent verification were contested immediately, and none of that is settled here.

What follows is not the proof. It is the picture underneath it, which turns out to be something you already have intuition for.

  <script id="scrolly-helpers" type="text/x-typescript">
/**
 * Wire up the shared scrollyteller shell: a full-bleed container, a background
 * that pins itself while the container is on screen, and one full-height frame
 * per caption.
 */
function buildScrollyteller(id: string, captions: any[]) {
  const container = html`<div class="scrollyteller" id="${id}"></div>`;
  const background = html`<div class="scrollyteller__background"></div>`;
  const fixed = html`<div class="scrollyteller__fixed-content"></div>`;
  const foreground = html`<div class="scrollyteller__foreground"></div>`;

  for (const caption of captions) {
    const frame = html`<div class="scrollyteller__frame"></div>`;
    if (caption.text) {
      const el = html`<div class="scrollyteller__caption" style="
        ${caption.left ? `left: ${caption.left};` : ''}
        ${caption.right ? `right: ${caption.right};` : ''}
        ${caption.top ? `top: ${caption.top};` : ''}
        ${caption.bottom ? `bottom: ${caption.bottom};` : ''}
      "></div>`;
      // A caption may be a node rather than markup, which is what lets one hold
      // a tex expression: `tex` returns an element, so it cannot go through
      // innerHTML.
      if (caption.text instanceof Node) el.appendChild(caption.text);
      else el.innerHTML = caption.text;
      frame.appendChild(el);
    }
    foreground.appendChild(frame);
  }

  background.appendChild(fixed);
  container.appendChild(background);
  container.appendChild(foreground);
  return { container, background, fixed, foreground };
}

const smoothstep = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

/**
 * The readout that says why this ends rather than just repeating: a track from
 * zero to the blowup time, ticked at every generation boundary, with the core
 * speed beside it.
 *
 * The cascade picture on its own is self-similar, and self-similar pictures
 * look eternal -- nothing about a nest of copies says it is over by a fixed
 * moment. The ledger does say it. Generation 1 alone eats half the total time
 * and generation 3 leaves only a sixth of it, so the ticks pile into the right
 * hand end of the track and the fill visibly stalls there, while the speed
 * beside it runs away by four orders of magnitude. Stalling and running away at
 * once is the singularity.
 */
function buildBlowupStrip(fixed: HTMLElement, rows: any[], blowupTime: number, genMax: number) {
  const fill = html`<div class="blowup-strip__fill"></div>`;
  const head = html`<div class="blowup-strip__head"></div>`;
  const track = html`<div class="blowup-strip__track"></div>`;
  track.appendChild(fill);
  for (let n = 1; n <= genMax; n++) {
    const tick = html`<div class="blowup-strip__tick"></div>`;
    tick.style.left = `${(rows[n - 1].end / blowupTime) * 100}%`;
    track.appendChild(tick);
  }
  track.appendChild(head);

  const genLabel = html`<span></span>`;
  const speedLabel = html`<span></span>`;
  const el = html`<div class="blowup-strip">
    <div class="blowup-strip__row">${genLabel}${speedLabel}</div>
    ${track}
    <div class="blowup-strip__row"><span>0</span><span>time → ${tex`T^*`}</span></div>
  </div>`;
  fixed.appendChild(el);

  const compact = new Intl.NumberFormat(undefined, { notation: 'compact', maximumSignificantDigits: 2 });
  const base = rows[0].velocity;

  /** @param gen fractional generation index, from 1. */
  const update = (gen: number, opacity: number) => {
    el.style.opacity = String(opacity);
    const g = Math.min(genMax, Math.max(1, gen));
    const i = Math.min(rows.length - 2, Math.floor(g) - 1);
    const f = g - Math.floor(g);
    const row = rows[i];
    const elapsed = row.start + f * row.duration;
    // Speed grows geometrically, so interpolate it in the log rather than
    // straight: a linear step between 5e3 and 1e4 spends most of its length in
    // the wrong decade.
    const speed = Math.exp(
      Math.log(row.velocity) + f * (Math.log(rows[i + 1].velocity) - Math.log(row.velocity))
    );
    const frac = elapsed / blowupTime;
    fill.style.width = `${frac * 100}%`;
    head.style.left = `calc(${frac * 100}% - 1px)`;
    genLabel.textContent = `generation ${Math.floor(g)}`;
    speedLabel.textContent = `core speed ×${compact.format(speed / base)}`;
  };

  // The frame loop does not run while the figure is off screen, so fill the
  // labels in now and start hidden. Otherwise the strip scrolls into view as an
  // empty box for a frame.
  update(1, 0);
  return update;
}

/** Phones get less geometry and one fewer peel layer. */
function isSmallScreen() {
  return Math.min(screen.width, screen.height) < 520 || navigator.maxTouchPoints > 0;
}

/** Progress through a scrollyteller, in [0, 1]. */
function scrollProgress(container: HTMLElement) {
  const rect = container.getBoundingClientRect();
  const scrollHeight = container.offsetHeight - window.innerHeight;
  if (scrollHeight <= 0) return 0;
  return Math.max(0, Math.min(1, -rect.top / scrollHeight));
}

/** Pin, release, or park the background, and report whether it is on screen. */
function updateBackgroundPosition(container: HTMLElement, background: HTMLElement) {
  const rect = container.getBoundingClientRect();
  const height = window.innerHeight;
  const topAbove = rect.top <= 0;
  const bottomBelow = rect.bottom >= height;
  const fixed = topAbove && bottomBelow;

  background.classList.toggle('is-fixed', fixed);
  background.classList.toggle('is-bottom', topAbove && !fixed);

  return rect.top < height && rect.bottom > 0;
}

/**
 * A corner button that swaps between scrolling the page and rotating the view.
 *
 * On touch devices the canvas starts transparent to pointer events, so a drag
 * scrolls the article. Pressing the button hands pointers to the canvas and
 * turns off touch scrolling over it. A mouse never needs this, since the camera
 * is created with the wheel disabled and dragging does not scroll.
 */
function addModeToggle(fixed: HTMLElement, canvas: HTMLCanvasElement) {
  const isTouch = navigator.maxTouchPoints > 0;
  const button = html`<button class="scrolly-mode" type="button" aria-pressed="false">
    <span>Scroll</span>
  </button>` as HTMLButtonElement;
  if (isTouch) button.classList.add('is-touch');

  let rotating = false;
  const apply = () => {
    canvas.style.pointerEvents = rotating || !isTouch ? 'auto' : 'none';
    canvas.style.touchAction = rotating ? 'none' : 'auto';
    button.setAttribute('aria-pressed', String(rotating));
    button.firstElementChild!.textContent = rotating ? 'Rotate' : 'Scroll';
  };

  button.addEventListener('click', () => { rotating = !rotating; apply(); });
  apply();
  fixed.appendChild(button);
  return button;
}

/** Create the sticky canvas for a scrollyteller, sized to its container. */
function attachCanvas(fixed: HTMLElement) {
  const canvas = document.createElement('canvas');
  canvas.style.cssText =
    'position:absolute;top:0;left:0;width:100%;height:100%;display:block;cursor:grab;';
  fixed.appendChild(canvas);

  // The peel passes cannot be multisampled, so oversample the backing store
  // instead and let the browser downscale.
  const dpi = Math.min(2, window.devicePixelRatio);
  const resize = () => {
    canvas.width = Math.max(1, Math.floor(fixed.offsetWidth * dpi));
    canvas.height = Math.max(1, Math.floor(fixed.offsetHeight * dpi));
  };
  resize();
  return { canvas, resize };
}
  </script>

  <script id="scrolly-stretching" type="module">
await new Promise((r) => setTimeout(r, 100));

{
  const captions = [
    { text: "A vortex line: a thread of spinning fluid, with the flow around it drawn as drifting streaks. It has no ends, because a vortex tube cannot stop in mid-fluid.", left: "8%", bottom: "12%" },
    { text: "Now a second, unrelated motion: the fluid is pulled apart along that same axis, and drawn inward from the sides to replace it.", right: "8%", bottom: "12%" },
    { text: "Run both at once.", left: "8%", bottom: "12%" },
    { text: "Stretching it makes it thinner and pulls it straight. The fluid is drawn inward and whips faster, because the same circulation now wraps a smaller circle.", right: "8%", bottom: "12%" },
    { text: "A skater pulling their arms in. Nothing is added; the rotation just has less room.", left: "8%", bottom: "12%" },
    { text: "Thinner, faster, finer. This is the turbulent cascade, energy walking down the scales.", right: "8%", bottom: "12%" },
    { text: "And normally it stops. Below some scale viscosity spreads the core faster than stretching can thin it, and the cascade dies out.", left: "8%", bottom: "12%" }
  ];

  // One pull, start to finish. The stretch rises once and then levels off,
  // which is the last caption: viscosity catching up is the curve going flat,
  // not a new thing appearing. The strain arrows are on only while it is rising,
  // since they are there to show a change and there is nothing to show once it
  // stops.
  const frameCount = captions.length;
  const sequencer = createSequencer({
    tubeOpacity:   [{ t: 0, value: 0 }, { t: 0.45, value: 0.8 }, { t: 7, value: 0.8 }],
    streakOpacity: [{ t: 0, value: 0 }, { t: 0.55, value: 1 }, { t: 1.2, value: 1 }, { t: 1.8, value: 0.06 }, { t: 2.4, value: 0.06 }, { t: 3.0, value: 1 }],
    axialOpacity:  [{ t: 1.15, value: 0 }, { t: 1.8, value: 1 }, { t: 5.4, value: 1 }, { t: 6.2, value: 0 }],
    radialOpacity: [{ t: 1.15, value: 0 }, { t: 2.0, value: 1 }, { t: 5.4, value: 1 }, { t: 6.2, value: 0 }],
    stretch:       [{ t: 2.4, value: 1 }, { t: 3.4, value: 1.35 }, { t: 4.6, value: 2.0 }, { t: 5.8, value: 3.0 }, { t: 6.4, value: 3.2 }, { t: 7, value: 3.2 }],
    distance:      [{ t: 0, value: 5.8 }, { t: 4.6, value: 6.3 }, { t: 6.4, value: 6.7 }]
  });

  const { container, background, fixed } = buildScrollyteller('scrolly-stretching', captions);
  display(container);
  await new Promise((r) => setTimeout(r, 100));

  const { canvas, resize } = attachCanvas(fixed);
  addModeToggle(fixed, canvas);

  const gpuContext = canvas.getContext('webgpu');
  gpuContext.configure({ device, format: canvasFormat, alphaMode: 'opaque' });

  const camera = createUnifiedCamera(canvas, {
    mode: 'orbit',
    distance: 5.6,
    theta: 0.18,
    phi: 0.6,
    fov: 0.7,
    wheel: false,
    renderContinuously: false
  });

  const renderer = createRenderer(device, canvasFormat, { tube: tubeShaderCode, composite: compositeShaderCode });
  const small = isSmallScreen();
  const scene = buildLessonScene({});
  renderer.setLayer('tube', scene.tube);
  renderer.setLayer('streakFast', scene.streakFast);
  renderer.setLayer('streakMid', scene.streakMid);
  renderer.setLayer('streakSlow', scene.streakSlow);
  renderer.setLayer('axialUp', scene.axialUp);
  renderer.setLayer('axialDown', scene.axialDown);
  renderer.setLayer('radial', scene.radial);

  // Circulation around the core is conserved, so the angular rate rises in step
  // with how much the core has been stretched. One number drives both the
  // visible rotation and how fast the pulses run along the arrows.
  const streakAngle = new Float64Array(STREAKS.length);
  // Pulse phases are integrated, not derived from a clock times a rate: the
  // swirl rate follows the stretch, and multiplying a changing rate by an
  // absolute time slews the pulses by whole cycles.
  // Parcels of fluid carried by the straining flow. An arrow is that parcel's
  // velocity vector, so it lengthens as the parcel accelerates outward along
  // the axis and shortens as it slows on its way in. Pinning them in place, as
  // fixed labels, left them frozen while everything they annotate moved.
  const parcels = seedStrainParcels();
  let elapsed = 0;
  let smoothed = 0;
  let last = performance.now();

  const loop = createFrameLoop((now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!updateBackgroundPosition(container, background)) return;

    smoothed += (scrollProgress(container) - smoothed) * 0.1;
    sequencer.setPosition(smoothed * frameCount);
    const s = sequencer.getState();

    // Set the camera before drawing, or the distance trails the scroll by a frame.
    camera.setState({ distance: s.distance });

    const sy = s.stretch;
    const sr = 1 / Math.sqrt(sy);

    for (let i = 0; i < STREAKS.length; i++) {
      streakAngle[i] += (dt * SWIRL_STRENGTH * sy) / (STREAKS[i].radius * STREAKS[i].radius);
    }

    // The straining arrows are Eulerian, so their highlights run at the local
    // speed of the strain: u_z = gamma z along the axis and u_r = -gamma r / 2
    // across it, each divided by the length of the arrow drawing it.
    elapsed += dt;

    // Advect the parcels: dz/dt = gamma z away from the stagnation plane and
    // dr/dt = -gamma r / 2 toward the axis, which is the strain exactly. Each
    // is recycled once it has run its course.
    const grow = Math.exp(GAMMA * dt);
    const draw = Math.exp((-GAMMA * dt) / 2);
    for (const p of parcels.axial) {
      p.z *= grow;
      p.radius *= draw;
      if (p.z > AXIAL_SPAN[1]) { p.z = AXIAL_SPAN[0]; p.radius = 0.98; }
    }
    for (const p of parcels.radial) {
      p.radius *= draw;
      if (p.radius < RADIAL_SPAN[0]) p.radius = RADIAL_SPAN[1];
    }

    // The core is an open, gently curved tube. Stretching narrows it and never
    // lengthens it into view, and because the lateral wander scales with the
    // radius the line visibly pulls straight as it thins. Material markers
    // carry no highlight of their own.
    // A slow breath on the core, and a slight bob on each loop. Neither is a
    // real vortex evolution; they are there so the figure reads as a process
    // rather than a diagram. The loops breathe with the core, since they are
    // painted on it.
    const breath = 1 + 0.035 * Math.sin(0.55 * elapsed);
    const core = { stretchR: sr * breath, opacity: s.tubeOpacity, pulseAmp: 0, writhe: WRITHE };

    // Material loops painted on the tube. The flow carries them apart in
    // proportion to the stretch, contracts them with the core, and turns them.
    // Each streak is carried by the flow: drawn inward as the core contracts,
    // apart as it is stretched, and around at its own rate. The offset is
    // applied before the scale, so the height divides through.
    const swarm = { streakFast: [], streakMid: [], streakSlow: [] };
    STREAKS.forEach((t, i) => {
      swarm[t.band].push({
        offsetR: t.radius * sr * breath,
        offsetY: t.y * sy + 0.03 * Math.sin(0.7 * elapsed + i),
        twist: t.twist + streakAngle[i],
        opacity: s.streakOpacity,
        pulseAmp: 0
      });
    });

    // Fade a parcel in as it is born and out as it is retired, so recycling
    // never shows as a pop.
    const ends = (f) => smoothstep(0, 0.14, f) * (1 - smoothstep(0.86, 1, f));

    const strainUp = [];
    const strainDown = [];
    const axialLife = Math.log(AXIAL_SPAN[1] / AXIAL_SPAN[0]);
    for (const p of parcels.axial) {
      // The arrow is the velocity vector: u_z = gamma z, drawn to scale.
      const length = SPEED_TO_LENGTH * GAMMA * p.z;
      const inst = {
        scale: length,
        twist: p.twist,
        offsetR: p.radius / length,
        offsetY: (p.sign * p.z) / length,
        opacity: s.axialOpacity * ends(Math.log(p.z / AXIAL_SPAN[0]) / axialLife),
        pulseAmp: 0
      };
      (p.sign > 0 ? strainUp : strainDown).push(inst);
    }

    const radialLife = Math.log(RADIAL_SPAN[1] / RADIAL_SPAN[0]);
    const radialRing = parcels.radial.map((p) => {
      // u_r = -gamma r / 2, so an inflow arrow shortens as it closes on the axis.
      const length = SPEED_TO_LENGTH * GAMMA * p.radius * 0.5;
      return {
        scale: length,
        twist: p.twist,
        offsetR: (p.radius - length) / length,
        offsetY: p.y / length,
        opacity: s.radialOpacity * ends(Math.log(RADIAL_SPAN[1] / p.radius) / radialLife),
        pulseAmp: 0
      };
    });

    renderer.render(gpuContext, {
      background: themeState.background,
      isDark: themeState.isDark,
      time: elapsed,
      flowRate: 1.0,
      flowAmp: 0.85,
      sceneRadius: 3.2,
      peelLayers: small ? 3 : 4,
      layers: [
        { id: 'tube', instances: [core] },
        { id: 'streakSlow', instances: swarm.streakSlow },
        { id: 'streakMid', instances: swarm.streakMid },
        { id: 'streakFast', instances: swarm.streakFast },
        { id: 'axialUp', instances: strainUp },
        { id: 'axialDown', instances: strainDown },
        { id: 'radial', instances: radialRing }
      ]
    }, camera, canvas.width, canvas.height);
  });

  const onResize = () => { resize(); camera.taint(); };
  window.addEventListener('resize', onResize);
  invalidation.then(() => {
    loop.cancel();
    window.removeEventListener('resize', onResize);
    camera.destroy();
    renderer.destroy();
  });
}
  </script>

  <script id="after-stretching" type="text/markdown">
That last step is the whole difficulty of the problem. Stretching sharpens a vortex; viscosity smooths it. In every fluid anyone has ever measured, viscosity wins in the end, at a small but strictly positive scale. Whether it *must* win is what the Millennium problem asks.

The construction below is an argument that it need not.
  </script>

  <script id="scrolly-cascade" type="module">
await new Promise((r) => setTimeout(r, 100));

{
  const captions = [
    { text: "Here is the same mechanism, tuned so that it never runs out.", left: "8%", bottom: "12%" },
    { text: "Each generation is a copy of the last, shrunk by a fixed factor and running faster, nested inside it.", right: "8%", bottom: "12%" },
    { text: "Every generation is <em>more</em> inviscid than the last, so diffusion is always a step behind.", left: "8%", bottom: "12%" },
    { text: "And each takes less time than the last. Watch the clock: the first generation alone spends half of all the time there is, and every one after it crowds into what little is left.", right: "8%", bottom: "12%" },
    { text: html`So the clock stalls just short of ${tex`T^*`} while the speed runs away. Infinitely many generations, finite total time, and nowhere for the velocity to end up but infinity.`, left: "8%", bottom: "12%" }
  ];

  const frameCount = captions.length;
  const COPIES = 5;
  const TWIST = 0.9;

  // The readout is drawn from the ledger at a fixed h. The slider further down
  // the page is a different cell; reading it here would tear down the GPU
  // pipelines on every drag.
  const H_STRIP = 0.25;
  const GEN_MAX = 16;

  const sequencer = createSequencer({
    zoom:          [{ t: 0, value: 0 }, { t: frameCount, value: 3.4, ease: linear }],
    streamOpacity: [{ t: 0, value: 0 }, { t: 0.5, value: 1 }],
    // The descent through generations, which the readout reports. It runs well
    // past the 3.4 chart steps the picture zooms through, because the point it
    // has to make is what happens after the picture stops being able to show
    // anything: by generation 16 the elapsed time is within 4% of T*.
    gen:           [{ t: 0, value: 1 }, { t: frameCount, value: GEN_MAX, ease: linear }],
    stripOpacity:  [{ t: 0, value: 0 }, { t: 0.6, value: 1 }]
  });

  const ledgerRows = Scales.ledger(H_STRIP, GEN_MAX + 2);
  const blowupTime = Scales.blowupTime(H_STRIP);

  const { container, background, fixed } = buildScrollyteller('scrolly-cascade', captions);
  display(container);
  await new Promise((r) => setTimeout(r, 100));

  const { canvas, resize } = attachCanvas(fixed);
  addModeToggle(fixed, canvas);
  const updateStrip = buildBlowupStrip(fixed, ledgerRows, blowupTime, GEN_MAX);

  const gpuContext = canvas.getContext('webgpu');
  gpuContext.configure({ device, format: canvasFormat, alphaMode: 'opaque' });

  const camera = createUnifiedCamera(canvas, {
    mode: 'orbit',
    distance: 17,
    theta: 0.14,
    phi: 0.5,
    // No centre offset. The cascade geometry is centred on the origin (its
    // world bbox spans y in [-3.37, 3.25]), and every generation is scaled
    // about the origin too, so that is where the camera must look. Aiming it
    // at y = 2.2 put the figure 143 px low on an 844 px screen -- 17% of the
    // height -- which is not a viewport problem and no CSS unit can fix it.
    fov: 0.75,
    wheel: false,
    renderContinuously: false
  });

  const renderer = createRenderer(device, canvasFormat, { tube: tubeShaderCode, composite: compositeShaderCode });

  // One generation's streamlines, integrated once. Every other generation is
  // this same geometry at a different scale.
  const field = createField({ gamma: 1.6, omega: 3.0, sigma: 0.7, zH: 1.15, zK: 0.95 });
  const small = isSmallScreen();
  // Few, thick and short. Densely packed thin tubes read as mud rather than as
  // a flow, and several generations are on screen at once.
  const lines = seedRings(field, {
    rings: 4,
    perRing: small ? 6 : 7,
    rMin: 0.36, rMax: 2.7, zSeed: 0.9,
    step: 0.022, maxSteps: small ? 440 : 520, bound: 4.6,
    // Stop a streamline once the fluid all but stops. The dash pattern below is
    // periodic in advection time, so its wavelength is proportional to the local
    // speed, and the near-stagnant tails would draw dashes a fraction of a pixel
    // long. Cutting at 0.12 takes the spread of speeds along a line from 12.6:1
    // down to 5.4:1 and drops 46% of the samples, which the phones also want.
    minSpeed: 0.12
  });
  const range = speedRange(lines);
  renderer.setLayer('stream', toYUp(mergeMeshes(lines.map((l) =>
    tubeMesh(decimate(l, 3), { radius: 0.045, sides: 7, scalarRange: range })
  ))));

  const smoothstep = (a, b, x) => {
    const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  };

  /**
   * Pulse rate for a copy drawn at unit scale, at the top of the scroll, in
   * pulses per second.
   */
  const PULSE_RATE = 1.0;

  /**
   * How much faster everything runs per generation of zoom.
   *
   * Something has to depend on the total zoom or the figure cannot appear to
   * speed up at all. The zoom recycles a fixed set of copies: as it advances by
   * one, every copy's generation index slides by one and the slots relabel, so
   * a rate that is any function of that index alone repeats exactly. Measured,
   * the visible arrangement at zoom 0, 1, 2 and 3 was identical to the last
   * digit, which is why the descent looked like a still picture.
   *
   * The true factor is the manuscript's own time zoom T_g = 4 + sqrt(2). Over
   * the 3.4 generations this scroll covers that is 312x, which takes a rate you
   * can follow at the top into a strobe at the bottom, so it is compressed to 2
   * per generation, about 6x end to end. The acceleration is real and the
   * ordering is right; only its steepness is dialled back.
   */
  const ZOOM_ACCEL = 2;

  /**
   * A ceiling on the rate, applied smoothly. The innermost copies are both the
   * smallest and the quickest, and without it they cross into flicker.
   */
  const PULSE_CAP = 7;

  // Phase is accumulated per slot rather than taken as a clock times a rate,
  // because the rate depends on the zoom and the zoom moves with the scroll:
  // multiplying a large elapsed time by a rate that changes would slew the
  // pulses by whole cycles for a fractional change. Only the fractional part is
  // ever read, so wrapping it keeps f32 precision exact no matter how long the
  // page has been open.
  const slotPhase = new Float64Array(COPIES);

  let smoothed = 0;
  let last = performance.now();
  const loop = createFrameLoop((now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!updateBackgroundPosition(container, background)) return;

    smoothed += (scrollProgress(container) - smoothed) * 0.1;
    sequencer.setPosition(smoothed * frameCount);
    const s = sequencer.getState();

    // Generation m is drawn at scale Lambda^-m about the blowup point, a family
    // that maps onto itself when m shifts by one. Sweeping m and recycling the
    // copies through a fade is an unbroken zoom, and because the generations
    // share a centre it is a zoom about the middle of the frame rather than a
    // drift across it. It is also the truer arrangement: the cascade
    // concentrates at a point rather than stringing out along the axis.
    updateStrip(s.gen, s.stripOpacity);

    const u = s.zoom - Math.floor(s.zoom);
    const instances = [];
    for (let k = 0; k < COPIES; k++) {
      const m = k - u;
      const scale = Math.pow(Scales.LAMBDA, -m);
      // Rate inversely proportional to the copy's scale, so the pulses travel at
      // one speed across the screen however deep the packet is and the nesting
      // reads as a single continuous flow. A smaller copy is not slower for it:
      // its pulses are closer together, so they arrive more often, which is the
      // generation running faster.
      const raw = (PULSE_RATE * Math.pow(ZOOM_ACCEL, s.zoom)) / scale;
      slotPhase[k] = (slotPhase[k] + dt * PULSE_CAP * Math.tanh(raw / PULSE_CAP)) % 1;
      instances.push({
        scale,
        twist: m * TWIST,
        opacity: s.streamOpacity * smoothstep(-1, 0, m) * (1 - smoothstep(COPIES - 2, COPIES - 1, m)),
        phase: slotPhase[k],
        pulseAmp: 1
      });
    }

    renderer.render(gpuContext, {
      background: themeState.background,
      isDark: themeState.isDark,
      flowRate: 2.0,
      flowAmp: 0.55,
      sceneRadius: 9,
      peelLayers: small ? 3 : 4,
      layers: [{ id: 'stream', instances }]
    }, camera, canvas.width, canvas.height);
  });

  const onResize = () => { resize(); camera.taint(); };
  window.addEventListener('resize', onResize);
  invalidation.then(() => {
    loop.cancel();
    window.removeEventListener('resize', onResize);
    camera.destroy();
    renderer.destroy();
  });
}
  </script>

  <script id="formulation-intro" type="text/markdown">
## Writing it down

Everything above is qualitative. Here is the same object stated precisely enough to implement, taken from the Lean sources published with the paper.

The flow is axisymmetric with swirl. Let ${tex`s = (x_0^2 + x_1^2)/2`}, half the squared distance from the axis, and pick two scalar profiles ${tex`H(s,z)`} and ${tex`K(s,z)`}. The velocity is the curl of

${tex.block`A = -\tfrac{1}{2} x_1 H \,e_0 + \tfrac{1}{2} x_0 H \,e_1 + K \,e_2,`}

which in cylindrical components is

${tex.block`u_r = -\tfrac{r}{2}\,\partial_z H, \qquad u_\theta = -r\,\partial_s K, \qquad u_z = \partial_s\!\left(s H\right).`}

${tex`H`} is the stretching from the walkthrough and ${tex`K`} is the spin. Using ${tex`s`} instead of ${tex`r`} is not cosmetic: it is what keeps the field smooth on the axis, since nothing is ever divided by the radius. Taking ${tex`H = \gamma z`} and ${tex`K = -\omega s`} near the axis recovers exactly the picture above, ${tex`u_r = -\gamma r/2`}, ${tex`u_z = \gamma z`}, ${tex`u_\theta = \omega r`}, and that is what the figures are drawn from.
  </script>

  <script id="ledger-text" type="text/markdown">
The generations are indexed by ${tex`n`}, on a dyadic parameter ${tex`Q_n = 2^{-n}`} with a polynomial weight ${tex`S_n = n^2`}. Two constants set the geometry, a time zoom and a space zoom,

${tex.block`T_g = 4 + \sqrt{2} \approx 5.414, \qquad \Lambda = 4 - \sqrt{2} \approx 2.586,`}

whose ratio gives the self-similar exponent ${tex`\rho = \log \Lambda / \log T_g \approx 0.5625`}, so lengths scale against times like ${tex`r \sim t^{\rho}`}. ${tex`\Lambda`} is the factor between successive packets in the figure above. Generation ${tex`n`} gets a native index ${tex`\nu(n) = \lfloor \log_{T_g}(Q_n^{-1-h}/n^2) \rfloor`} and from it

${tex.block`\tau_n = T_g^{\nu(n)}\, Q_n^{1+h}, \qquad R_n = \Lambda^{\nu(n)}\, Q_n^{(1+h)\rho - h\kappa},`}

with ${tex`\kappa = 10^{-5}`} and ${tex`h \in (0, \tfrac12)`} free. Its core carries velocity ${tex`Q_n^{-(1/2+h)}`} across radial width ${tex`Q_n^{1/2}`} and axial length ${tex`Q_n^{1/2-h}`}, so the Reynolds number on the radial scale is ${tex`\mathrm{Re}_n = Q_n^{-h} = 2^{nh}`}, growing geometrically. That is the frame-3 claim made precise, and why ${tex`h`} must be strictly positive.

The floor in ${tex`\nu(n)`} looks like an accounting detail and is in fact the point. It makes ${tex`T_g^{\nu(n)}`} very nearly cancel ${tex`Q_n^{-1-h}/n^2`}, leaving

${tex.block`\tau_n \asymp \frac{1}{n^2},`}

and ${tex`\sum_n n^{-2}`} converges. Infinitely many stages, finite total time.
  </script>

  <script id="ledger-controls" type="text/x-typescript">
const h = view(Inputs.range([0.05, 0.45], { label: 'h', value: 0.25, step: 0.01 }));

  <script id="ledger-figure" type="text/x-typescript">
const rows = Scales.ledger(h, 40);
const T = Scales.blowupTime(h);
const panelWidth = width > 560 ? Math.floor((Math.min(width, 720) - 16) / 2) : Math.min(width, 720);

const staircase = Plot.plot({

  ]
});

const magnitudes = Plot.plot({

display(html`<figure style="margin:1em 0">
  <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:center">${staircase}${magnitudes}</div>
  <figcaption>
    Elapsed time accumulates in ever shorter slots and stalls at ${tex`T^*`}, while the core speed
    leaves the top of a logarithmic axis and the core radius leaves the bottom. Move ${tex`h`} to
    see how little room there is between a cascade that outruns diffusion and one that does not.
  </figcaption>
</figure>`);

  <script id="closing" type="text/markdown">
The forcing carries the rest. The theorem is not that a fluid at rest tears itself apart unaided, but that there is a smooth, finite-energy forcing which drives one from rest into a singularity in finite time. That is exactly what alternatives (C) and (D) ask for.
  </script>

  <script id="caveats" type="text/markdown">
## What is exact here, and what is not

The ansatz, the constants ${tex`T_g = 4+\sqrt 2`}, ${tex`\Lambda = 4-\sqrt 2`} and ${tex`\kappa = 10^{-5}`}, the definitions of ${tex`\nu(n)`}, ${tex`\tau_n`} and ${tex`R_n`}, and the core velocity, radial and axial scalings are transcribed from the published Lean 4 sources in [openai/NavierStokesAndEuler](https://github.com/openai/NavierStokesAndEuler), specifically `ChartScales.lean`, `SlotColoring.lean`, `Scaling.lean` and `AxisymmetricFields.lean`. The plots are those formulas evaluated, the ratio between successive packets in the second figure is the manuscript's ${tex`\Lambda`}, and the streamlines are integrated from a genuine curl of the stated potential, divergence-free to roundoff.

The profiles are not exact. The manuscript's ${tex`H`} and ${tex`K`} come out of an inductive scheme with corrections at every stage and are not something you can write on a line. The figures substitute the simplest profiles with the right behaviour, a localized axial strain and a Gaussian-cored swirl. One packet is drawn per generation, where the construction places many on a mesh of spacing ${tex`Q_n^a/n^6`}. Generations are nested about the point the cascade concentrates on, each turned by a fixed angle from the last so they can be told apart. Successive packets differ only in scale, since after rescaling a self-similar cascade repeats; the real generations also drift in shape, and that drift is not drawn.

The first walkthrough is a diagram rather than a simulation. It is drawn to one rule: everything on screen either moves with the fluid or measures it, and nothing does both.

The core is a vortex tube, so it has no ends and it thins rather than lengthens. The streaks are parcels of fluid orbiting it, at the free-vortex rate ${tex`u_\theta = \Gamma / 2\pi r`}, which is why the ones near the axis whip round and the outer ones barely drift. They are carried inward as the core contracts and apart as it is stretched, so their radius goes like ${tex`S^{-1/2}`} and their angular rate like ${tex`S`}, leaving ${tex`\Gamma \sim \Omega r^2`} exactly constant. Nothing about the spin is exaggerated: the sequence stretches further instead. Arrows mean one thing only, the straining flow, and each is the velocity vector of the parcel carrying it, drawn to scale, lengthening as ${tex`u_z = \gamma z`} carries it out and shortening as ${tex`u_r = -\gamma r/2`} brings it in.

Two things there are for legibility rather than fidelity. The strain runs at a fixed rate while the reader controls how far it has progressed, so the arrows keep streaming when you stop to read. And the core breathes slightly while the streaks bob, which no vortex does, so that a paused figure still reads as a process.

This is a picture of the mechanism, not a rendering of the solution. Whether the proof is correct is a question for referees, and at the time of writing it is open.
  </script>
