  <script id="intro" type="text/markdown">
    Why is pressing up to a handstand so much harder than kicking up to one? Ask around and you will collect a pile of explanations: not enough shoulder strength, tight shoulders, stiff wrists, short hamstrings, bad timing. Some of these are real constraints. Some, I suspect, are folklore. This notebook builds a small physics model of a handstand and uses it to find out which is which.

    The model is a two dimensional, side view rigid body model of a person balancing on their hands. It is deliberately simple, but it is quantitative: segment masses and lengths come from published anthropometric tables, joint strength comes from measured torque and velocity relationships, and every claim the notebook makes is something you can recompute by dragging a slider. This first part builds the model and works out the statics of holding a handstand. The dynamics of getting into one, the kick-up, the press, and the question of which limitations actually matter, build on top of it.
  </script>

  <script id="model-section" type="text/markdown">
    ## A stick figure gymnast

    The body is seven rigid segments in the sagittal plane, viewed from the side. Both arms act together in a handstand, so by symmetry they merge into a single arm segment, and likewise the two hands merge into one. The legs stay independent so that later on the model can lunge and kick. That leaves a hand resting flat on the floor, one straight arm from wrist to shoulder, a torso with the head attached, and a thigh and shank per leg, connected by six joints: wrist, shoulder, two hips, and two knees.

    Segment masses, mass centers, and moments of inertia follow de Leva's adjustment of the Zatsiorsky segment inertia parameters, scaled by height and body mass. The hand is the interesting segment: it is not a point of support but a patch, from the heel of the palm to the finger pads. Where the pressure lands inside that patch is the entire mechanism of handstand balance, which the next section makes precise.
  </script>

  <script id="statics-section" type="text/markdown">
    ## Balance is a statics problem

    A pose at rest balances when the center of mass sits directly above the center of pressure, and the center of pressure has nowhere to live except the palm patch:

    ${tex.block`x_{\mathrm{CoM}} = x_{\mathrm{CoP}}, \qquad x_{\mathrm{heel}} \;\le\; x_{\mathrm{CoP}} \;\le\; x_{\mathrm{fingertips}}.`}

    The wrist is what moves the center of pressure. Pressing down through the fingertips shifts it forward; rocking onto the heel of the palm shifts it back. For body weight ${tex`W`} the wrist torque required to hold the pressure at a given spot is

    ${tex.block`\tau_{\mathrm{wrist}} = W\,(x_{\mathrm{CoP}} - x_{\mathrm{wrist}}),`}

    so the patch length times body weight is the entire balance authority available in a handstand. This is the wrist strategy that motion capture studies find gymnasts using more than three quarters of the time. Every other joint torque in a static pose is set by gravity: each joint must resist the moment of all the mass beyond it. That is what makes a pose expensive, and it is what the next figure maps.
  </script>
  <script id="flexibility-section" type="text/markdown">
    ## What flexibility limits actually do

    A shoulder that cannot open to 180 degrees tips the torso off the vertical line, and the pose has to buy that angle back somewhere: arch the back and let the legs travel past vertical, which is the banana, or lean the whole stack toward the fingertips. Lower the wrist limit and the arm itself cannot stand vertical over the palm, forcing a lean that the shoulders must then fight. Neither compensation is free, and the figure below prices them: the limits sit under the map, and moving one moves the wall it owns.

    The hamstrings enter differently, because they are a two joint muscle group. What they limit is not any single joint but the combination of hip flexion and knee extension. With knees straight, hip flexion caps at the toe touch limit; every degree of knee bend buys some of it back. That coupling is why a bent knee press exists, and the model expresses it directly in the hip slider clamp.
  </script>
  <script id="corridor-intro" type="text/markdown">
    ## The press corridor

    A press to handstand is, in the quasi static limit, a path through pose space that keeps the center of mass over the palm the whole way: from a deep pike, through compression, to the stacked handstand. For each combination of hip and shoulder angle, the model solves for the wrist angle that balances the pose, then asks whether that pose is reachable within the flexibility limits and holdable within the strength limits. The result is a corridor: the region of pose space a press is allowed to pass through. Tighten the shoulders or the hamstrings underneath it and watch the corridor narrow.
  </script>
  <script id="pose-probe" type="text/x-typescript">
    // Both the press corridor and the catch window are maps over coordinates
    // nobody can picture: "hip 80, shoulder 30" and "wrist +12 deg at 1.4
    // rad/s" mean nothing as numbers. This is the body those numbers stand
    // for, drawn next to the plot and driven by whatever the cursor is over.
    // The window has to be given, not defaulted: a body piked to 130 deg
    // reaches almost 0.9 m behind the hand, and centering on the hand the way
    // a straight handstand wants cuts the legs off the canvas.
    const makePoseProbe = ({ w = 156, h = 220, view = { cx: 0.1, yLo: -0.15, yHi: 2.15 } } = {}) => {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * devicePixelRatio);
      canvas.height = Math.round(h * devicePixelRatio);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      const note = html`<small style="display:block; opacity:.75; min-height:3.2em; line-height:1.3;"></small>`;
      const element = html`<div style="flex:0 0 auto; width:${w}px;">${canvas}${note}</div>`;
      const ctx = canvas.getContext('2d');
      return {
        element,
        draw(q, text = '', jointMarks = null) {
          ctx.save();
          ctx.scale(devicePixelRatio, devicePixelRatio);
          ctx.clearRect(0, 0, w, h);
          if (q) {
            drawScene(ctx, {
              model, ws, q, width: w, height: h, theme: poseState.theme, view,
              jointMarks,
            });
          }
          ctx.restore();
          note.textContent = text;
        },
      };
    };

    // Plot renders a figure that may also contain a legend svg; the plot
    // itself is the tallest one. Its scales invert in CSS pixels relative to
    // that svg, which is what a pointer event gives us.
    // Plot returns a <figure> when it draws a legend and a bare <svg>
    // otherwise. The figure carries a browser default margin that opens a gap
    // the width of the page, and it holds two svgs: the legend ramp first,
    // then the plot. Pick by the height we asked for, NOT by measuring: this
    // runs before the chart is in the document, so every getBoundingClientRect
    // is 0x0, a sort by size is a no-op, and the first svg wins -- which is
    // the legend. That is how the pointer handler ended up on the colour bar.
    const plotSurface = (chart, minHeight) => {
      chart.style.margin = '0';
      if (chart.tagName.toLowerCase() === 'svg') return chart;
      const svgs = [...chart.querySelectorAll('svg')];
      return svgs.find((sv) => +sv.getAttribute('height') >= minHeight)
        || svgs[svgs.length - 1] || null;
    };
  </script>
  <script id="corridor-frame" type="text/x-typescript">
    // The corridor is a picture of two limits, and until now the sliders that
    // set those limits lived in the pose panel, several screens up. They are
    // mirrored here so the wall you are looking at is the wall you move.
    //
    // The mirrors have to live in a cell of their own. This cell reads the
    // input elements and never their values, so dragging one does not
    // re-run the cell and destroy the slider under the cursor mid-drag. The
    // map is rebuilt on every change by the press-corridor cell, which
    // renders into corridorSlot rather than displaying anything itself.
    const corridorSlot = html`<div></div>`;
    const corridorLimits = (() => {
      const box = html`<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:0 18px; margin-top:8px;"></div>`;
      const mirror = (domain, opts, source) => {
        const input = Inputs.range(domain, opts);
        Inputs.bind(input, source, invalidation);
        box.appendChild(input);
      };
      mirror([0, 120], { label: 'Straddle (deg)', step: 5 }, straddleInput);
      mirror([0.4, 2], { label: 'Strength scale', step: 0.05 }, strengthInput);
      mirror([80, 150], { label: 'Wrist extension max', step: 1 }, inRomWrist);
      mirror([120, 185], { label: 'Shoulder flexion max', step: 1 }, inRomShoulder);
      mirror([40, 130], { label: 'Hip flexion max, straight knee', step: 1 }, inRomHip);
      return box;
    })();
    // The two ways out of the corridor are different failures and want naming
    // where they are seen, not in prose underneath. Alphas match the marks so
    // the swatches read the same against either theme.
    const swatch = (fill, text) => html`<span style="margin-right:16px; white-space:nowrap;"><span style="display:inline-block; width:.8em; height:.8em; background:${fill}; vertical-align:-.05em; margin-right:.35em;"></span>${text}</span>`;
    const corridorFigure = html`<figure class="wide-figure">
      ${corridorSlot}
      <small style="display:block; opacity:.85; margin-top:2px;">${swatch('rgba(154,160,166,0.3)', 'needs more strength')}${swatch('rgba(111,134,198,0.3)', 'needs more range of motion')}</small>
      ${corridorLimits}
      <figcaption>Hover the map to see the body each cell stands for. Every cell is a pose that balances over the palm, with straight, symmetric legs; the colored corridor is the part this body can hold, shaded by how much of the hardest-worked joint it takes. The controls below are mirrors of the ones at the top of the page: move them and the walls move. Red rings name the joint that makes a pose impossible: solid where it is asked for more torque than it has, dashed where it is outside its range of motion. Straddling is the odd one out among the controls, a change of shape rather than a limit — it shortens the legs in side view, which shrinks the strength wall and exposes the flexibility wall that was hiding behind it.</figcaption>
    </figure>`;
    display(corridorFigure);

    // The map is redrawn at whatever width the figure ends up with. Width is
    // quantised to 20 px and measured on the FIGURE, never on the slot the
    // map is drawn into, so a redraw cannot change the thing being observed
    // and start a loop. Plot has no reflow of its own; a resize means
    // rebuilding the chart, and a chart is 1760 rects, so the quantisation is
    // what keeps a window drag from thrashing.
    // FLOOR, not round. Rounding to the nearest 20 overshoots the real width
    // whenever the remainder is 10 or more, the map and the body are then
    // sized to a row wider than the one holding them, and the flex row wraps
    // the body underneath. Which way it rounds alternates as the window
    // resizes, so the layout appeared to wrap and unwrap at random.
    const quantise = (w) => Math.floor(w / 20) * 20;
    const corridorWidth = Generators.observe((notify) => {
      const measure = () => {
        const w = corridorFigure.clientWidth;
        if (w > 0) notify(quantise(w));
      };
      const ro = new ResizeObserver(measure);
      ro.observe(corridorFigure);
      measure();
      notify(quantise(corridorFigure.clientWidth || 640));
      return () => ro.disconnect();
    });
  </script>
  <script id="press-corridor" type="text/x-typescript">
    const corridorView = (() => {
      const cacheKey = JSON.stringify([romInfo, model.heightM, model.massKg, model.straddleDeg, strengthScale]);
      if (poseState.corridorCache.key !== cacheKey) {
        // Sampling shoulders below zero costs a band of cells that fail for a
        // reason that has nothing to do with pressing: the shoulder simply does
        // not extend past overhead. It also caught the reference handstand,
        // which snapped to shoulder -0.6 deg and read back as anatomically
        // illegal.
        poseState.corridorCache.grid = pressCorridor(model, romInfo, strengthProf, ws, { nHip: 44, nShoulder: 40, shoulderLoDeg: 0 });
        poseState.corridorCache.key = cacheKey;
      }
      const g = poseState.corridorCache.grid;
      const cells = [];
      const dHip = g.hipDeg[1] - g.hipDeg[0], dSh = g.shoulderDeg[1] - g.shoulderDeg[0];
      for (let i = 0; i < g.nHip; i++) {
        for (let j = 0; j < g.nShoulder; j++) {
          const idx = i * g.nShoulder + j;
          if (Number.isNaN(g.wristNeededDeg[idx])) continue;
          cells.push({
            x1: g.hipDeg[i] - dHip / 2, x2: g.hipDeg[i] + dHip / 2,
            y1: g.shoulderDeg[j] - dSh / 2, y2: g.shoulderDeg[j] + dSh / 2,
            util: g.utilization[idx],
            feasible: g.feasible[idx] === 1,
            tooStrong: g.utilization[idx] > 1,
          });
        }
      }
      const D2R = Math.PI / 180;
      // Split the figure between the map and the body it stands for. The
      // probe grows with the figure but not without bound: past about 260 px
      // a stick body gains nothing and the map loses area.
      // Below about 560 px there is not enough width for both, and squeezing
      // the map to fit the body beside it leaves neither readable. Give the
      // map the full width and let the flex row wrap the body underneath.
      const figW = Math.max(320, corridorWidth);
      const stacked = figW < 560;
      // GAP is the flex gap this row actually uses; the two children plus the
      // gap have to come to no more than the row, or it wraps.
      const GAP = 12;
      const probeW = stacked ? 156 : Math.round(Math.min(260, Math.max(180, 0.24 * figW)));
      const chartW = stacked ? figW : figW - probeW - GAP;
      const chartH = Math.round(Math.min(460, Math.max(300, 0.62 * chartW)));
      const chart = Plot.plot({
        width: chartW,
        height: chartH,
        marginLeft: 44,
        x: { label: 'hip flexion (deg)' },
        y: { label: 'shoulder closing (deg)' },
        color: { label: 'peak strength used', scheme: 'ylorrd', domain: [0, 1.2], legend: true },
        marks: [
          Plot.rect(cells.filter((d) => !d.feasible && d.tooStrong), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: '#9aa0a6', fillOpacity: 0.3 }),
          Plot.rect(cells.filter((d) => !d.feasible && !d.tooStrong), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: '#6f86c6', fillOpacity: 0.3 }),
          Plot.rect(cells.filter((d) => d.feasible), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: 'util' }),
        ],
      });
      // A cell of this map IS a pose: fix hip and shoulder, then solve the
      // whole-body lean that puts the center of mass over the palm. Hovering
      // shows that body, which is the only way the axes mean anything.
      const targetX = model.patch.x0 + HANDSTAND_TARGET_FRAC * (model.patch.x1 - model.patch.x0);
      const poseAt = (hipDeg, shDeg) => {
        const q = new Float64Array(model.nq);
        groundHand(model, q);
        q[4] = shDeg * D2R;
        q[5] = q[7] = hipDeg * D2R;
        const wr = solveWristForCom(model, q, ws, targetX);
        if (Number.isNaN(wr)) return null;
        q[3] = wr;
        return q;
      };
      const probe = makePoseProbe({
        w: probeW, h: Math.round(probeW * 1.41),
        view: { cx: -0.15, yLo: -0.15, yHi: 2.15 },
      });
      const nearest = (arr, v) => {
        let bi = 0;
        for (let i = 1; i < arr.length; i++) if (Math.abs(arr[i] - v) < Math.abs(arr[bi] - v)) bi = i;
        return bi;
      };
      // Which joint is the problem, not merely that there is one. Recomputing
      // the static torques for one pose is cheap, and it is the difference
      // between "too strong to hold" and knowing it is the shoulder.
      const JOINT_KEYS = ['wrist', 'shoulder', 'hipL', 'kneeL', 'hipR', 'kneeR'];
      const offendingJoints = (q) => {
        if (!q) return null;
        const marks = {};
        const st = staticAnalysis(model, q, ws);
        for (let k = 0; k < 6; k++) {
          const jj = 3 + k;
          const { lo, hi } = jointLimits(romInfo, q, jj);
          if (q[jj] < lo - 1e-9 || q[jj] > hi + 1e-9) { marks[jj] = 'rom'; continue; }
          const t = st.tau[jj];
          if (Math.abs(t) > availableTorque(strengthProf[JOINT_KEYS[k]], t, 0)) marks[jj] = 'strength';
        }
        return Object.keys(marks).length ? marks : null;
      };
      const showCorridor = (hipDeg, shDeg) => {
        const i = nearest(g.hipDeg, hipDeg), j = nearest(g.shoulderDeg, shDeg);
        const idx = i * g.nShoulder + j;
        const q = poseAt(g.hipDeg[i], g.shoulderDeg[j]);
        const util = g.utilization[idx];
        const verdict = !q || Number.isNaN(util)
          ? 'cannot be balanced over the palm at any lean'
          : g.feasible[idx]
            ? `holdable, using ${(util * 100).toFixed(0)}% of the hardest-worked joint`
            : util > 1
              ? `needs ${(util * 100).toFixed(0)}% of a joint's strength: too strong to hold`
              : 'outside a flexibility limit';
        probe.draw(q, `hip ${g.hipDeg[i].toFixed(0)}°, shoulder ${g.shoulderDeg[j].toFixed(0)}° — ${verdict}`,
          offendingJoints(q));
      };
      // Opens on the straight handstand, the one pose in here everybody can
      // already picture, so the probe starts with a body rather than blank.
      showCorridor(0, 0);
      const surface = plotSurface(chart, chartH);
      if (surface) {
        surface.style.touchAction = 'none';
        const onMove = (e) => {
          const r = surface.getBoundingClientRect();
          const hx = chart.scale('x').invert(e.clientX - r.left);
          const sy = chart.scale('y').invert(e.clientY - r.top);
          if (Number.isFinite(hx) && Number.isFinite(sy)) showCorridor(hx, sy);
        };
        surface.addEventListener('pointermove', onMove);
        surface.addEventListener('pointerdown', onMove);
      }

      return html`<div style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;">
        ${chart}
        ${probe.element}
      </div>`;
    })();
    corridorSlot.replaceChildren(corridorView);
  </script>
  <script id="dynamics-section" type="text/markdown">
    ## Making it move

    Statics ends where every interesting question about handstands begins. To simulate motion the model becomes a floating body in space: the hand is not attached to the floor, it just rests on it, pressed by two one-sided spring contacts under the heel of the palm and the finger pads, with one under each foot for entries. The center of pressure and every toppling failure emerge from those two palm contacts trading load. Joints are driven by servo torques tracking a reference trajectory, and every torque respects two layers of muscle physiology. The strength envelope is maximum voluntary torque as a function of joint velocity, after Yeadon, King and Wilson: a slow press gets isometric strength, a fast kick pays the Hill falloff and has roughly half its torque left at five radians per second. Activation dynamics is a first order lag near fifty milliseconds, so torque cannot step and bang-bang corrections are impossible by construction, for the model as for you.

    Two pieces of the body had to become mechanism rather than preference. The servo reads its damping off the mass matrix it is already computing, because these six joints span an effective inertia of two hundred to one — a knee swings a third of a kilogram metre squared, the wrist turns the entire body about the palm and sees eighty — so one damping constant is always wrong somewhere. And the commanded speed is capped at whatever the joint can still stop in the error that remains, computed not from the strength cap but from the reserve gravity has not already spent. That is the mathematical form of a coaching instruction: do not press so hard into the finish that you cannot meet it. Without it, a shoulder that has been at its cap for a second and a half sails straight through the balanced position and rings.

    Range of motion became physics too. Joints have passive end-stops built like the ground contacts one dimension down: stiffness set so that a joint pushed by its own maximum voluntary torque sinks about five degrees past the limit, damping near critical, one-sided and non-adhesive, so tissue can only push back into the range. Left as a cost term instead, a knee driven forty degrees past hyperextension for a tenth of a second was worth a few hundredths of a unit, and the optimizer bought the injury.

    Three failures the simulation produced on its own are worth keeping. Holding a perfectly stacked pose with perfect joint servos still topples, because the stacked pose rests the pressure a few millimeters from the heel of the palm and a heel pivot has no restoring authority. Servos without anticipatory gravity compensation sag, the sag leans the body, the lean raises the load, and the wrist creeps up to its cap and out over the fingertips. And the wrist cannot be critically damped at all: asking for it wants 505 newton metres per radian per second, a damper that would spend the joint's entire seventy newton metre envelope at 0.14 rad/s and leave the balance correction with nothing to say. Damping has to be capped at what the muscle can actually produce, and the wrist is the only joint where that cap binds — a mechanical way of saying what every beginner discovers about the joint they are standing on.
  </script>

    const simResult = (() => {
      const sel = scenario || 'hold';

      let prof = strengthProf, rom = { ...ROM_DEFAULTS }, config = {};

    scrubInput.addEventListener('input', () => {
      const rec = playState.sim?.rec;
      if (!rec) return;

    simControls.appendChild(playRow);
    invalidation.then(() => playRow.remove());

    const utilColor = (u, isDark) => {
      const uu = Math.min(Math.max(u, 0), 1);
      return `hsl(${210 * (1 - uu)}, ${40 + 45 * uu}%, ${isDark ? 62 : 42}%)`;
    };

    const stopPlayTheme = observeTheme((t) => { playState.theme = t; playState.dirty = true; });
    invalidation.then(stopPlayTheme);

    const playLoop = createFrameLoop((now) => {
      const sim = playState.sim;
      if (!sim) return;
      const rec = sim.rec;
      const Tend = rec.t[rec.t.length - 1];
      if (playState.playing) {
        if (playState.lastNow !== null) {
          playState.t += ((now - playState.lastNow) / 1000) * playState.speed;
          if (playState.t > Tend) playState.t = 0;
        }
        playState.lastNow = now;
        playState.dirty = true;
      }
      if (!playState.dirty) return;
      playState.dirty = false;

      const k = Math.min(rec.t.length - 1, Math.round(playState.t / (rec.dt * rec.stride)));
      const q = rec.q[k];
      const isDark = playState.theme?.isDark ?? false;

      // Per-joint utilization colors the segment each joint drives, against
      // the strength profile the run was simulated with.
      const keys = ['wrist', 'shoulder', 'hipL', 'kneeL', 'hipR', 'kneeR'];
      const profNow = sim.prof || strengthProf;
      const segmentColors = [null, null, null, null, null, null, null];
      for (let j = 0; j < 6; j++) {
        const tauApplied = rec.tauApplied[k][j];
        const cap = availableTorque(profNow[keys[j]], tauApplied, rec.qd[k][3 + j]);
        segmentColors[1 + j] = utilColor(Math.abs(tauApplied) / Math.max(cap, 1e-6), isDark);
      }

      const f = rec.forces[k];
      const forces = [];
      let copX, fySum = 0, fyX = 0;
      if (f) {
        for (let i = 0; i < f.fy.length; i++) {
          if (f.fy[i] > 1) forces.push({ x: f.px[i], y: 0, fx: f.fx[i], fy: f.fy[i] });
          if (i < 2) { fySum += f.fy[i]; fyX += f.fy[i] * f.px[i]; }

        copX = fySum > 1 ? fyX / fySum : undefined;
      }

      const canvas = playStack.elements.sim;
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(devicePixelRatio, devicePixelRatio);
      drawScene(ctx, {
        model, ws, q: Float64Array.from(q),
        width: playState.viewW, height: playState.viewH,
        theme: playState.theme,
        segmentColors, forces, copX,
        comTrail: rec.com.slice(0, k + 1),
        view: { cx: 0.15, yLo: -0.18, yHi: 2.3 },
      });
      ctx.restore();

      scrubInput.value = playState.t / Tend;
      timeLabel.textContent = `${playState.t.toFixed(2)}s`;
    });
    invalidation.then(() => playLoop.cancel());

    const playFigure = html`<figure>
      ${playStack.element}
      <figcaption>Segments are colored by strength used at that joint, blue (idle) to red (at the voluntary torque cap). Orange arrows are ground reaction forces; the blue dot on the floor is the center of pressure; the dashed curve is the center of mass trail.</figcaption>
    </figure>`;

    display(expandable(playFigure, {
      id: 'simulation-playback',
      width: Math.min(width, 640),
      height: Math.min(500, width * 0.8),
      controls: '.sim-controls',
      state: playState.ui,
      onResize(el, w, h) {
        playStack.resize(w, h);
        const dpr = devicePixelRatio;
        const canvas = playStack.elements.sim;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;
        playState.viewW = w;
        playState.viewH = h;
        playState.dirty = true;
      },
    }));
  </script>
  <script id="optimizer-section" type="text/markdown">
    ## Finding the easiest way up

    Hand-authoring trajectories is a losing game. Every attempt I wrote by hand failed in one of the ways beginners fail, and none of them survived into this notebook. So instead the notebook searches. A candidate technique is a set of spline knots for each of the six joints plus a total duration, thirty seven numbers in all, and its score is a physics rollout: did it arrive at a balanced handstand, meaning the stacked configuration with the feet free of the floor and not merely a center of mass in the right place; how much of the strength envelope did it burn; how much metabolic work it spent, with concentric work charged at muscle efficiency and eccentric absorption cheap, so churning the legs reads as expensive the way it should; did it violate a flexibility limit; did the palms stay planted; did it fall and how early. A covariance matrix adaptation evolution strategy (CMA-ES) then climbs that score. Every run is deterministic under its seed, and the entries in the playback menu were produced by exactly this process offline. None of them is a cached animation: each is re-simulated in the browser from its stored spline knots every time you select it, so if a run looks wrong it is wrong, whatever its cost says. The optimizer below runs live in a worker if you want to search under different flexibility or strength settings.
  </script>
  <script id="opt-state" type="text/x-typescript">
    const optState = {
      worker: null, running: false, history: [],
      latest: null, result: null, adopted: null,
      rev: 0, notify: null,
    };
  </script>
  <script id="opt-controls-cell" type="text/x-typescript">
    const optControls = html`<div class="opt-controls"></div>`;
    const optScenarioNames = { lunge: 'Kick-up (from lunge)', pike: 'Press (from pike)' };
    const optScenario = Inputs.select(Object.keys(optScenarioNames), { label: 'Optimize', format: (v) => optScenarioNames[v] });
    const optGens = Inputs.range([20, 400], { label: 'Generations', value: 120, step: 10 });
    const optSeed = Inputs.range([1, 99], { label: 'Seed', value: 7, step: 1 });
    optControls.append(optScenario, optGens, optSeed);
    const optRow = html`<div style="display:flex; gap:6px; align-items:center; margin-top:6px;"></div>`;
    const optRun = html`<button>Run optimization</button>`;
    const optStop = html`<button disabled>Stop</button>`;
    const optAdopt = html`<button disabled>Send result to playback</button>`;
    optRow.append(optRun, optStop, optAdopt);
    optControls.appendChild(optRow);

    function optCleanup() {
      optState.worker?.terminate();
      optState.worker = null;
      optState.running = false;
      optRun.disabled = false;
      optStop.disabled = true;
    }
    optRun.addEventListener('click', () => {
      optCleanup();
      optState.history = [];
      optState.result = null;
      optState.latest = null;
      optState.running = true;
      optRun.disabled = true;
      optStop.disabled = false;
      optAdopt.disabled = true;
      const worker = new Worker(new URL('./opt-worker.js', import.meta.url), { type: 'module' });
      optState.worker = worker;
      worker.onerror = (err) => {
        console.error('optimizer worker error', err.message);
        optCleanup();
        optState.rev++;
        optState.notify?.(optState);
      };
      worker.onmessage = ({ data }) => {
        if (data.type === 'progress') {
          optState.history.push({ gen: data.gen, best: data.best });
          optState.latest = data;
        } else if (data.type === 'done') {
          optState.result = { ...data, scenario: optScenario.value };
          optCleanup();
          optAdopt.disabled = false;
        }
        optState.rev++;
        optState.notify?.(optState);
      };
      // Start from the canonical result for this skill rather than from the
      // hand-written reference. A search from scratch does not find a kick-up
      // on this body in any budget this button offers -- the canonical one
      // exists because the strength and the entry duration were walked down in
      // stages offline -- so starting cold produced a couple of hundred
      // generations of slow improvement ending in a fall. Warm-started, the
      // button does what it looks like it does: takes a technique that works
      // and refines it for the body currently set in the sliders.
      const seedRun = PRESET_TRAJECTORIES[optScenario.value];
      worker.postMessage({
        type: 'optimize',
        scenario: optScenario.value,
        seed: optSeed.value,
        maxGen: optGens.value,
        x0: seedRun
          ? Array.from(encodeDecision(seedRun.knots.map((k) => Float64Array.from(k)), seedRun.T))
          : null,
        sigma0: seedRun ? 0.1 : undefined,
        modelParams: { heightM, massKg, straddleDeg, sex },
        strengthOpts: { scale: strengthScale },
        romOverrides: poseState.rom,
      });
      optState.rev++;
      optState.notify?.(optState);
    });
    optStop.addEventListener('click', () => { optCleanup(); optState.rev++; optState.notify?.(optState); });
    optAdopt.addEventListener('click', () => {
      if (!optState.result) return;
      optState.adopted = optState.result;
      scenarioInput.value = 'live';
      scenarioInput.dispatchEvent(new Event('input', { bubbles: true }));
    });
    invalidation.then(optCleanup);
    display(optControls);
  </script>

  <script id="coda" type="text/markdown">
    ## What the model says

    The question this notebook opens with — why pressing is so much harder than kicking up — has a number attached, and it is a bigger number than I expected. Re-optimizing both entries against the same body, the kick-up goes at a shoulder rated 1.6 newton metres per kilogram with average hamstrings, which is to say a recreational adult. The press on that same body does not merely stall, it collapses, and it is still collapsing at 2.2. Somewhere between 2.2 and 2.8 it starts working. The press asks for something like half again the shoulder strength of the kick-up, and that gap — not technique, not timing — is most of the answer.

    Flexibility plays a different role than the folklore gives it. Short hamstrings do not block the press: at a shoulder of 2.8 the model presses up perfectly well from an ordinary 85 degree fold. What flexibility buys is cheapness. The same press with hamstrings reaching 125 degrees scores 1.03 against 2.53 for the stiff one, about two and a half times less work, effort and shoulder time for an identical outcome. That is the honest version of the coaching advice: the flexible press is not a different skill, it is the same skill with most of the cost taken out, which over a training career is the difference between a press you can do and a press you can do twenty times.

    The two entries pull against each other, and the model hands that back as a trade rather than an answer. Pricing the hamstring stretch harder does reduce it, but it drains the entry: from twelve degrees of stretch down to seven, momentum at liftoff falls by a fifth and the time spent with the shoulder flat against its cap rises from a third of the entry to nearly half. The swing that spares your shoulders is the swing that stretches your hamstring, and no setting of the weights gets both.

    Most of the work here went into learning what an optimizer will do to a cost function. Given a shoulder rated at two newton metres per kilogram it stopped kicking up altogether and pressed out of a sixty degree planche instead, a skill several years further along, because living at maximum effort was charged three thousandths of a unit and was therefore nearly free. Given a knee injury priced at three hundredths of a unit, it bought the injury. Given a free choice of duration it stretched the kick-up out until it had quietly become a press, because both the work and smoothness terms fall as a movement slows. Each of those is a scoring bug rather than a finding, and each looked entirely plausible in replay — which is the argument for re-simulating every run on this page instead of trusting a cost number.

    The model is a two dimensional cartoon: merged arms, locked elbows, one rigid segment from shoulder to hip so a hollow body is assumed rather than earned, no lateral balance, no straddle dynamics beyond a projection, penalty friction, torque servos instead of muscles and tendons, and an optimizer that finds good technique rather than provably best technique. Its numbers should be read as mechanisms and thresholds, not prescriptions. But the mechanisms agree with what the force plates and the coaches have been saying all along, and it is rather pleasant to watch the folklore sort itself into the parts that are physics and the parts that are just repetition.
  </script>
  <script id="validation-section" type="text/markdown">
    ## Validation

    The physics core is exercised by offline gates (run with `node src/notebooks/handstand/test/dynamics.mjs` and friends): the recursive Newton-Euler dynamics against finite differences of the energy function, free-fall momentum conservation, a textbook double pendulum, penalty-contact settling, the Yeadon-King torque curve landmarks, deterministic optimization, and the arrival gates: that a constant-damping servo really does ring its way into the balanced pose and topple from forty five degrees out, and that the inertia-scaled, brake-limited servo arrives from the same start with no overshoot. The cell below reruns a fast subset in your browser against the current model so the page can vouch for itself.
  </script>
  <script id="validation-checks" type="text/x-typescript">
    const validation = (() => {
      const zeroV = new Float64Array(model.nq);
      const checks = [];
      // Mass matrix symmetry and SPD at a bent pose.
      {
        const q = Float64Array.from(poseState.q);
        const M = new Float64Array(model.nq * model.nq);
        massMatrix(model, q, M, ws);
        let asym = 0;
        for (let i = 0; i < model.nq; i++) {
          for (let j = 0; j < model.nq; j++) asym = Math.max(asym, Math.abs(M[i * model.nq + j] - M[j * model.nq + i]));
        }
        checks.push({ name: 'mass matrix symmetric', ok: asym < 1e-9, detail: `max asymmetry ${asym.toExponential(1)}` });
      }
      // Static torques match finite differences of potential energy.
      {
        const q = Float64Array.from(poseState.q);
        const tau = new Float64Array(model.nq);
        rnea(model, q, zeroV, zeroV, tau, null, { ws });
        const eps = 1e-6;
        let worst = 0;
        for (let i = 3; i < model.nq; i++) {
          const qp = q.slice(); qp[i] += eps;
          const qm = q.slice(); qm[i] -= eps;
          const dV = (energy(model, qp, zeroV, ws).potential - energy(model, qm, zeroV, ws).potential) / (2 * eps);
          worst = Math.max(worst, Math.abs(tau[i] - dV));
        }
        checks.push({ name: 'static torques = dV/dq', ok: worst < 1e-5, detail: `max err ${worst.toExponential(1)} Nm` });
      }
      // Strength model landmarks.
      {
        const jp = strengthProf.shoulder;
        const iso = availableTorque(jp, 1, 0);
        const con = availableTorque(jp, 1, 8);
        const ecc = availableTorque(jp, -1, 8);
        checks.push({
          name: 'strength: eccentric > isometric > fast concentric',
          ok: ecc > iso && iso > con && con > 0,
          detail: `${ecc.toFixed(0)} / ${iso.toFixed(0)} / ${con.toFixed(0)} Nm`,
        });
      }
      // Total mass budget.
      {
        let m = 0;
        for (let i = 0; i < model.nb; i++) m += model.mass[i];
        checks.push({ name: 'segment masses sum to body mass', ok: Math.abs(m - model.massKg) < 1e-9, detail: `${m.toFixed(3)} kg` });
      }
      const rows = checks.map((c) => html`<div>${c.ok ? '✓' : '✗'} ${c.name} <small style="opacity:0.6">(${c.detail})</small></div>`);
      const allOk = checks.every((c) => c.ok);
      return html`<div style="font-variant-numeric: tabular-nums; ${allOk ? '' : 'color:#c0392b;'}">${rows}</div>`;
    })();
    display(validation);
  </script>
