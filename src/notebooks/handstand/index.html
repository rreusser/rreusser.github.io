    # The Mechanics of a Handstand

  <script id="intro" type="text/markdown">
    Why is pressing up to a handstand so much harder than kicking up to one? Strength, shoulders, wrists, hamstrings, timing — some of those are real constraints and some are folklore. This is a two dimensional rigid body model of a person balancing on their hands, built to tell them apart. Segment masses and lengths come from published anthropometric tables and joint strength from measured torque-velocity relationships, so every number here can be recomputed by moving a slider.
  </script>

  <script id="model-section" type="text/markdown">
    ## A stick figure gymnast

    Seven rigid segments in the sagittal plane: one hand, one arm (both arms merge by symmetry), a torso with the head, and a thigh and shank per leg, joined at the wrist, shoulder, two hips and two knees. Masses, mass centers and inertias follow de Leva's adjustment of the Zatsiorsky parameters, scaled by height and body mass.

    The hand is the segment that matters. It is not a point of support but a patch, from the heel of the palm to the finger pads.
  </script>

  <script id="body-controls-cell" type="text/x-typescript">
    const bodyControls = html`<div class="body-controls"></div>`;
    const bctrl = (input) => { bodyControls.appendChild(input); return Generators.input(input); };
    // Declared, observed, and NOT put in this panel. Straddle is a shape a
    // gymnast chooses, not a proportion of their body, and shoulder strength
    // is physiology rather than anatomy; both are already mirrored onto the
    // press corridor, which is the figure that spends them. The panel here
    // keeps only what actually sets the segment table.
    const offPanel = (input) => Generators.input(input);
    const heightM = bctrl(Inputs.range([1.4, 2.05], { label: 'Height (m)', value: 1.75, step: 0.01 }));
    const massKg = bctrl(Inputs.range([45, 115], { label: 'Mass (kg)', value: 70, step: 1 }));
    // Element as well as value, like the strength scale: the corridor mirrors
    // this one too, because straddling is a shape change that moves a wall.
    const straddleInput = Inputs.range([0, 120], { label: 'Straddle (deg)', value: 0, step: 5 });
    const straddleDeg = offPanel(straddleInput);
    // Selects the de Leva segment table, so this moves mass around the body
    // as well as redrawing it: at the same stature and weight, the female
    // table puts 41.8 percent of body mass in the legs against 39.7, and in
    // a handstand the legs are the far end of the lever.
    const sex = bctrl(Inputs.select(['male', 'female'], { label: 'Segment proportions', value: 'male' }));
    // Shoulder strength in the units the rest of the notebook argues in:
    // maximum voluntary isometric torque per kilogram of body mass. It was a
    // unitless "strength scale" multiplying the whole profile, which put an
    // arbitrary factor in front of numbers that are already dimensional and
    // made the thresholds -- 1.6 for a kick-up, 2.2 and 2.8 for a press --

    // more to press, so the bottom of this range is the interesting part: it

    const strengthInput = Inputs.range([0.5, 3.2], {

    section('Pose');
    const inWrist = offPanel(Inputs.range([40, 100], { label: 'Wrist angle (deg)', value: 90, step: 0.5 }));
    const inShoulder = offPanel(Inputs.range([-5, 110], { label: 'Shoulder closing (deg)', value: 0, step: 0.5 }));
    const inHipL = offPanel(Inputs.range([-25, 140], { label: 'Hip flexion L (deg)', value: 0, step: 0.5 }));
    const inKneeL = offPanel(Inputs.range([-5, 145], { label: 'Knee flexion L (deg)', value: 0, step: 0.5 }));
    const inHipR = offPanel(Inputs.range([-25, 140], { label: 'Hip flexion R (deg)', value: 0, step: 0.5 }));
    const inKneeR = offPanel(Inputs.range([-5, 145], { label: 'Knee flexion R (deg)', value: 0, step: 0.5 }));
    const inSymmetric = add(Inputs.toggle({ label: 'Symmetric legs', value: true }));

    section('Flexibility limits');
    // Wrist extension, not the joint coordinate: 90 degrees is a forearm
    // standing vertical on a flat hand, and leaning out over the fingers
    // asks for more. Raising this slider therefore opens up the leaned-out
    // poses and lowering it forbids them, which is the direction a
    // flexibility limit should run. It used to be wired to the opposite end
    // of the range and did the reverse.
    const inRomWrist = add(Inputs.range([80, 150], { label: 'Wrist extension max', value: ROM_DEFAULTS.wristExtMaxDeg, step: 1 }));
    const inRomShoulder = add(Inputs.range([120, 185], { label: 'Shoulder flexion max', value: ROM_DEFAULTS.shoulderFlexMaxDeg, step: 1 }));
    const inRomHip = add(Inputs.range([40, 130], { label: 'Hip flexion max, straight knee', value: ROM_DEFAULTS.hipFlexStraightKneeMaxDeg, step: 1 }));
    const inRomCoupling = add(Inputs.range([0, 1], { label: 'Hamstring coupling (deg/deg)', value: ROM_DEFAULTS.hamstringCouplingPerDeg, step: 0.05 }));

    const D2R = Math.PI / 180;
    function syncPose() {
      if (!poseState.model) return;
      if (inSymmetric.value) { inHipR.value = inHipL.value; inKneeR.value = inKneeL.value; }
      const q = poseState.q;
      groundHand(poseState.model, q);
      // By name. Written as 3..8 these were the six-joint body's coordinates,
      // so once the trunk gained a hinge the hip sliders drove the SPINE and
      // the knee sliders drove the hips.
      q[QI.wrist] = inWrist.value * D2R;
      q[QI.shoulder] = inShoulder.value * D2R;
      q[QI.hipL] = inHipL.value * D2R;
      q[QI.kneeL] = -inKneeL.value * D2R;
      q[QI.hipR] = inHipR.value * D2R;
      q[QI.kneeR] = -inKneeR.value * D2R;
      const rom = {
        ...ROM_DEFAULTS,
        wristExtMaxDeg: inRomWrist.value,
        shoulderFlexMaxDeg: inRomShoulder.value,
        hipFlexStraightKneeMaxDeg: inRomHip.value,
        hamstringCouplingPerDeg: inRomCoupling.value,
      };
      const clamped = clampPose(q, rom);
      if (clamped) {
        inWrist.value = q[QI.wrist] / D2R;
        inShoulder.value = q[QI.shoulder] / D2R;
        inHipL.value = q[QI.hipL] / D2R;
        inKneeL.value = -q[QI.kneeL] / D2R;
        inHipR.value = q[QI.hipR] / D2R;
        inKneeR.value = -q[QI.kneeR] / D2R;
      }
      poseState.rom = rom;
      poseState.clamped = clamped;
      poseState.rev++;
      poseState.dirty = true;
      poseState.notifyPose?.({ rev: poseState.rev, q: Array.from(q), clamped });
      const romKey = JSON.stringify(rom);
      if (romKey !== poseState.romKey) {
        poseState.romKey = romKey;
        poseState.notifyRom?.(rom);
      }
    }
    poseState.sync = syncPose;
    poseState.jointSliders = { 3: inWrist, 4: inShoulder, 5: inHipL, 6: inKneeL, 7: inHipR, 8: inKneeR };
    poseState.symmetricInput = inSymmetric;
    poseControls.addEventListener('input', syncPose);

    section('Presets');
    const presetDefs = {
      'Straight': { wrist: 90, shoulder: 0, hip: 0, knee: 0 },
      'Banana': { wrist: 88, shoulder: 28, hip: -18, knee: 12 },
      'Planche lean': { wrist: 68, shoulder: 14, hip: 8, knee: 0 },
      'Pike': { wrist: 78, shoulder: 40, hip: 110, knee: 0 },
      'Tuck': { wrist: 85, shoulder: 25, hip: 115, knee: 120 },
    };
    const presetRow = html`<div style="display:flex; gap:6px; flex-wrap:wrap;"></div>`;
    for (const [name, p] of Object.entries(presetDefs)) {
      const b = html`<button>${name}</button>`;
      b.addEventListener('click', () => {
        inWrist.value = p.wrist; inShoulder.value = p.shoulder;
        inHipL.value = p.hip; inKneeL.value = p.knee;
        inHipR.value = p.hip; inKneeR.value = p.knee;
        syncPose();
      });
      presetRow.appendChild(b);
    }
    poseControls.appendChild(presetRow);
    syncPose();
    // Not displayed. The pose explorer that this panel drove is gone: it was
    // a debug view with a slider per degree of freedom and no question of
    // its own. What survives is the state -- the ROM values the press
    // corridor reads, and the pose the corridor's own probe solves for --
    // and the four limits worth touching are mirrored onto that figure.
  </script>
  <script id="pose-observables" type="text/x-typescript">
    const poseInfo = Generators.observe((notify) => {
      poseState.notifyPose = notify;
      notify({ rev: poseState.rev, q: Array.from(poseState.q), clamped: poseState.clamped });
      return () => { if (poseState.notifyPose === notify) poseState.notifyPose = null; };
    });
    const romInfo = Generators.observe((notify) => {
      poseState.notifyRom = notify;
      notify(poseState.rom);
      return () => { if (poseState.notifyRom === notify) poseState.notifyRom = null; };
    });
  </script>
  <script id="statics-section" type="text/markdown">
    ## Balance is a statics problem

    A pose at rest balances when the center of mass sits over the center of pressure, and the center of pressure has nowhere to live except the palm patch:

    ${tex.block`x_{\mathrm{CoM}} = x_{\mathrm{CoP}}, \qquad x_{\mathrm{heel}} \;\le\; x_{\mathrm{CoP}} \;\le\; x_{\mathrm{fingertips}}.`}

    The wrist is what moves it: press through the fingertips to shift it forward, rock onto the heel of the palm to shift it back. For body weight ${tex`W`},

    ${tex.block`\tau_{\mathrm{wrist}} = W\,(x_{\mathrm{CoP}} - x_{\mathrm{wrist}}),`}

    so the patch length times body weight is the whole balance authority in a handstand. Every other joint torque in a static pose is set by gravity.
  </script>
  <script id="flexibility-section" type="text/markdown">
    ## What flexibility limits actually do

    A shoulder that cannot open to 180 degrees tips the torso off vertical, and the pose has to buy that angle back: arch the back, or lean the whole stack toward the fingertips. A wrist limit forces the same lean from below.

    The hamstrings are a two joint group, so what they limit is hip flexion combined with knee extension — every degree of knee bend buys some hip fold back. That coupling is why a bent-leg press exists.
  </script>
  <script id="corridor-intro" type="text/markdown">
    ## The press corridor

    A press is, quasi-statically, a path through pose space that keeps the center of mass over the palm the whole way, from the deep pike to the stacked handstand. For each hip and shoulder angle the model solves the wrist angle that balances the pose, then asks whether that pose is inside the flexibility limits and inside the strength limits.
  </script>
  <script id="pose-probe" type="text/x-typescript">
    // Both the press corridor and the catch window are maps over coordinates
    // nobody can picture: "hip 80, shoulder 30" and "wrist +12 deg at 1.4
    // rad/s" mean nothing as numbers. This is the body those numbers stand
    // for, drawn next to the plot and driven by whatever the cursor is over.
    // The window has to be given, not defaulted: a body piked to 130 deg
    // reaches almost 0.9 m behind the hand, and centering on the hand the way
    // a straight handstand wants cuts the legs off the canvas.
    const makePoseProbe = ({ w = 156, h = 220, view = { cx: 0.1, yLo: -0.15, yHi: 2.15 } } = {}) => {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * devicePixelRatio);
      canvas.height = Math.round(h * devicePixelRatio);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      const note = html`<small style="display:block; opacity:.75; min-height:3.2em; line-height:1.3;"></small>`;
      const element = html`<div style="flex:0 0 auto; width:${w}px;">${canvas}${note}</div>`;
      const ctx = canvas.getContext('2d');
      return {
        element,
        draw(q, text = '', jointMarks = null) {
          ctx.save();
          ctx.scale(devicePixelRatio, devicePixelRatio);
          ctx.clearRect(0, 0, w, h);
          if (q) {
            drawScene(ctx, {
              model, ws, q, width: w, height: h, theme: poseState.theme, view,
              jointMarks,
            });
          }
          ctx.restore();
          note.textContent = text;
        },
      };
    };

    // Plot renders a figure that may also contain a legend svg; the plot
    // itself is the tallest one. Its scales invert in CSS pixels relative to
    // that svg, which is what a pointer event gives us.
    // Plot returns a <figure> when it draws a legend and a bare <svg>
    // otherwise. The figure carries a browser default margin that opens a gap
    // the width of the page, and it holds two svgs: the legend ramp first,
    // then the plot. Pick by the height we asked for, NOT by measuring: this
    // runs before the chart is in the document, so every getBoundingClientRect
    // is 0x0, a sort by size is a no-op, and the first svg wins -- which is
    // the legend. That is how the pointer handler ended up on the colour bar.
    const plotSurface = (chart, minHeight) => {
      chart.style.margin = '0';
      if (chart.tagName.toLowerCase() === 'svg') return chart;
      const svgs = [...chart.querySelectorAll('svg')];
      return svgs.find((sv) => +sv.getAttribute('height') >= minHeight)
        || svgs[svgs.length - 1] || null;
    };
  </script>
  <script id="corridor-frame" type="text/x-typescript">
    // The corridor is a picture of two limits, and until now the sliders that
    // set those limits lived in the pose panel, several screens up. They are
    // mirrored here so the wall you are looking at is the wall you move.
    //
    // The mirrors have to live in a cell of their own. This cell reads the
    // input elements and never their values, so dragging one does not
    // re-run the cell and destroy the slider under the cursor mid-drag. The
    // map is rebuilt on every change by the press-corridor cell, which
    // renders into corridorSlot rather than displaying anything itself.
    const corridorSlot = html`<div></div>`;
    const corridorLimits = (() => {
      const box = html`<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:0 18px; margin-top:8px;"></div>`;
      const mirror = (domain, opts, source) => {
        const input = Inputs.range(domain, opts);
        Inputs.bind(input, source, invalidation);
        box.appendChild(input);
      };
      mirror([0, 120], { label: 'Straddle (deg)', step: 5 }, straddleInput);
      mirror([0.5, 3.2], { label: 'Shoulder strength (Nm/kg)', step: 0.05 }, strengthInput);
      mirror([80, 150], { label: 'Wrist extension max', step: 1 }, inRomWrist);
      mirror([120, 185], { label: 'Shoulder flexion max', step: 1 }, inRomShoulder);
      mirror([40, 130], { label: 'Hip flexion max, straight knee', step: 1 }, inRomHip);
      return box;
    })();
    // The two ways out of the corridor are different failures and want naming
    // where they are seen, not in prose underneath. Alphas match the marks so
    // the swatches read the same against either theme.
    const swatch = (fill, text) => html`<span style="margin-right:16px; white-space:nowrap;"><span style="display:inline-block; width:.8em; height:.8em; background:${fill}; vertical-align:-.05em; margin-right:.35em;"></span>${text}</span>`;
    const corridorFigure = html`<figure class="wide-figure">
      ${corridorSlot}
      <small style="display:block; opacity:.85; margin-top:2px;">${swatch('rgba(154,160,166,0.3)', 'needs more strength')}${swatch('rgba(111,134,198,0.3)', 'needs more range of motion')}</small>
      ${corridorLimits}
      <figcaption>Hover the map to see the body each cell stands for. Every cell is a pose that balances over the palm with straight, symmetric legs; the colored corridor is the part this body can hold, shaded by how much of the hardest-worked joint it takes. Red rings name the joint that makes a pose impossible: solid for torque, dashed for range of motion. The controls are mirrors of the ones at the top of the page.</figcaption>
    </figure>`;
    display(corridorFigure);

    // The map is redrawn at whatever width the figure ends up with. Width is
    // quantised to 20 px and measured on the FIGURE, never on the slot the
    // map is drawn into, so a redraw cannot change the thing being observed
    // and start a loop. Plot has no reflow of its own; a resize means
    // rebuilding the chart, and a chart is 1760 rects, so the quantisation is
    // what keeps a window drag from thrashing.
    // FLOOR, not round. Rounding to the nearest 20 overshoots the real width
    // whenever the remainder is 10 or more, the map and the body are then
    // sized to a row wider than the one holding them, and the flex row wraps
    // the body underneath. Which way it rounds alternates as the window
    // resizes, so the layout appeared to wrap and unwrap at random.
    const quantise = (w) => Math.floor(w / 20) * 20;
    const corridorWidth = Generators.observe((notify) => {
      // Notify ONLY when the quantised width actually changes. A generator
      // yield re-runs its dependents whether or not the value differs, and a
      // ResizeObserver fires on height as well as width -- so probing the map
      // moved the caption text, the caption's line count changed the figure's
      // height, the observer fired, and the map was rebuilt underneath the
      // finger that was drawing it. The captured pointer went with the old
      // svg, so the first touch on a cell whose verdict wrapped differently
      // was also the last: no pointermove ever arrived again.
      let last = null;
      const measure = () => {
        const w = quantise(corridorFigure.clientWidth || 640);
        if (w > 0 && w !== last) { last = w; notify(w); }
      };
      const ro = new ResizeObserver(measure);
      ro.observe(corridorFigure);
      measure();
      return () => ro.disconnect();
    });
  </script>
  <script id="press-corridor" type="text/x-typescript">
    const corridorView = (() => {
      const cacheKey = JSON.stringify([romInfo, model.heightM, model.massKg, model.straddleDeg, shoulderNmPerKg]);
      if (poseState.corridorCache.key !== cacheKey) {
        // Sampling shoulders below zero costs a band of cells that fail for a
        // reason that has nothing to do with pressing: the shoulder simply does
        // not extend past overhead. It also caught the reference handstand,
        // which snapped to shoulder -0.6 deg and read back as anatomically
        // illegal.
        poseState.corridorCache.grid = pressCorridor(model, romInfo, strengthProf, ws, { nHip: 44, nShoulder: 40, shoulderLoDeg: 0 });
        poseState.corridorCache.key = cacheKey;
      }
      const g = poseState.corridorCache.grid;
      const cells = [];
      const dHip = g.hipDeg[1] - g.hipDeg[0], dSh = g.shoulderDeg[1] - g.shoulderDeg[0];
      for (let i = 0; i < g.nHip; i++) {
        for (let j = 0; j < g.nShoulder; j++) {
          const idx = i * g.nShoulder + j;
          if (Number.isNaN(g.wristNeededDeg[idx])) continue;
          cells.push({
            x1: g.hipDeg[i] - dHip / 2, x2: g.hipDeg[i] + dHip / 2,
            y1: g.shoulderDeg[j] - dSh / 2, y2: g.shoulderDeg[j] + dSh / 2,
            util: g.utilization[idx],
            feasible: g.feasible[idx] === 1,
            tooStrong: g.utilization[idx] > 1,
          });
        }
      }
      const D2R = Math.PI / 180;
      // Split the figure between the map and the body it stands for. The
      // probe grows with the figure but not without bound: past about 260 px
      // a stick body gains nothing and the map loses area.
      // Below about 560 px there is not enough width for both, and squeezing
      // the map to fit the body beside it leaves neither readable. Give the
      // map the full width and let the flex row wrap the body underneath.
      const figW = Math.max(320, corridorWidth);
      const stacked = figW < 560;
      // GAP is the flex gap this row actually uses; the two children plus the
      // gap have to come to no more than the row, or it wraps.
      const GAP = 12;
      const probeW = stacked ? 156 : Math.round(Math.min(260, Math.max(180, 0.24 * figW)));
      const chartW = stacked ? figW : figW - probeW - GAP;
      const chartH = Math.round(Math.min(460, Math.max(300, 0.62 * chartW)));
      const chart = Plot.plot({
        width: chartW,
        height: chartH,
        marginLeft: 44,
        x: { label: 'hip flexion (deg)' },
        y: { label: 'shoulder closing (deg)' },
        color: { label: 'peak strength used', scheme: 'ylorrd', domain: [0, 1.2], legend: true },
        marks: [
          Plot.rect(cells.filter((d) => !d.feasible && d.tooStrong), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: '#9aa0a6', fillOpacity: 0.3 }),
          Plot.rect(cells.filter((d) => !d.feasible && !d.tooStrong), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: '#6f86c6', fillOpacity: 0.3 }),
          Plot.rect(cells.filter((d) => d.feasible), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: 'util' }),
        ],
      });
      // A cell of this map IS a pose: fix hip and shoulder, then solve the
      // whole-body lean that puts the center of mass over the palm. Hovering
      // shows that body, which is the only way the axes mean anything.
      const targetX = model.patch.x0 + HANDSTAND_TARGET_FRAC * (model.patch.x1 - model.patch.x0);
      const poseAt = (hipDeg, shDeg) => {
        const q = new Float64Array(model.nq);
        groundHand(model, q);
        // The corridor's two axes are the SHOULDER and the HIPS. Written as
        // q[4] and q[5]/q[7] that was true of the six-joint body; on the
        // articulated one it bent the spine and the left knee instead, and
        // the probe drew a body folded in places a press does not fold.
        q[QI.shoulder] = shDeg * D2R;
        q[QI.hipL] = q[QI.hipR] = hipDeg * D2R;
        const wr = solveWristForCom(model, q, ws, targetX);
        if (Number.isNaN(wr)) return null;
        q[3] = wr;
        return q;
      };
      const probe = makePoseProbe({
        w: probeW, h: Math.round(probeW * 1.41),
        view: { cx: -0.15, yLo: -0.15, yHi: 2.15 },
      });
      const nearest = (arr, v) => {
        let bi = 0;
        for (let i = 1; i < arr.length; i++) if (Math.abs(arr[i] - v) < Math.abs(arr[bi] - v)) bi = i;
        return bi;
      };
      // Which joint is the problem, not merely that there is one. Recomputing
      // the static torques for one pose is cheap, and it is the difference
      // between "too strong to hold" and knowing it is the shoulder.
      const offendingJoints = (q) => {
        if (!q) return null;
        const marks = {};
        const st = staticAnalysis(model, q, ws);
        for (let k = 0; k < NJOINTS; k++) {
          const jj = 3 + k;
          const { lo, hi } = jointLimits(romInfo, q, jj);
          if (q[jj] < lo - 1e-9 || q[jj] > hi + 1e-9) { marks[jj] = 'rom'; continue; }
          const t = st.tau[jj];
          if (Math.abs(t) > availableTorque(strengthProf[JOINT_ORDER[k]], t, 0)) marks[jj] = 'strength';
        }
        return Object.keys(marks).length ? marks : null;
      };
      const showCorridor = (hipDeg, shDeg) => {
        const i = nearest(g.hipDeg, hipDeg), j = nearest(g.shoulderDeg, shDeg);
        const idx = i * g.nShoulder + j;
        const q = poseAt(g.hipDeg[i], g.shoulderDeg[j]);
        const util = g.utilization[idx];
        const verdict = !q || Number.isNaN(util)
          ? 'cannot be balanced over the palm at any lean'
          : g.feasible[idx]
            ? `holdable, using ${(util * 100).toFixed(0)}% of the hardest-worked joint`
            : util > 1
              ? `needs ${(util * 100).toFixed(0)}% of a joint's strength: too strong to hold`
              : 'outside a flexibility limit';
        poseState.corridorHover = { hipDeg: g.hipDeg[i], shoulderDeg: g.shoulderDeg[j] };
        probe.draw(q, `hip ${g.hipDeg[i].toFixed(0)}°, shoulder ${g.shoulderDeg[j].toFixed(0)}° — ${verdict}`,
          offendingJoints(q));
      };
      // Opens on the straight handstand, the one pose in here everybody can
      // already picture, so the probe starts with a body rather than blank --
      // or on whatever the reader was last looking at, since a width change
      // rebuilds this whole cell.
      showCorridor(poseState.corridorHover.hipDeg, poseState.corridorHover.shoulderDeg);
      // touch-action goes on the HTML box around the chart, not on the svg:
      // an svg node does not reliably honour it, and without it a touch drag
      // scrolls the page as well as probing, which fires pointercancel and
      // kills the gesture halfway. Scrolling also resizes the figure on a
      // phone, which rebuilds this cell -- the reason the probe used to snap
      // back to the straight handstand the moment you touched the map.
      const chartBox = html`<div style="touch-action:none;">${chart}</div>`;
      const surface = plotSurface(chart, chartH);
      if (surface) {
        let tracking = null;
        const probeAt = (e) => {
          const r = surface.getBoundingClientRect();
          const hx = chart.scale('x').invert(e.clientX - r.left);
          const sy = chart.scale('y').invert(e.clientY - r.top);
          if (Number.isFinite(hx) && Number.isFinite(sy)) showCorridor(hx, sy);
        };
        surface.addEventListener('pointerdown', (e) => {
          tracking = e.pointerId;
          surface.setPointerCapture?.(e.pointerId);
          probeAt(e);
        });
        surface.addEventListener('pointermove', (e) => {
          // A mouse probes on hover; a finger only while it is down.
          if (e.pointerType === 'mouse' || tracking === e.pointerId) probeAt(e);
        });
        const release = (e) => {
          if (tracking !== e.pointerId) return;
          surface.releasePointerCapture?.(e.pointerId);
          tracking = null;
        };
        surface.addEventListener('pointerup', release);
        surface.addEventListener('pointercancel', release);
      }

      return html`<div style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;">
        ${chartBox}
        ${probe.element}
      </div>`;
    })();
    corridorSlot.replaceChildren(corridorView);
  </script>
  <script id="dynamics-section" type="text/markdown">
    ## Making it move

    To move, the model becomes a floating body: the hand is not attached to the floor, it rests on it, on one-sided spring contacts under the heel of the palm and the finger pads, with one under each foot. The center of pressure and every toppling failure emerge from those two palm contacts trading load.

    Joints are driven by servo torques tracking a reference trajectory, capped by a Yeadon-King torque-velocity envelope and a fifty millisecond activation lag, so torque cannot step. Range of motion is enforced by passive end-stops built like the ground contacts one dimension down, and the servo reads its damping off the mass matrix, because these six joints span an effective inertia of two hundred to one.
  </script>
  <script id="replay-stored" type="text/x-typescript">
    // The ONE way to replay a stored run, whether it is a registered
    // artifact, a case saved this session, or the result the optimizer just
    // produced. Everything about the machine comes from the run itself --
    // strength, anatomy, plant -- and the integration is left at its default,
    // which is what makes two replays of the same run the same run.
    //
    // There used to be two of these. Playback replayed at the default
    // timestep over a 2.5 s settle; the optimizer's seed preview replayed the
    // same knots at 5e-4 over 1.2 s to save a few milliseconds. So a
    // technique could succeed in the search, appear to fall as a saved
    // starting point, and succeed again in playback -- three answers for one
    // trajectory, none of them wrong on its own.
    // A run also records the BODY it was produced on and the integration a
    // replay should use. Neither is a plant setting, so recording the plant
    // alone did not make a run reproducible -- and the body matters most of
    // all: a technique optimized for a 1.9 m frame replayed against whatever
    // the sliders happened to say.
    const replayModels = new Map();
    const modelFor = (body) => {
      if (!body || !Object.keys(body).length) return { model, ws };
      const key = JSON.stringify(body);
      if (!replayModels.has(key)) {
        const m = buildModel(body);
        replayModels.set(key, { model: m, ws: createWorkspace(m) });
      }
      return replayModels.get(key);
    };
    // Everything here is derived from the technique by technique-file.js.
    // This used to be a second, hand-kept copy of the argument list the search
    // also kept its own copy of; they drifted, repeatedly, and the page grew a

  <script id="reference-section" type="text/markdown">
    ## What is actually driving the pose

    Thirty-seven numbers. Six joints, six knots apiece, and a duration: a uniform Catmull-Rom spline per joint over `[0, T]`, and nothing else. That spline is the entire description of a technique. Everything the body does above — the lean, the swing, the catch — is the servo of the previous section reading an angle and a rate off those curves and spending whatever the strength envelope allows on closing the gap.

    Which means the reference is not the movement. It is a request. Where the body can follow it the two coincide; where it cannot, the request is a cheque the muscle does not cash, and the physics is still exactly right while the handstand is expensive, ugly, or absent. A bad reference does not produce a bad simulation. It produces a good simulation of someone attempting a bad idea.

    So the reference poses are not, in general, poses. A servo's torque is proportional to how far the joint is from its target, clipped at what the muscle can produce, which means the only way to hold a joint at its maximum is to keep the target far ahead of the body. The optimizer discovered that and used it. Two thirds of the way through the kick-up the reference is asking the trunk to stand at 75 degrees — thirteen degrees *past* the handstand — while the body is still at 123, and the shoulder is at a hundred per cent of its cap the whole time. It is a carrot on a stick. The same is true at the start: only the *last* knot is pinned, so the first is free, and the kick-up opens asking the hip for 26 degrees while the lunge it starts from is folded to 83.

    The straight-leg press does none of this. Its reference sits within a few degrees of the body at every knot, because a press never needs full effort from any joint and so never needs to lie to one. That is the difference between a technique you *hold* and a technique you *throw*.

    The pose the body actually starts in is not a knot at all, and is not authored: every scenario *solves* its start from the body it is given. The press folds to the deepest the hamstrings allow and then bisects the shoulder angle until the center of mass sits over the palm — so an 85 degree fold starts with the shoulder at 100 and a 125 degree fold at 74, and a stiffer body has to lean further to get over its hands at all. The kick-up hinges the torso to 90 degrees over the hands and solves the stance hip until the toe reaches the floor. The bent-leg press solves the same lean to leave about a third of body weight standing on the feet, which is what makes it a hop rather than a press. So moving a flexibility slider moves where the body begins while the technique's first knot stays exactly where the search left it, and the gap between them — the one the label under the figure measures — opens or closes without a knot having been touched.

    You can take that start over: drag it, and it stops being solved and becomes a pose the technique carries. You can also hand it to the *search*, which is the padlock on the first frame below, and then the eight angles the body begins in join the thirty-seven the optimizer is already moving.

    Below is that technique, and the three things that can change it: your hands, a search, and the body you make it do the work on. They all move the same thirty-seven numbers.
  </script>

      // this line speaks in eight channels; the presets and the recorded runs
      // still speak in six, and a six-channel technique IS an eight-channel
      // one with the spine and the neck straight.
      const stored8 = () => widenKnots(sim.knots.map((k) => Float64Array.from(k)));
      const baseKnots = () => (sameCount()
        ? sym(stored8())
        : fit(FIG.resampleKnots(stored8(), sim.T, K, sim.knotFracs)));
      // Even spacing, and only the ending held. This is what a technique
      // starts as and what Revert returns it to; a stored one may carry its own
      // phrasing, and does when it was authored with any.
      // Sized by argument, defaulting to the count on screen: openInto builds
      // these for the technique it is opening, which is a count K does not
      // have yet -- it is what openInto returns.
      const evenFracs = (n = K) => Float64Array.from({ length: n }, (_, k) => (n === 1 ? 0 : k / (n - 1)));
      const freshHeld = (n = K) => Array.from({ length: n }, (_, k) => k === n - 1);
      // The instants, held or free. Two different questions get asked of a
      // pose -- keep this shape, keep this moment -- and they are worth
      // asking separately: the shape of the pose you pass through and the
      // moment you pass through it are what a coach corrects one at a time.
      //
      // Everything starts pinned, so phrasing is something you ask for a pose
      // at a time. Free by default cost more than it bought: the instants are
      // four more dimensions, and CMA-ES's population grows as 4 + 3 ln n, so
      // 37 -> 41 dimensions buys exactly one more sample per generation.
      // Measured over two techniques and three seeds at 40 generations, free
      // won once, tied three times, and twice found NOTHING where pinned
      // improved -- both times on the press, which is a symmetric skill, so
      // mirroring halves the angle parameters that matter while the phrasing
      // dimensions arrive at full count.
      //
      // The ends are structural rather than pinned: the first pose is what
      // t = 0 means and the last is what T means, so neither is ever a
      // decision whatever you click.
      const freshTimeHeld = (n = K) => Array.from({ length: n }, () => true);
      const baseFracs = () => (sameCount() && sim.knotFracs?.length === K
        ? Float64Array.from(sim.knotFracs) : evenFracs());

      // Whether the technique on screen is still the one the run beside it was
      // produced from. Both a refit and a mirroring change the knots without
      // touching the recording, and a figure whose grey poses have moved while
      // its coloured body has not is the exact confusion this figure was built
      // to remove -- so either one means re-simulate rather than re-lay-out.
      let stale = false;
      const differs = (a, b) => a[0].length !== b[0].length
        || a.some((row, j) => row.some((v, k) => v !== b[j][k]));

      // ---- reading a technique, whole ---------------------------------------
      // ONE reader. A technique is a single object -- the one technique-file.js
      // writes -- and opening one has to give back every field of it: the
      // knots, the tempo, the phrasing, which poses are held, which instants
      // are pinned, the start pose, the mirror, the machine, the body, and the
      // search settings.
      //
      // There used to be two readers and they disagreed. Loading a FILE
      // restored all of it. Picking the same technique out of the list beside
      // it restored the knots and the tempo and dropped the rest on the floor:
      // the holds went back to "only the ending", every instant went back to
      // pinned, an edited start pose was discarded, the mirror was re-derived
      // from the scenario name, the search seed and generation count were left
      // at whatever was on screen -- and the pose count was taken from the
      // editor rather than the technique, so the knots themselves came back
      // resampled. Keep wrote one thing and the picker read another, which
      // means it was not a save/load at all.
      //
      // Returns the technique's own pose count, because the caller has to
      // reconcile the figure with it.
      const readTechnique = (rec) => {
        const nk = rec.knots[0].length;
        const rr = resolveRom(rec.rom);
        editState.knots = widenKnots(rec.knots.map((k) => Float64Array.from(k)));
        editState.T = +rec.T;
        editState.fracs = rec.knotFracs?.length === nk
          ? Float64Array.from(rec.knotFracs)
          : Float64Array.from({ length: nk }, (_, k) => (nk === 1 ? 0 : k / (nk - 1)));
        editState.held = rec.held?.length === nk
          ? Array.from(rec.held, Boolean)
          : Array.from({ length: nk }, (_, k) => k === nk - 1);
        editState.timeHeld = rec.timeHeld?.length === nk
          ? Array.from(rec.timeHeld, Boolean)
          : Array.from({ length: nk }, () => true);
        // Structural rather than stored: the ending pose is what the technique
        // aims at and the two ends of the movement are 0 and T by definition,
        // whatever a file happens to say about them.
        editState.held[nk - 1] = true;
        editState.timeHeld[0] = editState.timeHeld[nk - 1] = true;
        editState.q0 = rec.q0 ? Float64Array.from(rec.q0) : null;
        editState.startHeld = rec.startHeld !== false;
        editState.symmetric = typeof rec.symmetric === 'boolean'
          ? rec.symmetric
          : SYMMETRIC_SCENARIOS.has(rec.scenario || sim.scenarioName);
        editState.machine = {
          config: resolvePlant(rec.config),
          numerics: resolveNumerics(rec.numerics),
          body: resolveRunBody(rec.body),
        };
        editState.body = [
          rec.strength?.shoulder?.t0Vol ?? STRENGTH_DEFAULTS.shoulder.t0Vol,
          rr.hipFlexStraightKneeMaxDeg,
          rr.shoulderFlexMaxDeg,
          rr.wristExtMaxDeg ?? 135,
          rr.spineFlexMaxDeg ?? ROM_DEFAULTS.spineFlexMaxDeg,
        ];
        editState.search = { seed: rec.search?.seed ?? 7, maxGen: rec.search?.maxGen ?? 120 };
        return nk;
      };

      // ---- opening a technique into the editor ------------------------------
      // Called once when this figure is built and again every time another
      // technique is chosen. That second call is the point: choosing one used
      // to re-run this cell, which rebuilt every canvas, every control and the
      // wrapper around them to change what was inside -- so the animation
      // stopped, the filmstrip forgot where it was scrolled and the whole
      // figure flashed. Nothing about the instrument depends on WHICH
      // technique is in it, so nothing about it is rebuilt; this swaps the
      // technique and everything downstream reads the new one.
      //
      // Returns the pose count the technique wants. The caller owns K, because
      // changing it also re-lays the storyboard.
      function openInto(next) {
        const fresh = !(editState.base === next && editState.knots);
        // Per open, not per figure: the mirror straightens the knots of the
        // technique being opened, and whether it moved THOSE is the question
        // the caller settles on.
        stale = false;

        // Park what is being left, BEFORE anything below reassigns editState.
        // The body, the machine and the mirror are all rewritten a few lines
        // down with the INCOMING technique's defaults, and editState.base is
        // about to become the incoming run -- so a snapshot taken any later is a
        // snapshot of the wrong technique filed under the wrong id.
        //
        // Switching techniques used to destroy every edit made to the outgoing
        // one. For a built-in there was nowhere else for them to live, because a
        // built-in is derived rather than remembered: hold a pose, unpin an
        // instant, drag a knot, look at another technique to compare, come back,
        // and all of it was gone without a word. A document with unsaved changes
        // is a draft, so that is what it becomes.
        const leaving = editState.base;
        if (fresh && leaving?.presetId && editState.edited && editState.knots) {
          try {
            const drafts = readDrafts();
            drafts[leaving.presetId] = techniqueToJSON({
              label: leaving.stored?.label || leaving.scenarioName,
              saved: new Date().toISOString(),
              scenario: leaving.scenarioName,
              knots: editState.knots,
              T: editState.T,
              knotFracs: editState.fracs,
              held: editState.held,
              timeHeld: editState.timeHeld,
              startHeld: editState.startHeld,
              q0: editState.q0,
              target: leaving.stored?.target || null,
              rom: { ...(leaving.stored?.rom || {}),
                hipFlexStraightKneeMaxDeg: editState.body?.[1],
                shoulderFlexMaxDeg: editState.body?.[2],
                wristExtMaxDeg: editState.body?.[3],
                spineFlexMaxDeg: editState.body?.[4] },
              strength: { ...(leaving.stored?.strength || {}),
                shoulder: { ...(leaving.stored?.strength?.shoulder || STRENGTH_DEFAULTS.shoulder),
                  t0Vol: editState.body?.[0] } },
              body: editState.machine?.body || null,
              config: editState.machine?.config || null,
              numerics: editState.machine?.numerics || null,
              symmetric: editState.symmetric,
              search: editState.search,
              verdict: null, cost: null,
            });
            // Logged rather than shown: nobody asked for this write, and the
            // status line is about to be about the technique being opened.
            const err = writeDrafts(drafts);
            if (err) console.warn('could not park a draft:', err);
          } catch (err) { console.warn('could not park a draft:', err); }
        }
        sim = next;
        editState.base = sim;
        if (fresh || editState.body?.length !== 5) editState.body = bodyDefaults();
        if (fresh || !editState.machine) editState.machine = machineDefaults();
        if (fresh || editState.symmetric == null) {
          editState.symmetric = SYMMETRIC_SCENARIOS.has(sim.scenarioName);
        }
        // The pose count comes from the TECHNIQUE. It used to be read off
        // editState first and fall through to the technique only when the
        // editor was empty -- so opening a six-pose technique while a
        // seven-pose one was on screen kept the seven and quietly RESAMPLED
        // the six onto it. You saved six and got back seven. The count is a
        // setting of the figure only while you stay on one technique; the
        // moment you open another, the technique wins, exactly as loading a
        // file already did. And it is what the READER gives back, not what the
        // stored technique says: a parked draft is what gets opened when there
        // is one, and a draft may have had a pose added to it.
        let want = Math.max(2, fresh
          ? (openedTechnique()?.knots?.[0]?.length ?? sim.knots[0].length)
          : editState.knots[0].length);
        if (fresh) {
          // The draft for the technique being opened, if there is one, is what
          // the reader is handed -- otherwise the technique itself.
          const draft = sim.presetId ? readDrafts()[sim.presetId] : null;
          let opened = null;
          if (draft) {
            try { opened = techniqueFromJSON(draft); } catch (err) {
              console.warn('a parked draft would not read back, using the technique:', err);
            }
          }
          want = readTechnique(opened || openedTechnique() || {
            knots: sim.knots, T: sim.T, knotFracs: sim.knotFracs,
            rom: sim.baseRom, scenario: sim.scenarioName,
          });
          editState.hasDraft = !!opened;
          // Mirroring a symmetric skill moves the knots without touching the
          // recording beside them, and a figure whose grey poses have moved
          // while its coloured body has not is the confusion this figure exists
          // to remove -- so that means re-simulate rather than re-lay-out.
          const raw = editState.knots.map((k) => Float64Array.from(k));
          sym(editState.knots);
          stale = differs(editState.knots, raw);
          editState.run = sim;
          // A restored draft IS an edit -- it is the work you had done -- so the
          // badge and the verdict's baseline comparison both stay on.
          editState.edited = !!editState.hasDraft;
        }
        // Belt and braces for a technique stored before any of these existed.
        if (editState.fracs?.length !== want) editState.fracs = evenFracs(want);
        if (editState.held?.length !== want) editState.held = freshHeld(want);
        editState.held[want - 1] = true;
        if (editState.timeHeld?.length !== want) editState.timeHeld = freshTimeHeld(want);
        editState.timeHeld[0] = editState.timeHeld[want - 1] = true;
        if (!editState.search) editState.search = { seed: 7, maxGen: 120 };
        return want;
      }

      // Open whatever the picker is naming right now. Everything below is
      // built against the technique this leaves in editState.
      K = openInto(sim);

      const dpr = devicePixelRatio;
      // Every reference pose has to fit, and a reference pose is not a pose the
      // body ever holds: measured over every knot of every stored technique the
      // widest reaches 1.18 m from the hand and the tallest 2.07 m. Fixed, so
      // six poses look like six poses of one body rather than six bodies.
      const VIEW = { cx: 0.15, yLo: -0.2, yHi: 2.15 };
      // Mutable, because the figure expands. Every one of these is re-derived
      // in onResize below, and the values here are only the collapsed start.
      let totalW = pageW;
      let wide = totalW >= 560;
      let panelW = totalW;
      let panelH = wide ? 340 : 260;
      const STAGE_H = panelH;
      // K + 1 cells: the pose the body STARTS in, then the K it asks for.
      let nCells = K + 1;
      // Only an aspect ratio, in effect. The storyboard is ONE row and sizes
      // its own frames to whatever width it is handed -- it used to be a grid
      // that wrapped, and a wrapped storyboard stops being a time axis: the
      // ninth pose of a movement sat underneath the first, and the eye had to
      // jump back to the left margin in the middle of the phrase.
      const thumbW = 88, thumbH = Math.round(88 / 1.13);

      let theme = null;
      let paintRamp = null;
      // Assigned once the document bar below exists, and called through the
      // optional chain the way paintRamp is. It cannot be a direct reference:
      // createFrameLoop runs its callback ONCE, SYNCHRONOUSLY, at the moment
      // the loop is created -- which is above the bar -- so naming the badge
      // there put a const in its temporal dead zone, the first tick threw, and
      // a frame loop that throws cancels itself. The whole figure went dark and
      // stayed dark.
      let syncDoc = null;
      // Dropping a pose, asked and answered. Both are assigned further down --
      // askDrop needs dropPose, and closeConfirm needs the strip it hides --
      // and both are reached from callbacks that fire long after this cell
      // body has run. Declared here and called through the optional chain all
      // the same, because the last thing that named one of these directly
      // from above its definition put a const in the frame loop's dead zone
      // and took the whole figure down with it.
      let askDrop = null;
      let closeConfirm = null;

      // ---- one time variable, one selected pose ----------------------------
      let t = 0, sel = 0, playing = false, lastNow = null;
      let dirty = true, chromeDirty = true, xEnd = 1;
      // Whether the reference is drawn behind the body while the movement
      // plays. Off, because in playback it is not the subject: a second, grey,
      // slightly-out-of-step body in the same picture reads as a smear on the
      // animation rather than as the thing driving it. It is still there for
      // the asking -- and while you are EDITING a pose the reference IS the
      // subject, drawn alone, whatever this says.
      let showRef = false;
      let searching = false, poolSize = null, status = '';
      const knotTime = (k) => editState.fracs[k] * editState.T;
      // The held poses as the search wants them: the six angles each one is
      // pinned to, or null where it is free to move. Read off the knots, so a
      // pose you drag and then hold is held where you left it.
      const lockValues = () => editState.held.map((on, k) => (on
        ? Array.from({ length: FIG.JOINTS.length }, (_, j) => editState.knots[j][k]) : null));
      // And the pinned instants, the same way: the fraction each pinned pose
      // sits at, or null where the search may slide it.
      const timeLockValues = () => editState.timeHeld.map((on, k) => (on ? editState.fracs[k] : null));
      // Is there anything for the search to phrase? With every interior pose
      // pinned there is not, and the decision vector stays the length it was.
      const timesAreFree = () => editState.timeHeld.some((on, k) => !on && k > 0 && k < K - 1);
      // sel is a STORYBOARD CELL: 0 is the start, 1..K are the knots, -1 is
      // "none, the movement is running". Selecting one also moves the clock to
      // it -- it used to leave the clock where it was, so the pose being
      // edited and the instant everything else reported disagreed, and the
      // body behind it sat unchanging at some other moment entirely.
      const startQ = () => editState.q0 || editState.run.rec.q[0];
      const selectCell = (i) => {
        // Reaching for another pose is an answer: you are no longer looking at
        // the one you were asked about.
        closeConfirm?.();
        sel = Math.min(nCells - 1, Math.max(0, i));
        t = sel === 0 ? 0 : knotTime(sel - 1);
        setPlaying(false);
        dirty = chromeDirty = true;
      };

      // ONE stage. The two panels were the same instant drawn twice, and the
      // reader had to hold them side by side to see the only thing that
      // matters -- the gap between them. Overlaid, the gap IS the picture, and
      // opacity says which of the two you are acting on: the subject is solid
      // and on top, the other is a flat underlay in its own colour.
      const stage = html`<div style="position:relative; width:${panelW}px; height:${panelH}px;
        touch-action:none; border:1px solid currentColor; border-radius:4px; box-sizing:border-box;
        border-color:color-mix(in srgb, currentColor 18%, transparent);"></div>`;
      const canvas = html`<canvas style="position:absolute; left:0; top:0;
        width:${panelW}px; height:${panelH}px;"></canvas>`;
      canvas.width = Math.round(panelW * dpr);
      canvas.height = Math.round(panelH * dpr);
      const stageCtx = canvas.getContext('2d');
      stage.appendChild(canvas);
      const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      overlay.setAttribute('width', panelW);
      overlay.setAttribute('height', panelH);
      overlay.style.cssText = 'position:absolute; left:0; top:0;';
      stage.appendChild(overlay);
      // Everything that draws itself at a fixed size, told the new one. The
      // canvas is the only thing here with a backing store, so it is the only
      // thing that has to be re-created rather than restyled.
      const sizeStage = (w, h) => {
        panelW = Math.max(200, Math.round(w));
        panelH = Math.max(160, Math.round(h));
        stage.style.width = `${panelW}px`;
        stage.style.height = `${panelH}px`;
        canvas.style.width = `${panelW}px`;
        canvas.style.height = `${panelH}px`;
        canvas.width = Math.round(panelW * dpr);
        canvas.height = Math.round(panelH * dpr);
        overlay.setAttribute('width', panelW);
        overlay.setAttribute('height', panelH);
      };
      const askQ = new Float64Array(runModel().nq);
      // The pose the technique is aiming at IS its last knot. Drag that cell
      // and you have asked for a different ending -- a pike, a planche -- and
      // the search is told about it rather than snapping it back to a
      // handstand behind your back.
      const tgtQ = new Float64Array(runModel().nq);
      const targetQ = () => FIG.knotPose(
        editState.run?.model || sim.model || model, editState.knots, K - 1, tgtQ);

      const drawStage = () => {
        const run = editState.run, rec = run.rec;
        const m = run.model || model, wsr = run.ws || ws;
        const prof = run.prof || strengthProf;
        const isDark = theme?.isDark ?? false;
        const k = FIG.frameAt(rec, t);
        const common = { clear: false, model: m, ws: wsr, width: panelW, height: panelH, theme, view: VIEW };
        const field = searching ? optState.ghosts : null;
        const editing = sel >= 0 && !searching;

        stageCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stageCtx.clearRect(0, 0, panelW, panelH);

        if (field?.length) {
          // Searching: the generation, and nothing else. No incumbent on top,
          // because the question at that moment is what the whole field does.
          const floorY = panelH - (0 - VIEW.yLo) * (panelH / (VIEW.yHi - VIEW.yLo));
          const fg = theme?.foreground || [0.11, 0.12, 0.14];
          const rgb = fg.map((v) => Math.round(v * 255)).join(',');
          stageCtx.fillStyle = `rgba(${rgb},0.05)`;
          stageCtx.fillRect(0, floorY, panelW, panelH - floorY);
          stageCtx.strokeStyle = `rgba(${rgb},0.45)`;
          stageCtx.lineWidth = 1;
          stageCtx.beginPath();
          stageCtx.moveTo(0, floorY);
          stageCtx.lineTo(panelW, floorY);
          stageCtx.stroke();
          // Indexed by the clock, not by fraction-of-window. A candidate's
          // frames span the whole rollout it was SCORED over -- through the
          // settle tail -- while the window this figure plays stops a second
          // after the movement ends, so dividing by xEnd ran the field half
          // again too fast and left it parked in a settle the body beside it
          // had not reached. Both are now the same second of the same clock.
          drawGhosts(stageCtx, {
            ...common, alpha: 0.2,
            poses: field.map((c) => {
              const n = c.frames?.length || 0;
              if (!n) return {};
              const u = Math.min(Math.max(t / (c.dur || xEnd), 0), 1);
              return { q: c.frames[Math.min(n - 1, Math.round(u * (n - 1)))] };
            }).filter((c) => c.q),
          });
          syncHandles([]);
          return;
        }

        if (editing) {
          // Editing: the pose you are setting, alone. Nothing is drawn behind
          // it. There used to be the body's own pose at that instant back
          // there, and it was two grey bodies in the same picture again --
          // and worse, it did not move while you dragged, because the physics
          // has not re-run yet, so it read as broken rather than as context.
          const q = sel === 0 ? startQ() : FIG.knotPose(m, editState.knots, sel - 1, askQ);
          if (sel === 0) askQ.set(q);
          syncHandles(drawScene(stageCtx, {
            ...common, q, segmentColors: sel === 0 ? null : FIG.requestTint(),
          }).handles.filter((h) => !lockedJoint(h.joint)));
        } else {
          // Watching: what happened is solid, in its strength colours. The
          // reference it was chasing goes behind it only if you asked for it
          // -- see showRef. When it is drawn it is drawn faint, because at
          // this moment the target is context and not the subject.
          if (showRef) {
            FIG.requestPose(m, editState.knots, editState.T, t, askQ, editState.fracs);
            drawGhosts(stageCtx, { ...common, poses: [{ q: askQ }], alpha: 0.12, color: FIG.REQUEST_COLOR });
          }
          drawScene(stageCtx, { ...common, q: rec.q[k], segmentColors: FIG.effortTint(run, k, prof, isDark) });
          syncHandles([]);
        }
      };

      // ---- joint handles ----------------------------------------------------
      const handleEls = new Map();
      const syncHandles = (handles) => {
        const want = new Set(handles.map((h) => h.joint));
        for (const [j, el] of [...handleEls]) if (!want.has(j)) { el.remove(); handleEls.delete(j); }
        for (const h of handles) {
          let el = handleEls.get(h.joint);
          if (!el) {
            el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            el.setAttribute('r', 10);
            el.setAttribute('stroke-width', 1.6);
            el.setAttribute('stroke', FIG.REQUEST_COLOR);
            el.setAttribute('fill', FIG.REQUEST_FILL);
            el.style.pointerEvents = 'all';
            el.style.cursor = 'grab';
            el.style.transition = 'fill 90ms linear';
            el.dataset.joint = h.joint;
            // A handle that does not answer the pointer looks like decoration.
            // It stays lit while it is HELD as well as while it is hovered,
            // because a finger that has wandered off a 10 px circle is still
            // dragging it.
            el.addEventListener('pointerenter', () => {
              el.setAttribute('fill', FIG.REQUEST_FILL_HOVER);
              el.setAttribute('stroke-width', 2.2);
            });
            el.addEventListener('pointerleave', () => {
              if (drag?.el === el) return;
              el.setAttribute('fill', FIG.REQUEST_FILL);
              el.setAttribute('stroke-width', 1.6);
            });
            overlay.append(el);
            handleEls.set(h.joint, el);
          }
          el.setAttribute('cx', h.x);
          el.setAttribute('cy', h.y);
          el.dataset.px = h.pivotX;
          el.dataset.py = h.pivotY;
        }
      };

      // A drag rotates the joint about its own pivot, and nothing re-simulates
      // until it is let go: re-running the physics mid-gesture replaces the
      // recording, and the pose then jumps out from under the pointer.
      let drag = null;
      overlay.addEventListener('pointerdown', (e) => {
        const el = e.target;
        if (drag || !(el instanceof SVGCircleElement) || sel < 0 || searching) return;
        const r = overlay.getBoundingClientRect();
        const px = +el.dataset.px, py = +el.dataset.py;
        drag = {
          el, pointerId: e.pointerId, px, py, ch: +el.dataset.joint - 3, moved: false,
          a0: Math.atan2(-(e.clientY - r.top - py), e.clientX - r.left - px),
          q0: sel === 0 ? startQ()[+el.dataset.joint]
            : editState.knots[+el.dataset.joint - 3][sel - 1],
        };
        try { el.setPointerCapture(e.pointerId); } catch (_) { /* best effort */ }
        el.style.cursor = 'grabbing';
        el.setAttribute('fill', FIG.REQUEST_FILL_HOVER);
        el.setAttribute('stroke-width', 2.2);
        e.preventDefault();
      });
      overlay.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        const r = overlay.getBoundingClientRect();
        const a = Math.atan2(-(e.clientY - r.top - drag.py), e.clientX - r.left - drag.px);
        let da = a - drag.a0;
        if (da > Math.PI) da -= 2 * Math.PI;
        if (da < -Math.PI) da += 2 * Math.PI;
        if (sel === 0) writeStart(drag.ch, drag.q0 + da);
        else writeKnot(drag.ch, sel - 1, drag.q0 + da);
        drag.moved = true;
        dirty = chromeDirty = true;
        e.preventDefault();
      });
      const endDrag = (e) => {
        if (!drag || (e && e.pointerId !== drag.pointerId)) return;
        try { drag.el.releasePointerCapture(drag.pointerId); } catch (_) { /* gone */ }
        drag.el.style.cursor = 'grab';
        drag.el.setAttribute('fill', FIG.REQUEST_FILL);
        drag.el.setAttribute('stroke-width', 1.6);
        const moved = drag.moved;
        drag = null;
        if (moved) resim();
      };
      overlay.addEventListener('pointerup', endDrag);
      overlay.addEventListener('pointercancel', endDrag);
      overlay.addEventListener('lostpointercapture', endDrag);

      // A knot goes exactly where it is put. Nothing is clamped: a handle that
      // stops for a reason the figure has not drawn is a handle that lies.
      const writeKnot = (ch, k, q) => {
        editState.knots[ch][k] = q;
        if (symmetric() && ch === CH.hipL) editState.knots[CH.hipR][k] = q;
        if (symmetric() && ch === CH.kneeL) editState.knots[CH.kneeR][k] = q;
      };
      // The start is not a knot -- it is the body's own configuration at t = 0
      // -- so it is written into its own vector, and the first edit forks it
      // off the one the scenario solved.
      const writeStart = (ch, q) => {
        if (!editState.q0) editState.q0 = Float64Array.from(editState.run.rec.q[0]);
        editState.q0[3 + ch] = q;
        if (symmetric() && ch === CH.hipL) editState.q0[3 + CH.hipR] = q;
        if (symmetric() && ch === CH.kneeL) editState.q0[3 + CH.kneeR] = q;
      };

      const story = FIG.createStoryboard({
        n: nCells, thumbW, thumbH, view: VIEW, dpr, onSelect: selectCell,
        // The start pose has a padlock too. It is not a knot -- it is where
        // the body BEGINS -- but it is the one part of a technique the search
        // could never answer back on, and "you are starting in the wrong
        // place" is the most useful thing it has to say about a movement that
        // nearly works. Held by default; unlocked, its joints join the
        // decision vector. The ending stays permanently locked, because being
        // the pose the technique aims at is what "ending pose" means.
        canLock: (i) => (i === nCells - 1 ? 'fixed' : 'toggle'),
        // The first reference pose anchors t = 0 and the last IS the ending, so
        // neither goes; everything between is yours to drop. Same rule as the
        // timeline drag, for the same reason.
        canDelete: (i) => i >= 2 && i <= nCells - 2,
        // And a gap to add one in: before every knot after the first, which is
        // every boundary between two poses.
        canInsertBefore: (i) => i >= 2,
        // Asks. Dropping a pose is the one edit in this figure that cannot be
        // undone -- every other one moves a number you can move back -- and it
        // hangs off an 18px button in the corner of the target that SELECTS
        // the pose. See askDrop.
        onDelete: (i) => askDrop?.(i),
        onInsert: (i) => addPoseBefore(i - 1),
        // The instants of the interior poses -- the ends are 0 and T by
        // definition, and the start cell is not a knot at all.
        canTimeLock: (i) => i >= 2 && i <= nCells - 2,
        onTimeLock: (i) => {
          const k = i - 1;
          editState.timeHeld[k] = !editState.timeHeld[k];
          // Same as holding a pose: it changes what the search may do, not
          // what the body does, so nothing is re-simulated. It IS an edit
          // though -- which instants are pinned is a field of the technique,
          // written to every file -- and saying otherwise meant the editor
          // thought nothing had changed and threw the pins away on the next
          // technique switch.
          editState.edited = true;
          chromeDirty = dirty = true;
        },
        onLock: (i) => {
          if (i === 0) {
            editState.startHeld = !editState.startHeld;
            // Unlocking makes the start EXPLICIT. Left null it means "whatever
            // this scenario solves", and the search would then begin from the
            // solve rather than from the pose on screen -- which for a start
            // the reader has dragged is a different technique.
            if (!editState.startHeld && !editState.q0) {
              editState.q0 = Float64Array.from(editState.run.rec.q[0]);
            }
            editState.edited = true;
            chromeDirty = dirty = true;
            return;
          }
          const k = i - 1;
          editState.held[k] = !editState.held[k];
          // Holding a pose does not change the movement -- it changes what the
          // search is allowed to do with it -- so nothing is re-simulated. It
          // is still an edit: which poses are held is part of the technique.
          editState.edited = true;
          chromeDirty = dirty = true;
        },
      });
      const strip = FIG.createStrip({
        width: totalW, dpr,
        onSeek: (x) => {
          t = x; sel = -1; setPlaying(false);
          // chromeDirty too: without it the storyboard is never repainted and
          // the pose you last picked stays ringed while you scrub past it.
          dirty = chromeDirty = true;
        },
        // Sliding a pose along the timeline. Where the poses fall is phrasing,
        // and a movement is mostly phrasing: two key poses a tenth of a second
        // apart is a snap, and evenly spaced knots cannot say one at all. It
        // re-simulates on the drop rather than during the drag, for the same
        // reason dragging a limb does -- re-running the physics mid-gesture
        // moves the floating base, and with it the thing under the finger.
        onPlay: (next) => togglePlay(next),
        onKnotPick: (k) => { selectCell(k + 1); },
        onKnotDrag: (k, frac, settled) => {
          editState.fracs[k] = frac;
          // Moving a pose in time does NOT pin it. Setting a value and
          // deciding who owns it are two different things, and doing them with
          // one gesture means you cannot do the first without the second --
          // there was no way to nudge the starting point of a pose you had
          // deliberately handed to the search without taking it back. The
          // padlock beside the number is how you say that, and it is left
          // exactly as you set it.
          t = knotTime(k);
          dirty = chromeDirty = true;
          if (settled) resim(); else relayout();
        },
        // The last pose IS the end of the movement, so dragging it sets the
        // duration. It was a slider in a panel -- "Duration T (s)" -- which
        // asked the reader to set, in a number, the one thing the picture
        // beside it draws as a position; and the handle a reader would
        // actually reach for, the one at the end of the timeline, did nothing.
        //
        // Everything before it keeps the INSTANT it is at rather than the
        // fraction: dragging the end moves the end, not the phrasing. The
        // settle window that follows is fixed (numerics.settleT) and is what
        // the axis draws past the T mark, so a longer movement does not buy
        // more time to fall over in.
        onDurationDrag: (Tsec, settled) => {
          const times = Array.from({ length: K }, (_, k) => knotTime(k));
          const Tmin = Math.max(T_RANGE[0], (times[K - 2] ?? 0) + 0.02);
          const next = Math.min(Math.max(Tsec, Tmin), T_RANGE[1]);
          editState.T = next;
          for (let k = 1; k < K - 1; k++) editState.fracs[k] = times[k] / next;
          editState.fracs[0] = 0;
          editState.fracs[K - 1] = 1;
          // The tempo is a field of the technique, so changing it is an edit --
          // the same reason moving a pose is.
          editState.edited = true;
          t = next;
          dirty = chromeDirty = true;
          if (settled) resim(); else relayout();
        },
      });
      // ---- changing how many poses there are ---------------------------------
      // Three ways in, one place they land. Nothing here re-runs the cell: the
      // storyboard is told its new cell count and everything else already
      // reads K live.
      // Set by the expandable() wrapper below, which owns the box this figure
      // is drawn in. A change of pose count can add a whole row of thumbnails,
      // and nothing outside can see that: collapsed, the container's height was
      // measured once from the content and stops matching it; expanded, the
      // stage was given the height left over from a chrome that has since got
      // taller. Either way the timeline ends up past the bottom edge.
      const layout = { refresh: null };
      // opts travel through to resim: opening another technique changes the
      // count without that being an EDIT, and resim is what decides whether
      // the document is badged as one.
      const setCount = (next, opts) => {
        // A search in flight is a search for a DIFFERENT technique the moment
        // the pose count changes: it is still scoring K poses and will hand
        // back K of them, onto a page whose knots, phrasing and holds are all
        // K-1 long now. Nothing downstream checks, so the mismatch travels --
        // the replay reads a knot column that is not there, or phrases six
        // poses by five instants, and the figure fills with NaN. Revert and
        // Load already stop the search for exactly this reason; dropping and
        // adding a pose are the same kind of edit and were not.
        if (searching) {
          stopSearch();
          status = 'stopped · the number of poses changed';
        }
        K = next;
        nCells = K + 1;
        editState.held[K - 1] = true;
        editState.timeHeld[0] = editState.timeHeld[K - 1] = true;
        // The storyboard re-lays itself at whatever width it is currently at,
        // which is not totalW while the figure is expanded.
        story.setCount(nCells);
        sel = Math.min(sel, nCells - 1);
        resim(opts);
        layout.refresh?.();
      };

      // Drop a pose. The others keep their angles AND their instants exactly:
      // this is the edit for a pose that is not earning its place, and refitting
      // the rest around its absence would be a different technique.
      const dropPose = (k) => {
        if (K <= 2 || k <= 0 || k >= K - 1) return;
        editState.knots = editState.knots.map((row) =>
          Float64Array.from([...row.slice(0, k), ...row.slice(k + 1)]));
        editState.fracs = Float64Array.from([...editState.fracs.slice(0, k), ...editState.fracs.slice(k + 1)]);
        editState.held = [...editState.held.slice(0, k), ...editState.held.slice(k + 1)];
        editState.timeHeld = [...editState.timeHeld.slice(0, k), ...editState.timeHeld.slice(k + 1)];
        editState.edited = true;
        setCount(K - 1);
      };

      // Add one between knot k-1 and knot k, halfway between them in time, with
      // its angles read off the curve that is already there. The movement does
      // not change; you gain a handle on it. That IS the resampling -- of one
      // point, at one instant, rather than a least-squares refit of everything.
      const insQ = new Float64Array(runModel().nq);
      const addPoseBefore = (k) => {
        if (K >= 12 || k <= 0 || k > K - 1) return;
        const frac = 0.5 * (editState.fracs[k - 1] + editState.fracs[k]);
        FIG.requestPose(editState.run?.model || runModel(), editState.knots, editState.T,
          frac * editState.T, insQ, editState.fracs);
        editState.knots = editState.knots.map((row, j) =>
          Float64Array.from([...row.slice(0, k), insQ[3 + j], ...row.slice(k)]));
        editState.fracs = Float64Array.from([...editState.fracs.slice(0, k), frac, ...editState.fracs.slice(k)]);
        editState.held = [...editState.held.slice(0, k), false, ...editState.held.slice(k)];
        editState.timeHeld = [...editState.timeHeld.slice(0, k), true, ...editState.timeHeld.slice(k)];
        editState.edited = true;
        setCount(K + 1);
      };

      // ---- asking before dropping a pose --------------------------------------
      // Dropping a pose is the one edit in this figure that cannot be undone.
      // Every other one moves a number you can move back; this one takes a
      // column out of the knot matrix, and Revert -- the only way back -- also
      // discards everything else you have done since.
      //
      // And it hangs off an 18px button in the corner of the 40px target that
      // SELECTS the pose. On a desktop that button only appears under the
      // pointer, so it is hard to hit by mistake. On a phone there is no
      // pointer: it was invisible and live at the same time, and reaching for
      // a pose to look at deleted it instead, over and over, with nothing on
      // screen to say what had just happened. The storyboard now hides what it
      // cannot reveal (see HOVER in figure-kit), and the button asks.
      //
      // The asking is in the pane header rather than on the frame, because two
      // finger-sized answers do not fit on a frame 40 pixels wide -- and
      // because a question about the strip belongs to the strip. The frame
      // being asked about goes solid-bordered with its neighbours dimmed, so
      // "pose 3" and which one that is are the same fact.
      let confirmCell = -1;
      const confirmText = html`<span style="opacity:.85;"></span>`;
      const confirmYes = html`<button class="hs-btn hs-btn--primary">Delete</button>`;
      const confirmNo = html`<button class="hs-btn">Cancel</button>`;
      const confirmBar = html`<span class="hs-confirm" hidden aria-live="assertive"
        >${confirmText}${confirmYes}${confirmNo}</span>`;
      const posesTitle = html`<span class="hs-pane__title">Poses</span>`;
      closeConfirm = (focusBack = false) => {
        if (confirmCell < 0) return;
        const back = story.cells[confirmCell]?.host;
        confirmCell = -1;
        story.setPending(-1);
        confirmBar.hidden = true;
        posesTitle.hidden = false;
        // The strip is the same height as the title it replaces, so this is
        // belt and braces -- but a pane that changes height inside a box whose
        // height was measured once is a pane that gets clipped.
        layout.refresh?.();
        if (focusBack) back?.focus?.();
      };
      askDrop = (i) => {
        // Nothing to ask about: the first reference pose anchors t = 0 and the
        // last IS the ending. Same rule the storyboard uses to decide whether
        // this cell has a button at all.
        if (i < 2 || i > nCells - 2 || K <= 2) return;
        confirmCell = i;
        story.setPending(i);
        confirmText.textContent = `Drop pose ${i}?`;
        confirmBar.hidden = false;
        posesTitle.hidden = true;
        layout.refresh?.();
        // The safe answer takes the focus, so a stray Enter cancels.
        confirmNo.focus?.();
      };
      confirmNo.addEventListener('click', () => closeConfirm(true));
      confirmYes.addEventListener('click', () => {
        const k = confirmCell - 1;
        closeConfirm();
        dropPose(k);
      });

      // Mirrored from the picker above rather than duplicated: one technique,
      // one selection, two places you can reach it. The section that is ABOUT
      // a technique should not be the one section with no way to choose one.
      // Mirrored from the picker above rather than duplicated: one list, one
      // selection, two places you can reach it. Inputs.bind cannot do this any
      // more because both are plain selects whose options change as presets
      // are kept and forgotten, so the mirroring is explicit -- and it copies
      // the OPTIONS as well as the value, or the panel offers a stale list.
      // Flexes and truncates rather than demanding a width. Kept presets are
      // auto-named "<technique> · <date>", which is wider than a phone, and a
      // select that insists on 11em pushed everything else onto a second row.
      // The name is the front of that string, so an ellipsis loses the part
      // nobody reads.
      // Shrinks but does not grow: its natural width is its longest option, so
      // where there is room it sizes to what it has to say and no further, and
      // where there is not it gives way rather than pushing the row apart.
      const pick = html`<select style="flex:0 1 auto; min-width:0; max-width:18em;"></select>`;
      const syncPick = () => {
        pick.replaceChildren(...Array.from(presetInput.options,
          (o) => html`<option value="${o.value}">${o.textContent}</option>`));
        pick.value = presetInput.value;
      };
      syncPick();
      pick.addEventListener('input', () => {
        presetInput.value = pick.value;
        presetInput.dispatchEvent(new Event('input', { bubbles: true }));
      });
      // Rebuild both lists and select `id`. Everything that adds or removes a
      // preset goes through here, so the two selects cannot drift.
      const refreshPresets = (id = null) => {
        // The stored list has changed, so anything techniqueSource remembers
        // about an id in it is stale -- a preset can be overwritten, renamed
        // or forgotten under an id it has already answered for.
        techniqueSource.forget();
        presetInput.refresh(id);
        syncPick();
      };
      // The blunt way to the same setting, and the only one that refits: asking
      // for a count says nothing about WHICH poses, so the curve is re-fitted
      // with that many and the phrasing goes back to even. The x and + on the
      // storyboard say which, and neither refits anything.
      const symToggle = Inputs.toggle({ label: 'Legs mirror', value: editState.symmetric });
      symToggle.title = 'the two legs do the same thing. On, the right leg follows the '
        + 'left -- it gets no handles of its own and the search cannot move it '
        + 'independently, which is what stops a press arriving with one leg straight '
        + 'and the other folded. Off, all six joints are yours and the search\u2019s.';
      symToggle.addEventListener('input', () => {
        editState.symmetric = !!symToggle.value;
        if (editState.symmetric) {
          symmetrizeKnots(editState.knots);
          // By name. Written as 5/6/7/8 these were the six-joint body's leg
          // coordinates; on the articulated body 5 is the spine.
          if (editState.q0) {
            editState.q0[QI.hipR] = editState.q0[QI.hipL];
            editState.q0[QI.kneeR] = editState.q0[QI.kneeL];
          }
        }
        editState.edited = true;
        chromeDirty = dirty = true;
        resim();
      });

      // There was a "Poses" slider here, which asked for a COUNT and then
      // refitted the curve onto it -- throwing away the phrasing and the holds
      // to answer a question nobody has ("I want seven of something"). The x
      // and + on the storyboard say which pose goes and where one arrives,
      // which is the same setting reached the way it is actually thought
      // about, and neither refits anything.

      // The clock's owner. The button that works it lives on the timeline now,
      // so every place that stops playback goes through here and the icon can
      // never disagree with what the body is doing.
      const setPlaying = (next) => { playing = !!next; strip.setPlaying(playing); };
      // Starting playback deselects: a pose you are editing is a moment you
      // are stopped at, and the two states cannot both be true.
      const togglePlay = (next) => {
        setPlaying(next ?? !playing);
        if (playing) sel = -1;
        lastNow = null;
        dirty = chromeDirty = true;
      };
