            : editState.knots[+el.dataset.joint - 3][sel - 1],
        };
        try { el.setPointerCapture(e.pointerId); } catch (_) { /* best effort */ }
        el.style.cursor = 'grabbing';
        el.setAttribute('fill', FIG.REQUEST_FILL_HOVER);
        el.setAttribute('stroke-width', 2.2);
        e.preventDefault();
      });
      overlay.addEventListener('pointermove', (e) => {
        if (!drag || e.pointerId !== drag.pointerId) return;
        const r = overlay.getBoundingClientRect();
        const a = Math.atan2(-(e.clientY - r.top - drag.py), e.clientX - r.left - drag.px);
        let da = a - drag.a0;
        if (da > Math.PI) da -= 2 * Math.PI;
        if (da < -Math.PI) da += 2 * Math.PI;
        if (sel === 0) writeStart(drag.ch, drag.q0 + da);
        else writeKnot(drag.ch, sel - 1, drag.q0 + da);
        drag.moved = true;
        dirty = chromeDirty = true;
        e.preventDefault();
      });
      const endDrag = (e) => {
        if (!drag || (e && e.pointerId !== drag.pointerId)) return;
        try { drag.el.releasePointerCapture(drag.pointerId); } catch (_) { /* gone */ }
        drag.el.style.cursor = 'grab';
        drag.el.setAttribute('fill', FIG.REQUEST_FILL);
        drag.el.setAttribute('stroke-width', 1.6);
        const moved = drag.moved;
        drag = null;
        if (moved) resim();
      };
      overlay.addEventListener('pointerup', endDrag);
      overlay.addEventListener('pointercancel', endDrag);
      overlay.addEventListener('lostpointercapture', endDrag);

      // A knot goes exactly where it is put. Nothing is clamped: a handle that
      // stops for a reason the figure has not drawn is a handle that lies.
      const writeKnot = (ch, k, q) => {
        editState.knots[ch][k] = q;
        if (symmetric() && ch === CH.hipL) editState.knots[CH.hipR][k] = q;
        if (symmetric() && ch === CH.kneeL) editState.knots[CH.kneeR][k] = q;
      };
      // The start is not a knot -- it is the body's own configuration at t = 0
      // -- so it is written into its own vector, and the first edit forks it
      // off the one the scenario solved.
      const writeStart = (ch, q) => {
        if (!editState.q0) editState.q0 = Float64Array.from(editState.run.rec.q[0]);
        editState.q0[3 + ch] = q;
        if (symmetric() && ch === CH.hipL) editState.q0[3 + CH.hipR] = q;
        if (symmetric() && ch === CH.kneeL) editState.q0[3 + CH.kneeR] = q;
      };

      const story = FIG.createStoryboard({
        n: nCells, cols: thumbCols, thumbW, thumbH, view: VIEW, dpr, onSelect: selectCell,
        // Cell 0 is the start, which the search never moved in the first
        // place; the last cell is the ending pose, which it may never move.
        // Everything between is yours to hold or release.
        canLock: (i) => (i === 0 ? null : i === nCells - 1 ? 'fixed' : 'toggle'),
        // The first reference pose anchors t = 0 and the last IS the ending, so
        // neither goes; everything between is yours to drop. Same rule as the
        // timeline drag, for the same reason.
        canDelete: (i) => i >= 2 && i <= nCells - 2,
        // And a gap to add one in: before every knot after the first, which is
        // every boundary between two poses.
        canInsertBefore: (i) => i >= 2,
        onDelete: (i) => dropPose(i - 1),
        onInsert: (i) => addPoseBefore(i - 1),
        // The instants of the interior poses -- the ends are 0 and T by
        // definition, and the start cell is not a knot at all.
        canTimeLock: (i) => i >= 2 && i <= nCells - 2,
        onTimeLock: (i) => {
          const k = i - 1;
          editState.timeHeld[k] = !editState.timeHeld[k];
          // Same as holding a pose: it changes what the search may do, not
          // what the body does, so nothing is re-simulated.
          chromeDirty = dirty = true;
        },
        onLock: (i) => {
          const k = i - 1;
          editState.held[k] = !editState.held[k];
          // Holding a pose does not change the movement -- it changes what the
          // search is allowed to do with it -- so nothing is re-simulated.
          chromeDirty = dirty = true;
        },
      });
      story.setColsFor(colsFor);
      const strip = FIG.createStrip({
        width: totalW, dpr,
        onSeek: (x) => {
          t = x; sel = -1; setPlaying(false);
          // chromeDirty too: without it the storyboard is never repainted and
          // the pose you last picked stays ringed while you scrub past it.
          dirty = chromeDirty = true;
        },
        // Sliding a pose along the timeline. Where the poses fall is phrasing,
        // and a movement is mostly phrasing: two key poses a tenth of a second
        // apart is a snap, and evenly spaced knots cannot say one at all. It
        // re-simulates on the drop rather than during the drag, for the same
        // reason dragging a limb does -- re-running the physics mid-gesture
        // moves the floating base, and with it the thing under the finger.
        onPlay: (next) => togglePlay(next),
        onKnotPick: (k) => { selectCell(k + 1); },
        onKnotDrag: (k, frac, settled) => {
          editState.fracs[k] = frac;
          // Putting a pose at an instant BY HAND pins it there. It is already
          // pinned unless you released it, so this only bites on a pose you
          // had handed to the search -- and there a drag the search then
          // undoes is a control that does not control anything: you would set
          // a snap, optimize, and watch it even itself back out. Nothing about
          // it is hidden, the caption and the upright both change as you let
          // go, and clicking the caption releases it again.
          if (settled) editState.timeHeld[k] = true;
          t = knotTime(k);
          dirty = chromeDirty = true;
          if (settled) resim(); else relayout();
        },
      });
      // ---- changing how many poses there are ---------------------------------
      // Three ways in, one place they land. Nothing here re-runs the cell: the
      // storyboard is told its new cell count and everything else already
      // reads K live.
      // Set by the expandable() wrapper below, which owns the box this figure
      // is drawn in. A change of pose count can add a whole row of thumbnails,
      // and nothing outside can see that: collapsed, the container's height was
      // measured once from the content and stops matching it; expanded, the
      // stage was given the height left over from a chrome that has since got
      // taller. Either way the timeline ends up past the bottom edge.
      const layout = { refresh: null };
      const setCount = (next) => {
        // A search in flight is a search for a DIFFERENT technique the moment
        // the pose count changes: it is still scoring K poses and will hand
        // back K of them, onto a page whose knots, phrasing and holds are all
        // K-1 long now. Nothing downstream checks, so the mismatch travels --
        // the replay reads a knot column that is not there, or phrases six
        // poses by five instants, and the figure fills with NaN. Revert and
        // Load already stop the search for exactly this reason; dropping and
        // adding a pose are the same kind of edit and were not.
        if (searching) {
          stopSearch();
          status = 'stopped · the number of poses changed';
        }
        K = next;
        nCells = K + 1;
        editState.held[K - 1] = true;
        editState.timeHeld[0] = editState.timeHeld[K - 1] = true;
        // The storyboard re-lays itself at whatever width it is currently at,
        // which is not totalW while the figure is expanded.
        story.setCount(nCells);
        poses.value = K;
        sel = Math.min(sel, nCells - 1);
        resim();
        layout.refresh?.();
      };

      // Drop a pose. The others keep their angles AND their instants exactly:
      // this is the edit for a pose that is not earning its place, and refitting
      // the rest around its absence would be a different technique.
      const dropPose = (k) => {
        if (K <= 2 || k <= 0 || k >= K - 1) return;
        editState.knots = editState.knots.map((row) =>
          Float64Array.from([...row.slice(0, k), ...row.slice(k + 1)]));
        editState.fracs = Float64Array.from([...editState.fracs.slice(0, k), ...editState.fracs.slice(k + 1)]);
        editState.held = [...editState.held.slice(0, k), ...editState.held.slice(k + 1)];
        editState.timeHeld = [...editState.timeHeld.slice(0, k), ...editState.timeHeld.slice(k + 1)];
        editState.edited = true;
        setCount(K - 1);
      };

      // Add one between knot k-1 and knot k, halfway between them in time, with
      // its angles read off the curve that is already there. The movement does
      // not change; you gain a handle on it. That IS the resampling -- of one
      // point, at one instant, rather than a least-squares refit of everything.
      const insQ = new Float64Array(runModel.nq);
      const addPoseBefore = (k) => {
        if (K >= 12 || k <= 0 || k > K - 1) return;
        const frac = 0.5 * (editState.fracs[k - 1] + editState.fracs[k]);
        FIG.requestPose(editState.run?.model || runModel, editState.knots, editState.T,
          frac * editState.T, insQ, editState.fracs);
        editState.knots = editState.knots.map((row, j) =>
          Float64Array.from([...row.slice(0, k), insQ[3 + j], ...row.slice(k)]));
        editState.fracs = Float64Array.from([...editState.fracs.slice(0, k), frac, ...editState.fracs.slice(k)]);
        editState.held = [...editState.held.slice(0, k), false, ...editState.held.slice(k)];
        editState.timeHeld = [...editState.timeHeld.slice(0, k), true, ...editState.timeHeld.slice(k)];
        editState.edited = true;
        setCount(K + 1);
      };

      // Mirrored from the picker above rather than duplicated: one technique,
      // one selection, two places you can reach it. The section that is ABOUT
      // a technique should not be the one section with no way to choose one.
      // Mirrored from the picker above rather than duplicated: one list, one
      // selection, two places you can reach it. Inputs.bind cannot do this any
      // more because both are plain selects whose options change as presets
      // are kept and forgotten, so the mirroring is explicit -- and it copies
      // the OPTIONS as well as the value, or the panel offers a stale list.
      const pick = html`<select style="min-width:11em; max-width:16em;"></select>`;
      const syncPick = () => {
        pick.replaceChildren(...Array.from(presetInput.options,
          (o) => html`<option value="${o.value}">${o.textContent}</option>`));
        pick.value = presetInput.value;
      };
      syncPick();
      pick.addEventListener('input', () => {
        presetInput.value = pick.value;
        presetInput.dispatchEvent(new Event('input', { bubbles: true }));
      });
      presetInput.addEventListener('input', syncPick);
      // Rebuild both lists and select `id`. Everything that adds or removes a
      // preset goes through here, so the two selects cannot drift.
      const refreshPresets = (id = null) => { presetInput.refresh(id); syncPick(); };
      // The blunt way to the same setting, and the only one that refits: asking
      // for a count says nothing about WHICH poses, so the curve is re-fitted
      // with that many and the phrasing goes back to even. The x and + on the
      // storyboard say which, and neither refits anything.
      const symToggle = Inputs.toggle({ label: 'Legs mirror', value: editState.symmetric });
      symToggle.title = 'the two legs do the same thing. On, the right leg follows the '
        + 'left -- it gets no handles of its own and the search cannot move it '
        + 'independently, which is what stops a press arriving with one leg straight '
        + 'and the other folded. Off, all six joints are yours and the search\u2019s.';
      symToggle.addEventListener('input', () => {
        editState.symmetric = !!symToggle.value;
        if (editState.symmetric) {
          symmetrizeKnots(editState.knots);
          // By name. Written as 5/6/7/8 these were the six-joint body's leg
          // coordinates; on the articulated body 5 is the spine.
          if (editState.q0) {
            editState.q0[QI.hipR] = editState.q0[QI.hipL];
            editState.q0[QI.kneeR] = editState.q0[QI.kneeL];
          }
        }
        editState.edited = true;
        chromeDirty = dirty = true;
        resim();
      });

      const poses = Inputs.range([2, 12], { label: 'Poses', step: 1, value: K });
      poses.addEventListener('input', () => {
        const next = Math.max(2, Math.round(+poses.value));
        if (next === K) return;
        editState.knots = fit(FIG.resampleKnots(editState.knots, editState.T, next, editState.fracs));
        editState.fracs = Float64Array.from({ length: next }, (_, i) => i / (next - 1));
        editState.held = Array.from({ length: next }, (_, i) => i === next - 1);
        editState.timeHeld = Array.from({ length: next }, () => true);
        editState.edited = true;
        setCount(next);
      });

      // The clock's owner. The button that works it lives on the timeline now,
      // so every place that stops playback goes through here and the icon can
      // never disagree with what the body is doing.
      const setPlaying = (next) => { playing = !!next; strip.setPlaying(playing); };
      // Starting playback deselects: a pose you are editing is a moment you
      // are stopped at, and the two states cannot both be true.
      const togglePlay = (next) => {
        setPlaying(next ?? !playing);
        if (playing) sel = -1;
        lastNow = null;
        dirty = chromeDirty = true;
      };

      // The sliders themselves: views onto editState.body, which is where the
      // numbers live (see above).
      const inShoulder = Inputs.range([0.5, 3.2], { label: 'Shoulder (Nm/kg)', step: 0.05,
        value: editState.body[0] });
      const inHam = Inputs.range([40, 140], { label: 'Hamstrings (deg)', step: 1,
        value: editState.body[1] });
      const inShFlex = Inputs.range([120, 185], { label: 'Shoulder flexion max (deg)', step: 1,
        value: editState.body[2] });
      const inWrExt = Inputs.range([80, 150], { label: 'Wrist extension max (deg)', step: 1,
        value: editState.body[3] });
      const bodyInputs = [inShoulder, inHam, inShFlex, inWrExt];
      bodyInputs.forEach((inp, n) => inp.addEventListener('input', () => {
        editState.body[n] = +inp.value;
        resim();
      }));

      // One definition of the duration range, because the search is told it too
      // and an Inputs.range is a wrapper around the input rather than the input
      // itself -- reading .min off it gives undefined, which travels as null
      // and lands as "no range given", quietly putting the search back on its
      // own default ceiling.
      const T_RANGE = [0.5, 3.5];
      const durInput = Inputs.range(T_RANGE, { label: 'Duration T (s)', value: editState.T, step: 0.01 });
      durInput.title = 'how long the movement takes. Yours to set: the search is '
        + 'pinned to it and will not change it. A movement that arrives only gets '
        + 'cheaper as it slows, so left free the search spends its budget running '
        + 'out of slider rather than finding a technique.';
      durInput.addEventListener('input', () => { editState.T = +durInput.value; resim(); });
      // "Reset" said nothing about what it resets, sitting in a row with the
      // pose count and the duration as if it reset those. It reverts the
      // technique -- every angle, the timing, the holds, the duration, the
      // start pose and the body sliders -- so it says so, and it sits with the
      // picker that names the thing it reverts to. The pose count is the one
      // thing it leaves alone: that is a setting, not part of the technique,
      // and a four-pose refit of a six-pose technique cannot be undone by
      // restoring six numbers.
      const resetBtn = html`<button class="hs-btn" title="discard every edit and go back to this technique as stored — angles, timing, held poses, duration and the body sliders. The number of poses is a setting and stays as you set it.">Revert to stored</button>`;
      resetBtn.addEventListener('click', () => {
        stopSearch();
        // baseKnots is a FUNCTION -- it has to be, because the pose count can
        // move and reverting at four poses has to give back the stored
        // technique said with four. Calling .map on the function itself threw
        // on the first line, so Revert had been doing nothing at all except
        // stopping the search: every button press was a silent no-op.
        editState.knots = baseKnots().map((k) => Float64Array.from(k));
        editState.T = simResult.T;
        editState.fracs = baseFracs();
        editState.held = freshHeld();
        editState.timeHeld = freshTimeHeld();
        // The mirror is part of the technique, so reverting the technique
        // reverts it too -- it was left wherever it had been set.
        editState.symmetric = SYMMETRIC_SCENARIOS.has(simResult.scenarioName);
        symToggle.value = editState.symmetric;
        editState.q0 = null;
        durInput.value = simResult.T;
        editState.body = bodyDefaults.slice();
        editState.machine = machineDefaults();
        syncServo();
        bodyInputs.forEach((i, n) => { i.value = bodyDefaults[n]; });
        editState.run = simResult;
        editState.edited = false;
        editState.notify?.(null);
        optState.history = [];
        status = '';
        // A revert changes the knots, so the body on screen is no longer the
        // one beside them: re-simulate rather than merely re-draw.
        resim();
      });

      // ---- save and load ------------------------------------------------------
      // Everything needed to reproduce the case, which is not a judgement call:
      // technique-file.js writes the list the plumbing gates enumerate, and
      // test/technique-file.mjs perturbs each field in turn to prove none of
      // them is quietly missing. The shape is a stored artifact's, so a file
      // saved here is the same object a built-in preset is derived as.
      const asTechnique = () => ({
        label: `${simResult.stored?.label || simResult.scenarioName} · ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`,
        saved: new Date().toISOString(),
        scenario: simResult.scenarioName,
        knots: editState.knots,
        T: editState.T,
        knotFracs: editState.fracs,
        held: editState.held,
        timeHeld: editState.timeHeld,
        q0: editState.q0,
        target: targetQ(),
        rom: resolveRom(bodyOver().rom),
        strength: bodyOver().strength,
        body: editState.machine.body,
        config: editState.machine.config,
        numerics: editState.machine.numerics,
        symmetric: editState.symmetric,
        search: { seed: +optSeed.value, maxGen: +optGens.value },
        verdict: editState.run?.verdict || null,
        cost: null,
      });
      const saveBtn = html`<button class="hs-btn" title="write this preset to a JSON file: the technique, the tempo, the phrasing, the held poses, the start and ending poses, the anatomy, the strength, the frame, the plant and the integration. Everything a replay needs.">Save</button>`;
      saveBtn.addEventListener('click', () => {
        const text = JSON.stringify(techniqueToJSON(asTechnique()), null, 1);
        const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        const a = html`<a download="${simResult.scenarioName}-preset.json" href="${url}"></a>`;
        a.click();
        // Revoked on the next turn of the loop rather than immediately: some
        // browsers have not started reading the blob when click() returns.
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      });

      // ---- presets kept in this browser --------------------------------------
      // No list of its own. These act on the SELECTION in the picker above,
      // which already holds the built-ins and everything kept, so there is one
      // place a preset is chosen and these are the verbs that apply to it.
      // Previously the panel carried a second select, and opening from it
      // applied a technique on top of whatever scenario the first one happened
      // to be showing.
      const presetName = html`<input type="text" placeholder="name this preset"
        style="width:11em; font: inherit; font-size:13px; padding:2px 4px;">`;
      const keepBtn = html`<button class="hs-btn" title="keep the technique on screen in this browser, under the name beside it. Exactly what Save writes to a file — the technique, the body, the anatomy, the servo and the integration.">Keep</button>`;
      const renameBtn = html`<button class="hs-btn" title="rename the selected preset to the name beside it">Rename</button>`;
      const dropBtn = html`<button class="hs-btn" title="forget the selected preset">Forget</button>`;
      const isBuiltin = () => String(pick.value).startsWith('builtin:');
      // A built-in is derived, not remembered, so there is nothing to rename
      // or forget -- Keep is how you make one of your own from it.
      const syncPresetButtons = () => {
        renameBtn.disabled = dropBtn.disabled = isBuiltin();
        const cur = readPresets().find((c) => c.id === pick.value);
        presetName.value = cur?.label || '';
      };
      keepBtn.addEventListener('click', () => {
        const list = readPresets();
        const rec = techniqueToJSON(asTechnique());
        rec.label = presetName.value.trim() || rec.label;
        rec.id = nextId(list);
        list.push(rec);
        const err = writePresets(list);
        status = err ? `could not keep: ${err}` : `kept "${rec.label}"`;
        if (!err) { refreshPresets(rec.id); syncPresetButtons(); }
        dirty = chromeDirty = true;
      });
      renameBtn.addEventListener('click', () => {
        const name = presetName.value.trim();
        if (!name) { status = 'type a name first'; dirty = chromeDirty = true; return; }
        const list = readPresets();
        const c = list.find((x) => x.id === pick.value);
        if (!c) return;
        c.label = name;
        const err = writePresets(list);
        status = err ? `could not rename: ${err}` : `renamed to "${name}"`;
        if (!err) refreshPresets(c.id);
        dirty = chromeDirty = true;
      });
      dropBtn.addEventListener('click', () => {
        const gone = readPresets().find((c) => c.id === pick.value);
        const list = readPresets().filter((c) => c.id !== pick.value);
        const err = writePresets(list);
        status = err ? `could not forget: ${err}` : `forgot "${gone?.label || 'preset'}"`;
        // Falls back to the first built-in, which re-runs the simulation --
        // the preset that was showing no longer exists.
        if (!err) {
          refreshPresets(`builtin:${simResult.scenarioName}`);
          presetInput.dispatchEvent(new Event('input', { bubbles: true }));
        }
        dirty = chromeDirty = true;
      });
      pick.addEventListener('input', syncPresetButtons);
      syncPresetButtons();

      const loadInput = html`<input type="file" accept="application/json,.json" style="display:none;">`;
      const loadBtn = html`<button class="hs-btn" title="read a preset back from a JSON file, exactly as it was saved">Load</button>`;
      loadBtn.addEventListener('click', () => loadInput.click());
      loadInput.addEventListener('change', async () => {
        const file = loadInput.files?.[0];
        loadInput.value = '';
        if (!file) return;
        let rec;
        try {
          rec = techniqueFromJSON(await file.text());
        } catch (err) {
          status = `could not load: ${err.message}`;
          dirty = chromeDirty = true;
          console.error('loading a technique:', err);
          return;
        }
        beginLoad(rec);
      });

      // Applying a loaded file, from whichever run of this cell ends up holding
      // it. Everything the file carries goes in; nothing is left at a default
      // that the file happened to agree with.
      // Starting a load, from a file or from a kept case. A case carries the
      // scenario it was made under, and the scenario is not decoration: it
      // decides how the start pose is solved, which contacts exist, and which
      // phase terms the score applies. So it has to be switched FIRST -- which
      // re-runs this cell, and this closure with it, so the technique is parked
      // in pendingLoad for the next run to pick up.
      //
      // Opening a kept case skipped all of that and applied the technique on
      // top of whatever scenario happened to be showing. A press opened while
      // the kick-up was up loaded the press's knots, tempo and body, said
      // "Kick-up" in the picker, and ran the whole thing through the kick-up's
      // start solver -- which is a different movement, and it fell.
      function beginLoad(rec) {
        stopSearch();
        pendingLoad.rec = rec;
        if (rec.scenario !== simResult.scenarioName) {
          const key = `builtin:${rec.scenario}`;
          if (Array.from(presetInput.options).some((o) => o.value === key)) {
            presetInput.value = key;
            presetInput.dispatchEvent(new Event('input', { bubbles: true }));
            return;
          }
        }
        applyLoaded();
      }

      function applyLoaded() {
        const rec = pendingLoad.rec;
        if (!rec) return;
        pendingLoad.rec = null;
        const loadedK = rec.knots[0].length;
        editState.knots = rec.knots.map((k) => Float64Array.from(k));
        editState.T = rec.T;
        editState.fracs = rec.knotFracs
          ? Float64Array.from(rec.knotFracs)
          : Float64Array.from({ length: loadedK }, (_, k) => (loadedK === 1 ? 0 : k / (loadedK - 1)));
        editState.held = rec.held.slice();
        editState.held[loadedK - 1] = true;
        editState.timeHeld = rec.timeHeld.slice();
        editState.timeHeld[0] = editState.timeHeld[loadedK - 1] = true;
        editState.q0 = rec.q0 ? Float64Array.from(rec.q0) : null;
        editState.machine = { config: rec.config, numerics: rec.numerics, body: rec.body };
        syncServo();
        editState.symmetric = rec.symmetric;
        symToggle.value = rec.symmetric;
        editState.body = [
          rec.strength?.shoulder?.t0Vol ?? STRENGTH_DEFAULTS.shoulder.t0Vol,
          rec.rom.hipFlexStraightKneeMaxDeg, rec.rom.shoulderFlexMaxDeg, rec.rom.wristExtMaxDeg,
        ];
        bodyInputs.forEach((i, n) => { i.value = editState.body[n]; });
        durInput.value = rec.T;
        optSeed.value = rec.search.seed;
        optGens.value = rec.search.maxGen;
        editState.edited = true;
        optState.history = [];
        status = rec.label ? `loaded ${rec.label}` : 'loaded';
        sel = -1;
        // The pose count is a setting of the figure; the file is a technique
        // with a definite number of poses. The file wins.
        if (loadedK !== K) setCount(loadedK); else resim();
      }

      const verdict = html`<div style="font-size:13px; margin:6px 0 2px;"></div>`;
      const baseStats = FIG.analyzeRun(simResult, simResult.prof || strengthProf, model);

      const resim = () => {
        let run;
        try {
          // Always bodyOver(), never "the stored body when no slider moved":
          // two expressions for the same body is how they drift apart. With
          // the sliders at their defaults it reproduces the stored body
          // exactly, which the artifact gates check.
          run = simResult.replay(editState.knots.map((k) => Float64Array.from(k)), editState.T,
            { ...bodyOver(), ...editState.machine, q0: editState.q0, target: targetQ(),
              knotFracs: Float64Array.from(editState.fracs) });
        } catch (err) { console.warn('replay failed', err); return; }
        // Read the start back out of the run. A start with a toe through the
        // floor is lifted clear before it is integrated, so this is what makes
        // the pose on screen the pose that was actually simulated.
        if (editState.q0) editState.q0 = Float64Array.from(run.rec.q[0]);
        editState.run = run;
        editState.edited = true;
        editState.notify?.({ base: simResult, run });
        relayout();
      };

      // ---- the servo ---------------------------------------------------------
      // The machine the technique runs on, and now yours to set. It was fixed
      // in the source and RECORDED into every artifact, which is the pairing
      // that made it invisible: you could not change it, and the presets
      // insisted on the values they were born with, so a controller fix could
      // not be seen without re-recording the thing you wanted to see it on.
      //
      // These four are the ones that decide whether the body behaves. Torque
      // is commanded through a first-order activation lag, and a servo faster
      // than its own actuator rings no matter how stiff or soft it is -- which
      // is what a bobbling head and springy knees were -- so the two that
      // govern that sit next to each other here.
      const SERVO = [
        { key: 'kp', label: 'Stiffness kp', range: [100, 4000], step: 50,
          title: 'how hard the servo corrects an angle error. Scaled per joint by the '
            + 'inertia that joint drives, so this is the whole body\u2019s setting, not one joint\u2019s.' },
        { key: 'dampingRatio', label: 'Damping \u03b6', range: [0.2, 4], step: 0.05,
          title: 'damping as a fraction of critical for the inertia each joint actually drives. '
            + 'One is critical ON PAPER; the activation lag below means it still rings, which is '
            + 'why the default is above one.' },
        { key: 'loopOmegaTau', label: 'Bandwidth \u03c9\u03c4', range: [0, 4], step: 0.05,
          title: 'the fastest loop a joint may run, as a multiple of its own actuation lag. '
            + 'Zero is uncapped, which lets the light joints \u2014 the neck above all \u2014 run far '
            + 'faster than the muscle can answer, and they buzz.' },
        { key: 'activationTau', label: 'Activation lag (s)', range: [0.01, 0.15], step: 0.005,
          title: 'how long a muscle takes to change its force. Torque cannot step; this is why.' },
      ];
      const servoInputs = SERVO.map((d) => {
        const inp = Inputs.range(d.range, { label: d.label, step: d.step,
          value: editState.machine.config[d.key] });
        inp.title = d.title;
        inp.addEventListener('input', () => {
          // A new object rather than a mutated one: editState.machine.config
          // is handed to the worker and written into saved files, and sharing
          // one object between the page and a message that was already posted
          // is how a search ends up scoring a plant nobody chose.
          editState.machine = { ...editState.machine,
            config: { ...editState.machine.config, [d.key]: +inp.value } };
          resim();
        });
        return inp;
      });
      const syncServo = () => servoInputs.forEach((inp, n) => {
        inp.value = editState.machine.config[SERVO[n].key];
      });

      // ---- the search --------------------------------------------------------
      // It changes the same numbers your hands do. That is the whole reason it
      // lives here: you watch the six poses above move, and the duration slider
      // move, because those ARE what CMA-ES is searching over.
      const optRun = html`<button class="hs-btn hs-btn--primary">Optimize</button>`;
      const optStop = html`<button class="hs-btn" disabled>Stop</button>`;
      const optGens = Inputs.range([20, 400], { label: 'Generations', value: 120, step: 10 });
      const optSeed = Inputs.range([1, 99], { label: 'Search seed', value: 7, step: 1 });
      // Short. It sits in a wrapping row next to three buttons and a
      // sparkline, and "searching · generation 12 · best cost 5.55 · 12
      // workers" was long enough to push itself onto a line of its own at some
      // widths and not at others. The generation and the cost are the two
      // things that change; the sparkline beside it already says the cost is a
      // cost, and how many cores are busy is not something anyone acts on.
      const statusEl = html`<span style="font-size:12px; opacity:.8;
        font-variant-numeric:tabular-nums; white-space:nowrap;"></span>`;
      const spark = html`<canvas style="width:150px; height:26px; vertical-align:middle;"></canvas>`;
      spark.width = Math.round(150 * dpr); spark.height = Math.round(26 * dpr);
      const drawSpark = () => {
        const h = optState.history;
        const c = spark.getContext('2d');
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.clearRect(0, 0, 150, 26);
        if (h.length < 2) return;
        const fg = theme?.foreground || [0.11, 0.12, 0.14];
        const rgb = fg.map((v) => Math.round(v * 255)).join(',');
        const ys = h.map((p) => Math.log(Math.max(p.best, 1e-6)));
        const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
        c.strokeStyle = `rgba(${rgb},0.75)`;
        c.lineWidth = 1.5;
        c.beginPath();
        h.forEach((p, i) => {
          const x = 1 + (i / (h.length - 1)) * 148;
          const y = 24 - ((ys[i] - lo) / span) * 22;
          if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
        });
        c.stroke();
      };
      // The incumbent, and the generation it came out of, applied together.
      let pending = null;
      const adopt = (data) => {
        if (data.generation?.length) optState.ghosts = data.generation;
        if (!data.knots) return;
        // Belt to setCount's braces. A result is for the technique that was
        // searched, and if that is not the technique on screen any more there
        // is nothing sensible to do with it: adopting six poses' worth of
        // knots into a five-pose page leaves every array a different length
        // from every other, and the first thing to read one of them off the
        // end gets NaN.
        //
        // Counted against the joint list rather than a written-down six. As a
        // literal this was the loudest bug on the page: the worker answers in
        // as many channels as the body has, so once the trunk gained a hinge
        // EVERY result was refused. The search would find a handstand, the
        // page would drop it on the floor, keep the knots it already had, and
        // report that the replay does not arrive -- with a status line
        // blaming the pose count, which was never the problem.
        if (data.knots.length !== NJOINTS || data.knots[0].length !== K) {
          // Console, not the status line. This is a race between a result and
          // an edit, it resolves itself on the next search, and there is
          // nothing for the reader to do about it.
          console.warn('ignored a search result for a technique that is no longer on screen',
            `(${data.knots.length} joints x ${data.knots[0]?.length} poses, page has ${NJOINTS} x ${K})`);
          return;
        }
        editState.knots = data.knots.map((k) => Float64Array.from(k));
        editState.T = data.T;
        // The phrasing the search settled on, when it was searching phrasing.
        // Without this the answer is drawn against the rhythm it started from
        // and every pose sits at the wrong instant -- the same class of bug as
        // replaying on a body the search never used, and just as quiet.
        if (data.knotFracs?.length === editState.knots[0].length) {
          editState.fracs = Float64Array.from(data.knotFracs);
        }
        durInput.value = data.T;
        resim();
      };
      const stopSearch = () => {
        optState.worker?.terminate();
        optState.worker = null;
        optState.ghosts = null;
        pending = null;
        searching = false;
        optRun.disabled = false;
        optStop.disabled = true;
      };
      invalidation.then(stopSearch);
      optStop.addEventListener('click', () => {
        stopSearch();
        status = status.replace(/^gen \d+/, 'stopped');
        dirty = chromeDirty = true;
      });
      optRun.addEventListener('click', () => {
        stopSearch();
        optState.history = [];
        searching = true;
        // Optimizing starts playback and leaves it running, so the figure is
        // moving from the moment the button is pressed and keeps moving when
        // the search hands its answer back. Holding one panel still while the
        // other animated made the two halves disagree about what time it was.
        sel = -1;
        setPlaying(true);
        lastNow = null;
        optRun.disabled = true;
        optStop.disabled = false;
        status = 'starting';
        const worker = new Worker(new URL('./opt-worker.js', import.meta.url), { type: 'module' });
        optState.worker = worker;
        const over = bodyOver();
        worker.onmessage = ({ data }) => {
          // Logged, not shown: how many cores are busy is a performance
          // detail, and the status line has four words of room.
          if (data.type === 'pool') {
            poolSize = data.size;
            console.info(`optimizer: evaluating on ${data.size} worker${data.size > 1 ? 's' : ''}`);
            return;
          }
          // The worker reports its own failures rather than throwing them at
          // an error event, and these were being dropped on the floor: a
          // search that died inside the worker simply stopped, with the status
          // line still saying "searching" forever.
          if (data.type === 'failed') {
            console.error('optimizer worker failed:', data.message, '\n', data.stack);
            status = `the search failed — ${data.message}`;
            stopSearch();
            dirty = chromeDirty = true;
            return;
          }
          // Not fatal: the nested evaluation workers could not be started, so
          // the search runs on one core instead of several.
          if (data.type === 'pool-failed') {
            console.warn('optimizer: evaluating on one core —', data.message);
            poolSize = 1;
            return;
          }
          if (data.type === 'progress') {
            optState.history.push({ gen: data.gen, best: data.best });
            status = `gen ${data.gen} · cost ${data.best.toFixed(2)}`;
            // Held, not applied. A generation is swapped in at the end of a
            // loop pass and never during one, so what is on screen is always a
            // single generation and always one that finished -- and the
            // incumbent it belongs to arrives with it, rather than the poses
            // jumping at one moment and the field behind them at another.
            pending = data;
          } else if (data.type === 'done') {
            optState.history.push({ gen: optState.history.length, best: data.fineCost });
            status = `done · cost ${data.fineCost.toFixed(2)}`;
            pending = null;
            adopt(data);
            // The search reports what it scored; the figure has just
            // replayed the same technique. Those are two call sites for one
            // rollout, and every time they have drifted apart -- a start the
            // search solved for itself, an ending it pinned to a handstand, a
            // symmetric skill it straightened -- it read on screen as a
            // search that succeeded and a body that fell, with no number
            // saying so. They agree to the last bit when nothing is wrong, so
            // any disagreement at all is worth a line in the console.
            try {
              const got = editState.run?.verdict;
              if (got && !!got.success !== !!data.verdict?.success) {
                console.warn('the search and the replay disagree about this technique:',
                  `search ${data.verdict?.success ? 'arrives' : 'falls'} at cost ${data.fineCost?.toFixed(3)},`,
                  `replay ${got.success ? 'arrives' : 'falls'} with the centre of mass at ${got.comY?.toFixed(3)} m.`,
                  '\n  search plant:', data.plant, '\n  replay plant:', editState.run?.plant,
                  '\n  search body:', data.body, '\n  replay body:', editState.run?.body,
                  '\n  numerics:', data.numerics, editState.run?.numerics);
              }
            } catch (e) { console.warn('could not compare the search with the replay', e); }
            stopSearch();
          }
          dirty = chromeDirty = true;
        };
        // An ErrorEvent carries a message, a filename and a line. A BARE Event
        // carries none of those, and means something different: the worker
        // script could not be loaded or parsed at all. Logging the event
        // object for either was useless -- a browser prints a bare Event as
        // "Event" and nothing else -- so both are named here, with the script
        // that failed, because a search that will not start is otherwise an
        // unreadable dead end.
        const workerUrl = new URL('./opt-worker.js', import.meta.url).href;
        const fail = (what) => {
          console.error('optimizer worker:', what, '\n  script:', workerUrl);
          status = `the search failed — ${what}`;
          stopSearch();
          dirty = chromeDirty = true;
        };
        worker.onerror = (e) => {
          fail(e?.message
            ? `${e.message} (${(e.filename || '').split('/').pop() || '?'}:${e.lineno ?? '?'})`
            : 'the worker script could not be loaded — check the browser network tab for '
              + workerUrl.split('/').pop());
          e?.preventDefault?.();
        };
        // A message that cannot be deserialized: rarer, and completely silent
        // without this.
        worker.onmessageerror = () => fail('a message from the worker could not be read');
        worker.postMessage({
          type: 'optimize',
          scenario: simResult.scenarioName,
          seed: +optSeed.value,
          maxGen: +optGens.value,
          K,
          // Continue from what is on screen. There is no separate "start from"
          // menu any more, because the thing you would pick in it is the thing
          // the figure is already showing.
          x0: Array.from(encodeDecision(editState.knots.map((k) => Float64Array.from(k)), editState.T)),
          // Measured: perturbing a warm start by sigma radians on every knot at
          // once, the share of a 14-candidate generation still reaching a
          // handstand runs 0/14 at 0.10 and 14/14 at 0.01.
          sigma0: 0.02,
          modelParams: { ...(editState.run?.model
            ? { heightM: editState.run.model.heightM, massKg: editState.run.model.massKg,
              straddleDeg: editState.run.model.straddleDeg, sex: editState.run.model.sex }
            : { heightM: runModel.heightM, massKg: runModel.massKg,
              straddleDeg: runModel.straddleDeg, sex: runModel.sex }) },
          strengthOpts: { overrides: over.strength },
          romOverrides: resolveRom(over.rom),
          // The start too. Without it the search solved its own start while
          // the page replayed the one on screen, so a technique that worked
          // here was scored somewhere else and its answer fell over on the
          // way back.
          q0: editState.q0 ? Array.from(editState.q0) : null,
          target: Array.from(targetQ()),
          // And the machine. Everything else the page owns already travels --
          // the body, the strength, the anatomy, the start, the ending -- and
          // the plant was the one thing the search still supplied itself.
          plant: editState.machine.config,
          // The phrasing, the poses held by hand, and which instants are
          // pinned. The phrasing travels either way: as the thing to score
          // against when every instant is pinned, and as the place to start
          // from when they are not.
          knotFracs: Array.from(editState.fracs),
          locks: lockValues(),
          freeTimes: timesAreFree(),
          timeLocks: timeLockValues(),
          // The duration is NOT searched: both ends of its range are the value
          // on screen, so the search is pinned to the tempo you set.
          //
          // It used to be the 37th decision variable, and it was a bad one. A
          // movement that arrives gets cheaper the slower it goes -- work and
          // smoothness both fall -- so for anything with room to spare the
          // gradient points at the ceiling and stays there: the press arrives
          // at every duration from 1.6s up, and costs 4.59, 1.48, 1.15, 1.08,
          // 1.05, 1.03 as it slows to 3.5s. The search was not finding a
          // tempo, it was running out of slider. And the slowest version is
          // the one where the shoulder supplies everything and nothing is
          // carried by momentum, which is the opposite of technique.
          //
          // So tempo joins the pose count and the held poses: things a reader
          // sets. Phrasing WITHIN that tempo is the search's, unless you pin
          // it -- moving a pose earlier while another moves later cannot buy a
          // cheaper score by taking longer, because there is no longer to take.
          tLo: editState.T, tHi: editState.T,
          // And the integration a replay uses, so the settle horizon scored is
          // the one the page watches.
          numerics: editState.machine.numerics,
          symmetric: editState.symmetric,
        });
        dirty = chromeDirty = true;
      });

      function relayout() {
        const run = editState.run, rec = run.rec;
        xEnd = Math.min(rec.t[rec.t.length - 1] || editState.T, editState.T + 1.0);
        if (t > xEnd) t = xEnd;
        strip.layout({
          run, prof: run.prof || strengthProf, rom: run.rom || simResult.baseRom,
          T: editState.T, xEnd, theme,
          knotTimes: Array.from({ length: K }, (_, k) => knotTime(k)),
          locks: editState.timeHeld,
        });
        const stats = FIG.analyzeRun(run, run.prof || strengthProf, model);
        verdict.innerHTML = FIG.verdictHTML(stats, editState.edited ? baseStats : null);
        paintRamp?.();
        dirty = chromeDirty = true;
      }

      const loop = createFrameLoop((now) => {
        if (playing || searching) {
          if (lastNow !== null) {
            t += (now - lastNow) / 1000;
            if (t > xEnd) {
              t = 0;
              if (pending) { adopt(pending); pending = null; }
            }
          }
          lastNow = now;
          dirty = true;
        } else { lastNow = null; }
        if (!dirty) return;
        dirty = false;
        drawStage();
        strip.draw(t, theme);
        if (chromeDirty) {
          chromeDirty = false;
          const run = editState.run;
          const m = run.model || model;
          const cell = new Float64Array(m.nq);
          story.draw({
            model: m, ws: run.ws || ws, sel, theme,
            items: [
              { q: Float64Array.from(startQ()), label: 'start', time: null, solid: true },
              ...Array.from({ length: K }, (_, kk) => ({
                q: Float64Array.from(FIG.knotPose(m, editState.knots, kk, cell)),
                label: `${kk + 1}`, time: `${knotTime(kk).toFixed(2)}s`,
                solid: false, locked: editState.held[kk], timeLocked: editState.timeHeld[kk],
              })),
            ],
          });
          statusEl.textContent = status;
          drawSpark();
        }
      });
      invalidation.then(() => loop.cancel());
      if (pendingLoad.rec) applyLoaded();
      else if (stale) resim(); else relayout();
      const stopTheme = observeTheme((th) => { theme = th; relayout(); });
      invalidation.then(stopTheme);

      const key = (mark, text) => html`<span style="margin-right:14px; white-space:nowrap;">${mark}${text}</span>`;
      const dot = (fill) => html`<span style="display:inline-block; width:.75em; height:.75em;
        background:${fill}; vertical-align:-.05em; margin-right:.3em; border-radius:2px;"></span>`;
      const ramp = html`<span style="display:inline-block; width:3em; height:.75em; vertical-align:-.05em;
        margin-right:.3em; border-radius:2px;"></span>`;
      paintRamp = () => {
        const d = theme?.isDark ?? false;
        ramp.style.background = `linear-gradient(to right, ${FIG.effortColor(0, d)},`
          + ` ${FIG.effortColor(0.5, d)}, ${FIG.effortColor(1, d)})`;
      };
      paintRamp();

      // What you WATCH, and everything else. The figure is the movement, the
      // poses and the timeline, plus the one thing that cannot be read without
      // them -- the legend that says what the colours on the strip mean.
      //
      // Everything else is the box: what technique to show, what to do with
      // it, what it did. The two status lines go there too even though they
      // are readouts rather than settings, because they are sentences, and a
      // sentence sitting between two pictures is read as a caption for one of
      // them. In the box they read as the panel telling you what it is
      // pointing at.
      // Everything you DO to the movement lives on one line, on the timeline
      // it acts on: play it, and search for a better one. Opening the panel is
      // for changing a parameter, not for running the thing.
      const rule = () => html`<span style="width:1px; height:16px; margin:0 2px;
        background:color-mix(in srgb, currentColor 20%, transparent);"></span>`;
      strip.transport?.append(rule(), optRun, optStop,
        html`<span style="flex:1 1 12px;"></span>`, spark, statusEl);

      const chromeEl = html`<div>
        <div style="margin-top:12px;">${story.element}</div>
        <div style="margin-top:14px;">${strip.element}</div>
        <div style="display:flex; gap:14px; align-items:baseline; flex-wrap:wrap;
          margin-top:9px;">
          <small style="opacity:.85; font: 11px system-ui, -apple-system, sans-serif;">${
            key(ramp, 'strength used')}${
            key(dot(FIG.ROM_COLOR), 'outside range of motion')}</small>
        </div>
        <div style="margin-top:8px; font: 12.5px/1.45 system-ui, -apple-system,
          'Segoe UI', sans-serif;">${verdict}</div>
      </div>`;

      // Grouped, and every group collapsible. Eleven controls in one column is a
      // list to read rather than a panel to use; folded, what is open says what
      // you are currently working on. The transport and the two status lines
      // stay outside any group -- they are what you are always looking at.
      const group = (title, open, ...rows) => html`<details ${open ? 'open' : ''}
        style="margin-top:8px; border-top:1px solid color-mix(in srgb, currentColor 12%, transparent);">
        <summary style="cursor:pointer; font-size:11px; font-weight:600; letter-spacing:.04em;
          text-transform:uppercase; opacity:.75; padding:6px 0 2px;">${title}</summary>
        ${rows}
      </details>`;

      const controlsBox = html`<div class="technique-controls">
        <div class="spline-controls" style="margin-bottom:4px;">${pick}${resetBtn}</div>
        ${group('technique', true,
          html`<div class="spline-controls">${poses}${durInput}</div>`,
          html`<div class="spline-controls">${symToggle}</div>`)}
        ${group('body', false,
          html`<div class="spline-controls">${inShoulder}${inHam}</div>`,
          html`<div class="spline-controls">${inShFlex}${inWrExt}</div>`)}
        ${group('search', false,
          html`<div class="spline-controls">${optGens}${optSeed}</div>`)}
        ${group('servo', false,
          html`<div class="spline-controls">${servoInputs[0]}${servoInputs[1]}</div>`,
          html`<div class="spline-controls">${servoInputs[2]}${servoInputs[3]}</div>`)}
        ${group('presets', false,
          html`<div class="spline-controls">${presetName}${keepBtn}${renameBtn}${dropBtn}</div>`,
          html`<div class="spline-controls" style="margin-top:6px;">${saveBtn}${loadBtn}${loadInput}</div>`)}
      </div>`;

      const figure = html`<figure>
        ${stage}${chromeEl}
      </figure>`;

      const redraw = () => { dirty = chromeDirty = true; };
      return { figure, controlsBox, chromeEl, sizeStage, story, strip, colsFor, redraw, layout, stageH: STAGE_H };
    })();
    // The figure first. Eight sliders ahead of it is a wall the reader has to
    // climb before reaching the thing the sliders act on; expandable() resolves
    // the controls selector when it expands, not when it is built, so the box
    // is free to sit below.
    const techniqueBox = expandable(techniqueFigure.figure, {
      id: 'technique-editor',
      width: pageW,
      // Collapsed, the stage keeps the height it always had and the figure is
      // as tall as its contents; expandable measures that itself. This number
      // only matters expanded, where onResize divides it up.
      height: techniqueFigure.stageH,
      controls: '.technique-controls',
      state: editState.ui,
      onResize(el, w, h, expanded) {
        // Width first: the storyboard's thumbnails and the timeline both get
        // taller or shorter as they get wider, and the stage is given whatever
        // vertical room is left over -- so their heights have to be settled
        // before there is a leftover to measure.
        techniqueFigure.story.resize(w, techniqueFigure.colsFor(w));
        techniqueFigure.strip.resize(w);
        // Measured, not guessed: the storyboard and the timeline both get
        // taller as they get wider, so the leftover is only honest after they
        // have been resized.
        const stageH = expanded
          ? Math.max(220, h - techniqueFigure.chromeEl.offsetHeight - 8)
          : techniqueFigure.stageH;
        techniqueFigure.sizeStage(w, stageH);
        techniqueFigure.redraw();
      },
    });
    // Adding or dropping a pose changes how tall the figure's own contents are,
    // which only the figure knows and only the wrapper can act on.
    techniqueFigure.layout.refresh = () => techniqueBox.refreshLayout?.();
    display(techniqueBox);
    display(techniqueFigure.controlsBox);

  <script id="optimizer-section" type="text/markdown">
    ## What the search is actually doing

    CMA-ES climbs a score computed by simulating the candidate. The score is a weighted sum: did it arrive in the balanced pose and stop there; what it cost in metabolic work and in time spent near the torque cap; whether it went outside its own range of motion; whether it is still the skill it claims to be — feet leaving the floor once and not replanting, a bent-leg press actually passing through an inverted tuck, the legs not slung in at more than two metres a second; and whether it looks like a person, through terms on joint acceleration and on how fast the muscle drive is allowed to slew. Each candidate is scored as the *worst case* of two evaluations — the nominal one, and one at a different timestep with a small velocity jitter — so a knife-edge catch tuned to one timestep's contact artifacts pays full price for it.

    What it cannot do is as informative as what it can. It searches angles, and nothing else: the tempo, where the poses fall within it, how many there are, and which of them are held are all yours. Tempo is the interesting one, because it used to be the search's and it should not have been. A movement that arrives at all gets cheaper the slower it runs — work and smoothness both fall — so wherever there was room to spare the gradient pointed at the longest duration on offer and stayed there. The straight-leg press arrives at every duration from 1.6 seconds up, and costs 4.59, 1.48, 1.15, 1.08, 1.05 and 1.03 as it slows to three and a half. That is not a search finding a tempo, it is a search running out of slider — and the slowest version is precisely the one where the shoulder supplies everything and nothing is carried by momentum, which is the opposite of technique. Set the tempo yourself and the search has to find a shape that works at it.

    Every knot is boxed by the body's own range of motion, so lowering a flexibility limit takes technique away from the search rather than fining it afterwards. And every run above is re-simulated in your browser from its knots rather than replayed as an animation, so if a technique looks wrong it is wrong, whatever its cost says.
  </script>

  <script id="coda" type="text/markdown">
    ## What the model says

    - The kick-up goes at a shoulder rated 1.6 Nm/kg with average hamstrings. The straight-leg press on that same body collapses, and still collapses at 2.2; at 2.8 it works.
    - Hamstring flexibility does not decide whether the press happens, only what it costs. At 2.8 Nm/kg, hamstrings reaching 125 degrees score 1.03 against 2.53 for an ordinary 85 degree fold: the same skill for two and a half times less.
    - The inverted tuck itself is nearly free: hips over the hands with the knees at the chest holds at 23 Nm and is limited by the wrist, like a straight handstand. Rise through a tucked planche instead and the identical shape costs 132 Nm.
    - So a bent-leg press reaches a handstand on a 2.0 Nm/kg shoulder, where the straight-leg press needs 2.8 — but only by staying tucked to the vertical and throwing the legs out, at 3.1 m/s at the foot against 1.8 for a kick-up. Coming out of the tuck earlier means holding the rise on the shoulder while the legs lengthen the body, and that costs 2.8 as well. Bending the legs buys the weaker shoulder, not the controlled finish.

    The model is a two dimensional cartoon: merged arms, locked elbows, one rigid segment from shoulder to hip, no lateral balance, penalty friction, torque servos rather than muscles and tendons, and a search that finds good technique rather than best technique. Read the numbers as mechanisms and thresholds, not prescriptions.
  </script>
  <script id="validation-section" type="text/markdown">
    ## Validation

    The physics core is covered by offline gates (`node src/notebooks/handstand/test/dynamics.mjs` and friends): the dynamics against finite differences of the energy, momentum conservation in free fall, a textbook double pendulum, contact settling, the torque-curve landmarks, and the servo's arrival behavior. The cell below reruns a fast subset in your browser against the current model.
  </script>
  <script id="validation-checks" type="text/x-typescript">
    const validation = (() => {
      const zeroV = new Float64Array(model.nq);
      const checks = [];
      // Mass matrix symmetry and SPD at a bent pose.
      {
        const q = Float64Array.from(poseState.q);
        const M = new Float64Array(model.nq * model.nq);
        massMatrix(model, q, M, ws);
        let asym = 0;
        for (let i = 0; i < model.nq; i++) {
          for (let j = 0; j < model.nq; j++) asym = Math.max(asym, Math.abs(M[i * model.nq + j] - M[j * model.nq + i]));
        }
        checks.push({ name: 'mass matrix symmetric', ok: asym < 1e-9, detail: `max asymmetry ${asym.toExponential(1)}` });
      }
      // Static torques match finite differences of potential energy.
      {
        const q = Float64Array.from(poseState.q);
        const tau = new Float64Array(model.nq);
        rnea(model, q, zeroV, zeroV, tau, null, { ws });
        const eps = 1e-6;
        let worst = 0;
        for (let i = 3; i < model.nq; i++) {
          const qp = q.slice(); qp[i] += eps;
          const qm = q.slice(); qm[i] -= eps;
          const dV = (energy(model, qp, zeroV, ws).potential - energy(model, qm, zeroV, ws).potential) / (2 * eps);
          worst = Math.max(worst, Math.abs(tau[i] - dV));
        }
        checks.push({ name: 'static torques = dV/dq', ok: worst < 1e-5, detail: `max err ${worst.toExponential(1)} Nm` });
      }
      // Strength model landmarks.
      {
        const jp = strengthProf.shoulder;
        const iso = availableTorque(jp, 1, 0);
        const con = availableTorque(jp, 1, 8);
        const ecc = availableTorque(jp, -1, 8);
        checks.push({
          name: 'strength: eccentric > isometric > fast concentric',
          ok: ecc > iso && iso > con && con > 0,
          detail: `${ecc.toFixed(0)} / ${iso.toFixed(0)} / ${con.toFixed(0)} Nm`,
        });
      }
      // Total mass budget.
      {
        let m = 0;
        for (let i = 0; i < model.nb; i++) m += model.mass[i];
        checks.push({ name: 'segment masses sum to body mass', ok: Math.abs(m - model.massKg) < 1e-9, detail: `${m.toFixed(3)} kg` });
      }
      const rows = checks.map((c) => html`<div>${c.ok ? '✓' : '✗'} ${c.name} <small style="opacity:0.6">(${c.detail})</small></div>`);
      const allOk = checks.every((c) => c.ok);
      return html`<div style="font-variant-numeric: tabular-nums; ${allOk ? '' : 'color:#c0392b;'}">${rows}</div>`;
    })();
    display(validation);
  </script>
