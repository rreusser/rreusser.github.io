      // The sliders themselves: views onto editState.body, which is where the
      // numbers live (see above).
      const inShoulder = Inputs.range([0.5, 3.2], { label: 'Shoulder (Nm/kg)', step: 0.05,
        value: editState.body[0] });
      const inHam = Inputs.range([40, 140], { label: 'Hamstrings (deg)', step: 1,
        value: editState.body[1] });
      const inShFlex = Inputs.range([120, 185], { label: 'Shoulder flexion max (deg)', step: 1,
        value: editState.body[2] });
      const inWrExt = Inputs.range([80, 150], { label: 'Wrist extension max (deg)', step: 1,
        value: editState.body[3] });
      // How far the trunk can round. The hollow body is the shape this whole
      // notebook is about and until the trunk had a hinge there was nothing to
      // set; now there is, and how much of it a person HAS is the difference
      // between a stacked line and a banana, so it belongs beside the
      // hamstrings rather than buried in the anatomy defaults.
      const inSpine = Inputs.range([5, 80], { label: 'Back flexion max (deg)', step: 1,
        value: editState.body[4] });
      inSpine.title = 'how far the single trunk hinge may round forward. The arching '
        + 'direction is bounded separately and is not on this slider.';
      const bodyInputs = [inShoulder, inHam, inShFlex, inWrExt, inSpine];
      bodyInputs.forEach((inp, n) => inp.addEventListener('input', () => {
        editState.body[n] = +inp.value;
        resim();
      }));

      // One definition of the duration range, because the search is told it too
      // and an Inputs.range is a wrapper around the input rather than the input
      // itself -- reading .min off it gives undefined, which travels as null
      // and lands as "no range given", quietly putting the search back on its
      // own default ceiling.
      // It is the bound the timeline's end handle is dragged within, and the
      // bound the search is pinned inside. It is no longer a slider: see
      // onDurationDrag above.
      const T_RANGE = [0.5, 3.5];
      // "Reset" said nothing about what it resets, sitting in a row with the
      // pose count and the duration as if it reset those. It reverts the
      // technique -- every angle, the timing, the holds, the duration, the
      // start pose and the body sliders -- so it lives on the document bar
      // beside the picker that names the thing it reverts TO, which is the
      // only place the word needs no object. The pose count is the one thing
      // it leaves alone: that is a setting, not part of the technique, and a
      // four-pose refit of a six-pose technique cannot be undone by restoring
      // six numbers.
      // A draft is what an unsaved edit IS, so the two things that mean "I do
      // not want that edit any more" have to say so: Revert, which asks for
      // the stored technique back, and Forget, which throws the preset away.
      // Without this, Revert cleaned the editor and the parked draft came
      // straight back the next time the technique was opened.
      const clearDraft = (id) => {
        if (!id) return;
        try {
          const drafts = readDrafts();
          if (drafts[id] === undefined) return;
          delete drafts[id];
          const err = writeDrafts(drafts);
          if (err) console.warn('could not clear a draft:', err);
        } catch (err) { console.warn('could not clear a draft:', err); }
      };

      // Icon AND word: on a phone the word goes and the icon stays, which is
      // the only one of the three actions that can survive losing its label --
      // Keep/Update says which of the two it will do, and the menu is already
      // just a glyph.
      const resetBtn = html`<button class="hs-btn hs-btn--icontext" aria-label="Revert"
        title="discard every edit and go back to this technique as stored — angles, timing, held poses, duration and the body sliders. The number of poses is a setting and stays as you set it."
        ><svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
          ><polyline points="0.9 2.4 0.9 5.9 4.4 5.9"/><path d="M2.2 8.6a5.1 5.1 0 1 0 1.2-5.3L0.9 5.9"/></svg
        ><span class="hs-btn__label">Revert</span></button>`;
      resetBtn.addEventListener('click', () => {
        stopSearch();
        clearDraft(sim.presetId);
        editState.hasDraft = false;
        // baseKnots is a FUNCTION -- it has to be, because the pose count can
        // move and reverting at four poses has to give back the stored
        // technique said with four. Calling .map on the function itself threw
        // on the first line, so Revert had been doing nothing at all except
        // stopping the search: every button press was a silent no-op.
        // The same reader again, when the technique can be said exactly. Revert
        // means "give me the stored technique", and that is one object: the
        // holds, the pins, the start pose, the mirror and the search settings
        // came back re-derived rather than restored, which made Revert a
        // different act from opening the very same technique.
        if (sameCount() && openedTechnique()) {
          readTechnique(openedTechnique());
          sym(editState.knots);
        } else {
          // A different pose count is the one thing Revert leaves alone -- that
          // is a setting of the figure, and a four-pose refit of a six-pose
          // technique cannot be undone by restoring six numbers -- so here the
          // technique has to be resampled onto the count on screen.
          editState.knots = baseKnots().map((k) => Float64Array.from(k));
          editState.T = sim.T;
          editState.fracs = baseFracs();
          editState.held = freshHeld();
          editState.timeHeld = freshTimeHeld();
          editState.symmetric = SYMMETRIC_SCENARIOS.has(sim.scenarioName);
          editState.q0 = null;
          editState.body = bodyDefaults();
          editState.machine = machineDefaults();
        }
        syncTechniqueInputs();
        editState.run = sim;
        optState.history = [];
        status = '';
        // A revert changes the knots, so the body on screen is no longer the
        // one beside them: re-simulate rather than merely re-draw. The flag is
        // what makes it a revert rather than one more edit -- see resim.
        resim({ revert: true });
      });

      // ---- save and load ------------------------------------------------------
      // Everything needed to reproduce the case, which is not a judgement call:
      // technique-file.js writes the list the plumbing gates enumerate, and
      // test/technique-file.mjs perturbs each field in turn to prove none of
      // them is quietly missing. The shape is a stored artifact's, so a file
      // saved here is the same object a built-in preset is derived as.
      const asTechnique = () => ({
        label: `${sim.stored?.label || sim.scenarioName} · ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`,
        saved: new Date().toISOString(),
        scenario: sim.scenarioName,
        knots: editState.knots,
        T: editState.T,
        knotFracs: editState.fracs,
        held: editState.held,
        timeHeld: editState.timeHeld,
        startHeld: editState.startHeld,
        q0: editState.q0,
        target: targetQ(),
        rom: resolveRom(bodyOver().rom),
        strength: bodyOver().strength,
        body: editState.machine.body,
        config: editState.machine.config,
        numerics: editState.machine.numerics,
        symmetric: editState.symmetric,
        search: { seed: +optSeed.value, maxGen: +optGens.value },
        verdict: editState.run?.verdict || null,
        cost: null,
      });
      const saveBtn = html`<button class="hs-btn" title="write this preset to a JSON file: the technique, the tempo, the phrasing, the held poses, the start and ending poses, the anatomy, the strength, the frame, the plant and the integration. Everything a replay needs.">Save</button>`;
      saveBtn.addEventListener('click', () => {
        const text = JSON.stringify(techniqueToJSON(asTechnique()), null, 1);
        const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        const a = html`<a download="${sim.scenarioName}-preset.json" href="${url}"></a>`;
        a.click();
        // Revoked on the next turn of the loop rather than immediately: some
        // browsers have not started reading the blob when click() returns.
        setTimeout(() => URL.revokeObjectURL(url), 10000);
      });

      // ---- presets kept in this browser --------------------------------------
      // No list of its own. These act on the SELECTION in the picker above,
      // which already holds the built-ins and everything kept, so there is one
      // place a preset is chosen and these are the verbs that apply to it.
      // Previously the panel carried a second select, and opening from it
      // applied a technique on top of whatever scenario the first one happened
      // to be showing.
      const presetName = html`<input type="text" placeholder="name this preset"
        style="font: inherit; font-size:13px; padding:2px 4px; min-width:0;">`;
      // Keep MAKES one. Update OVERWRITES one. They were a single button that
      // decided which it was by whether the name you had typed happened to
      // match the name of the preset selected -- so the same click, in the
      // same place, either kept a copy or destroyed the original, and which of
      // the two you got depended on a comparison you were not making. Renaming
      // a preset and pressing it was enough to lose the preset. An action that
      // cannot be undone does not get to be inferred, so it has its own
      // button, which says what it will overwrite.
      const keepBtn = html`<button class="hs-btn" title="keep the technique on screen as a NEW preset in this browser, under the name beside it. Exactly what Save writes to a file — the technique, the body, the anatomy, the servo and the integration.">Keep as new</button>`;
      const updateBtn = html`<button class="hs-btn">Update</button>`;
      const renameBtn = html`<button class="hs-btn" title="rename the selected preset to the name beside it">Rename</button>`;
      const dropBtn = html`<button class="hs-btn" title="forget the selected preset">Forget</button>`;
      const isBuiltin = () => String(pick.value).startsWith('builtin:');
      // Which preset Keep would write over, or null for "make a new one".
      //
      // Opening one of your own, editing it and keeping it is a SAVE, not a
      // second preset of the same name -- that is the whole shape of the work:
      // load, change, keep, repeat. It used to append every time, so a few
      // rounds left a list of identical names and no way to tell which was
      // current. Typing a different name is how you ask for a copy, and a
      // built-in is never overwritten because it is derived rather than
      // remembered: there is nothing there to write to.
      // What Update would overwrite: the kept preset the picker is naming, or
      // nothing when it names a built-in. It is no longer a question about the
      // name box -- the name box says what a NEW preset would be called, and
      // that is all it says.
      const keepTarget = () => (isBuiltin()
        ? null : readPresets().find((c) => c.id === pick.value) || null);
      // A built-in is derived, not remembered, so there is nothing to rename
      // or forget -- Keep is how you make one of your own from it.
      const syncPresetButtons = () => {
        renameBtn.disabled = dropBtn.disabled = isBuiltin();
        const cur = readPresets().find((c) => c.id === pick.value);
        presetName.value = cur?.label || '';
        // Update names its victim, in the button and in the tooltip, because
        // the whole point of it being a separate button is that you can see
        // what it is about to do before you do it.
        const over = keepTarget();
        updateBtn.disabled = !over;
        updateBtn.textContent = over ? `Update \u201c${over.label}\u201d` : 'Update';
        updateBtn.title = over
          ? `overwrite "${over.label}" with the technique on screen. This cannot be undone.`
          : 'nothing to update: a built-in is derived rather than remembered. '
            + 'Keep as new makes one of your own from it.';
      };
      // Writing the technique on screen into the list under `id`, replacing
      // whatever is there. Both buttons land here; they differ only in which
      // id they hand it and what they call it.
      const writePreset = (id, label, [doing, done]) => {
        const list = readPresets();
        const rec = techniqueToJSON(asTechnique());
        rec.id = id;
        rec.label = label;
        const at = list.findIndex((c) => c.id === id);
        if (at >= 0) list[at] = rec; else list.push(rec);
        const err = writePresets(list);
        status = err ? `could not ${doing}: ${err}` : `${done} "${rec.label}"`;
        if (!err) {
          // The edit is a preset now, so the draft parked under whatever this
          // was opened from has nothing left to say.
          clearDraft(sim.presetId);
          editState.hasDraft = false;
          refreshPresets(rec.id);
          syncPresetButtons();
        }
        dirty = chromeDirty = true;
      };
      keepBtn.addEventListener('click', () => {
        const list = readPresets();
        // A new id every time, so this can only ever ADD. Its own name too:
        // the box if you typed one, and the auto-generated "<technique> ·
        // <when>" if you did not, which is at least unique.
        writePreset(nextId(list), presetName.value.trim()
          || techniqueToJSON(asTechnique()).label, ['keep', 'kept']);
      });
      updateBtn.addEventListener('click', () => {
        const over = keepTarget();
        if (!over) return;
        // Its own id and its own name: overwriting must not renumber the
        // preset or the picker's selection lands somewhere else, and must not
        // rename it either -- renaming is what Rename is for.
        writePreset(over.id, over.label, ['update', 'updated']);
      });
      renameBtn.addEventListener('click', () => {
        const name = presetName.value.trim();
        if (!name) { status = 'type a name first'; dirty = chromeDirty = true; return; }
        const list = readPresets();
        const c = list.find((x) => x.id === pick.value);
        if (!c) return;
        c.label = name;
        const err = writePresets(list);
        status = err ? `could not rename: ${err}` : `renamed to "${name}"`;
        if (!err) refreshPresets(c.id);
        dirty = chromeDirty = true;
      });
      dropBtn.addEventListener('click', () => {
        const gone = readPresets().find((c) => c.id === pick.value);
        clearDraft(pick.value);
        const list = readPresets().filter((c) => c.id !== pick.value);
        const err = writePresets(list);
        status = err ? `could not forget: ${err}` : `forgot "${gone?.label || 'preset'}"`;
        // Falls back to the first built-in, which re-runs the simulation --
        // the preset that was showing no longer exists.
        if (!err) {
          refreshPresets(`builtin:${sim.scenarioName}`);
          presetInput.dispatchEvent(new Event('input', { bubbles: true }));
        }
        dirty = chromeDirty = true;
      });
      pick.addEventListener('input', syncPresetButtons);
      syncPresetButtons();

      const loadInput = html`<input type="file" accept="application/json,.json" style="display:none;">`;
      const loadBtn = html`<button class="hs-btn" title="read a preset back from a JSON file, exactly as it was saved">Load</button>`;
      loadBtn.addEventListener('click', () => loadInput.click());
      loadInput.addEventListener('change', async () => {
        const file = loadInput.files?.[0];
        loadInput.value = '';
        if (!file) return;
        let rec;
        try {
          rec = techniqueFromJSON(await file.text());
        } catch (err) {
          status = `could not load: ${err.message}`;
          dirty = chromeDirty = true;
          console.error('loading a technique:', err);
          return;
        }
        beginLoad(rec);
      });

      // Applying a loaded file, from whichever run of this cell ends up holding
      // it. Everything the file carries goes in; nothing is left at a default
      // that the file happened to agree with.
      // Starting a load, from a file or from a kept case. A case carries the
      // scenario it was made under, and the scenario is not decoration: it
      // decides how the start pose is solved, which contacts exist, and which
      // phase terms the score applies. So it has to be switched FIRST -- which
      // re-runs this cell, and this closure with it, so the technique is parked
      // in pendingLoad for the next run to pick up.
      //
      // Opening a kept case skipped all of that and applied the technique on
      // top of whatever scenario happened to be showing. A press opened while
      // the kick-up was up loaded the press's knots, tempo and body, said
      // "Kick-up" in the picker, and ran the whole thing through the kick-up's
      // start solver -- which is a different movement, and it fell.
      function beginLoad(rec) {
        stopSearch();
        pendingLoad.rec = rec;
        if (rec.scenario !== sim.scenarioName) {
          const key = `builtin:${rec.scenario}`;
          if (Array.from(presetInput.options).some((o) => o.value === key)) {
            presetInput.value = key;
            presetInput.dispatchEvent(new Event('input', { bubbles: true }));
            return;
          }
        }
        applyLoaded();
      }

      function applyLoaded() {
        const rec = pendingLoad.rec;
        if (!rec) return;
        pendingLoad.rec = null;
        // The same reader the picker uses. This used to be a second,
        // hand-kept copy of it, and the two drifted -- which is how opening a
        // technique from the list stopped being the same act as opening the
        // file it was saved to.
        const loadedK = readTechnique(rec);
        syncTechniqueInputs();
        editState.edited = true;
        optState.history = [];
        status = rec.label ? `loaded ${rec.label}` : 'loaded';
        sel = -1;
        // The pose count is a setting of the figure; a technique has a definite
        // number of poses. The technique wins.
        if (loadedK !== K) setCount(loadedK); else resim();
      }

      const verdict = html`<div style="font-size:13px; margin:6px 0 2px;"></div>`;
      // What the verdict compares an edit against: the technique as stored,
      // replayed. A `let`, because opening another technique replaces it --
      // a delta against the technique you are no longer looking at is a
      // number about nothing.
      let baseStats = FIG.analyzeRun(sim, sim.prof || strengthProf, model);

      // `revert` says the replay about to happen restores the technique the
      // picker names rather than changing it. Without it Revert left the page
      // marked as edited: the handler set the flag to false and then called
      // this, which set it straight back to true -- so the verdict kept
      // reporting a delta against a baseline it now equalled, and there was no
      // honest way to badge the document.
      const resim = ({ revert = false } = {}) => {
        let run;
        try {
          // Always bodyOver(), never "the stored body when no slider moved":
          // two expressions for the same body is how they drift apart. With
          // the sliders at their defaults it reproduces the stored body
          // exactly, which the artifact gates check.
          // The technique itself, not a bag of overrides assembled here. This
          // is the SAME object the search is handed and the same one Save
          // writes, so "what is playing" and "what is being searched" cannot
          // be different problems.
          run = storedRun.run(asTechnique());
        } catch (err) { console.warn('replay failed', err); return; }
        // Read the start back out of the run. A start with a toe through the
        // floor is lifted clear before it is integrated, so this is what makes
        // the pose on screen the pose that was actually simulated.
        if (editState.q0) editState.q0 = Float64Array.from(run.rec.q[0]);
        editState.run = run;
        editState.edited = !revert;
        editState.notify?.(revert ? null : { base: sim, run });
        relayout();
      };

      // ---- the servo ---------------------------------------------------------
      // The machine the technique runs on, and now yours to set. It was fixed
      // in the source and RECORDED into every artifact, which is the pairing
      // that made it invisible: you could not change it, and the presets
      // insisted on the values they were born with, so a controller fix could
      // not be seen without re-recording the thing you wanted to see it on.
      //
      // These four are the ones that decide whether the body behaves. Torque
      // is commanded through a first-order activation lag, and a servo faster
      // than its own actuator rings no matter how stiff or soft it is -- which
      // is what a bobbling head and springy knees were -- so the two that
      // govern that sit next to each other here.
      const SERVO = [
        { key: 'kp', label: 'Stiffness kp', range: [100, 4000], step: 50,
          title: 'how hard the servo corrects an angle error. Scaled per joint by the '
            + 'inertia that joint drives, so this is the whole body\u2019s setting, not one joint\u2019s.' },
        { key: 'dampingRatio', label: 'Damping \u03b6', range: [0.2, 4], step: 0.05,
          title: 'damping as a fraction of critical for the inertia each joint actually drives. '
            + 'One is critical ON PAPER; the activation lag below means it still rings, which is '
            + 'why the default is above one.' },
        { key: 'loopOmegaTau', label: 'Bandwidth \u03c9\u03c4', range: [0, 4], step: 0.05,
          title: 'the fastest loop a joint may run, as a multiple of its own actuation lag. '
            + 'Zero is uncapped, which lets the light joints \u2014 the neck above all \u2014 run far '
            + 'faster than the muscle can answer, and they buzz.' },
        { key: 'activationTau', label: 'Activation lag (s)', range: [0.01, 0.15], step: 0.005,
          title: 'how long a muscle takes to change its force. Torque cannot step; this is why.' },
      ];
      const servoInputs = SERVO.map((d) => {
        const inp = Inputs.range(d.range, { label: d.label, step: d.step,
          value: editState.machine.config[d.key] });
        inp.title = d.title;
        inp.addEventListener('input', () => {
          // A new object rather than a mutated one: editState.machine.config
          // is handed to the worker and written into saved files, and sharing
          // one object between the page and a message that was already posted
          // is how a search ends up scoring a plant nobody chose.
          editState.machine = { ...editState.machine,
            config: { ...editState.machine.config, [d.key]: +inp.value } };
          resim();
        });
        return inp;
      });
      const syncServo = () => servoInputs.forEach((inp, n) => {
        inp.value = editState.machine.config[SERVO[n].key];
      });
      // Every control that shows a field of the technique, pushed back from
      // editState in one place. readTechnique writes the state; this makes the
      // panel agree with it, and the two are always called together.
      function syncTechniqueInputs() {
        symToggle.value = editState.symmetric;
        bodyInputs.forEach((i, n) => { i.value = editState.body[n]; });
        optSeed.value = editState.search.seed;
        optGens.value = editState.search.maxGen;
        syncServo();
      }

      // ---- the search --------------------------------------------------------
      // It changes the same numbers your hands do. That is the whole reason it
      // lives here: you watch the poses above move, and the start pose with
      // them when you have unlocked it, because those ARE what CMA-ES is
      // searching over.
      const optRun = html`<button class="hs-btn hs-btn--primary">Optimize</button>`;
      const optStop = html`<button class="hs-btn" disabled>Stop</button>`;
      // Read off the technique rather than hardcoded, because the seed and the
      // generation count are fields of it: Save writes them and Load restored
      // them, while opening the same technique from the picker left whatever
      // was on screen. Same object, same fields, both ways in.
      const optGens = Inputs.range([20, 400], { label: 'Generations',
        value: editState.search.maxGen, step: 10 });
      const optSeed = Inputs.range([1, 99], { label: 'Search seed',
        value: editState.search.seed, step: 1 });
      optGens.addEventListener('input', () => { editState.search.maxGen = +optGens.value; });
      optSeed.addEventListener('input', () => { editState.search.seed = +optSeed.value; });
      // Short. It sits in a wrapping row next to three buttons and a
      // sparkline, and "searching · generation 12 · best cost 5.55 · 12
      // workers" was long enough to push itself onto a line of its own at some
      // widths and not at others. The generation and the cost are the two
      // things that change; the sparkline beside it already says the cost is a
      // cost, and how many cores are busy is not something anyone acts on.
      const statusEl = html`<span style="font-size:12px; opacity:.8;
        font-variant-numeric:tabular-nums; white-space:nowrap;"
        title="what the search is minimising, which is the worst this technique scores across the robustness variants — the same rollout at a second timestep with a jittered start. Worst-case rather than nominal so the answer cannot be a knife edge tuned to one timestep's contact artifacts, and it only ever falls, because it is the best found so far."></span>`;
      // 110 rather than 150. The transport carries the play button, the clock,
      // the reference toggle, two search buttons, this and the status line, and
      // at 150 the sum was forty pixels wider than the column -- so the status
      // line spent every search on a second row. The curve is a shape, not a
      // reading; it loses nothing at this width.
      const SPARK_W = 110;
      const spark = html`<canvas style="width:${SPARK_W}px; height:26px; vertical-align:middle;"></canvas>`;
      spark.width = Math.round(SPARK_W * dpr); spark.height = Math.round(26 * dpr);
      const drawSpark = () => {
        const h = optState.history;
        const c = spark.getContext('2d');
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        c.clearRect(0, 0, SPARK_W, 26);
        if (h.length < 2) return;
        const fg = theme?.foreground || [0.11, 0.12, 0.14];
        const rgb = fg.map((v) => Math.round(v * 255)).join(',');
        const ys = h.map((p) => Math.log(Math.max(p.best, 1e-6)));
        const lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
        c.strokeStyle = `rgba(${rgb},0.75)`;
        c.lineWidth = 1.5;
        c.beginPath();
        h.forEach((p, i) => {
          const x = 1 + (i / (h.length - 1)) * (SPARK_W - 2);
          const y = 24 - ((ys[i] - lo) / span) * 22;
          if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
        });
        c.stroke();
      };
      // The incumbent, and the generation it came out of, applied together.
      let pending = null;
      const adopt = (data) => {
        if (data.generation?.length) optState.ghosts = data.generation;
        if (!data.knots) return;
        // Belt to setCount's braces. A result is for the technique that was
        // searched, and if that is not the technique on screen any more there
        // is nothing sensible to do with it: adopting six poses' worth of
        // knots into a five-pose page leaves every array a different length
        // from every other, and the first thing to read one of them off the
        // end gets NaN.
        //
        // Counted against the joint list rather than a written-down six. As a
        // literal this was the loudest bug on the page: the worker answers in
        // as many channels as the body has, so once the trunk gained a hinge
        // EVERY result was refused. The search would find a handstand, the
        // page would drop it on the floor, keep the knots it already had, and
        // report that the replay does not arrive -- with a status line
        // blaming the pose count, which was never the problem.
        if (data.knots.length !== NJOINTS || data.knots[0].length !== K) {
          // Console, not the status line. This is a race between a result and
          // an edit, it resolves itself on the next search, and there is
          // nothing for the reader to do about it.
          console.warn('ignored a search result for a technique that is no longer on screen',
            `(${data.knots.length} joints x ${data.knots[0]?.length} poses, page has ${NJOINTS} x ${K})`);
          return;
        }
        editState.knots = data.knots.map((k) => Float64Array.from(k));
        editState.T = data.T;
        // The phrasing the search settled on, when it was searching phrasing.
        // Without this the answer is drawn against the rhythm it started from
        // and every pose sits at the wrong instant -- the same class of bug as
        // replaying on a body the search never used, and just as quiet.
        if (data.knotFracs?.length === editState.knots[0].length) {
          editState.fracs = Float64Array.from(data.knotFracs);
        }
        // The start pose, when the search was allowed to move it. Null means
        // it was not, and the page keeps its own -- the same rule the knots
        // follow for a held pose.
        if (data.q0?.length) editState.q0 = Float64Array.from(data.q0);
        resim();
      };
      const stopSearch = () => {
        optState.worker?.terminate();
        optState.worker = null;
        optState.ghosts = null;
        pending = null;
        searching = false;
        optRun.disabled = false;
        optStop.disabled = true;
      };
      invalidation.then(stopSearch);
      optStop.addEventListener('click', () => {
        stopSearch();
        status = status.replace(/^gen \d+/, 'stopped');
        dirty = chromeDirty = true;
      });
      optRun.addEventListener('click', () => {
        stopSearch();
        optState.history = [];
        searching = true;
        // Optimizing starts playback and leaves it running, so the figure is
        // moving from the moment the button is pressed and keeps moving when
        // the search hands its answer back. Holding one panel still while the
        // other animated made the two halves disagree about what time it was.
        sel = -1;
        setPlaying(true);
        lastNow = null;
        optRun.disabled = true;
        optStop.disabled = false;
        status = 'starting';
        const worker = new Worker(new URL('./opt-worker.js', import.meta.url), { type: 'module' });
        optState.worker = worker;
        const over = bodyOver();
        worker.onmessage = ({ data }) => {
          // Logged, not shown: how many cores are busy is a performance
          // detail, and the status line has four words of room.
          if (data.type === 'pool') {
            poolSize = data.size;
            console.info(`optimizer: evaluating on ${data.size} worker${data.size > 1 ? 's' : ''}`);
            return;
          }
          // The worker reports its own failures rather than throwing them at
          // an error event, and these were being dropped on the floor: a
          // search that died inside the worker simply stopped, with the status
          // line still saying "searching" forever.
          if (data.type === 'failed') {
            console.error('optimizer worker failed:', data.message, '\n', data.stack);
            status = `the search failed — ${data.message}`;
            stopSearch();
            dirty = chromeDirty = true;
            return;
          }
          // Not fatal: the nested evaluation workers could not be started, so
          // the search runs on one core instead of several.
          if (data.type === 'pool-failed') {
            console.warn('optimizer: evaluating on one core —', data.message);
            poolSize = 1;
            return;
          }
          if (data.type === 'progress') {
            // The objective, which is what a progress reading has to be: the
            // search only ever lowers it, so the curve falls or holds. It is
            // the worst case over the robustness variants rather than a single
            // rollout -- see statusEl's title, and the worker's comment on why
            // reporting a nominal replay here made progress look like noise.
            optState.history.push({ gen: data.gen, best: data.best });
            status = `gen ${data.gen} · cost ${data.best.toFixed(2)}`;
            // Held, not applied. A generation is swapped in at the end of a
            // loop pass and never during one, so what is on screen is always a
            // single generation and always one that finished -- and the
            // incumbent it belongs to arrives with it, rather than the poses
            // jumping at one moment and the field behind them at another.
            pending = data;
          } else if (data.type === 'done') {
            // The same quantity the generations reported, so the last point
            // belongs on the same curve and the closing number is where the
            // curve actually ended. These were two different measurements once
            // -- the generations showed the objective and the finish showed an
            // independent nominal replay, both labelled "cost" -- so the number
            // fell for forty generations and jumped at the end. Nothing had
            // gone wrong with the search; the label had changed under it.
            //
            // fineCost is still sent, and still worth having: it is the
            // technique replayed the way the figure replays it, and the two
            // disagreeing about whether it ARRIVES is the console warning
            // below.
            optState.history.push({ gen: optState.history.length, best: data.best });
            status = `done · cost ${data.best.toFixed(2)}`;
            pending = null;
            adopt(data);
            // The search reports what it scored; the figure has just
            // replayed the same technique. Those are two call sites for one
            // rollout, and every time they have drifted apart -- a start the
            // search solved for itself, an ending it pinned to a handstand, a
            // symmetric skill it straightened -- it read on screen as a
            // search that succeeded and a body that fell, with no number
            // saying so. They agree to the last bit when nothing is wrong, so
            // any disagreement at all is worth a line in the console.
            try {
              const got = editState.run?.verdict;
              if (got && !!got.success !== !!data.verdict?.success) {
                console.warn('the search and the replay disagree about this technique:',
                  `search ${data.verdict?.success ? 'arrives' : 'falls'} at cost ${data.fineCost?.toFixed(3)},`,
                  `replay ${got.success ? 'arrives' : 'falls'} with the centre of mass at ${got.comY?.toFixed(3)} m.`,
                  '\n  search plant:', data.plant, '\n  replay plant:', editState.run?.plant,
                  '\n  search body:', data.body, '\n  replay body:', editState.run?.body,
                  '\n  numerics:', data.numerics, editState.run?.numerics);
              }
            } catch (e) { console.warn('could not compare the search with the replay', e); }
            stopSearch();
          }
          dirty = chromeDirty = true;
        };
        // An ErrorEvent carries a message, a filename and a line. A BARE Event
        // carries none of those, and means something different: the worker
        // script could not be loaded or parsed at all. Logging the event
        // object for either was useless -- a browser prints a bare Event as
        // "Event" and nothing else -- so both are named here, with the script
        // that failed, because a search that will not start is otherwise an
        // unreadable dead end.
        const workerUrl = new URL('./opt-worker.js', import.meta.url).href;
        const fail = (what) => {
          console.error('optimizer worker:', what, '\n  script:', workerUrl);
          status = `the search failed — ${what}`;
          stopSearch();
          dirty = chromeDirty = true;
        };
        worker.onerror = (e) => {
          fail(e?.message
            ? `${e.message} (${(e.filename || '').split('/').pop() || '?'}:${e.lineno ?? '?'})`
            : 'the worker script could not be loaded — check the browser network tab for '
              + workerUrl.split('/').pop());
          e?.preventDefault?.();
        };
        // A message that cannot be deserialized: rarer, and completely silent
        // without this.
        worker.onmessageerror = () => fail('a message from the worker could not be read');
        // ONE object. Everything the search needs -- the body, the strength,
        // the anatomy, the start, the ending, the plant, the integration, the
        // phrasing, the pins, the tempo, the seed -- is IN the technique, and
        // technique-file.js derives the search's arguments from it exactly as
        // it derives the replay's. There is no second list here to fall out of
        // step with the first, which is what a hand-written postMessage was.
        worker.postMessage({
          type: 'optimize',
          technique: techniqueToJSON(asTechnique()),
          // Measured: perturbing a warm start by sigma radians on every knot at
          // once, the share of a 14-candidate generation still reaching a
          // handstand runs 0/14 at 0.10 and 14/14 at 0.01.
          sigma0: 0.02,
        });
        dirty = chromeDirty = true;
      });

      function relayout() {
        const run = editState.run, rec = run.rec;
        xEnd = Math.min(rec.t[rec.t.length - 1] || editState.T, editState.T + 1.0);
        if (t > xEnd) t = xEnd;
        strip.layout({
          run, prof: run.prof || strengthProf, rom: run.rom || sim.baseRom,
          T: editState.T, xEnd, theme,
          knotTimes: Array.from({ length: K }, (_, k) => knotTime(k)),
          locks: editState.timeHeld,
        });
        const stats = FIG.analyzeRun(run, run.prof || strengthProf, model);
        verdict.innerHTML = FIG.verdictHTML(stats, editState.edited ? baseStats : null);
        paintRamp?.();
        dirty = chromeDirty = true;
      }

      const loop = createFrameLoop((now) => {
        if (playing || searching) {
          if (lastNow !== null) {
            t += (now - lastNow) / 1000;
            if (t > xEnd) {
              t = 0;
              if (pending) { adopt(pending); pending = null; }
            }
          }
          lastNow = now;
          dirty = true;
        } else { lastNow = null; }
        if (!dirty) return;
        dirty = false;
        drawStage();
        strip.draw(t, theme);
        if (chromeDirty) {
          chromeDirty = false;
          const run = editState.run;
          const m = run.model || model;
          const cell = new Float64Array(m.nq);
          story.draw({
            model: m, ws: run.ws || ws, sel, theme,
            items: [
              { q: Float64Array.from(startQ()), label: 'start', time: null, solid: true,
                locked: editState.startHeld, start: true },
              ...Array.from({ length: K }, (_, kk) => ({
                q: Float64Array.from(FIG.knotPose(m, editState.knots, kk, cell)),
                label: `${kk + 1}`, time: `${knotTime(kk).toFixed(2)}s`,
                solid: false, locked: editState.held[kk], timeLocked: editState.timeHeld[kk],
              })),
            ],
          });
          statusEl.textContent = status;
          // Says the technique on screen is no longer the one the picker
          // names. Read off the same flag the verdict uses to decide whether
          // to report a delta, so the badge and the numbers cannot disagree.
          syncDoc?.();
          drawSpark();
        }
      });
      invalidation.then(() => loop.cancel());

      // ---- settling on a technique that has just been opened ----------------
      // A file waiting to be applied wins; then a technique whose knots the
      // mirror moved, or a restored draft, both of which mean the recording
      // beside them is of some other movement and has to be re-run. Otherwise
      // the run the technique came with IS the run, and this only re-lays.
      const settle = () => {
        if (pendingLoad.rec) applyLoaded();
        else if (stale || editState.hasDraft) resim();
        else relayout();
      };

      // ---- swapping the technique, in place ---------------------------------
      // The whole reason this figure no longer depends on the picker. Nothing
      // here rebuilds anything: the storyboard is told a new cell count if the
      // count changed, every control is pushed back from editState, and the
      // clock keeps running -- so choosing another technique looks like the
      // animation changing rather than the page rebuilding underneath it.
      function openAnother(next) {
        if (!next || (next === sim && !pendingLoad.rec)) return;
        stopSearch();
        const before = K;
        const want = openInto(next);
        baseStats = FIG.analyzeRun(sim, sim.prof || strengthProf, model);
        syncTechniqueInputs();
        syncPresetButtons();
        syncPick();
        optState.history = [];
        status = '';
        // The clock survives -- it is the one thing here that is about the
        // reader rather than the technique -- but the selection does not: the
        // pose you were editing was a pose of the other movement.
        sel = -1;
        closeConfirm?.();
        if (pendingLoad.rec) {
          // applyLoaded reads the file over the top of what was just opened
          // and fixes the count itself, so all this owes it is a K that
          // matches the storyboard it is about to compare against.
          if (want !== before) { K = want; nCells = K + 1; story.setCount(nCells); }
          applyLoaded();
        } else if (want !== before) {
          // A technique with a different number of poses still has to re-lay
          // the storyboard, and setCount re-simulates as part of that -- but
          // opening one is not an edit of it, so the replay says so. Except
          // when a parked draft came back, which IS the work you had done.
          setCount(want, { revert: !editState.hasDraft });
        } else settle();
        chromeDirty = dirty = true;
      }
      // Both ways in are the same act. The bar's own picker mirrors into the
      // one above the playback figure, which is what the rest of the notebook
      // listens to; this listens to it too, so a change made in either place
      // opens the technique here exactly once.
      const onPicked = () => { syncPick(); openAnother(techniqueSource.resolve(presetInput.value)); };
      presetInput.addEventListener('input', onPicked);
      // presetInput OUTLIVES this cell -- it belongs to the controls above the
      // playback figure -- so a listener left on it would still be here, and
      // still holding this cell's closure, the next time the body changes and
      // this figure is rebuilt.
      invalidation.then(() => presetInput.removeEventListener('input', onPicked));

      settle();
      const stopTheme = observeTheme((th) => { theme = th; relayout(); });
      invalidation.then(stopTheme);

      const key = (mark, text) => html`<span>${mark}${text}</span>`;
      const dot = (fill) => html`<span style="display:inline-block; width:.75em; height:.75em;
        background:${fill}; vertical-align:-.05em; margin-right:.3em; border-radius:2px;"></span>`;
      const ramp = html`<span style="display:inline-block; width:3em; height:.75em; vertical-align:-.05em;
        margin-right:.3em; border-radius:2px;"></span>`;
      paintRamp = () => {
        const d = theme?.isDark ?? false;
        ramp.style.background = `linear-gradient(to right, ${FIG.effortColor(0, d)},`
          + ` ${FIG.effortColor(0.5, d)}, ${FIG.effortColor(1, d)})`;
      };
      paintRamp();
      const legend = html`<span class="hs-legend">${
        key(ramp, 'strength used')}${key(dot(FIG.ROM_COLOR), 'outside range of motion')}</span>`;

      // ---- the transport ------------------------------------------------------
      // Everything you DO to the movement, on one bar, directly under the thing
      // it moves: play it, choose whether the request is drawn behind it, and
      // search for a better one. Opening the parameter panel is for changing a
      // number, not for running the thing.
      const rule = () => html`<span class="hs-rule" style="width:1px; height:16px; margin:0 2px;
        background:color-mix(in srgb, currentColor 20%, transparent);"></span>`;
      const refBtn = html`<button class="hs-btn" aria-pressed="false"
        title="draw the reference the servo is chasing behind the body while the movement plays. Off by default: in playback it is a second, grey, slightly out-of-step body in the same picture, which reads as a smear on the animation rather than as the thing driving it. Editing a pose always shows it — there it is the subject.">Reference</button>`;
      const syncRef = () => {
        refBtn.classList.toggle('hs-btn--on', showRef);
        refBtn.setAttribute('aria-pressed', showRef ? 'true' : 'false');
      };
      refBtn.addEventListener('click', () => { showRef = !showRef; syncRef(); dirty = true; });
      syncRef();
      strip.transport?.append(refBtn,
        // The search's two buttons and the rule that separates them from the
        // transport, wrapping as ONE thing. Narrow enough and this bar wraps;
        // loose, it wrapped between them, so a phone got "Stop" alone on a
        // line reading as a third control and a divider dangling off the end
        // of the line above.
        html`<span style="display:inline-flex; gap:6px; align-items:center;">${
          rule()}${optRun}${optStop}</span>`,
        html`<span style="flex:1 1 12px;"></span>`, spark, statusEl);

      // ---- the document bar ---------------------------------------------------
      // Which technique this is, and what may be done to it AS a document.
      // Presets used to sit at the bottom of the parameter panel, filed
      // between the search seed and the servo gains, which said that opening
      // one was the same kind of act as changing a damping ratio. It is not.
      // Opening, reverting, keeping and saving are what you do to a file, and
      // they belong at the top of the thing the file IS -- so the picker that
      // was two controls in two places (one above the figure, one buried in
      // the panel) is now the editor's own title bar.
      // A dot and a word. Below the breakpoint the word goes and the dot stays:
      // "this differs from what the picker names" is a one-bit fact and does
      // not need fifty pixels to say so.
      const editedTag = html`<span class="hs-tag" hidden role="status"
        title="the technique on screen is no longer the one the picker names. Revert puts it back; Keep makes it a preset of its own."
        ><span class="hs-tag__dot" aria-hidden="true"></span
        ><span class="hs-tag__word">edited</span></span>`;
      // The rest of the verbs, behind one control: a bar with eight buttons on
      // it is a bar nobody reads.
      // Everything you can DO to the technique, in one place. The bar used to
      // carry Revert and Keep as well, which made a title bar into a row of
      // five verbs -- and on a phone it was five verbs and a picker in three
      // hundred pixels. A title bar's job is to say WHICH technique this is
      // and whether it differs from what is stored; acting on it is what the
      // menu is for, and there is only one of those to find.
      const docMenu = html`<details class="hs-menu">
        <summary class="hs-btn" aria-label="what can be done with this technique"
          title="keep, update, revert, rename, forget, and files">⋯</summary>
        <div class="hs-menu__panel">
          <div class="hs-menu__row hs-menu__row--wide">${keepBtn}</div>
          <div class="hs-menu__row hs-menu__row--wide">${updateBtn}</div>
          <div class="hs-menu__row hs-menu__row--wide">${resetBtn}</div>
          <div class="hs-menu__sep"></div>
          <div class="hs-menu__row">${presetName}</div>
          <div class="hs-menu__row">${renameBtn}${dropBtn}</div>
          <div class="hs-menu__sep"></div>
          <div class="hs-menu__row">${saveBtn}${loadBtn}${loadInput}</div>
        </div>
      </details>`;
      // A details stays open until its own summary is clicked again, which for
      // a menu means it stays open behind whatever you do next.
      const closeMenu = (e) => { if (!docMenu.contains(e.target)) docMenu.open = false; };
      const escMenu = (e) => {
        if (e.key !== 'Escape') return;
        docMenu.open = false;
        closeConfirm?.(true);
      };
      document.addEventListener('pointerdown', closeMenu);
      document.addEventListener('keydown', escMenu);
      invalidation.then(() => {
        document.removeEventListener('pointerdown', closeMenu);
        document.removeEventListener('keydown', escMenu);
      });
      // Pressing one of the verbs inside says what it did on the status line,
      // which is on the transport bar and not in the menu -- so the menu shuts
      // itself and gets out of the way.
      for (const b of [keepBtn, updateBtn, resetBtn, renameBtn, dropBtn, saveBtn, loadBtn]) {
        b.addEventListener('click', () => { docMenu.open = false; });
      }
      // The verbs in one group with `margin-left:auto` rather than each of them
      // after a flexible spacer. A spacer only pushes what is on ITS line, so
      // on a phone -- where the bar wraps -- the buttons dropped to a second
      // row hard against the left margin, and the menu opening off the right
      // of a control sitting at x = 0 hung its panel off the screen.
      const docBar = html`<div class="hs-editor__bar">
        <span class="hs-pane__title">Technique</span>
        ${pick}${editedTag}
        <span class="hs-editor__actions">${docMenu}</span>
      </div>`;
      syncDoc = () => { editedTag.hidden = !editState.edited; };
      syncDoc();

      // ---- the panes ----------------------------------------------------------
      // What you WATCH, what you PRESS, which poses there are, and when. Four
      // panes of one instrument, in the order you work them, each with the same
      // padding -- which is the whole reason the frames no longer sit hard
      // against the edge of a phone.
      const stagePane = html`<div class="hs-editor__pane hs-editor__pane--first">${stage}</div>`;
      const transportPane = html`<div class="hs-editor__pane hs-editor__transport">${strip.transport}</div>`;
      const posesPane = html`<div class="hs-editor__pane">
        <div class="hs-pane__head">${posesTitle}${confirmBar}</div>
        ${story.element}
      </div>`;
      // "Effort", not "Timeline": the tab above it is the timeline, and this is
      // one of the two things on it. What the strip actually shows is how much
      // of each joint's strength the movement is spending, which is what the
      // legend beside this title says too.
      const timelinePane = html`<div class="hs-editor__pane">
        <div class="hs-pane__head"><span class="hs-pane__title">Effort</span>${legend}</div>
        ${strip.element}
      </div>`;
      const verdictPane = html`<div class="hs-editor__pane hs-editor__verdict"
        style="font: 12.5px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;">${verdict}</div>`;

      // ---- the deck -----------------------------------------------------------
      // The lower half of the instrument, as two views of one technique with a
      // tab bar over them.
      //
      // The parameters used to live outside the figure entirely, in a box under
      // it, and expandable would lift that box into a panel floating over the
      // figure when you went fullscreen. That was a reasonable arrangement for
      // a picture with some sliders beside it and a poor one for this: there is
      // enough interface here now that a second, draggable, differently-shaped
      // window on top of it reads as another application. It also had nowhere
      // good to sit -- its own toggle floats at the top-left of whatever it
      // wraps, which since the title bar arrived is over the technique picker.
      //
      // Two tabs rather than three. The poses and the effort strip are both
      // TIME views of the same movement and are wanted at the same time: you
      // scrub one and read the other, and the frame you are editing is ringed
      // in the first while the second says what it costs. Splitting them would
      // break the one pairing in this figure that already works. The
      // parameters are the other thing -- what body, what search, what servo --
      // and they are set and then left alone.
      const TABS = [
        { id: 'timeline', label: 'Timeline', pane: html`<div></div>` },
        { id: 'settings', label: 'Settings', pane: html`<div class="hs-editor__pane"></div>` },
      ];
      TABS[0].pane.append(posesPane, timelinePane);
      const tabBtns = TABS.map((t, i) => {
        const b = html`<button class="hs-tab" type="button" role="tab"
          id="hs-tab-${t.id}" aria-controls="hs-tabpanel-${t.id}">${t.label}</button>`;
        t.pane.id = `hs-tabpanel-${t.id}`;
        t.pane.setAttribute('role', 'tabpanel');
        t.pane.setAttribute('aria-labelledby', `hs-tab-${t.id}`);
        b.addEventListener('click', () => selectTab(i));
        // Left and right walk the tabs, which is what a tablist is expected to
        // do and costs four lines.
        b.addEventListener('keydown', (e) => {
          if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
          e.preventDefault();
          const next = (i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
          selectTab(next);
          tabBtns[next].focus();
        });
        return b;
      });
      const tabBar = html`<div class="hs-tabs" role="tablist"
        aria-label="what the lower half of the editor shows">${tabBtns}</div>`;
      const selectTab = (n) => {
        editState.ui.tab = TABS[n].id;
        TABS.forEach((t, i) => {
          const on = i === n;
          tabBtns[i].classList.toggle('hs-tab--on', on);
          tabBtns[i].setAttribute('aria-selected', on ? 'true' : 'false');
          // Untabbable when not selected: a tablist takes ONE tab stop, and
          // arrow keys move within it.
          tabBtns[i].tabIndex = on ? 0 : -1;
          t.pane.hidden = !on;
        });
        // The deck's two views are different heights, and expanded the stage
        // is given whatever they leave -- so switching has to re-divide it.
        layout.refresh?.();
        // The flags directly rather than redraw(), which is a const declared
        // further down: this runs once during the cell body to restore the tab
        // the reader last had open, and naming redraw there would put it in
        // its temporal dead zone. That has taken this figure down twice.
        dirty = chromeDirty = true;
      };
      const deck = html`<div class="hs-editor__deck">${tabBar}${TABS.map((t) => t.pane)}</div>`;

      // Everything below the stage, in one element, because the stage is given
      // whatever vertical room the rest of it leaves and that is a number only
      // a measurement can give.
      const chromeEl = html`<div>${transportPane}${deck}${verdictPane}</div>`;

      const figure = html`<figure class="hs-editor">${docBar}${stagePane}${chromeEl}</figure>`;

      // ---- the parameters -----------------------------------------------------
      // Grouped, and every group collapsible. Eleven controls in one column is a
      // list to read rather than a panel to use; folded, what is open says what
      // you are currently working on.
      //
      // What is NOT here any more is the presets. They were a group at the
      // bottom of this list, filed between the search seed and the servo
      // gains, which said that opening a technique was the same kind of act as
      // changing a damping ratio -- and put the picker in two places, so the
      // one you happened to reach decided whether the scenario came with it.
      // Opening, reverting, keeping and saving are what you do to a document,
      // and they are on the editor's own title bar now.
      const group = (title, open, ...rows) => html`<details ${open ? 'open' : ''}
        style="margin-top:8px; border-top:1px solid color-mix(in srgb, currentColor 12%, transparent);">
        <summary style="cursor:pointer; font-size:11px; font-weight:600; letter-spacing:.04em;
          text-transform:uppercase; opacity:.75; padding:6px 0 2px;">${title}</summary>
        ${rows}
      </details>`;

      // No heading of its own any more: the tab it sits behind is its heading.
      // One wrapping line per group rather than fixed pairs of rows: how many
      // controls fit across is the width's business, not a decision baked into
      // the markup, and hardcoded pairs left two thirds of a desktop window
      // empty while stacking the panel taller than the picture it drives.
      //
      // "Technique" is gone as a group. Its three controls were a pose count
      // (now the x and + on the storyboard), a duration (now the last pose's
      // own handle on the timeline) and the leg mirror -- and the mirror is a
      // statement about the BODY performing the skill, which is the group it
      // sits in now.
      const controlsBox = html`<div class="technique-controls">
        ${group('body', true,
          html`<div class="spline-controls">${inShoulder}${inHam}${inShFlex}${inWrExt}${inSpine}${symToggle}</div>`)}
        ${group('search', false,
          html`<div class="spline-controls">${optGens}${optSeed}</div>`)}
        ${group('servo', false,
          html`<div class="spline-controls">${servoInputs.map((i) => i)}</div>`)}
      </div>`;
      // Opening a group makes the panel taller, which expanded means the deck
      // has to be re-divided against the stage. Without this the new controls
      // were laid out below the bottom edge of a box that cannot scroll to
      // them -- visible only after switching tabs away and back, which is the
      // one other thing that re-runs the measurement.
      controlsBox.querySelectorAll('details').forEach((d) => {
        d.addEventListener('toggle', () => { layout.refresh?.(); dirty = chromeDirty = true; });
      });

      TABS[1].pane.appendChild(controlsBox);
      // Survives the cell re-running, which it does whenever the technique or
      // the pose count changes -- like the expanded flag beside it.
      selectTab(Math.max(0, TABS.findIndex((t) => t.id === editState.ui.tab)));

      const redraw = () => { dirty = chromeDirty = true; };

      return { figure, controlsBox, chromeEl, docBar, deck, sizeStage, story, strip, redraw,
        layout, stageH: STAGE_H };
    })();
    // The figure first. Eight sliders ahead of it is a wall the reader has to
    // climb before reaching the thing the sliders act on; expandable() resolves
    // the controls selector when it expands, not when it is built, so the box
    // is free to sit below.
    const techniqueBox = expandable(techniqueFigure.figure, {
      id: 'technique-editor',
      width: pageW,
      // Collapsed, the stage keeps the height it always had and the figure is
      // as tall as its contents; expandable measures that itself. This number
      // only matters expanded, where onResize divides it up.
      height: techniqueFigure.stageH,
      state: editState.ui,
      onResize(el, w, h, expanded) {
        // The shell is a box with a border and a padding, so the room its
        // panes actually have is neither w nor h. The padding is READ OFF a
        // pane rather than written down again here: it is set in the
        // stylesheet, and it changes there on a narrow screen -- arithmetic
        // that did not know about that media query would walk the timeline off
        // the edge of the box by exactly the difference.
        const BORDER = 1;
        const pane = getComputedStyle(techniqueFigure.chromeEl.firstElementChild);
        const PANE = (parseFloat(pane.paddingLeft) || 8) + (parseFloat(pane.paddingRight) || 8);
        techniqueFigure.figure.style.width = `${Math.round(w)}px`;
        const innerW = Math.max(200, Math.round(w) - 2 * BORDER - PANE);
        // Width first: the storyboard's frames and the timeline both get taller
        // or shorter as they get wider, and the stage is given whatever
        // vertical room is left over -- so their heights have to be settled
        // before there is a leftover to measure.
        techniqueFigure.story.resize(innerW);
        techniqueFigure.strip.resize(innerW);
        // The deck is measured at its natural height, so what follows divides
        // the room against what it WANTS rather than against the cap it was
        // last given -- otherwise the cap is its own input and the panel can
        // only ever shrink.
        const deckEl = techniqueFigure.deck;
        deckEl.style.maxHeight = '';
        if (!expanded) {
          techniqueFigure.sizeStage(innerW, techniqueFigure.stageH);
          techniqueFigure.redraw();
          return;
        }
        // Measured, not guessed: the storyboard and the timeline both get
        // taller as they get wider, so the leftover is only honest after they
        // have been resized. The bar and the stage pane's own padding come off
        // it too, or the timeline hangs out of the bottom of the box by
        // exactly their height.
        //
        // Expanded, the figure is a fixed box and the stage takes what the
        // deck leaves. That only works while the deck is willing to be a size:
        // opening SERVO used to push the panel's own bottom out through a
        // wrapper with overflow:hidden, so four sliders existed somewhere you
        // could neither see nor scroll to. So the room is divided the other
        // way round now -- the stage keeps a floor, and whatever is left is
        // the deck's height, which its panel scrolls inside.
        const spent = techniqueFigure.chromeEl.offsetHeight - deckEl.offsetHeight
          + techniqueFigure.docBar.offsetHeight + PANE + 2 * BORDER;
        const room = Math.max(160, h - spent - 4);
        const stageH = Math.max(200, room - deckEl.offsetHeight);
        deckEl.style.maxHeight = `${Math.max(90, room - stageH)}px`;
        techniqueFigure.sizeStage(innerW, stageH);
        techniqueFigure.redraw();
      },
    });
    // Adding or dropping a pose changes how tall the figure's own contents are,
    // which only the figure knows and only the wrapper can act on.
    techniqueFigure.layout.refresh = () => techniqueBox.refreshLayout?.();
    display(techniqueBox);
  </script>
  <script id="optimizer-section" type="text/markdown">
    ## What the search is actually doing

    CMA-ES climbs a score computed by simulating the candidate. The score is a weighted sum: did it arrive in the balanced pose and stop there; what it cost in metabolic work and in time spent near the torque cap; whether it went outside its own range of motion; whether it is still the skill it claims to be — feet leaving the floor once and not replanting, a bent-leg press actually passing through an inverted tuck, the legs not slung in at more than two metres a second; and whether it looks like a person, through terms on joint acceleration and on how fast the muscle drive is allowed to slew. Each candidate is scored as the *worst case* of two evaluations — the nominal one, and one at a different timestep with a small velocity jitter — so a knife-edge catch tuned to one timestep's contact artifacts pays full price for it.

    What it cannot do is as informative as what it can. It searches angles, and nothing else: the tempo, where the poses fall within it, how many there are, and which of them are held are all yours. The angles include the pose the body *starts* in, but only if you ask — the padlock on the first frame of the storyboard hands it over, and it is shut by default, because where a movement begins is usually the one thing about it you are sure of. Tempo is the interesting one, because it used to be the search's and it should not have been. A movement that arrives at all gets cheaper the slower it runs — work and smoothness both fall — so wherever there was room to spare the gradient pointed at the longest duration on offer and stayed there. The straight-leg press arrives at every duration from 1.6 seconds up, and costs 4.59, 1.48, 1.15, 1.08, 1.05 and 1.03 as it slows to three and a half. That is not a search finding a tempo, it is a search running out of slider — and the slowest version is precisely the one where the shoulder supplies everything and nothing is carried by momentum, which is the opposite of technique. Set the tempo yourself and the search has to find a shape that works at it.

    Every knot is boxed by the body's own range of motion, so lowering a flexibility limit takes technique away from the search rather than fining it afterwards. And every run above is re-simulated in your browser from its knots rather than replayed as an animation, so if a technique looks wrong it is wrong, whatever its cost says.

  <script id="coda" type="text/markdown">
    ## What the model says

    - The kick-up goes at a shoulder rated 1.6 Nm/kg with average hamstrings. The straight-leg press on that same body collapses, and still collapses at 2.2; at 2.8 it works.
    - Hamstring flexibility does not decide whether the press happens, only what it costs. At 2.8 Nm/kg, hamstrings reaching 125 degrees score 1.03 against 2.53 for an ordinary 85 degree fold: the same skill for two and a half times less.
    - The inverted tuck itself is nearly free: hips over the hands with the knees at the chest holds at 23 Nm and is limited by the wrist, like a straight handstand. Rise through a tucked planche instead and the identical shape costs 132 Nm.
    - So a bent-leg press reaches a handstand on a 2.0 Nm/kg shoulder, where the straight-leg press needs 2.8 — but only by staying tucked to the vertical and throwing the legs out, at 3.1 m/s at the foot against 1.8 for a kick-up. Coming out of the tuck earlier means holding the rise on the shoulder while the legs lengthen the body, and that costs 2.8 as well. Bending the legs buys the weaker shoulder, not the controlled finish.

    The model is a two dimensional cartoon: merged arms, locked elbows, one rigid segment from shoulder to hip, no lateral balance, penalty friction, torque servos rather than muscles and tendons, and a search that finds good technique rather than best technique. Read the numbers as mechanisms and thresholds, not prescriptions.

    ## Validation

    The physics core is covered by offline gates (`node src/notebooks/handstand/test/dynamics.mjs` and friends): the dynamics against finite differences of the energy, momentum conservation in free fall, a textbook double pendulum, contact settling, the torque-curve landmarks, and the servo's arrival behavior. The cell below reruns a fast subset in your browser against the current model.

  <script id="validation-checks" type="text/x-typescript">
    const validation = (() => {
      const zeroV = new Float64Array(model.nq);
      const checks = [];
      // Mass matrix symmetry and SPD at a bent pose.
      {
        const q = Float64Array.from(poseState.q);
        const M = new Float64Array(model.nq * model.nq);
        massMatrix(model, q, M, ws);
        let asym = 0;
        for (let i = 0; i < model.nq; i++) {
          for (let j = 0; j < model.nq; j++) asym = Math.max(asym, Math.abs(M[i * model.nq + j] - M[j * model.nq + i]));
        }
        checks.push({ name: 'mass matrix symmetric', ok: asym < 1e-9, detail: `max asymmetry ${asym.toExponential(1)}` });
      }
      // Static torques match finite differences of potential energy.
      {
        const q = Float64Array.from(poseState.q);
        const tau = new Float64Array(model.nq);
        rnea(model, q, zeroV, zeroV, tau, null, { ws });
        const eps = 1e-6;
        let worst = 0;
        for (let i = 3; i < model.nq; i++) {
          const qp = q.slice(); qp[i] += eps;
          const qm = q.slice(); qm[i] -= eps;
          const dV = (energy(model, qp, zeroV, ws).potential - energy(model, qm, zeroV, ws).potential) / (2 * eps);
          worst = Math.max(worst, Math.abs(tau[i] - dV));
        }
        checks.push({ name: 'static torques = dV/dq', ok: worst < 1e-5, detail: `max err ${worst.toExponential(1)} Nm` });
      }
      // Strength model landmarks.
      {
        const jp = strengthProf.shoulder;
        const iso = availableTorque(jp, 1, 0);
        const con = availableTorque(jp, 1, 8);
        const ecc = availableTorque(jp, -1, 8);
        checks.push({
          name: 'strength: eccentric > isometric > fast concentric',
          ok: ecc > iso && iso > con && con > 0,
          detail: `${ecc.toFixed(0)} / ${iso.toFixed(0)} / ${con.toFixed(0)} Nm`,
        });
      }
      // Total mass budget.
      {
        let m = 0;
        for (let i = 0; i < model.nb; i++) m += model.mass[i];
        checks.push({ name: 'segment masses sum to body mass', ok: Math.abs(m - model.massKg) < 1e-9, detail: `${m.toFixed(3)} kg` });
      }
      const rows = checks.map((c) => html`<div>${c.ok ? '✓' : '✗'} ${c.name} <small style="opacity:0.6">(${c.detail})</small></div>`);
      const allOk = checks.every((c) => c.ok);
      return html`<div style="font-variant-numeric: tabular-nums; ${allOk ? '' : 'color:#c0392b;'}">${rows}</div>`;
    })();
    display(validation);
  </script>
