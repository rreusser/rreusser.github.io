  <script id="intro" type="text/markdown">
    Why is pressing up to a handstand so much harder than kicking up to one? Strength, shoulders, wrists, hamstrings, timing — some of those are real constraints and some are folklore. This is a two dimensional rigid body model of a person balancing on their hands, built to tell them apart. Segment masses and lengths come from published anthropometric tables and joint strength from measured torque-velocity relationships, so every number here can be recomputed by moving a slider.
  </script>

  <script id="model-section" type="text/markdown">
    ## A stick figure gymnast

    Seven rigid segments in the sagittal plane: one hand, one arm (both arms merge by symmetry), a torso with the head, and a thigh and shank per leg, joined at the wrist, shoulder, two hips and two knees. Masses, mass centers and inertias follow de Leva's adjustment of the Zatsiorsky parameters, scaled by height and body mass.

    The hand is the segment that matters. It is not a point of support but a patch, from the heel of the palm to the finger pads.
  </script>

  <script id="pose-controls" type="text/x-typescript">
    const poseControls = html`<div class="pose-controls"></div>`;
    const section = (label) => poseControls.appendChild(html`<div style="font-weight:600; margin:0.6em 0 0.2em;">${label}</div>`);
    const add = (input) => { poseControls.appendChild(input); return input; };
    // Every one of the six joint angles has a drag handle on the figure, so
    // none of them gets a slider as well. The input elements are still made,
    // and are still where the pose lives: the drag handler writes them, the
    // preset buttons write them, syncPose reads them and writes back whatever
    // the flexibility clamp changed. They are simply never put in the panel.
    const offPanel = (input) => input;

    section('Pose');
    const inWrist = offPanel(Inputs.range([40, 100], { label: 'Wrist angle (deg)', value: 90, step: 0.5 }));
    const inShoulder = offPanel(Inputs.range([-5, 110], { label: 'Shoulder closing (deg)', value: 0, step: 0.5 }));
    const inHipL = offPanel(Inputs.range([-25, 140], { label: 'Hip flexion L (deg)', value: 0, step: 0.5 }));
    const inKneeL = offPanel(Inputs.range([-5, 145], { label: 'Knee flexion L (deg)', value: 0, step: 0.5 }));
    const inHipR = offPanel(Inputs.range([-25, 140], { label: 'Hip flexion R (deg)', value: 0, step: 0.5 }));
    const inKneeR = offPanel(Inputs.range([-5, 145], { label: 'Knee flexion R (deg)', value: 0, step: 0.5 }));
    const inSymmetric = add(Inputs.toggle({ label: 'Symmetric legs', value: true }));

    section('Flexibility limits');
    // Wrist extension, not the joint coordinate: 90 degrees is a forearm
    // standing vertical on a flat hand, and leaning out over the fingers
    // asks for more. Raising this slider therefore opens up the leaned-out
    // poses and lowering it forbids them, which is the direction a
    // flexibility limit should run. It used to be wired to the opposite end
    // of the range and did the reverse.
    const inRomWrist = add(Inputs.range([80, 150], { label: 'Wrist extension max', value: ROM_DEFAULTS.wristExtMaxDeg, step: 1 }));
    const inRomShoulder = add(Inputs.range([120, 185], { label: 'Shoulder flexion max', value: ROM_DEFAULTS.shoulderFlexMaxDeg, step: 1 }));
    const inRomHip = add(Inputs.range([40, 130], { label: 'Hip flexion max, straight knee', value: ROM_DEFAULTS.hipFlexStraightKneeMaxDeg, step: 1 }));
    const inRomCoupling = add(Inputs.range([0, 1], { label: 'Hamstring coupling (deg/deg)', value: ROM_DEFAULTS.hamstringCouplingPerDeg, step: 0.05 }));

    const D2R = Math.PI / 180;
    function syncPose() {
      if (!poseState.model) return;
      if (inSymmetric.value) { inHipR.value = inHipL.value; inKneeR.value = inKneeL.value; }
      const q = poseState.q;
      groundHand(poseState.model, q);
      q[3] = inWrist.value * D2R;
      q[4] = inShoulder.value * D2R;
      q[5] = inHipL.value * D2R;
      q[6] = -inKneeL.value * D2R;
      q[7] = inHipR.value * D2R;
      q[8] = -inKneeR.value * D2R;
      const rom = {
        ...ROM_DEFAULTS,
        wristExtMaxDeg: inRomWrist.value,
        shoulderFlexMaxDeg: inRomShoulder.value,
        hipFlexStraightKneeMaxDeg: inRomHip.value,
        hamstringCouplingPerDeg: inRomCoupling.value,
      };
      const clamped = clampPose(q, rom);
      if (clamped) {
        inWrist.value = q[3] / D2R;
        inShoulder.value = q[4] / D2R;
        inHipL.value = q[5] / D2R;
        inKneeL.value = -q[6] / D2R;
        inHipR.value = q[7] / D2R;
        inKneeR.value = -q[8] / D2R;
      }
      poseState.rom = rom;
      poseState.clamped = clamped;
      poseState.rev++;
      poseState.dirty = true;
      poseState.notifyPose?.({ rev: poseState.rev, q: Array.from(q), clamped });
      const romKey = JSON.stringify(rom);
      if (romKey !== poseState.romKey) {
        poseState.romKey = romKey;
        poseState.notifyRom?.(rom);
      }
    }
    poseState.sync = syncPose;
    poseState.jointSliders = { 3: inWrist, 4: inShoulder, 5: inHipL, 6: inKneeL, 7: inHipR, 8: inKneeR };
    poseState.symmetricInput = inSymmetric;
    poseControls.addEventListener('input', syncPose);

    section('Presets');
    const presetDefs = {
      'Straight': { wrist: 90, shoulder: 0, hip: 0, knee: 0 },
      'Banana': { wrist: 88, shoulder: 28, hip: -18, knee: 12 },
      'Planche lean': { wrist: 68, shoulder: 14, hip: 8, knee: 0 },
      'Pike': { wrist: 78, shoulder: 40, hip: 110, knee: 0 },
      'Tuck': { wrist: 85, shoulder: 25, hip: 115, knee: 120 },
    };
    const presetRow = html`<div style="display:flex; gap:6px; flex-wrap:wrap;"></div>`;
    for (const [name, p] of Object.entries(presetDefs)) {
      const b = html`<button>${name}</button>`;
      b.addEventListener('click', () => {
        inWrist.value = p.wrist; inShoulder.value = p.shoulder;
        inHipL.value = p.hip; inKneeL.value = p.knee;
        inHipR.value = p.hip; inKneeR.value = p.knee;
        syncPose();
      });
      presetRow.appendChild(b);
    }
    poseControls.appendChild(presetRow);
    syncPose();
    // Not displayed. The pose explorer that this panel drove is gone: it was
    // a debug view with a slider per degree of freedom and no question of
    // its own. What survives is the state -- the ROM values the press
    // corridor reads, and the pose the corridor's own probe solves for --
    // and the four limits worth touching are mirrored onto that figure.
  </script>

  <script id="statics-section" type="text/markdown">
    ## Balance is a statics problem

    A pose at rest balances when the center of mass sits over the center of pressure, and the center of pressure has nowhere to live except the palm patch:

    ${tex.block`x_{\mathrm{CoM}} = x_{\mathrm{CoP}}, \qquad x_{\mathrm{heel}} \;\le\; x_{\mathrm{CoP}} \;\le\; x_{\mathrm{fingertips}}.`}

    The wrist is what moves it: press through the fingertips to shift it forward, rock onto the heel of the palm to shift it back. For body weight ${tex`W`},

    ${tex.block`\tau_{\mathrm{wrist}} = W\,(x_{\mathrm{CoP}} - x_{\mathrm{wrist}}),`}

    so the patch length times body weight is the whole balance authority in a handstand. Every other joint torque in a static pose is set by gravity.
  </script>
  <script id="flexibility-section" type="text/markdown">
    ## What flexibility limits actually do

    A shoulder that cannot open to 180 degrees tips the torso off vertical, and the pose has to buy that angle back: arch the back, or lean the whole stack toward the fingertips. A wrist limit forces the same lean from below.

    The hamstrings are a two joint group, so what they limit is hip flexion combined with knee extension — every degree of knee bend buys some hip fold back. That coupling is why a bent-leg press exists.
  </script>
  <script id="corridor-intro" type="text/markdown">
    ## The press corridor

    A press is, quasi-statically, a path through pose space that keeps the center of mass over the palm the whole way, from the deep pike to the stacked handstand. For each hip and shoulder angle the model solves the wrist angle that balances the pose, then asks whether that pose is inside the flexibility limits and inside the strength limits.
  </script>
  <script id="pose-probe" type="text/x-typescript">
    // Both the press corridor and the catch window are maps over coordinates
    // nobody can picture: "hip 80, shoulder 30" and "wrist +12 deg at 1.4
    // rad/s" mean nothing as numbers. This is the body those numbers stand
    // for, drawn next to the plot and driven by whatever the cursor is over.
    // The window has to be given, not defaulted: a body piked to 130 deg
    // reaches almost 0.9 m behind the hand, and centering on the hand the way
    // a straight handstand wants cuts the legs off the canvas.
    const makePoseProbe = ({ w = 156, h = 220, view = { cx: 0.1, yLo: -0.15, yHi: 2.15 } } = {}) => {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * devicePixelRatio);
      canvas.height = Math.round(h * devicePixelRatio);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      const note = html`<small style="display:block; opacity:.75; min-height:3.2em; line-height:1.3;"></small>`;
      const element = html`<div style="flex:0 0 auto; width:${w}px;">${canvas}${note}</div>`;
      const ctx = canvas.getContext('2d');
      return {
        element,
        draw(q, text = '', jointMarks = null) {
          ctx.save();
          ctx.scale(devicePixelRatio, devicePixelRatio);
          ctx.clearRect(0, 0, w, h);
          if (q) {
            drawScene(ctx, {
              model, ws, q, width: w, height: h, theme: poseState.theme, view,
              jointMarks,
            });
          }
          ctx.restore();
          note.textContent = text;
        },
      };
    };

    // Plot renders a figure that may also contain a legend svg; the plot
    // itself is the tallest one. Its scales invert in CSS pixels relative to
    // that svg, which is what a pointer event gives us.
    // Plot returns a <figure> when it draws a legend and a bare <svg>
    // otherwise. The figure carries a browser default margin that opens a gap
    // the width of the page, and it holds two svgs: the legend ramp first,
    // then the plot. Pick by the height we asked for, NOT by measuring: this
    // runs before the chart is in the document, so every getBoundingClientRect
    // is 0x0, a sort by size is a no-op, and the first svg wins -- which is
    // the legend. That is how the pointer handler ended up on the colour bar.
    const plotSurface = (chart, minHeight) => {
      chart.style.margin = '0';
      if (chart.tagName.toLowerCase() === 'svg') return chart;
      const svgs = [...chart.querySelectorAll('svg')];
      return svgs.find((sv) => +sv.getAttribute('height') >= minHeight)
        || svgs[svgs.length - 1] || null;
    };
  </script>
  <script id="corridor-frame" type="text/x-typescript">
    // The corridor is a picture of two limits, and until now the sliders that
    // set those limits lived in the pose panel, several screens up. They are
    // mirrored here so the wall you are looking at is the wall you move.
    //
    // The mirrors have to live in a cell of their own. This cell reads the
    // input elements and never their values, so dragging one does not
    // re-run the cell and destroy the slider under the cursor mid-drag. The
    // map is rebuilt on every change by the press-corridor cell, which
    // renders into corridorSlot rather than displaying anything itself.
    const corridorSlot = html`<div></div>`;
    const corridorLimits = (() => {
      const box = html`<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(290px,1fr)); gap:0 18px; margin-top:8px;"></div>`;
      const mirror = (domain, opts, source) => {
        const input = Inputs.range(domain, opts);
        Inputs.bind(input, source, invalidation);
        box.appendChild(input);
      };
      mirror([0, 120], { label: 'Straddle (deg)', step: 5 }, straddleInput);
      mirror([0.8, 3.2], { label: 'Shoulder strength (Nm/kg)', step: 0.05 }, strengthInput);
      mirror([80, 150], { label: 'Wrist extension max', step: 1 }, inRomWrist);
      mirror([120, 185], { label: 'Shoulder flexion max', step: 1 }, inRomShoulder);
      mirror([40, 130], { label: 'Hip flexion max, straight knee', step: 1 }, inRomHip);
      return box;
    })();
    // The two ways out of the corridor are different failures and want naming
    // where they are seen, not in prose underneath. Alphas match the marks so
    // the swatches read the same against either theme.
    const swatch = (fill, text) => html`<span style="margin-right:16px; white-space:nowrap;"><span style="display:inline-block; width:.8em; height:.8em; background:${fill}; vertical-align:-.05em; margin-right:.35em;"></span>${text}</span>`;
    const corridorFigure = html`<figure class="wide-figure">
      ${corridorSlot}
      <small style="display:block; opacity:.85; margin-top:2px;">${swatch('rgba(154,160,166,0.3)', 'needs more strength')}${swatch('rgba(111,134,198,0.3)', 'needs more range of motion')}</small>
      ${corridorLimits}
      <figcaption>Hover the map to see the body each cell stands for. Every cell is a pose that balances over the palm with straight, symmetric legs; the colored corridor is the part this body can hold, shaded by how much of the hardest-worked joint it takes. Red rings name the joint that makes a pose impossible: solid for torque, dashed for range of motion. The controls are mirrors of the ones at the top of the page.</figcaption>
    </figure>`;
    display(corridorFigure);

    // The map is redrawn at whatever width the figure ends up with. Width is
    // quantised to 20 px and measured on the FIGURE, never on the slot the
    // map is drawn into, so a redraw cannot change the thing being observed
    // and start a loop. Plot has no reflow of its own; a resize means
    // rebuilding the chart, and a chart is 1760 rects, so the quantisation is
    // what keeps a window drag from thrashing.
    // FLOOR, not round. Rounding to the nearest 20 overshoots the real width
    // whenever the remainder is 10 or more, the map and the body are then
    // sized to a row wider than the one holding them, and the flex row wraps
    // the body underneath. Which way it rounds alternates as the window
    // resizes, so the layout appeared to wrap and unwrap at random.
    const quantise = (w) => Math.floor(w / 20) * 20;
    const corridorWidth = Generators.observe((notify) => {
      // Notify ONLY when the quantised width actually changes. A generator
      // yield re-runs its dependents whether or not the value differs, and a
      // ResizeObserver fires on height as well as width -- so probing the map
      // moved the caption text, the caption's line count changed the figure's
      // height, the observer fired, and the map was rebuilt underneath the
      // finger that was drawing it. The captured pointer went with the old
      // svg, so the first touch on a cell whose verdict wrapped differently
      // was also the last: no pointermove ever arrived again.
      let last = null;
      const measure = () => {
        const w = quantise(corridorFigure.clientWidth || 640);
        if (w > 0 && w !== last) { last = w; notify(w); }
      };
      const ro = new ResizeObserver(measure);
      ro.observe(corridorFigure);
      measure();
      return () => ro.disconnect();
    });
  </script>
  <script id="press-corridor" type="text/x-typescript">
    const corridorView = (() => {
      const cacheKey = JSON.stringify([romInfo, model.heightM, model.massKg, model.straddleDeg, shoulderNmPerKg]);
      if (poseState.corridorCache.key !== cacheKey) {
        // Sampling shoulders below zero costs a band of cells that fail for a
        // reason that has nothing to do with pressing: the shoulder simply does
        // not extend past overhead. It also caught the reference handstand,
        // which snapped to shoulder -0.6 deg and read back as anatomically
        // illegal.
        poseState.corridorCache.grid = pressCorridor(model, romInfo, strengthProf, ws, { nHip: 44, nShoulder: 40, shoulderLoDeg: 0 });
        poseState.corridorCache.key = cacheKey;
      }
      const g = poseState.corridorCache.grid;
      const cells = [];
      const dHip = g.hipDeg[1] - g.hipDeg[0], dSh = g.shoulderDeg[1] - g.shoulderDeg[0];
      for (let i = 0; i < g.nHip; i++) {
        for (let j = 0; j < g.nShoulder; j++) {
          const idx = i * g.nShoulder + j;
          if (Number.isNaN(g.wristNeededDeg[idx])) continue;
          cells.push({
            x1: g.hipDeg[i] - dHip / 2, x2: g.hipDeg[i] + dHip / 2,
            y1: g.shoulderDeg[j] - dSh / 2, y2: g.shoulderDeg[j] + dSh / 2,
            util: g.utilization[idx],
            feasible: g.feasible[idx] === 1,
            tooStrong: g.utilization[idx] > 1,
          });
        }
      }
      const D2R = Math.PI / 180;
      // Split the figure between the map and the body it stands for. The
      // probe grows with the figure but not without bound: past about 260 px
      // a stick body gains nothing and the map loses area.
      // Below about 560 px there is not enough width for both, and squeezing
      // the map to fit the body beside it leaves neither readable. Give the
      // map the full width and let the flex row wrap the body underneath.
      const figW = Math.max(320, corridorWidth);
      const stacked = figW < 560;
      // GAP is the flex gap this row actually uses; the two children plus the
      // gap have to come to no more than the row, or it wraps.
      const GAP = 12;
      const probeW = stacked ? 156 : Math.round(Math.min(260, Math.max(180, 0.24 * figW)));
      const chartW = stacked ? figW : figW - probeW - GAP;
      const chartH = Math.round(Math.min(460, Math.max(300, 0.62 * chartW)));
      const chart = Plot.plot({
        width: chartW,
        height: chartH,
        marginLeft: 44,
        x: { label: 'hip flexion (deg)' },
        y: { label: 'shoulder closing (deg)' },
        color: { label: 'peak strength used', scheme: 'ylorrd', domain: [0, 1.2], legend: true },
        marks: [
          Plot.rect(cells.filter((d) => !d.feasible && d.tooStrong), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: '#9aa0a6', fillOpacity: 0.3 }),
          Plot.rect(cells.filter((d) => !d.feasible && !d.tooStrong), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: '#6f86c6', fillOpacity: 0.3 }),
          Plot.rect(cells.filter((d) => d.feasible), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: 'util' }),
        ],
      });
      // A cell of this map IS a pose: fix hip and shoulder, then solve the
      // whole-body lean that puts the center of mass over the palm. Hovering
      // shows that body, which is the only way the axes mean anything.
      const targetX = model.patch.x0 + HANDSTAND_TARGET_FRAC * (model.patch.x1 - model.patch.x0);
      const poseAt = (hipDeg, shDeg) => {
        const q = new Float64Array(model.nq);
        groundHand(model, q);
        q[4] = shDeg * D2R;
        q[5] = q[7] = hipDeg * D2R;
        const wr = solveWristForCom(model, q, ws, targetX);
        if (Number.isNaN(wr)) return null;
        q[3] = wr;
        return q;
      };
      const probe = makePoseProbe({
        w: probeW, h: Math.round(probeW * 1.41),
        view: { cx: -0.15, yLo: -0.15, yHi: 2.15 },
      });
      const nearest = (arr, v) => {
        let bi = 0;
        for (let i = 1; i < arr.length; i++) if (Math.abs(arr[i] - v) < Math.abs(arr[bi] - v)) bi = i;
        return bi;
      };
      // Which joint is the problem, not merely that there is one. Recomputing
      // the static torques for one pose is cheap, and it is the difference
      // between "too strong to hold" and knowing it is the shoulder.
      const JOINT_KEYS = ['wrist', 'shoulder', 'hipL', 'kneeL', 'hipR', 'kneeR'];
      const offendingJoints = (q) => {
        if (!q) return null;
        const marks = {};
        const st = staticAnalysis(model, q, ws);
        for (let k = 0; k < 6; k++) {
          const jj = 3 + k;
          const { lo, hi } = jointLimits(romInfo, q, jj);
          if (q[jj] < lo - 1e-9 || q[jj] > hi + 1e-9) { marks[jj] = 'rom'; continue; }
          const t = st.tau[jj];
          if (Math.abs(t) > availableTorque(strengthProf[JOINT_KEYS[k]], t, 0)) marks[jj] = 'strength';
        }
        return Object.keys(marks).length ? marks : null;
      };
      const showCorridor = (hipDeg, shDeg) => {
        const i = nearest(g.hipDeg, hipDeg), j = nearest(g.shoulderDeg, shDeg);
        const idx = i * g.nShoulder + j;
        const q = poseAt(g.hipDeg[i], g.shoulderDeg[j]);
        const util = g.utilization[idx];
        const verdict = !q || Number.isNaN(util)
          ? 'cannot be balanced over the palm at any lean'
          : g.feasible[idx]
            ? `holdable, using ${(util * 100).toFixed(0)}% of the hardest-worked joint`
            : util > 1
              ? `needs ${(util * 100).toFixed(0)}% of a joint's strength: too strong to hold`
              : 'outside a flexibility limit';
        poseState.corridorHover = { hipDeg: g.hipDeg[i], shoulderDeg: g.shoulderDeg[j] };
        probe.draw(q, `hip ${g.hipDeg[i].toFixed(0)}°, shoulder ${g.shoulderDeg[j].toFixed(0)}° — ${verdict}`,
          offendingJoints(q));
      };
      // Opens on the straight handstand, the one pose in here everybody can
      // already picture, so the probe starts with a body rather than blank --
      // or on whatever the reader was last looking at, since a width change
      // rebuilds this whole cell.
      showCorridor(poseState.corridorHover.hipDeg, poseState.corridorHover.shoulderDeg);
      // touch-action goes on the HTML box around the chart, not on the svg:
      // an svg node does not reliably honour it, and without it a touch drag
      // scrolls the page as well as probing, which fires pointercancel and
      // kills the gesture halfway. Scrolling also resizes the figure on a
      // phone, which rebuilds this cell -- the reason the probe used to snap
      // back to the straight handstand the moment you touched the map.
      const chartBox = html`<div style="touch-action:none;">${chart}</div>`;
      const surface = plotSurface(chart, chartH);
      if (surface) {
        let tracking = null;
        const probeAt = (e) => {
          const r = surface.getBoundingClientRect();
          const hx = chart.scale('x').invert(e.clientX - r.left);
          const sy = chart.scale('y').invert(e.clientY - r.top);
          if (Number.isFinite(hx) && Number.isFinite(sy)) showCorridor(hx, sy);
        };
        surface.addEventListener('pointerdown', (e) => {
          tracking = e.pointerId;
          surface.setPointerCapture?.(e.pointerId);
          probeAt(e);
        });
        surface.addEventListener('pointermove', (e) => {
          // A mouse probes on hover; a finger only while it is down.
          if (e.pointerType === 'mouse' || tracking === e.pointerId) probeAt(e);
        });
        const release = (e) => {
          if (tracking !== e.pointerId) return;
          surface.releasePointerCapture?.(e.pointerId);
          tracking = null;
        };
        surface.addEventListener('pointerup', release);
        surface.addEventListener('pointercancel', release);
      }

      return html`<div style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;">
        ${chartBox}
        ${probe.element}
      </div>`;
    })();
    corridorSlot.replaceChildren(corridorView);
  </script>
  <script id="dynamics-section" type="text/markdown">
    ## Making it move

    To move, the model becomes a floating body: the hand is not attached to the floor, it rests on it, on one-sided spring contacts under the heel of the palm and the finger pads, with one under each foot. The center of pressure and every toppling failure emerge from those two palm contacts trading load.

    Joints are driven by servo torques tracking a reference trajectory, capped by a Yeadon-King torque-velocity envelope and a fifty millisecond activation lag, so torque cannot step. Range of motion is enforced by passive end-stops built like the ground contacts one dimension down, and the servo reads its damping off the mass matrix, because these six joints span an effective inertia of two hundred to one.
  </script>
  <script id="sim-controls-cell" type="text/x-typescript">
    const simControls = html`<div class="sim-controls"></div>`;
    // One entry per skill, named plainly, plus whatever the optimizer last
    // produced. The rest of the registry in runs/ is not a menu: it is the
    // regression net the artifact suite replays, and offering every superseded
    // attempt as something to watch was a filmstrip of near-identical falls.
    // The press is deliberately labelled with the shoulder it needs, because
    // picking it quietly swaps in a stronger body than the default.
    const scenarioNames = {
      hold: 'Hold a handstand',
      ...(PRESET_TRAJECTORIES.lunge ? { 'lunge-opt': 'Kick-up' } : {}),
      ...(PRESET_TRAJECTORIES.tuck ? { 'tuck-opt': 'Bent-leg press (2.2 Nm/kg shoulder)' } : {}),
      ...(PRESET_TRAJECTORIES.pike ? { 'pike-opt': 'Press, straight legs (needs 2.8 Nm/kg)' } : {}),
      live: 'Latest optimizer result',
    };
    const scenarioKeys = Object.keys(scenarioNames);
    const scenarioInput = Inputs.select(scenarioKeys, {
      label: 'Scenario',
      format: (v) => scenarioNames[v],
      // Opens on the kick-up. Holding a handstand is the one scenario where
      // essentially nothing moves, so it made a poor first thing to watch;
      // it stays in the menu as the baseline it is.
      value: scenarioKeys.includes('lunge-opt') ? 'lunge-opt' : scenarioKeys[0],
    });
    simControls.appendChild(scenarioInput);
    const scenario = Generators.input(scenarioInput);
    display(simControls);
  </script>
  <script id="sim-run" type="text/x-typescript">
    const simResult = (() => {
      const sel = scenario || 'hold';
      let base = sel, knots = null, T = 1.2;
      let prof = strengthProf, rom = { ...ROM_DEFAULTS }, config = {};
      // Artifacts replay under EXACTLY what they were made with: their
      // recorded strength, flexibility, and plant/controller config, never
      // the current sliders or defaults. History does not get rewritten.
      const fromPreset = (p) => {
        base = p.scenario;
        knots = p.knots.map((k) => Float64Array.from(k));
        T = p.T;
        if (p.strength) prof = strengthProfile(model.massKg, { overrides: p.strength });
        rom = resolveRom(p.rom);
        config = resolveConfig(p.config);
      };
      if (sel === 'lunge-opt') fromPreset(PRESET_TRAJECTORIES.lunge);
      else if (sel === 'tuck-opt') fromPreset(PRESET_TRAJECTORIES.tuck);
      else if (sel === 'pike-opt') fromPreset(PRESET_TRAJECTORIES.pike);
      else if (sel === 'live') {
        if (optState.adopted) fromPreset(optState.adopted);
        else base = 'hold';
      }
      return { ...runScenario(model, ws, prof, { scenario: base, knots, T, settleT: 2.5, rom, ...config }), prof };
    })();
  </script>
  <script id="playback-state" type="text/x-typescript">
    const playState = {
      sim: null, t: 0, playing: true, speed: 1,
      dirty: true, theme: null, lastNow: null,
      viewW: 640, viewH: 480, ui: { expanded: false },
    };
  </script>
  <script id="sim-into-state" type="text/x-typescript">
    playState.sim = simResult;
    playState.t = 0;
    playState.playing = true;
    playState.lastNow = null;
    playState.dirty = true;
  </script>
  <script id="playback-figure" type="text/x-typescript">
    const playStack = createElementStack({
      layers: [{ id: 'sim', element: ({ current }) => current || document.createElement('canvas') }],
    });

    const playRow = html`<div style="display:flex; gap:8px; align-items:center; margin:4px 0;"></div>`;
    const playButton = html`<button style="min-width:64px;">Pause</button>`;
    const timeLabel = html`<span style="font-variant-numeric: tabular-nums;"></span>`;
    const scrubInput = html`<input type="range" min="0" max="1" step="0.001" value="0" style="flex:1;">`;
    playRow.append(playButton, scrubInput, timeLabel);
    playButton.addEventListener('click', () => {
      playState.playing = !playState.playing;
      playState.lastNow = null;
      playButton.textContent = playState.playing ? 'Pause' : 'Play';
    });
    scrubInput.addEventListener('input', () => {
      const rec = playState.sim?.rec;
      if (!rec) return;
      playState.playing = false;
      playButton.textContent = 'Play';
      playState.t = +scrubInput.value * rec.t[rec.t.length - 1];
      playState.dirty = true;
    });

    // The transport lives with the scenario picker rather than under the
    // canvas, so it follows the rest of the controls into the floating panel
    // when the figure is expanded. This cell re-runs on resize and builds a
    // fresh row each time, so the old one has to go with the old cell.
    simControls.appendChild(playRow);
    invalidation.then(() => playRow.remove());

    const utilColor = (u, isDark) => {
      const uu = Math.min(Math.max(u, 0), 1);
      return `hsl(${210 * (1 - uu)}, ${40 + 45 * uu}%, ${isDark ? 62 : 42}%)`;
    };

    const stopPlayTheme = observeTheme((t) => { playState.theme = t; playState.dirty = true; });
    invalidation.then(stopPlayTheme);

    const playLoop = createFrameLoop((now) => {
      const sim = playState.sim;
      if (!sim) return;
      const rec = sim.rec;
      const Tend = rec.t[rec.t.length - 1];
      if (playState.playing) {
        if (playState.lastNow !== null) {
          playState.t += ((now - playState.lastNow) / 1000) * playState.speed;
          if (playState.t > Tend) playState.t = 0;
        }
        playState.lastNow = now;
        playState.dirty = true;
      }
      if (!playState.dirty) return;
      playState.dirty = false;

      const k = Math.min(rec.t.length - 1, Math.round(playState.t / (rec.dt * rec.stride)));
      const q = rec.q[k];
      const isDark = playState.theme?.isDark ?? false;

      // Per-joint utilization colors the segment each joint drives, against
      // the strength profile the run was simulated with.
      const keys = ['wrist', 'shoulder', 'hipL', 'kneeL', 'hipR', 'kneeR'];
      const profNow = sim.prof || strengthProf;
      const segmentColors = [null, null, null, null, null, null, null];
      for (let j = 0; j < 6; j++) {
        const tauApplied = rec.tauApplied[k][j];
        const cap = availableTorque(profNow[keys[j]], tauApplied, rec.qd[k][3 + j]);
        segmentColors[1 + j] = utilColor(Math.abs(tauApplied) / Math.max(cap, 1e-6), isDark);
      }

      const f = rec.forces[k];
      const forces = [];
      let copX, fySum = 0, fyX = 0;
      if (f) {
        for (let i = 0; i < f.fy.length; i++) {
          if (f.fy[i] > 1) forces.push({ x: f.px[i], y: 0, fx: f.fx[i], fy: f.fy[i] });
          if (i < 2) { fySum += f.fy[i]; fyX += f.fy[i] * f.px[i]; }
        }
        copX = fySum > 1 ? fyX / fySum : undefined;
      }

      const canvas = playStack.elements.sim;
      const ctx = canvas.getContext('2d');
      const view = { cx: 0.15, yLo: -0.18, yHi: 2.3 };
      ctx.save();
      ctx.scale(devicePixelRatio, devicePixelRatio);
      drawScene(ctx, {
        model, ws, q: Float64Array.from(q),
        width: playState.viewW, height: playState.viewH,
        theme: playState.theme,
        segmentColors, forces, copX,
        comTrail: rec.com.slice(0, k + 1),
        view,
      });
      ctx.restore();

      scrubInput.value = playState.t / Tend;
      timeLabel.textContent = `${playState.t.toFixed(2)}s`;
    });
    invalidation.then(() => playLoop.cancel());

    const playFigure = html`<figure>
      ${playStack.element}
      <figcaption>Segments are colored by strength used at that joint, blue (idle) to red (at the voluntary torque cap). Orange arrows are ground reaction forces; the blue dot on the floor is the center of pressure; the dashed curve is the center of mass trail.</figcaption>
    </figure>`;

    display(expandable(playFigure, {
      id: 'simulation-playback',
      width: Math.min(width, 640),
      height: Math.min(500, width * 0.8),
      controls: '.sim-controls',
      state: playState.ui,
      onResize(el, w, h) {
        playStack.resize(w, h);
        const dpr = devicePixelRatio;
        const canvas = playStack.elements.sim;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;
        playState.viewW = w;
        playState.viewH = h;
        playState.dirty = true;
      },
    }));
  </script>
  <script id="optimizer-section" type="text/markdown">
    ## Finding the easiest way up

    A candidate technique is spline knots for each of the six joints plus a duration — thirty seven numbers — scored by a physics rollout: did it arrive at a balanced handstand, how much of the strength envelope did it burn, how much metabolic work did it spend, did it break a flexibility limit, did it fall. CMA-ES climbs that score.

    Every run in the menu is re-simulated in the browser from its stored knots rather than replayed as an animation, so if a run looks wrong it is wrong, whatever its cost says.
  </script>
  <script id="opt-state" type="text/x-typescript">
    const optState = {
      worker: null, running: false, history: [],
      latest: null, result: null, adopted: null, body: null, poolSize: null,
      // The most recently finished generation, as candidate trajectories the
      // optimizer already simulated. ghostRev only ever increments, and the
      // playback loop compares it against what it is currently showing, so a
      // new generation is picked up at a loop boundary rather than mid-swing.
      ghosts: null, ghostRev: 0,
      rev: 0, notify: null,
    };
  </script>
  <script id="opt-controls-cell" type="text/x-typescript">
    const optControls = html`<div class="opt-controls"></div>`;
    const optScenarioNames = {
      lunge: 'Kick-up (from lunge)',
      tuck: 'Bent-leg press (from a tucked fold)',
      pike: 'Press (from pike)',
    };
    const optGens = Inputs.range([20, 400], { label: 'Generations', value: 120, step: 10 });
    const optSeed = Inputs.range([1, 99], { label: 'Seed', value: 7, step: 1 });
    // The body the search scores against, set here rather than inherited
    // from sliders in another section. Choosing a seed FILLS THESE IN with
    // the body that seed was built for; editing them afterwards is the whole
    // point, because a technique only survives being walked onto a weaker
    // body in small steps. One jump lands in a basin where every candidate
    // falls; a sequence of small ones lets the technique adapt, which is how
    // it starts paying for a weaker shoulder with more momentum off the floor.
    const optShoulder = Inputs.range([0.8, 3.2], { label: 'Shoulder (Nm/kg)', value: STRENGTH_DEFAULTS.shoulder.t0Vol, step: 0.05 });
    const optHam = Inputs.range([40, 140], { label: 'Hamstrings (deg)', value: ROM_DEFAULTS.hipFlexStraightKneeMaxDeg, step: 1 });
    // The two mobility limits an entry actually spends: how far the shoulder
    // opens overhead, and how far the wrist extends before the body is out
    // over its fingertips. Both bound the reference knots directly, so
    // lowering one takes technique away from the search rather than merely
    // charging it a penalty afterwards.
    const optRomShoulder = Inputs.range([120, 185], { label: 'Shoulder flexion max (deg)', value: ROM_DEFAULTS.shoulderFlexMaxDeg, step: 1 });
    const optRomWrist = Inputs.range([80, 150], { label: 'Wrist extension max (deg)', value: ROM_DEFAULTS.wristExtMaxDeg, step: 1 });
    const optTHi = Inputs.range([1.0, 3.5], { label: 'Max entry duration (s)', value: 3.0, step: 0.1 });
    const optBodyNote = html`<small style="display:block; opacity:.8; margin:2px 0 0;"></small>`;

    // Every dimension of the body the search scores against, paired with the
    // field it reads out of a seed's recorded body. One table drives both
    // filling the inputs in from a seed and reporting how far they have since
    // been moved away from it.
    const BODY_FIELDS = [
      { input: optShoulder, read: (r) => r.strength?.shoulder?.t0Vol, name: 'shoulder', unit: ' Nm/kg', digits: 2 },
      { input: optHam, read: (r) => r.rom?.hipFlexStraightKneeMaxDeg, name: 'hamstrings', unit: '°', digits: 0 },
      { input: optRomShoulder, read: (r) => r.rom?.shoulderFlexMaxDeg, name: 'shoulder flexion', unit: '°', digits: 0 },
      { input: optRomWrist, read: (r) => r.rom?.wristExtMaxDeg, name: 'wrist extension', unit: '°', digits: 0 },
    ];

    // Seeds are the stored techniques plus anything saved from a run in this
    // session. A saved case carries its own body and its own knots, so
    // continuing from it resumes exactly where the last search stopped.
    const savedCases = [];
    const seedSlot = html`<div></div>`;
    let seedOptions = [], seedInput = null;

    const currentSeed = () => {
      const o = seedOptions[seedInput ? +seedInput.value : 0];
      if (!o) return null;
      return o.kind === 'preset'
        ? { scenario: o.key, run: PRESET_TRAJECTORIES[o.key], label: o.label }
        : { scenario: savedCases[o.index].scenario, run: savedCases[o.index], label: o.label };
    };
    const applySeedBody = () => {
      const run = currentSeed()?.run;
      for (const f of (run ? BODY_FIELDS : [])) {
        const v = f.read(run);
        if (v === undefined) continue;
        f.input.value = v;
        f.input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      describeBody();
      showSeedGhost();
    };
    // select: which option to leave chosen. Given one, the body inputs are
    // filled in from it as though it had been picked by hand, which is what
    // makes saving a run and continuing from it one step instead of three.
    // Selecting a starting point draws it, in the same place a generation of
    // candidates appears: the seed is the technique the next search
    // continues from, so it belongs on screen while you decide how far to
    // move the body away from it. One rollout on the seed's own plant and
    // body, thinned to a loop's worth of frames.
    const GHOST_FRAMES = 48;
    const showSeedGhost = () => {
      if (optState.running) return;
      const c = currentSeed();
      const run = c?.run;
      if (!run?.knots) return;
      try {
        const r = runScenario(model, ws,
          strengthProfile(model.massKg, { overrides: run.strength || {} }), {
            scenario: c.scenario,
            knots: run.knots.map((k) => Float64Array.from(k)),
            T: run.T,
            settleT: 1.2,
            dt: 5e-4,
            rom: resolveRom(run.rom),
            ...resolveConfig(run.config),

          seed: c.label,

            frames: Array.from({ length: GHOST_FRAMES },
              (_, i) => r.rec.q[Math.round(i * (n - 1) / (GHOST_FRAMES - 1))]),
            success: r.verdict.success,
            cost: run.recordedCost ?? null,
          }],
        };

        optState.rev++;
        optState.notify?.(optState);
      } catch (err) {
        console.warn('seed preview failed', err);
      }
    };

    const rebuildSeeds = (select = null) => {
      seedOptions = [
        ...Object.keys(optScenarioNames).map((k) => ({ kind: 'preset', key: k, label: `stored ${optScenarioNames[k]}` })),
        ...savedCases.map((c, i) => ({ kind: 'saved', index: i, label: `saved: ${c.label}` })),
      ];
      const keep = select ?? (seedInput ? Math.min(+seedInput.value, seedOptions.length - 1) : 0);
      seedInput = Inputs.select(seedOptions.map((_, i) => i), {
        label: 'Start from', value: keep, format: (i) => seedOptions[i].label,
      });

      seedSlot.replaceChildren(seedInput);
      if (select !== null) applySeedBody();
    };

    const resolveBody = () => {
      const c = currentSeed();
      return {
        scenario: c?.scenario ?? 'lunge',
        seedRun: c?.run ?? null,
        strengthOpts: { overrides: { shoulder: { t0Vol: +optShoulder.value }, wrist: { t0Vol: 0.85 } } },
        romOverrides: {
          ...poseState.rom,
          hipFlexStraightKneeMaxDeg: +optHam.value,
          shoulderFlexMaxDeg: +optRomShoulder.value,
          wristExtMaxDeg: +optRomWrist.value,
        },
        tHi: +optTHi.value,
      };
    };
    const describeBody = () => {
      const run = currentSeed()?.run;
      const moved = [];
      for (const f of (run ? BODY_FIELDS : [])) {
        const seedV = f.read(run);
        if (seedV === undefined) continue;

        if (Math.abs(d) > 1e-6) moved.push(`${f.name} ${d >= 0 ? '+' : ''}${d.toFixed(f.digits)}${f.unit}`);
      }

        ? `Continuing onto a different body: ${moved.join(', ')} from what this technique was built `
          + `for. Small steps adapt; large ones start from a fall.`
        : `Scoring against the body this technique was built for.`;
    };

    optControls.append(seedSlot, optShoulder, optHam, optRomShoulder, optRomWrist,
      optTHi, optGens, optSeed, optBodyNote);
    for (const f of BODY_FIELDS) f.input.addEventListener('input', describeBody);
    optTHi.addEventListener('input', describeBody);
    rebuildSeeds();
    applySeedBody();

    const optRow = html`<div style="display:flex; gap:6px; align-items:center; margin-top:6px;"></div>`;
    const optRun = html`<button>Run optimization</button>`;
    const optStop = html`<button disabled>Stop</button>`;
    const optAdopt = html`<button disabled>Send result to playback</button>`;
    const optSave = html`<button disabled>Save as a starting point</button>`;
    optRow.append(optRun, optStop, optAdopt, optSave);
    // Saving a result puts it in the seed list with the body it was scored
    // against, so a technique can be walked down in steps: save at 1.6, seed
    // from it, drop the shoulder to 1.55, run, save again. Each step is a
    // small one, which is the only way the technique survives.
    optSave.addEventListener('click', () => {
      const r = optState.result;
      if (!r) return;
      const sh = r.strength?.shoulder?.t0Vol ?? optShoulder.value;
      savedCases.push({
        label: `${r.scenario} @ ${(+sh).toFixed(2)} Nm/kg`
          + (r.stopped ? ` (gen ${r.gen})` : '') + ` \u2014 cost ${(r.fineCost ?? r.best).toFixed(2)}`,
        scenario: r.scenario, knots: r.knots, T: r.T, strength: r.strength, rom: r.rom,
        config: r.config,

    }
    optRun.addEventListener('click', () => {
      optCleanup();
      optState.history = [];
      optState.result = null;
      optState.latest = null;
      optState.running = true;
      optRun.disabled = true;
      optStop.disabled = false;
      optAdopt.disabled = true;
      optSave.disabled = true;
      const worker = new Worker(new URL('./opt-worker.js', import.meta.url), { type: 'module' });

      worker.onerror = (err) => {
        console.error('optimizer worker error', err.message);

        optState.rev++;
        optState.notify?.(optState);
      };
      worker.onmessage = ({ data }) => {
        if (data.type === 'pool') {
          optState.poolSize = data.size;
        } else if (data.type === 'progress') {
          optState.history.push({ gen: data.gen, best: data.best });
          optState.latest = data;
          if (data.generation?.length) {
            optState.ghosts = { gen: data.gen, poses: data.generation };
            optState.ghostRev++;
          }
        } else if (data.type === 'done') {
          // The worker reports the plant its rollouts ran on; keeping it is
          // what lets playback replay a result on the machine that produced
          // it. Without it, playback resolved an unrecorded plant to the
          // LEGACY one -- no braking, no inertia-scaled damping, no
          // end-stops, the old start pose -- and the run fell on its face.
          optState.result = { ...data, ...optState.body, config: data.plant };
          optCleanup();
          optAdopt.disabled = false;
          optSave.disabled = false;
        }
        optState.rev++;
        optState.notify?.(optState);
      };
      // A search from scratch does not find an entry in any budget this
      // button offers, so every run continues an existing technique. What
      // makes it a continuation rather than a doomed transplant is that the
      // body is set here and starts equal to the seed's own.
      const resolved = resolveBody();
      const { seedRun, strengthOpts, romOverrides } = resolved;
      // Carried onto the result so that adopting or re-seeding a run uses the
      // body it was optimised for. Without this, a press optimised at 2.8
      // Nm/kg went to playback and collapsed on a 1.6 Nm/kg body.
      //
      optState.body = {
        scenario: resolved.scenario, strength: strengthOpts.overrides, rom: romOverrides,
      };
      worker.postMessage({
        type: 'optimize',
        scenario: resolved.scenario,
        seed: optSeed.value,
        maxGen: optGens.value,
        x0: seedRun
          ? Array.from(encodeDecision(seedRun.knots.map((k) => Float64Array.from(k)), seedRun.T))
          : null,
        // Measured, not guessed: perturbing a warm start by sigma in radians
        // on every knot of every joint at once, the fraction of a 14-candidate
        // generation that still reaches a handstand runs 0/14 at 0.10, 4/14 at
        // 0.05, 12/14 at 0.02 and 14/14 at 0.01. At 0.10 the first generation
        // wiped out the entire population and the search spent the rest of its
        // budget choosing between falls.
        sigma0: seedRun ? 0.02 : undefined,
        tHi: resolved.tHi,
        modelParams: { heightM, massKg, straddleDeg, sex },
        strengthOpts,
        romOverrides,
      });
      optState.rev++;
      optState.notify?.(optState);
    });
    optStop.addEventListener('click', () => {
      // Stopping keeps the best technique found so far rather than throwing
      // the search away. The progress message carries the incumbent's knots
      // and duration, so there is always something to keep; it just has not
      // been re-scored at the fine timestep the way a completed run is.
      if (optState.latest) {
        optState.result = {
          ...optState.latest, ...optState.body, stopped: true,
        };
        optAdopt.disabled = false;
        optSave.disabled = false;
      }
      optCleanup();
      optState.rev++; optState.notify?.(optState);
    });
    optAdopt.addEventListener('click', () => {
      if (!optState.result) return;
      optState.adopted = optState.result;
      scenarioInput.value = 'live';
      scenarioInput.dispatchEvent(new Event('input', { bubbles: true }));
    });
    invalidation.then(optCleanup);
    display(optControls);
  </script>
  <script id="opt-observable" type="text/x-typescript">
    const optInfo = Generators.observe((notify) => {
      optState.notify = notify;
      notify(optState);
      return () => { if (optState.notify === notify) optState.notify = null; };
    });
  </script>
  <script id="opt-preview" type="text/x-typescript">
    // The generation the optimizer just finished, drawn where the optimizer
    // is. Every one of these bodies is a candidate that was simulated and
    // scored to produce the number on the chart below; none of them is a
    // fresh rollout, and none is a projection of what the search might do.
    // The cheapest member of the generation is the dark one.
    const optPreview = (() => {
      const W = Math.min(width, 640), H = 330;
      // Room below the floor line: the model has contacts only under the palms
      // and toes, so a candidate that topples has nothing to land on and
      // keeps going. Showing that honestly beats cropping it out of frame.
      const VIEW = { cx: 0.15, yLo: -0.55, yHi: 2.25 };
      const canvas = html`<canvas style="width:${W}px; height:${H}px;"></canvas>`;
      canvas.width = Math.round(W * devicePixelRatio);
      canvas.height = Math.round(H * devicePixelRatio);
      const note = html`<figcaption></figcaption>`;
      const ctx = canvas.getContext('2d');

      let theme = null;
      const stopTheme = observeTheme((t) => { theme = t; });
      invalidation.then(stopTheme);

      // One pass of the loop is one generation. A newer generation is picked
      // up when the pass ends, so what is on screen is always a single
      // generation and always one that finished.
      const LOOP_S = 3.2;
      let shown = null, shownRev = -1, t0 = null;
      const loop = createFrameLoop((now) => {
        if (t0 === null) t0 = now;
        let u = ((now - t0) / 1000) / LOOP_S;
        // A generation is swapped in at a loop boundary, so what is on screen
        // is always a single generation and always one that finished. A seed
        // preview is the answer to a click and swaps in at once.
        const pending = optState.ghostRev !== shownRev;
        if (pending && (u >= 1 || !shown || optState.ghosts?.seed)) {
          shown = optState.ghosts; shownRev = optState.ghostRev;
          t0 = now; u = 0;
        } else if (u >= 1) {
          t0 = now; u = 0;
        }
        ctx.save();
        ctx.scale(devicePixelRatio, devicePixelRatio);
        ctx.clearRect(0, 0, W, H);
        // Floor, so the fallen candidates read as fallen.
        const floorY = H - (0 - VIEW.yLo) * (H / (VIEW.yHi - VIEW.yLo));
        const fg = theme?.foreground || [0.11, 0.12, 0.14];
        const rgb = fg.map((v) => Math.round(v * 255)).join(',');
        ctx.fillStyle = `rgba(${rgb},0.05)`;
        ctx.fillRect(0, floorY, W, H - floorY);
        ctx.strokeStyle = `rgba(${rgb},0.45)`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(W, floorY); ctx.stroke();
        const poses = shown?.poses;
        if (poses?.length) {
          drawGhosts(ctx, {
            model, ws, width: W, height: H, theme,
            view: VIEW,
            // One figure wants to be solid; thirty overlaid want to be faint.
            alpha: shown.seed ? 0.34 : 0.16,
            // Filtered, because this is a frame loop reading state another
            // cell owns: a pose list caught half-built must skip a frame, not
            // kill the loop and take the figure with it.
            poses: poses.map((p, i) => ({
              q: p.frames?.[Math.min(p.frames.length - 1, Math.round(u * (p.frames.length - 1)))],
              weight: i === 0 ? 2.6 : 1,
            })).filter((p) => p.q),
          });
          if (shown.seed) {
            note.textContent = `Starting point: ${shown.seed}`
              + (poses[0].cost != null ? ` \u2014 cost ${poses[0].cost.toFixed(2)}` : '')
              + `. Run the optimizer to replace this with the generation it is working on.`;
          } else {
            const failed = poses.filter((p) => !p.success).length;
            note.textContent = `Generation ${shown.gen}: ${poses.length} candidates, `
              + `${poses.length - failed} reaching a handstand, ${failed} falling. `
              + `Best cost ${poses[0].cost.toFixed(2)}. The dark figure is the best of them.`;
          }
        } else {
          note.textContent = optState.running
            ? 'Waiting for the first generation to finish.'
            : 'Run the optimizer to watch a generation of candidates at once.';
        }
        ctx.restore();
      });
      invalidation.then(() => loop.cancel());
      return html`<figure>${canvas}${note}</figure>`;
    })();
    display(optPreview);
  </script>
  <script id="opt-progress" type="text/x-typescript">
    const optProgress = (() => {
      if (!optInfo.history.length) {
        return html`<p><em>No optimization run yet. The playback presets above were computed with this exact machinery offline.</em></p>`;
      }
      const chart = Plot.plot({
        height: 180,
        x: { label: 'generation' },
        y: { label: 'best cost', type: 'log', grid: true },
        marks: [Plot.lineY(optInfo.history, { x: 'gen', y: 'best', stroke: '#4878b8' })],
      });
      let statusText;
      if (optInfo.running) {
        const last = optInfo.history[optInfo.history.length - 1];
        statusText = `running: generation ${last.gen}, best cost ${last.best.toFixed(2)}`
          + (optInfo.poolSize ? `, evaluating on ${optInfo.poolSize} worker${optInfo.poolSize > 1 ? 's' : ''}` : '');
      } else if (optInfo.result?.stopped) {
        statusText = `stopped at generation ${optInfo.result.gen}, keeping the best so far `
          + `(cost ${optInfo.result.best.toFixed(2)}, not re-scored at the fine timestep). `
          + `Send it to playback to watch it.`;
      } else if (optInfo.result) {
        const v = optInfo.result.verdict;
        statusText = `done: cost ${optInfo.result.fineCost.toFixed(2)} at fine timestep, `
          + (v.success ? 'reaches a settled handstand'
            : v.upright && v.over ? 'reaches the handstand with residual sway'
              : 'does not reach a stable handstand');
      } else {
        statusText = 'stopped';
      }
      return html`<figure>${chart}<figcaption>${statusText}</figcaption></figure>`;
    })();
    display(optProgress);
  </script>
  <script id="coda" type="text/markdown">
    ## What the model says

    - The kick-up goes at a shoulder rated 1.6 Nm/kg with average hamstrings. The straight-leg press on that same body collapses, and still collapses at 2.2; at 2.8 it works.
    - Hamstring flexibility does not decide whether the press happens, only what it costs. At 2.8 Nm/kg, hamstrings reaching 125 degrees score 1.03 against 2.53 for an ordinary 85 degree fold: the same skill for two and a half times less.
    - Bending the legs and hopping off them is worth about 0.6 Nm/kg: the bent-leg press goes at 2.2 where the straight-leg press needs 2.8. The search keeps finding entries down to 1.8, but below 2.2 they stop holding their verdict across the timestep range.

    The model is a two dimensional cartoon: merged arms, locked elbows, one rigid segment from shoulder to hip, no lateral balance, penalty friction, torque servos rather than muscles and tendons, and a search that finds good technique rather than best technique. Read the numbers as mechanisms and thresholds, not prescriptions.
  </script>
  <script id="validation-section" type="text/markdown">
    ## Validation

    The physics core is covered by offline gates (`node src/notebooks/handstand/test/dynamics.mjs` and friends): the dynamics against finite differences of the energy, momentum conservation in free fall, a textbook double pendulum, contact settling, the torque-curve landmarks, and the servo's arrival behavior. The cell below reruns a fast subset in your browser against the current model.
  </script>
  <script id="validation-checks" type="text/x-typescript">
    const validation = (() => {
      const zeroV = new Float64Array(model.nq);
      const checks = [];
      // Mass matrix symmetry and SPD at a bent pose.
      {
        const q = Float64Array.from(poseState.q);
        const M = new Float64Array(model.nq * model.nq);
        massMatrix(model, q, M, ws);
        let asym = 0;
        for (let i = 0; i < model.nq; i++) {
          for (let j = 0; j < model.nq; j++) asym = Math.max(asym, Math.abs(M[i * model.nq + j] - M[j * model.nq + i]));
        }
        checks.push({ name: 'mass matrix symmetric', ok: asym < 1e-9, detail: `max asymmetry ${asym.toExponential(1)}` });
      }
      // Static torques match finite differences of potential energy.
      {
        const q = Float64Array.from(poseState.q);
        const tau = new Float64Array(model.nq);
        rnea(model, q, zeroV, zeroV, tau, null, { ws });
        const eps = 1e-6;
        let worst = 0;
        for (let i = 3; i < model.nq; i++) {
          const qp = q.slice(); qp[i] += eps;
          const qm = q.slice(); qm[i] -= eps;
          const dV = (energy(model, qp, zeroV, ws).potential - energy(model, qm, zeroV, ws).potential) / (2 * eps);
          worst = Math.max(worst, Math.abs(tau[i] - dV));
        }
        checks.push({ name: 'static torques = dV/dq', ok: worst < 1e-5, detail: `max err ${worst.toExponential(1)} Nm` });
      }
      // Strength model landmarks.
      {
        const jp = strengthProf.shoulder;
        const iso = availableTorque(jp, 1, 0);
        const con = availableTorque(jp, 1, 8);
        const ecc = availableTorque(jp, -1, 8);
        checks.push({
          name: 'strength: eccentric > isometric > fast concentric',
          ok: ecc > iso && iso > con && con > 0,
          detail: `${ecc.toFixed(0)} / ${iso.toFixed(0)} / ${con.toFixed(0)} Nm`,
        });
      }
      // Total mass budget.
      {
        let m = 0;
        for (let i = 0; i < model.nb; i++) m += model.mass[i];
        checks.push({ name: 'segment masses sum to body mass', ok: Math.abs(m - model.massKg) < 1e-9, detail: `${m.toFixed(3)} kg` });
      }
      const rows = checks.map((c) => html`<div>${c.ok ? '✓' : '✗'} ${c.name} <small style="opacity:0.6">(${c.detail})</small></div>`);
      const allOk = checks.every((c) => c.ok);
      return html`<div style="font-variant-numeric: tabular-nums; ${allOk ? '' : 'color:#c0392b;'}">${rows}</div>`;
    })();
    display(validation);
  </script>
