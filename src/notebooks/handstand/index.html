  </script>
  <script id="intro" type="text/markdown">
    Why is pressing up to a handstand so much harder than kicking up to one? Ask around and you will collect a pile of explanations: not enough shoulder strength, tight shoulders, stiff wrists, short hamstrings, bad timing. Some of these are real constraints. Some, I suspect, are folklore. This notebook builds a small physics model of a handstand and uses it to find out which is which.

    The model is a two dimensional, side view rigid body model of a person balancing on their hands. It is deliberately simple, but it is quantitative: segment masses and lengths come from published anthropometric tables, joint strength comes from measured torque and velocity relationships, and every claim the notebook makes is something you can recompute by dragging a slider. This first part builds the model and works out the statics of holding a handstand. The dynamics of getting into one, the kick-up, the press, and the question of which limitations actually matter, build on top of it.
  </script>

  <script id="model-section" type="text/markdown">
    ## A stick figure gymnast

    The body is seven rigid segments in the sagittal plane, viewed from the side. Both arms act together in a handstand, so by symmetry they merge into a single arm segment, and likewise the two hands merge into one. The legs stay independent so that later on the model can lunge and kick. That leaves a hand resting flat on the floor, one straight arm from wrist to shoulder, a torso with the head attached, and a thigh and shank per leg, connected by six joints: wrist, shoulder, two hips, and two knees.

    Segment masses, mass centers, and moments of inertia follow de Leva's adjustment of the Zatsiorsky segment inertia parameters, scaled by height and body mass. The hand is the interesting segment: it is not a point of support but a patch, from the heel of the palm to the finger pads. Where the pressure lands inside that patch is the entire mechanism of handstand balance, which the next section makes precise.
  </script>

  <script id="pose-controls" type="text/x-typescript">
    const poseControls = html`<div class="pose-controls"></div>`;
    const section = (label) => poseControls.appendChild(html`<div style="font-weight:600; margin:0.6em 0 0.2em;">${label}</div>`);
    const add = (input) => { poseControls.appendChild(input); return input; };
    // Every one of the six joint angles has a drag handle on the figure, so
    // none of them gets a slider as well. The input elements are still made,
    // and are still where the pose lives: the drag handler writes them, the
    // preset buttons write them, syncPose reads them and writes back whatever
    // the flexibility clamp changed. They are simply never put in the panel.
    const offPanel = (input) => input;

    section('Pose');
    const inWrist = offPanel(Inputs.range([40, 100], { label: 'Wrist angle (deg)', value: 90, step: 0.5 }));
    const inShoulder = offPanel(Inputs.range([-5, 110], { label: 'Shoulder closing (deg)', value: 0, step: 0.5 }));
    const inHipL = offPanel(Inputs.range([-25, 140], { label: 'Hip flexion L (deg)', value: 0, step: 0.5 }));
    const inKneeL = offPanel(Inputs.range([-5, 145], { label: 'Knee flexion L (deg)', value: 0, step: 0.5 }));
    const inHipR = offPanel(Inputs.range([-25, 140], { label: 'Hip flexion R (deg)', value: 0, step: 0.5 }));
    const inKneeR = offPanel(Inputs.range([-5, 145], { label: 'Knee flexion R (deg)', value: 0, step: 0.5 }));
    const inSymmetric = add(Inputs.toggle({ label: 'Symmetric legs', value: true }));

    section('Flexibility limits');
    const inRomWrist = add(Inputs.range([50, 100], { label: 'Wrist dorsiflexion max', value: ROM_DEFAULTS.wristDorsiMaxDeg, step: 1 }));
    const inRomShoulder = add(Inputs.range([120, 185], { label: 'Shoulder flexion max', value: ROM_DEFAULTS.shoulderFlexMaxDeg, step: 1 }));
    const inRomHip = add(Inputs.range([40, 130], { label: 'Hip flexion max, straight knee', value: ROM_DEFAULTS.hipFlexStraightKneeMaxDeg, step: 1 }));
    const inRomCoupling = add(Inputs.range([0, 1], { label: 'Hamstring coupling (deg/deg)', value: ROM_DEFAULTS.hamstringCouplingPerDeg, step: 0.05 }));

    const D2R = Math.PI / 180;
    function syncPose() {
      if (!poseState.model) return;
      if (inSymmetric.value) { inHipR.value = inHipL.value; inKneeR.value = inKneeL.value; }
      const q = poseState.q;
      groundHand(poseState.model, q);
      q[3] = inWrist.value * D2R;
      q[4] = inShoulder.value * D2R;
      q[5] = inHipL.value * D2R;
      q[6] = -inKneeL.value * D2R;
      q[7] = inHipR.value * D2R;
      q[8] = -inKneeR.value * D2R;
      const rom = {
        ...ROM_DEFAULTS,
        wristDorsiMaxDeg: inRomWrist.value,
        shoulderFlexMaxDeg: inRomShoulder.value,
        hipFlexStraightKneeMaxDeg: inRomHip.value,
        hamstringCouplingPerDeg: inRomCoupling.value,
      };
      const clamped = clampPose(q, rom);
      if (clamped) {
        inWrist.value = q[3] / D2R;
        inShoulder.value = q[4] / D2R;
        inHipL.value = q[5] / D2R;
        inKneeL.value = -q[6] / D2R;
        inHipR.value = q[7] / D2R;
        inKneeR.value = -q[8] / D2R;
      }
      poseState.rom = rom;
      poseState.clamped = clamped;
      poseState.rev++;
      poseState.dirty = true;
      poseState.notifyPose?.({ rev: poseState.rev, q: Array.from(q), clamped });
      const romKey = JSON.stringify(rom);
      if (romKey !== poseState.romKey) {
        poseState.romKey = romKey;
        poseState.notifyRom?.(rom);
      }
    }
    poseState.sync = syncPose;
    poseState.jointSliders = { 3: inWrist, 4: inShoulder, 5: inHipL, 6: inKneeL, 7: inHipR, 8: inKneeR };
    poseState.symmetricInput = inSymmetric;
    poseControls.addEventListener('input', syncPose);

    section('Presets');
    const presetDefs = {
      'Straight': { wrist: 90, shoulder: 0, hip: 0, knee: 0 },
      'Banana': { wrist: 88, shoulder: 28, hip: -18, knee: 12 },
      'Planche lean': { wrist: 68, shoulder: 14, hip: 8, knee: 0 },
      'Pike': { wrist: 78, shoulder: 40, hip: 110, knee: 0 },
      'Tuck': { wrist: 85, shoulder: 25, hip: 115, knee: 120 },
    };
    const presetRow = html`<div style="display:flex; gap:6px; flex-wrap:wrap;"></div>`;
    for (const [name, p] of Object.entries(presetDefs)) {
      const b = html`<button>${name}</button>`;
      b.addEventListener('click', () => {
        inWrist.value = p.wrist; inShoulder.value = p.shoulder;
        inHipL.value = p.hip; inKneeL.value = p.knee;
        inHipR.value = p.hip; inKneeR.value = p.knee;
        syncPose();
      });
      presetRow.appendChild(b);
    }
    poseControls.appendChild(presetRow);
    syncPose();
    display(poseControls);
  </script>

  <script id="pose-figure" type="text/x-typescript">
    const poseStack = createElementStack({
      layers: [
        { id: 'body', element: ({ current }) => current || document.createElement('canvas') },
        {
          id: 'overlay', element: ({ current }) => {
            if (current) return current;
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.style.pointerEvents = 'none';
            return svg;
          },
        },
      ],
    });

    const svgNS = 'http://www.w3.org/2000/svg';
    const overlay = poseStack.elements.overlay;
    // touch-action:none on the outer HTML container, not the SVG: mobile
    // browsers do not reliably honour it on inner SVG nodes. Without it a
    // finger-drag scrolls the page, and the scroll gesture fires
    // pointercancel, so the drag also dies the moment the finger travels far
    // enough to start scrolling. Both halves of the touch bug are this line.
    poseStack.element.style.touchAction = 'none';
    const handleEls = new Map();
    function updateHandles(handles) {
      for (const h of handles) {
        let el = handleEls.get(h.joint);
        if (!el) {
          el = document.createElementNS(svgNS, 'circle');
          el.setAttribute('r', 9);
          el.setAttribute('fill', 'rgba(120, 140, 200, 0.25)');
          el.setAttribute('stroke', 'rgba(120, 140, 200, 0.8)');
          el.setAttribute('stroke-width', 1.5);
          el.style.pointerEvents = 'all';
          el.style.cursor = 'grab';
          el.dataset.joint = h.joint;
          overlay.appendChild(el);
          handleEls.set(h.joint, el);
        }
        el.setAttribute('cx', h.x);
        el.setAttribute('cy', h.y);
        el.dataset.px = h.pivotX;
        el.dataset.py = h.pivotY;
      }
    }

    // Dragging a handle rotates its joint about the pivot; the slider is the
    // single source of truth, so drags write slider values and re-sync.
    const jointSign = { 3: 1, 4: 1, 5: 1, 6: -1, 7: 1, 8: -1 };
    // With symmetric legs on, dragging a right-leg handle drives the left
    // slider (the right mirrors it in sync).
    const sliderFor = (joint) => {
      let j = joint;
      if (poseState.symmetricInput?.value && (j === 7 || j === 8)) j -= 2;
      return poseState.jointSliders?.[j] || null;
    };
    // Pointer capture is what lets the finger wander off the 9px handle (and
    // outside the figure) without the drag stopping; the pointerId is tracked
    // so a second finger cannot hijack a drag in progress.
    let drag = null;
    overlay.addEventListener('pointerdown', (e) => {
      const t = e.target;
      if (drag || !(t instanceof SVGCircleElement)) return;
      const joint = +t.dataset.joint;
      const rect = overlay.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      const a0 = Math.atan2(-(sy - t.dataset.py), sx - t.dataset.px);
      drag = { joint, a0, q0: poseState.q[joint], pointerId: e.pointerId, el: t };
      try { t.setPointerCapture(e.pointerId); } catch (_) { /* capture is best-effort */ }
      t.style.cursor = 'grabbing';
      e.preventDefault();
    });
    overlay.addEventListener('pointermove', (e) => {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const el = handleEls.get(drag.joint);
      const rect = overlay.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      const a = Math.atan2(-(sy - el.dataset.py), sx - el.dataset.px);
      let da = a - drag.a0;
      if (da > Math.PI) da -= 2 * Math.PI;
      if (da < -Math.PI) da += 2 * Math.PI;
      const qNew = drag.q0 + da;
      const slider = sliderFor(drag.joint);
      if (slider) {
        slider.value = jointSign[drag.joint] * qNew * 180 / Math.PI;
        poseState.sync?.();
      }
      e.preventDefault();
    });
    const endDrag = (e) => {
      if (!drag || (e && e.pointerId !== drag.pointerId)) return;
      try { drag.el.releasePointerCapture(drag.pointerId); } catch (_) { /* already released */ }
      drag.el.style.cursor = 'grab';
      drag = null;
    };
    overlay.addEventListener('pointerup', endDrag);
    overlay.addEventListener('pointercancel', endDrag);
    // If capture is lost for any reason (the element is re-created, the OS
    // steals the gesture), the drag must end with it or it sticks on.
    overlay.addEventListener('lostpointercapture', endDrag);

    function sizeLayers(w, h) {
      poseStack.resize(w, h);
      const dpr = devicePixelRatio;
      const canvas = poseStack.elements.body;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      overlay.setAttribute('width', w);
      overlay.setAttribute('height', h);
      poseState.viewW = w;
      poseState.viewH = h;
      poseState.dirty = true;
    }

    const stopTheme = observeTheme((t) => { poseState.theme = t; poseState.dirty = true; });
    invalidation.then(stopTheme);

    const poseLoop = createFrameLoop(() => {
      if (!poseState.dirty || !poseState.model) return;
      poseState.dirty = false;
      const canvas = poseStack.elements.body;
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(devicePixelRatio, devicePixelRatio);
      const res = drawScene(ctx, {
        model: poseState.model, ws: poseState.ws, q: poseState.q,
        width: poseState.viewW, height: poseState.viewH,
        theme: poseState.theme, clamped: poseState.clamped,
      });
      ctx.restore();
      updateHandles(res.handles);
    });
    invalidation.then(() => poseLoop.cancel());

    // Height reserved inside the figure for the torque readout, which the
    // torque-chart cell renders into torqueSlot. It belongs in this figure: it
    // is a readout of the pose being dragged, and having to scroll down to it
    // turned cause and effect into two separate events.
    const TORQUE_H = 190;
    const torqueSlot = html`<div style="margin-top:2px;"></div>`;

    const poseFigure = html`<figure>
      ${poseStack.element}
      ${torqueSlot}
      <figcaption>Drag the faint joint handles to pose the figure. The dot and drop line mark the center of mass: green over the palm patch (blue strip), red past it. Orange rings mark joints pinned at a flexibility limit.</figcaption>
    </figure>`;

    display(expandable(poseFigure, {
      id: 'pose-explorer',
      width: Math.min(width, 640),
      height: Math.min(540, width * 0.85),
      controls: '.pose-controls',
      state: poseState.ui,
      buttons: [createSnapshotButton(poseStack.elements.body, { filename: 'handstand-pose', onSnapshot: () => { poseState.dirty = true; } })],
      onResize(el, w, h) { sizeLayers(w, Math.max(200, h - TORQUE_H)); },
    }));
  </script>
  <script id="statics-section" type="text/markdown">
    ## Balance is a statics problem

    A pose at rest balances when the center of mass sits directly above the center of pressure, and the center of pressure has nowhere to live except the palm patch:

    ${tex.block`x_{\mathrm{CoM}} = x_{\mathrm{CoP}}, \qquad x_{\mathrm{heel}} \;\le\; x_{\mathrm{CoP}} \;\le\; x_{\mathrm{fingertips}}.`}

    The wrist is what moves the center of pressure. Pressing down through the fingertips shifts it forward; rocking onto the heel of the palm shifts it back. For body weight ${tex`W`} the wrist torque required to hold the pressure at a given spot is

    ${tex.block`\tau_{\mathrm{wrist}} = W\,(x_{\mathrm{CoP}} - x_{\mathrm{wrist}}),`}

    so the patch length times body weight is the entire balance authority available in a handstand. This is the wrist strategy that motion capture studies find gymnasts using more than three quarters of the time. Every other joint torque in a static pose is set by gravity: each joint must resist the moment of all the mass beyond it. Those torques are the bars under the figure above, normalized by body mass and drawn against each joint's isometric strength, so posing the body and reading what the pose costs happen in the same place.
  </script>
  <script id="torque-chart" type="text/x-typescript">
    const torqueView = (() => {
      const qNow = Float64Array.from(poseInfo.q);
      const st = staticAnalysis(model, qNow, ws);
      const names = ['Wrist', 'Shoulder', 'Hip L', 'Knee L', 'Hip R', 'Knee R'];
      const keys = ['wrist', 'shoulder', 'hipL', 'kneeL', 'hipR', 'kneeR'];
      const data = names.map((joint, k) => {
        const tau = st.tau[3 + k] / model.massKg;
        const cap = availableTorque(strengthProf[keys[k]], st.tau[3 + k], 0) / model.massKg;
        return { joint, tau, cap, over: Math.abs(tau) > cap };
      });
      const chart = Plot.plot({
        width: Math.min(width, 640),
        height: 150,
        marginTop: 8,
        marginLeft: 70,
        x: { label: 'torque (Nm per kg body mass)', domain: [-3.2, 3.2], grid: true },
        y: { label: null, domain: names },
        marks: [
          Plot.ruleX([0]),
          Plot.barX(data, { y: 'joint', x: 'tau', fill: (d) => (d.over ? '#c0392b' : '#4878b8') }),
          Plot.tickX(data, { y: 'joint', x: (d) => d.cap, stroke: '#888', strokeWidth: 1.5 }),
          Plot.tickX(data, { y: 'joint', x: (d) => -d.cap, stroke: '#888', strokeWidth: 1.5 }),
        ],
      });
      const where = st.supported
        ? `center of pressure at ${(st.patchFrac * 100).toFixed(0)}% of the palm patch`
        : st.patchFrac < 0
          ? 'toppling backward off the heel of the palm'
          : 'toppling forward over the fingertips';
      return html`<div>
        ${chart}
        <small style="opacity:.7">Static joint torque for this pose (bars) against isometric strength (gray ticks): ${where}.</small>
      </div>`;
    })();
    torqueSlot.replaceChildren(torqueView);
  </script>
  <script id="flexibility-section" type="text/markdown">
    ## What flexibility limits actually do

    Try lowering the shoulder flexion limit in the controls above. A shoulder that cannot open to 180 degrees tips the torso off the vertical line, and the pose has to buy that angle back somewhere: arch the back and let the legs travel past vertical, which is the banana, or lean the whole stack toward the fingertips. Lower the wrist limit and the arm itself cannot stand vertical over the palm, forcing a lean that the shoulders must then fight. Neither compensation is free, and the torque chart above prices them.

    The hamstrings enter differently, because they are a two joint muscle group. What they limit is not any single joint but the combination of hip flexion and knee extension. With knees straight, hip flexion caps at the toe touch limit; every degree of knee bend buys some of it back. That coupling is why a bent knee press exists, and the model expresses it directly in the hip slider clamp.
  </script>
  <script id="corridor-intro" type="text/markdown">
    ## The press corridor

    A press to handstand is, in the quasi static limit, a path through pose space that keeps the center of mass over the palm the whole way: from a deep pike, through compression, to the stacked handstand. For each combination of hip and shoulder angle, the model solves for the wrist angle that balances the pose, then asks whether that pose is reachable within the flexibility limits and holdable within the strength limits. The result is a corridor: the region of pose space a press is allowed to pass through. Tighten the shoulders or hamstrings in the controls and watch the corridor narrow.
  </script>
  <script id="pose-probe" type="text/x-typescript">
    // Both the press corridor and the catch window are maps over coordinates
    // nobody can picture: "hip 80, shoulder 30" and "wrist +12 deg at 1.4
    // rad/s" mean nothing as numbers. This is the body those numbers stand
    // for, drawn next to the plot and driven by whatever the cursor is over.
    // The window has to be given, not defaulted: a body piked to 130 deg
    // reaches almost 0.9 m behind the hand, and centering on the hand the way
    // a straight handstand wants cuts the legs off the canvas.
    const makePoseProbe = ({ w = 156, h = 220, view = { cx: 0.1, yLo: -0.15, yHi: 2.15 } } = {}) => {
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * devicePixelRatio);
      canvas.height = Math.round(h * devicePixelRatio);
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      const note = html`<small style="display:block; opacity:.75; min-height:3.2em; line-height:1.3;"></small>`;
      const element = html`<div style="flex:0 0 auto; width:${w}px;">${canvas}${note}</div>`;
      const ctx = canvas.getContext('2d');
      return {
        element,
        draw(q, text = '') {
          ctx.save();
          ctx.scale(devicePixelRatio, devicePixelRatio);
          ctx.clearRect(0, 0, w, h);
          if (q) {
            drawScene(ctx, {
              model, ws, q, width: w, height: h, theme: poseState.theme, view,
            });
          }
          ctx.restore();
          note.textContent = text;
        },
      };
    };

    // Plot renders a figure that may also contain a legend svg; the plot
    // itself is the tallest one. Its scales invert in CSS pixels relative to
    // that svg, which is what a pointer event gives us.
    // Plot returns a <figure> when it draws a legend and a bare <svg>
    // otherwise. The figure carries a browser default margin that opens a gap
    // the width of the page, and it holds two svgs: the legend ramp first,
    // then the plot. Pick by the height we asked for, NOT by measuring: this
    // runs before the chart is in the document, so every getBoundingClientRect
    // is 0x0, a sort by size is a no-op, and the first svg wins -- which is
    // the legend. That is how the pointer handler ended up on the colour bar.
    const plotSurface = (chart, minHeight) => {
      chart.style.margin = '0';
      if (chart.tagName.toLowerCase() === 'svg') return chart;
      const svgs = [...chart.querySelectorAll('svg')];
      return svgs.find((sv) => +sv.getAttribute('height') >= minHeight)
        || svgs[svgs.length - 1] || null;
    };
  </script>
  <script id="press-corridor" type="text/x-typescript">
    const corridorView = (() => {
      const cacheKey = JSON.stringify([romInfo, model.heightM, model.massKg, model.straddleDeg, strengthScale]);
      if (poseState.corridorCache.key !== cacheKey) {
        // Sampling shoulders below zero costs a band of cells that fail for a
        // reason that has nothing to do with pressing: the shoulder simply does
        // not extend past overhead. It also caught the reference handstand,
        // which snapped to shoulder -0.6 deg and read back as anatomically
        // illegal.
        poseState.corridorCache.grid = pressCorridor(model, romInfo, strengthProf, ws, { nHip: 44, nShoulder: 40, shoulderLoDeg: 0 });
        poseState.corridorCache.key = cacheKey;
      }
      const g = poseState.corridorCache.grid;
      const cells = [];
      const dHip = g.hipDeg[1] - g.hipDeg[0], dSh = g.shoulderDeg[1] - g.shoulderDeg[0];
      for (let i = 0; i < g.nHip; i++) {
        for (let j = 0; j < g.nShoulder; j++) {
          const idx = i * g.nShoulder + j;
          if (Number.isNaN(g.wristNeededDeg[idx])) continue;
          cells.push({
            x1: g.hipDeg[i] - dHip / 2, x2: g.hipDeg[i] + dHip / 2,
            y1: g.shoulderDeg[j] - dSh / 2, y2: g.shoulderDeg[j] + dSh / 2,
            util: g.utilization[idx],
            feasible: g.feasible[idx] === 1,
            tooStrong: g.utilization[idx] > 1,
          });
        }
      }
      const D2R = Math.PI / 180;
      const poseDot = {
        hip: 0.5 * (poseInfo.q[5] + poseInfo.q[7]) / D2R,
        shoulder: poseInfo.q[4] / D2R,
      };
      const chart = Plot.plot({
        width: 452,
        height: 340,
        marginLeft: 44,
        x: { label: 'hip flexion (deg)' },
        y: { label: 'shoulder closing (deg)' },
        color: { label: 'peak strength used', scheme: 'ylorrd', domain: [0, 1.2], legend: true },
        marks: [
          Plot.rect(cells.filter((d) => !d.feasible && d.tooStrong), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: '#9aa0a6', fillOpacity: 0.3 }),
          Plot.rect(cells.filter((d) => !d.feasible && !d.tooStrong), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: '#6f86c6', fillOpacity: 0.3 }),
          Plot.rect(cells.filter((d) => d.feasible), { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: 'util' }),
          Plot.dot([poseDot], { x: 'hip', y: 'shoulder', r: 5, stroke: 'black', fill: 'white' }),
        ],
      });
      // A cell of this map IS a pose: fix hip and shoulder, then solve the
      // whole-body lean that puts the center of mass over the palm. Hovering
      // shows that body, which is the only way the axes mean anything.
      const targetX = model.patch.x0 + HANDSTAND_TARGET_FRAC * (model.patch.x1 - model.patch.x0);
      const poseAt = (hipDeg, shDeg) => {
        const q = new Float64Array(model.nq);
        groundHand(model, q);
        q[4] = shDeg * D2R;
        q[5] = q[7] = hipDeg * D2R;
        const wr = solveWristForCom(model, q, ws, targetX);
        if (Number.isNaN(wr)) return null;
        q[3] = wr;
        return q;
      };
      const probe = makePoseProbe({ view: { cx: -0.15, yLo: -0.15, yHi: 2.15 } });
      const nearest = (arr, v) => {
        let bi = 0;
        for (let i = 1; i < arr.length; i++) if (Math.abs(arr[i] - v) < Math.abs(arr[bi] - v)) bi = i;
        return bi;
      };
      const showCorridor = (hipDeg, shDeg) => {
        const i = nearest(g.hipDeg, hipDeg), j = nearest(g.shoulderDeg, shDeg);
        const idx = i * g.nShoulder + j;
        const q = poseAt(g.hipDeg[i], g.shoulderDeg[j]);
        const util = g.utilization[idx];
        const verdict = !q || Number.isNaN(util)
          ? 'cannot be balanced over the palm at any lean'
          : g.feasible[idx]
            ? `holdable, using ${(util * 100).toFixed(0)}% of the hardest-worked joint`
            : util > 1
              ? `needs ${(util * 100).toFixed(0)}% of a joint's strength: too strong to hold`
              : 'outside a flexibility limit';
        probe.draw(q, `hip ${g.hipDeg[i].toFixed(0)}°, shoulder ${g.shoulderDeg[j].toFixed(0)}° — ${verdict}`);
      };
      showCorridor(poseDot.hip, poseDot.shoulder);
      const surface = plotSurface(chart, 300);
      if (surface) {
        surface.style.touchAction = 'none';
        const onMove = (e) => {
          const r = surface.getBoundingClientRect();
          const hx = chart.scale('x').invert(e.clientX - r.left);
          const sy = chart.scale('y').invert(e.clientY - r.top);
          if (Number.isFinite(hx) && Number.isFinite(sy)) showCorridor(hx, sy);
        };
        surface.addEventListener('pointermove', onMove);
        surface.addEventListener('pointerdown', onMove);
      }

      return html`<figure>
        <div style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;">
          ${chart}
          ${probe.element}
        </div>
        <figcaption>Hover the map to see the body each cell stands for. Every cell is a pose that balances over the palm, with straight, symmetric legs; the question is whether this body can hold it. Colored cells can, shaded by how much of the hardest-worked joint it takes. Gray cells need more strength than it has, blue-gray cells need range of motion it does not have. The dot is the current explorer pose.</figcaption>
      </figure>`;
    })();
    display(corridorView);
  </script>
  <script id="dynamics-section" type="text/markdown">
    ## Making it move

    Statics ends where every interesting question about handstands begins. To simulate motion, the model becomes a floating body in space: the hand is not attached to the floor, it just rests on it, pressed by two one-sided spring contacts under the heel of the palm and the finger pads (and one under each foot for entries). The center of pressure and every toppling failure emerge from those two palm contacts trading load. Joints are driven by servo torques that track a reference trajectory, and every torque respects two layers of muscle physiology. The first is the strength envelope: maximum voluntary torque as a function of joint velocity, after Yeadon, King and Wilson. Isometric strength is available in a slow press while a fast kick pays the Hill hyperbola falloff; at five radians per second a joint has roughly half its isometric torque left. The second is activation dynamics: neural drive follows a first order lag with a time constant near fifty milliseconds, so torque cannot step instantaneously and bang-bang corrections are impossible by construction, for the model as for you.

    A servo also has to be tuned against the thing it drives, and here that thing is not one thing. These six joints span an effective inertia of two hundred to one: a knee swings a third of a kilogram metre squared, while the wrist turns the entire body about the palm and sees eighty. One damping constant is therefore always wrong somewhere, and the constant that kept the knees civil left the wrist at a damping ratio of 0.12. So the servo reads the damping it needs off the mass matrix it is already computing, two zeta root kp M for each joint, refreshed a couple of hundred times a second: often enough to follow the body as it changes shape, seldom enough to stay off the hot loop. A nervous system does not re-identify its own limbs at five kilohertz either.

    That fixes the ringing but not the reason for it. At forty five degrees of error the position term asks for ten radians per second, and a loaded shoulder needs five hundred degrees of travel to brake from ten radians per second, so the reference is quietly requesting an arrival the muscle cannot produce; the joint spends the whole movement against its cap, and the moment it finally reaches the balanced position, where the required force falls to nothing, it sails straight through. The fix is the one a proximate time-optimal servo uses: cap the commanded speed at whatever the joint can still stop in the error that remains. What makes that honest here is the acceleration it is computed from, which is not the strength cap but the reserve left after gravity has taken its share. A shoulder that has been holding the body up for a second and a half has most of its envelope already committed, and it has to plan its stop with what is left.

    One more piece of the body had to become physics rather than preference. Range of motion began as a cost term, and a soft one: a knee driven forty degrees past hyperextension for a tenth of a second cost the optimizer a few hundredths of a cost unit, so it bought the injury and spent the savings on a tidier finish. Bounding the reference angles is not enough either, because it is momentum, not the reference, that carries a swinging limb past its limit. Joints now have passive end-stops, built exactly like the ground contacts one dimension down: stiffness set so that a joint pushed by its own maximum voluntary torque sinks about five degrees past the limit, damping near critical for the inertia that joint drives, one-sided and non-adhesive so tissue can only push back into the range. They are elastic, because ligaments are, and a limb thrown hard enough still travels some way past its limit and is pushed back, which is the honest picture: you can see the joint being loaded rather than watching the pose silently clip. What is gone is the ability to spend a whole movement outside your own anatomy for the price of a rounding error.

    Building this surfaced three failures worth keeping. First, holding a perfectly stacked pose with perfect joint servos still topples: the stacked pose rests the pressure a few millimeters from the heel of the palm, and a body pivoting on the heel point has nothing to push against. Second, servos without anticipatory gravity compensation sag under load, the sag leans the body, the lean raises the load, and the wrist creeps up to its strength cap and over the fingertips. Third, and least expected: the wrist cannot be critically damped at all. Asking for it wants 505 newton metres per radian per second, a damper that would spend the joint's entire seventy newton metre envelope at 0.14 rad/s and leave the balance correction with nothing to say, whereupon the model rides its wrist cap out over the fingertips exactly as the uncompensated servo did. Damping has to be capped at what the muscle can actually produce, and the wrist is the only joint where that cap binds, which is a mechanical way of saying what every beginner discovers: relative to the load it carries, the joint is underpowered, and no choice of gain repairs it. All three are real handstand failures, reproduced by accident.
  </script>

  <script id="sim-run" type="text/x-typescript">
    const simResult = (() => {
      const sel = scenario || 'hold';
      let base = sel, knots = null, T = 1.2;
      let prof = strengthProf, rom = { ...ROM_DEFAULTS }, config = {};
      // Artifacts replay under EXACTLY what they were made with: their
      // recorded strength, flexibility, and plant/controller config, never
      // the current sliders or defaults. History does not get rewritten.
      const fromPreset = (p) => {
        base = p.scenario;
        knots = p.knots.map((k) => Float64Array.from(k));
        T = p.T;
        if (p.strength) prof = strengthProfile(model.massKg, { overrides: p.strength });
        if (p.rom) rom = { ...ROM_DEFAULTS, ...p.rom };
        config = resolveConfig(p.config);
      };
      if (sel === 'lunge-opt') fromPreset(PRESET_TRAJECTORIES.lunge);
      else if (sel === 'pike-opt') fromPreset(PRESET_TRAJECTORIES.pike);
      else if (sel.startsWith('gallery-')) fromPreset(PRESET_GALLERY[+sel.slice(8)]);
      else if (sel === 'live') {
        if (optState.adopted) fromPreset(optState.adopted);
        else base = 'hold';
      }
      return { ...runScenario(model, ws, prof, { scenario: base, knots, T, settleT: 2.5, rom, ...config }), prof };
    })();

  <script id="playback-state" type="text/x-typescript">
    const playState = {
      sim: null, t: 0, playing: true, speed: 1,
      dirty: true, theme: null, lastNow: null,
      viewW: 640, viewH: 480, ui: { expanded: false },
    };

  <script id="sim-into-state" type="text/x-typescript">
    playState.sim = simResult;
    playState.t = 0;
    playState.playing = true;
    playState.lastNow = null;

  <script id="playback-figure" type="text/x-typescript">
    const playStack = createElementStack({
      layers: [{ id: 'sim', element: ({ current }) => current || document.createElement('canvas') }],
    });

    const playRow = html`<div style="display:flex; gap:8px; align-items:center; margin:4px 0;"></div>`;
    const playButton = html`<button style="min-width:64px;">Pause</button>`;
    const timeLabel = html`<span style="font-variant-numeric: tabular-nums;"></span>`;
    const scrubInput = html`<input type="range" min="0" max="1" step="0.001" value="0" style="flex:1;">`;
    playRow.append(playButton, scrubInput, timeLabel);
    playButton.addEventListener('click', () => {
      playState.playing = !playState.playing;
      playState.lastNow = null;
      playButton.textContent = playState.playing ? 'Pause' : 'Play';
    });
    scrubInput.addEventListener('input', () => {
      const rec = playState.sim?.rec;
      if (!rec) return;
      playState.playing = false;
      playButton.textContent = 'Play';
      playState.t = +scrubInput.value * rec.t[rec.t.length - 1];
      playState.dirty = true;
    });

    // The transport lives with the scenario picker rather than under the
    // canvas, so it follows the rest of the controls into the floating panel
    // when the figure is expanded. This cell re-runs on resize and builds a
    // fresh row each time, so the old one has to go with the old cell.
    simControls.appendChild(playRow);
    invalidation.then(() => playRow.remove());

    const utilColor = (u, isDark) => {
      const uu = Math.min(Math.max(u, 0), 1);
      return `hsl(${210 * (1 - uu)}, ${40 + 45 * uu}%, ${isDark ? 62 : 42}%)`;
    };

    const stopPlayTheme = observeTheme((t) => { playState.theme = t; playState.dirty = true; });
    invalidation.then(stopPlayTheme);

    const playLoop = createFrameLoop((now) => {
      const sim = playState.sim;
      if (!sim) return;
      const rec = sim.rec;
      const Tend = rec.t[rec.t.length - 1];
      if (playState.playing) {
        if (playState.lastNow !== null) {
          playState.t += ((now - playState.lastNow) / 1000) * playState.speed;
          if (playState.t > Tend) playState.t = 0;
        }
        playState.lastNow = now;
        playState.dirty = true;
      }
      if (!playState.dirty) return;
      playState.dirty = false;

      const k = Math.min(rec.t.length - 1, Math.round(playState.t / (rec.dt * rec.stride)));
      const q = rec.q[k];
      const isDark = playState.theme?.isDark ?? false;

      // Per-joint utilization colors the segment each joint drives, against
      // the strength profile the run was simulated with.
      const keys = ['wrist', 'shoulder', 'hipL', 'kneeL', 'hipR', 'kneeR'];
      const profNow = sim.prof || strengthProf;
      const segmentColors = [null, null, null, null, null, null, null];
      for (let j = 0; j < 6; j++) {
        const tauApplied = rec.tauApplied[k][j];
        const cap = availableTorque(profNow[keys[j]], tauApplied, rec.qd[k][3 + j]);
        segmentColors[1 + j] = utilColor(Math.abs(tauApplied) / Math.max(cap, 1e-6), isDark);
      }

      const f = rec.forces[k];
      const forces = [];
      let copX, fySum = 0, fyX = 0;
      if (f) {
        for (let i = 0; i < f.fy.length; i++) {
          if (f.fy[i] > 1) forces.push({ x: f.px[i], y: 0, fx: f.fx[i], fy: f.fy[i] });
          if (i < 2) { fySum += f.fy[i]; fyX += f.fy[i] * f.px[i]; }
        }
        copX = fySum > 1 ? fyX / fySum : undefined;
      }

      const canvas = playStack.elements.sim;
      const ctx = canvas.getContext('2d');
      ctx.save();
      ctx.scale(devicePixelRatio, devicePixelRatio);
      drawScene(ctx, {
        model, ws, q: Float64Array.from(q),
        width: playState.viewW, height: playState.viewH,
        theme: playState.theme,
        segmentColors, forces, copX,
        comTrail: rec.com.slice(0, k + 1),
        view: { cx: 0.15, yLo: -0.18, yHi: 2.3 },
      });
      ctx.restore();

      scrubInput.value = playState.t / Tend;
      timeLabel.textContent = `${playState.t.toFixed(2)}s`;
    });
    invalidation.then(() => playLoop.cancel());

    const playFigure = html`<figure>
      ${playStack.element}
      <figcaption>Segments are colored by strength used at that joint, blue (idle) to red (at the voluntary torque cap). Orange arrows are ground reaction forces; the blue dot on the floor is the center of pressure; the dashed curve is the center of mass trail.</figcaption>
    </figure>`;

    display(expandable(playFigure, {
      id: 'simulation-playback',
      width: Math.min(width, 640),
      height: Math.min(500, width * 0.8),
      controls: '.sim-controls',
      state: playState.ui,
      onResize(el, w, h) {
        playStack.resize(w, h);
        const dpr = devicePixelRatio;
        const canvas = playStack.elements.sim;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;
        playState.viewW = w;
        playState.viewH = h;
        playState.dirty = true;
      },
    }));
  </script>
  <script id="sim-charts" type="text/x-typescript">
    const simCharts = (() => {
      const rec = simResult.rec;
      const chartProf = simResult.prof || strengthProf;
      const keys = ['wrist', 'shoulder', 'hipL', 'kneeL', 'hipR', 'kneeR'];
      const labels = ['Wrist', 'Shoulder', 'Hip L', 'Knee L', 'Hip R', 'Knee R'];
      const utilRows = [], grfRows = [], comRows = [];
      const patchSpan = model.patch.x1 - model.patch.x0;
      let posWork = 0, negWork = 0;
      for (let k = 0; k < rec.t.length; k++) {
        const t = rec.t[k];
        const dts = k > 0 ? t - rec.t[k - 1] : 0;
        for (let j = 0; j < 6; j++) {
          const tauApplied = rec.tauApplied[k][j];
          const cap = availableTorque(chartProf[keys[j]], tauApplied, rec.qd[k][3 + j]);
          utilRows.push({ t, joint: labels[j], util: Math.abs(tauApplied) / Math.max(cap, 1e-6) });
          const P = tauApplied * rec.qd[k][3 + j];
          if (P > 0) posWork += P * dts; else negWork -= P * dts;
        }
        const f = rec.forces[k];
        if (f) {
          let fySum = 0, fyX = 0;
          for (let i = 0; i < 2; i++) { fySum += f.fy[i]; fyX += f.fy[i] * f.px[i]; }
          grfRows.push({
            t, grf: fySum / (model.massKg * model.gravity),
            copFrac: fySum > 1 ? (fyX / fySum - (rec.q[k][0] + model.patch.x0)) / patchSpan : NaN,
          });
        }
        comRows.push({
          t,
          comFrac: (rec.com[k][0] - (rec.q[k][0] + model.patch.x0)) / patchSpan,
          L: rec.L[k],
        });
      }
      const utilPlot = Plot.plot({
        height: 200, x: { label: 'time (s)' },
        y: { label: 'strength used', domain: [0, 1.3], grid: true },
        color: { legend: true },
        marks: [
          Plot.ruleY([1], { stroke: '#c0392b', strokeDasharray: '4,3' }),
          Plot.lineY(utilRows, { x: 't', y: 'util', stroke: 'joint' }),
        ],
      });
      const balancePlot = Plot.plot({
        height: 180, x: { label: 'time (s)' },
        y: { label: 'position along palm patch', domain: [-0.6, 1.6], grid: true },
        marks: [
          Plot.ruleY([0, 1], { stroke: '#888', strokeDasharray: '4,3' }),
          Plot.lineY(grfRows.filter((d) => Number.isFinite(d.copFrac)), { x: 't', y: 'copFrac', stroke: '#4878b8' }),
          Plot.lineY(comRows, { x: 't', y: 'comFrac', stroke: '#2e8b57' }),
          Plot.text([{ t: rec.t[rec.t.length - 1], y: 1.45, text: simResult.verdict.success ? 'balanced' : 'fell' }],
            { x: 't', y: 'y', text: 'text', textAnchor: 'end', fontWeight: 'bold' }),
        ],
      });
      const momentumPlot = Plot.plot({
        height: 140, x: { label: 'time (s)' },
        y: { label: 'angular momentum (kg m²/s)', grid: true },
        marks: [Plot.ruleY([0]), Plot.lineY(comRows, { x: 't', y: 'L', stroke: '#a06cd5' })],
      });
      return html`<figure>
        ${utilPlot}
        ${balancePlot}
        ${momentumPlot}
        <figcaption>Instrumentation for the run above. Top: fraction of each joint's velocity-dependent strength in use (dashed red is the cap). Middle: center of pressure (blue) and center of mass (green) along the palm patch; 0 is the heel, 1 the fingertips, outside the dashed lines means toppling. Bottom: whole-body angular momentum about the center of mass. Mechanical work: ${posWork.toFixed(0)} J concentric, ${negWork.toFixed(0)} J eccentric (raising the body from this start takes about ${Math.max(0, Math.round((model.massKg * model.gravity) * (1.0 - rec.com[0][1])))} J of potential energy).</figcaption>
      </figure>`;
    })();
    display(simCharts);
  </script>
  <script id="optimizer-section" type="text/markdown">
    ## Finding the easiest way up

    Hand-authoring trajectories is a losing game. Every attempt I wrote by hand failed in one of the ways beginners fail, and none of them survived into this notebook. So instead the notebook searches. A candidate technique is a set of spline knots for each of the six joints plus a total duration, thirty seven numbers in all, and its score is a physics rollout: did it arrive at a balanced handstand, meaning the stacked configuration with the feet free of the floor and not merely a center of mass in the right place; how much of the strength envelope did it burn; how much metabolic work it spent, with concentric work charged at muscle efficiency and eccentric absorption cheap, so churning the legs reads as expensive the way it should; did it violate a flexibility limit; did the palms stay planted; did it fall and how early. A covariance matrix adaptation evolution strategy (CMA-ES) then climbs that score. Every run is deterministic under its seed, and the presets above were produced by exactly this process offline; the optimizer below runs live in a worker if you want to search under different flexibility or strength settings.
  </script>
  <script id="opt-state" type="text/x-typescript">
    const optState = {
      worker: null, running: false, history: [],
      latest: null, result: null, adopted: null,
      rev: 0, notify: null,
    };
  </script>
  <script id="opt-controls-cell" type="text/x-typescript">
    const optControls = html`<div class="opt-controls"></div>`;
    const optScenarioNames = { lunge: 'Kick-up (from lunge)', pike: 'Press (from pike)' };
    const optScenario = Inputs.select(Object.keys(optScenarioNames), { label: 'Optimize', format: (v) => optScenarioNames[v] });
    const optGens = Inputs.range([20, 400], { label: 'Generations', value: 120, step: 10 });
    const optSeed = Inputs.range([1, 99], { label: 'Seed', value: 7, step: 1 });
    optControls.append(optScenario, optGens, optSeed);
    const optRow = html`<div style="display:flex; gap:6px; align-items:center; margin-top:6px;"></div>`;
    const optRun = html`<button>Run optimization</button>`;
    const optStop = html`<button disabled>Stop</button>`;
    const optAdopt = html`<button disabled>Send result to playback</button>`;
    optRow.append(optRun, optStop, optAdopt);
    optControls.appendChild(optRow);

    function optCleanup() {
      optState.worker?.terminate();
      optState.worker = null;
      optState.running = false;
      optRun.disabled = false;
      optStop.disabled = true;
    }
    optRun.addEventListener('click', () => {
      optCleanup();
      optState.history = [];
      optState.result = null;
      optState.latest = null;
      optState.running = true;
      optRun.disabled = true;
      optStop.disabled = false;
      optAdopt.disabled = true;
      const worker = new Worker(new URL('./opt-worker.js', import.meta.url), { type: 'module' });
      optState.worker = worker;
      worker.onerror = (err) => {
        console.error('optimizer worker error', err.message);
        optCleanup();
        optState.rev++;
        optState.notify?.(optState);
      };
      worker.onmessage = ({ data }) => {
        if (data.type === 'progress') {
          optState.history.push({ gen: data.gen, best: data.best });
          optState.latest = data;
        } else if (data.type === 'done') {
          optState.result = { ...data, scenario: optScenario.value };
          optCleanup();
          optAdopt.disabled = false;
        }
        optState.rev++;
        optState.notify?.(optState);
      };
      // Start from the canonical result for this skill rather than from the
      // hand-written reference. A search from scratch does not find a kick-up
      // on this body in any budget this button offers -- the canonical one
      // exists because the strength and the entry duration were walked down in
      // stages offline -- so starting cold produced a couple of hundred
      // generations of slow improvement ending in a fall. Warm-started, the
      // button does what it looks like it does: takes a technique that works
      // and refines it for the body currently set in the sliders.
      const seedRun = PRESET_TRAJECTORIES[optScenario.value];
      worker.postMessage({
        type: 'optimize',
        scenario: optScenario.value,
        seed: optSeed.value,
        maxGen: optGens.value,
        x0: seedRun
          ? Array.from(encodeDecision(seedRun.knots.map((k) => Float64Array.from(k)), seedRun.T))
          : null,
        sigma0: seedRun ? 0.1 : undefined,
        modelParams: { heightM, massKg, straddleDeg },
        strengthOpts: { scale: strengthScale },
        romOverrides: poseState.rom,
      });
      optState.rev++;
      optState.notify?.(optState);
    });
    optStop.addEventListener('click', () => { optCleanup(); optState.rev++; optState.notify?.(optState); });
    optAdopt.addEventListener('click', () => {
      if (!optState.result) return;
      optState.adopted = optState.result;
      scenarioInput.value = 'live';
      scenarioInput.dispatchEvent(new Event('input', { bubbles: true }));
    });
    invalidation.then(optCleanup);
    display(optControls);

  <script id="catch-section" type="text/markdown">
    ## The catch window

    A kick-up succeeds or fails in its last quarter second. Once the feet leave the floor the body is, to good approximation, a rigid stack pivoting about the wrists, and the only authority left is the wrist strategy: pressing the center of pressure around inside the palm patch. So ask directly: from which combinations of arrival angle and arrival angular velocity can the wrist strategy still recover to stillness? The answer is the catch window below. Arrive under it and you fall back the way you came; overshoot it and you topple over the top. The optimized kick-up threads its trajectory straight through it.
  </script>
  <script id="catch-state" type="text/x-typescript">
    const catchState = { grid: PRESET_CATCH_WINDOW, computing: false, progress: 0, rev: 0, notify: null };
  </script>
  <script id="catch-observable" type="text/x-typescript">
    const catchInfo = Generators.observe((notify) => {
      catchState.notify = notify;
      notify(catchState);
      return () => { if (catchState.notify === notify) catchState.notify = null; };
    });
  </script>
  <script id="catch-figure" type="text/x-typescript">
    const catchView = (() => {
      const g = catchInfo.grid;
      if (!g) return html`<p><em>No catch window data.</em></p>`;
      const dTh = g.thetasDeg[1] - g.thetasDeg[0], dOm = g.omegas[1] - g.omegas[0];
      const cells = [];
      for (let i = 0; i < g.nTheta; i++) {
        for (let j = 0; j < g.nOmega; j++) {
          if (!g.success[i * g.nOmega + j]) continue;
          cells.push({
            x1: g.thetasDeg[i] - dTh / 2, x2: g.thetasDeg[i] + dTh / 2,
            y1: g.omegas[j] - dOm / 2, y2: g.omegas[j] + dOm / 2,
          });
        }
      }
      // Wrist-space trace of the current playback run's final approach.
      const qBal = balancedHandstand(model, ws);
      const rec = simResult.rec;
      const trace = [];
      for (let k = 0; k < rec.t.length; k++) {
        trace.push({ th: (rec.q[k][3] - qBal[3]) * 180 / Math.PI, om: rec.qd[k][3], t: rec.t[k] });
      }
      const chart = Plot.plot({
        width: 452,
        height: 320,
        marginLeft: 44,
        x: { label: 'wrist angle offset from balance (deg)', domain: [g.thetasDeg[0], g.thetasDeg[g.nTheta - 1]] },
        y: { label: 'wrist angular velocity (rad/s)', domain: [g.omegas[0], g.omegas[g.nOmega - 1]] },
        marks: [
          Plot.rect(cells, { x1: 'x1', x2: 'x2', y1: 'y1', y2: 'y2', fill: '#5a9e6f', fillOpacity: 0.55 }),
          Plot.ruleX([0]), Plot.ruleY([0]),
          Plot.lineY(trace, { x: 'th', y: 'om', stroke: '#c06030', strokeWidth: 1.5, clip: true }),
          Plot.dot(trace.length ? [trace[trace.length - 1]] : [], { x: 'th', y: 'om', r: 4, fill: '#c06030' }),
        ],
      });
      // A cell here is an arrival: the body stacked but rotated off balance by
      // theta about the wrist, already turning at omega. The pose shows the
      // angle, the arrow shows which way it is going, and the grid says
      // whether the wrist can still save it.
      const probe = makePoseProbe();
      const nearest = (arr, v) => {
        let bi = 0;
        for (let i = 1; i < arr.length; i++) if (Math.abs(arr[i] - v) < Math.abs(arr[bi] - v)) bi = i;
        return bi;
      };
      const showCatch = (thDeg, om) => {
        const i = nearest(g.thetasDeg, thDeg), j = nearest(g.omegas, om);
        const q = Float64Array.from(qBal);
        q[3] += g.thetasDeg[i] * Math.PI / 180;
        const caught = g.success[i * g.nOmega + j] === 1;
        const dir = g.omegas[j] > 0.05 ? 'still falling toward the fingertips'
          : g.omegas[j] < -0.05 ? 'still falling back toward the heel'
          : 'arriving with no rotation';
        probe.draw(q, `${g.thetasDeg[i] > 0 ? '+' : ''}${g.thetasDeg[i].toFixed(0)}° past balance at `
          + `${g.omegas[j].toFixed(1)} rad/s, ${dir} — ${caught ? 'the wrist recovers it' : 'it falls'}`);
      };
      showCatch(0, 0);
      const surface = plotSurface(chart, 300);
      if (surface) {
        surface.style.touchAction = 'none';
        const onMove = (e) => {
          const r = surface.getBoundingClientRect();
          const th = chart.scale('x').invert(e.clientX - r.left);
          const om = chart.scale('y').invert(e.clientY - r.top);
          if (Number.isFinite(th) && Number.isFinite(om)) showCatch(th, om);
        };
        surface.addEventListener('pointermove', onMove);
        surface.addEventListener('pointerdown', onMove);
      }

      const recompute = html`<button ${catchState.computing ? 'disabled' : ''}>Recompute for current body and strength</button>`;
      recompute.addEventListener('click', () => {
        if (catchState.computing) return;
        catchState.computing = true;
        catchState.rev++;
        catchState.notify?.(catchState);
        const worker = new Worker(new URL('./opt-worker.js', import.meta.url), { type: 'module' });
        invalidation.then(() => worker.terminate());
        worker.onmessage = ({ data }) => {
          if (data.type === 'done') {
            catchState.grid = data;
            catchState.computing = false;
            worker.terminate();
            catchState.rev++;
            catchState.notify?.(catchState);
          }
        };
        worker.postMessage({
          type: 'catchWindow',
          modelParams: { heightM, massKg, straddleDeg },
          strengthOpts: { scale: strengthScale },
          gridOpts: { nTheta: 27, nOmega: 23 },
        });
      });
      const status = catchState.computing ? html`<em> computing, this takes a moment...</em>` : '';
      return html`<figure>
        <div style="display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;">
          ${chart}
          ${probe.element}
        </div>
        <div>${recompute}${status}</div>
        <figcaption>Hover the map to see the arrival each cell stands for. Green cells: arrival states (wrist angle offset, wrist rate) from which the wrist-strategy balance controller recovers to a still handstand. The orange curve is the current playback run in this plane, ending at the dot. Positive angle offsets lean toward the fingertips.</figcaption>
      </figure>`;
    })();
    display(catchView);
  </script>
  <script id="coda" type="text/markdown">
    ## What the model taught along the way

    Some of the best findings were failures the simulation produced on its own, each now pinned by a test so it stays true. Holding a perfectly stacked handstand with perfect joint servos still topples, because the stacked pose rests the pressure on the heel of the palm and a heel pivot has no restoring authority: balance must be actively bought with wrist torque, and biasing the pressure toward mid palm is worth more than any amount of stiffness. Servos without anticipatory gravity compensation sag, lean, and ride the wrist up to its strength cap and over the fingertips. Opening the hips or shoulders before shifting weight onto the hands rocks the body straight back off its palms, which is the beginner's press attempt in one sentence. And with muscle activation limited to a fifty millisecond time constant, the recoverable catch window for a kick-up shrinks by half, which is why arriving slowly matters more than arriving precisely.

    The question this notebook opens with — why pressing is so much harder than kicking up — turns out to have a number attached, and it is a bigger number than I expected. Re-optimizing both entries against the same body says the kick-up goes at a shoulder rated 1.6 newton metres per kilogram with average hamstrings, which is to say a recreational adult, while the press on that same body does not merely stall, it collapses, and it is still collapsing at 2.2. Somewhere between 2.2 and 2.8 it starts working. So the press asks for something like half again the shoulder strength of the kick-up, and that gap, not technique and not timing, is most of the answer. It is tempting to split the difference and give the model one body that can do both, and that does not work: handed a shoulder rated for the press, the optimizer promptly spends it, and the kick-up drifts back out over the hands into the planche it was talked out of earlier, arriving with a fifth of the energy it needs instead of a third and riding ten degrees outside its wrist range for most of the rollout. Pricing effort properly discourages that; it does not prevent it. The strength ceiling is doing real work, so the default body here is one that can kick up and cannot press, and the press section is an account of what it would take rather than something you can watch this body do.

    Flexibility turns out to play a different role than the folklore gives it. Short hamstrings do not block the press: with a shoulder at 2.8 the model presses up perfectly well from an ordinary 85 degree fold. What flexibility buys is cheapness. The same press with hamstrings that reach 125 degrees scores 1.03 against 2.53 for the stiff one, so roughly two and a half times less work, effort and shoulder time for the identical outcome. That is the honest version of the coaching advice: the flexible press is not a different skill, it is the same skill with most of the cost taken out, which over a training career is the difference between a press you can do and a press you can do twenty times.

    The most instructive of them arrived late, and it was an overshoot. A shoulder pressing to vertical under load spends the whole press against its torque cap, and when the body finally stacks and the demand falls away there is nothing left holding it back: it sails through the balanced position and rings, five reversals from thirty degrees out, an outright topple from forty five. Two things were wrong and both are worth stating plainly. A servo damped by one constant cannot serve joints whose inertia spans two hundred to one, and a position gain that commands ten radians per second at forty five degrees of error is asking for a stop the muscle has no way to make. Deceleration has to be planned from the reserve that gravity has not already spent, which is the mathematical form of a coaching instruction: do not press so hard into the finish that you cannot meet it. With the damping read off the mass matrix and the approach speed limited to what remains brakeable, the same press arrives with no measurable overshoot and no reversals at all, and forty five degrees, which used to fall, simply arrives. The kick-up, re-optimized against the corrected servo, tells the same story from the other end: it reaches the handstand three tenths of a second sooner, spends noticeably less of the entry with the shoulder flat against its cap, and then holds its last second and a half without one joint reversing direction, where the previous best reversed fourteen times and was still moving four times as fast when the clock ran out.

    That kick-up had one more thing wrong with it, and the model had no way to say so: it hyperextended a knee nearly forty degrees, drove the wrist forty five degrees beyond its range, and called the result a success, because range of motion was a fine rather than a wall. It is a good reminder of what an optimizer actually optimizes. Give it a cost function in which a career-ending knee injury is worth three hundredths of a unit and it will spend that every time, cheerfully, and the trajectory will still look plausible in the replay. Passive end-stops make the anatomy part of the mechanism instead of part of the scoring, and the technique that comes back out of the optimizer afterward is not merely legal, it is cheaper: it stops trying to buy range it does not have. The same normalization trap was hiding in the range-of-motion term itself, which measured violations in squared radians: twelve degrees outside your anatomy is 0.044 of those, so even holding it for an entire rollout scored less than a fifth of a unit against about one and a half for the work. Measuring the violation against the end-stop's own five degree design penetration, and charging for the worst instant as well as the average, brought the wrist and both knees exactly inside their limits and cut the remaining hamstring stretch roughly in half.

    That last one does not go to zero, and the reason it does not is the most useful thing in this section. Pricing the hamstring harder does reduce the stretch, but it also drains the entry: from twelve degrees of stretch down to seven, the model's momentum at liftoff falls by a fifth and the time it spends with the shoulder flat against its cap rises from a third of the entry to nearly half. The swing that spares your shoulders is the same swing that stretches your hamstring, and there is no setting of the weights that gets both. A model built to be argued with will eventually hand back a trade-off instead of an answer, and this is a real one: it is the choice between kicking up and pressing up, written in joint angles.

    The same trick, played once more and better disguised, was the last thing to go. Given a shoulder rated at two newton metres per kilogram of body mass, the model quietly stopped kicking up. It leaned out over its hands, held the body sixty degrees off vertical on straight arms at full effort for a second, and pressed out of that into the handstand: a planche press, a skill several years further along than the one being studied, substituted silently for the one that was asked for. Nothing objected, because the saturation term charged about three thousandths of a cost unit for a joint pinned at its limit for an entire rollout, against two for the work it was doing. Maximal effort was free, so the model bought the strongest technique available to it. Rating the shoulders and wrists for someone who can hold a handstand rather than someone who can hold a planche closes the position off — holding a straight body thirty degrees off the line costs 1.9 Nm/kg at the shoulder against a recreational 1.6 — and charging properly for living at the cap removes the incentive to go looking.

    Strength alone will not do it, though, and the reason is worth stating. Cutting the shoulder far enough to make a planche outright impossible also makes every entry impossible, because a kick-up passes through those same leaned positions on its way up. What separates the two skills is not geometry but duration: a kick-up is a position you pass through and a planche is a position you sit in. There is a matching trap in the cost that took longer to see, and it points the same way. Both the work term and the smoothness term fall as a movement slows down, so given a free choice of duration the optimizer will always stretch an entry out, and a kick-up stretched to two and a half seconds has quietly become a press again. A skill defined by being fast has to be bounded to be fast, or the optimizer will define it away.

    The model is a two dimensional cartoon: merged arms, locked elbows, no lateral balance, no straddle dynamics beyond a projection, penalty friction, torque servos instead of muscles and tendons, and an optimizer that finds good technique rather than provably best technique. Its numbers should be read as mechanisms and thresholds, not prescriptions. But the mechanisms agree with what the force plates and the coaches have been saying all along, and it is rather pleasant to watch the folklore sort itself into the parts that are physics and the parts that are just repetition.
  </script>
  <script id="gallery-section" type="text/markdown">
    ## Every optimization run, on the record

    Trajectory optimization fails in creative ways, and a cost number proves nothing. So every optimization result this notebook relies on is embedded and re-simulated here, live, as a filmstrip: successes, stalls, and flails alike. Each row is also available in the playback scenario menu above (the entries in brackets) with full force instrumentation. If a row looks wrong, it is wrong, whatever its cost says.
  </script>
  <script id="trajectory-gallery" type="text/x-typescript">
    const galleryView = (() => {
      if (!PRESET_GALLERY.length) return html`<p><em>No runs embedded yet.</em></p>`;
      const rows = PRESET_GALLERY.map((g, gi) => {
        const prof = g.strength ? strengthProfile(model.massKg, { overrides: g.strength }) : strengthProf;
        const rom = { ...ROM_DEFAULTS, ...(g.rom || {}) };
        const r = runScenario(model, ws, prof, {
          scenario: g.scenario,
          knots: g.knots.map((k) => Float64Array.from(k)),
          T: g.T, settleT: 2.5, dt: 2.5e-4, rom,
          ...resolveConfig(g.config),
        });
        const rec = r.rec;
        const strip = html`<div style="display:flex; gap:3px; flex-wrap:wrap;"></div>`;
        const NK = 7;
        for (let i = 0; i < NK; i++) {
          const k = Math.round((i / (NK - 1)) * (rec.t.length - 1));
          const cw = 96, chh = 140;
          const cell = html`<div style="text-align:center;"></div>`;
          const cv = document.createElement('canvas');
          cv.width = Math.round(cw * devicePixelRatio);
          cv.height = Math.round(chh * devicePixelRatio);
          cv.style.width = `${cw}px`;
          cv.style.height = `${chh}px`;
          const ctx = cv.getContext('2d');
          ctx.scale(devicePixelRatio, devicePixelRatio);
          drawScene(ctx, {
            model, ws, q: Float64Array.from(rec.q[k]),
            width: cw, height: chh, theme: poseState.theme,
            view: { cx: 0.05, yLo: -0.15, yHi: 2.15 },
          });
          cell.appendChild(cv);
          cell.appendChild(html`<small style="opacity:.6">${rec.t[k].toFixed(1)}s</small>`);
          strip.appendChild(cell);
        }
        // Runs span several bodies: the shoulder and wrist ratings and the
        // hamstring limit were all tightened partway through this notebook's
        // life, and each artifact replays under the anatomy it was made with.
        // Comparing two rows is only meaningful once you can see which body
        // each one had, so every row states it, and anything differing from
        // today's defaults is called out.
        const anat = (() => {
          const sh = g.strength?.shoulder?.t0Vol ?? STRENGTH_DEFAULTS.shoulder.t0Vol;
          const wr = g.strength?.wrist?.t0Vol ?? STRENGTH_DEFAULTS.wrist.t0Vol;
          const ham = rom.hipFlexStraightKneeMaxDeg;
          const dflt = sh === STRENGTH_DEFAULTS.shoulder.t0Vol
            && wr === STRENGTH_DEFAULTS.wrist.t0Vol
            && ham === ROM_DEFAULTS.hipFlexStraightKneeMaxDeg;
          return { text: `shoulder ${sh} · wrist ${wr} Nm/kg · hamstrings to ${ham}°`, dflt };
        })();
        const v = r.verdict;
        const tag = v.success
          ? { text: 'settled handstand', color: '#2e8b57' }
          : v.upright && v.feetFree
            ? { text: 'inverted, not settled', color: '#c98a00' }
            : { text: 'does not reach a handstand', color: '#c0392b' };
        return html`<div style="margin: 26px 0;">
          ${strip}
          <div style="margin-top:4px;"><strong>${g.label}</strong>
            <span style="color:${tag.color}; font-weight:600;"> — ${tag.text}</span>
            <small style="opacity:.6"> (replayed live; end CoM ${v.comX.toFixed(2)}, ${v.comY.toFixed(2)} m)</small>
          </div>
          <div><small style="opacity:.6">${anat.text}${anat.dflt ? '' : ' — not the current default body'}</small></div>
        </div>`;
      });
      return html`<figure>
        ${rows}
        <figcaption>Each row re-simulates an embedded optimization result at the current page load and renders seven keyframes. Verdict labels come from the replay, not from the stored run. Each row also replays under the strength and flexibility it was produced with, which is not the same for every row: the line under each strip says which body it had, and flags the ones that are not today's defaults.</figcaption>
      </figure>`;
    })();
    display(galleryView);
  </script>
  <script id="validation-section" type="text/markdown">
    ## Validation

    The physics core is exercised by offline gates (run with `node src/notebooks/handstand/test/dynamics.mjs` and friends): the recursive Newton-Euler dynamics against finite differences of the energy function, free-fall momentum conservation, a textbook double pendulum, penalty-contact settling, the Yeadon-King torque curve landmarks, deterministic optimization, and the arrival gates: that a constant-damping servo really does ring its way into the balanced pose and topple from forty five degrees out, and that the inertia-scaled, brake-limited servo arrives from the same start with no overshoot. The cell below reruns a fast subset in your browser against the current model so the page can vouch for itself.
  </script>
  <script id="validation-checks" type="text/x-typescript">
    const validation = (() => {
      const zeroV = new Float64Array(model.nq);
      const checks = [];
      // Mass matrix symmetry and SPD at a bent pose.
      {
        const q = Float64Array.from(poseState.q);
        const M = new Float64Array(model.nq * model.nq);
        massMatrix(model, q, M, ws);
        let asym = 0;
        for (let i = 0; i < model.nq; i++) {
          for (let j = 0; j < model.nq; j++) asym = Math.max(asym, Math.abs(M[i * model.nq + j] - M[j * model.nq + i]));
        }
        checks.push({ name: 'mass matrix symmetric', ok: asym < 1e-9, detail: `max asymmetry ${asym.toExponential(1)}` });
      }
      // Static torques match finite differences of potential energy.
      {
        const q = Float64Array.from(poseState.q);
        const tau = new Float64Array(model.nq);
        rnea(model, q, zeroV, zeroV, tau, null, { ws });
        const eps = 1e-6;
        let worst = 0;
        for (let i = 3; i < model.nq; i++) {
          const qp = q.slice(); qp[i] += eps;
          const qm = q.slice(); qm[i] -= eps;
          const dV = (energy(model, qp, zeroV, ws).potential - energy(model, qm, zeroV, ws).potential) / (2 * eps);
          worst = Math.max(worst, Math.abs(tau[i] - dV));
        }
        checks.push({ name: 'static torques = dV/dq', ok: worst < 1e-5, detail: `max err ${worst.toExponential(1)} Nm` });
      }
      // Strength model landmarks.
      {
        const jp = strengthProf.shoulder;
        const iso = availableTorque(jp, 1, 0);
        const con = availableTorque(jp, 1, 8);
        const ecc = availableTorque(jp, -1, 8);
        checks.push({
          name: 'strength: eccentric > isometric > fast concentric',
          ok: ecc > iso && iso > con && con > 0,
          detail: `${ecc.toFixed(0)} / ${iso.toFixed(0)} / ${con.toFixed(0)} Nm`,
        });
      }
      // Total mass budget.
      {
        let m = 0;
        for (let i = 0; i < model.nb; i++) m += model.mass[i];
        checks.push({ name: 'segment masses sum to body mass', ok: Math.abs(m - model.massKg) < 1e-9, detail: `${m.toFixed(3)} kg` });
      }
      const rows = checks.map((c) => html`<div>${c.ok ? '✓' : '✗'} ${c.name} <small style="opacity:0.6">(${c.detail})</small></div>`);
      const allOk = checks.every((c) => c.ok);
      return html`<div style="font-variant-numeric: tabular-nums; ${allOk ? '' : 'color:#c0392b;'}">${rows}</div>`;
    })();
    display(validation);
  </script>
