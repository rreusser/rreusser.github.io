  <script id="title" type="text/markdown">
    # Feynman's Sum Over Paths
  </script>

  <script id="intro-1" type="text/markdown">
    Here is the one question all of quantum mechanics answers: *a particle is here now — what are the odds it turns up over there a little later?* Feynman's way of answering it is a single strange instruction to the particle. **Explore every path.** It does not choose a route from here to there; it takes all of them at once, and what we can predict is built from the whole bundle.

    The bookkeeping is a picture you can hold in your head. Along each path the particle carries a little rotating arrow, an imaginary **stopwatch**, whose hand winds around as it goes. To find the odds of arriving, you lay every path's final arrow **tip to tail** and measure the arrow that closes the chain. The probability is that length, squared. This whole article is that one picture, turned over and over until the rest of quantum mechanics falls out of it.
  </script>

  <script id="intro-2" type="text/markdown">
    We follow the teaching path of Taylor, Vokos, O'Meara, and Thornber, *Teaching Feynman's sum-over-paths quantum theory* (Computers in Physics 12, 190, 1998). The plan: meet the arrows on something you can measure, learn how fast they spin, watch the whole sum build itself, and then let it grow into the wavefunction and the discrete energies of atoms. Figures marked <span class="youtry">try it</span> are yours to drag or click.
  </script>

  <script id="palette" type="text/x-typescript">

  <script id="draw-helpers" type="text/x-typescript">
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const HEADER = 26; // reserved top band for readouts, above every panel

    function mapLin(a0, a1, b0, b1) {
      const s = (b1 - b0) / ((a1 - a0) || 1);
      return (v) => b0 + (v - a0) * s;
    }

    function canvasPos(canvas, e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function panelBg(ctx, rect, pal, title) {
      ctx.save();
      roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 7);
      ctx.fillStyle = pal.panel; ctx.fill();
      ctx.lineWidth = 1; ctx.strokeStyle = pal.border; ctx.stroke();
      if (title) {
        ctx.fillStyle = pal.muted; ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(title, rect.x + 9, rect.y + 7);
      }
      ctx.restore();
    }

    // Single readout band along the very top of a figure, above all panels, so
    // it can never collide with a panel title.
    function header(ctx, st, left, right, colL, colR) {
      const pal = palette;
      ctx.font = '12px system-ui, sans-serif'; ctx.textBaseline = 'middle';
      if (left) { ctx.textAlign = 'left'; ctx.fillStyle = colL || pal.fg; ctx.fillText(left, 16, 13); }
      if (right) { ctx.textAlign = 'right'; ctx.fillStyle = colR || pal.muted; ctx.fillText(right, st.w - 16, 13); }
    }

    function drawVec(ctx, x1, y1, x2, y2, color, lw) {
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const len = Math.hypot(x2 - x1, y2 - y1);
      const hs = Math.min(len, Math.max(4, lw * 2.4));
      if (hs < 1) return;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - hs * Math.cos(ang - 0.42), y2 - hs * Math.sin(ang - 0.42));
      ctx.lineTo(x2 - hs * Math.cos(ang + 0.42), y2 - hs * Math.sin(ang + 0.42));
      ctx.closePath(); ctx.fill();
    }

    function drawClock(ctx, cx, cy, r, phi, color, pal) {
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI);
      ctx.strokeStyle = pal.border; ctx.lineWidth = 1; ctx.stroke();
      drawVec(ctx, cx, cy, cx + r * Math.cos(phi), cy - r * Math.sin(phi), color, 2);
    }

    function drawChain(ctx, ox, oy, arrows, scale, pathColor, resColor) {
      let x = ox, y = oy;
      ctx.strokeStyle = pathColor; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y);
      for (const a of arrows) { x += a.re * scale; y -= a.im * scale; ctx.lineTo(x, y); }
      ctx.stroke();
      drawVec(ctx, ox, oy, x, y, resColor, 2.5);
      return { x, y };
    }

    function setupCanvas(canvas, ctx, w, h) {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Unified pointer/touch drag: `down` returns true if it grabbed something
    // (only then do we capture + preventDefault); pointer capture + the canvas's
    // touch-action:none keep the drag alive and stop the page scrolling.
    function attachDrag(canvas, handlers) {
      const { down, move, up } = handlers;
      const onDown = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (down && down(e) === false) return;
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        e.preventDefault(); e.stopPropagation();
      };
      const onMove = (e) => { if (move && move(e)) { e.preventDefault(); e.stopPropagation(); } };
      const onUp = (e) => { if (up) up(e); try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} };
      canvas.addEventListener('pointerdown', onDown);
      canvas.addEventListener('pointermove', onMove);
      canvas.addEventListener('pointerup', onUp);
      canvas.addEventListener('pointercancel', onUp);
      invalidation.then(() => {
        canvas.removeEventListener('pointerdown', onDown);
        canvas.removeEventListener('pointermove', onMove);
        canvas.removeEventListener('pointerup', onUp);
        canvas.removeEventListener('pointercancel', onUp);
      });
    }

    function makeFigure(id, h0, init, draw, attach) {
      const canvas = document.createElement('canvas');
      canvas.id = id + '-canvas';
      canvas.style.touchAction = 'none';
      const ctx = canvas.getContext('2d');
      const state = Object.assign({ w: 720, h: h0, last: null, tSim: 0, dirty: true, anim: true }, init);
      const fig = { canvas, ctx, state, ui: { expanded: false } };
      function frame(now) {
        if (state.last == null) state.last = now;
        const dt = Math.min(0.05, (now - state.last) / 1000);
        state.last = now;
        if (state.anim && !state.frozen) state.tSim += dt;
        else if (!state.dirty) return;
        state.dirty = false;
        draw(ctx, state, now);
      }
      const loop = createFrameLoop(frame);
      invalidation.then(() => loop.cancel());
      const redraw = () => { state.dirty = true; };
      redrawHooks.add(redraw);
      invalidation.then(() => redrawHooks.delete(redraw));
      if (attach) attach(fig);
      return fig;
    }
  </script>

  <script id="a1-head" type="text/markdown">
    ## 1. Meet the arrows

    Before trusting arrows for an invisible electron, watch them account for something you can measure. Shine light at a sheet of glass. About 4% reflects off the front surface and 4% off the back, so you might guess 8% total. Instead the reflection swings between nearly 0% and about 16%, purely with the thickness of the glass.

    The arrows explain it exactly. There are two paths back to your eye, one bouncing off the front, one off the back. The back path is longer, so its stopwatch winds further before it returns. Lay the two arrows tip to tail and the resultant is long when they agree and nearly zero when they oppose. Squared, it is the reflection.
  </script>

  <script id="a1-fig" type="text/x-typescript">
    const fig1 = (() => {
      const A = 0.2, n = 1.5, lambda = 120;
      const init = { anim: false, thick: 95, geo: null, drag: false };
      const delta = (d) => (4 * Math.PI * n * d) / lambda;

      function draw(ctx, st, now) {
        const pal = palette;
        const { w, h } = st;
        ctx.clearRect(0, 0, w, h);
        const pad = 14, gap = 14, top = HEADER;
        const leftW = (w - 2 * pad - gap) * 0.54;
        const left = { x: pad, y: top, w: leftW, h: h - top - pad };
        const right = { x: pad + leftW + gap, y: top, w: w - 2 * pad - gap - leftW, h: h - top - pad };

        panelBg(ctx, left, pal, 'light on a glass sheet');
        const frontX = left.x + left.w * 0.34;
        const maxThick = left.w * 0.42;
        const d = clamp(st.thick, 6, maxThick);
        const backX = frontX + d;
        st.geo = { frontX, maxThick };
        ctx.save();
        ctx.fillStyle = pal.isDark ? '#26405233' : '#8fc4e022';
        ctx.fillRect(frontX, left.y + 26, backX - frontX, left.h - 52);
        ctx.strokeStyle = pal.accent; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(frontX, left.y + 26); ctx.lineTo(frontX, left.y + left.h - 26); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(backX, left.y + 26); ctx.lineTo(backX, left.y + left.h - 26); ctx.stroke();
        ctx.restore();
        const rayY = left.y + left.h * 0.52;
        const srcX = left.x + 14;
        drawVec(ctx, srcX, rayY - 30, frontX, rayY - 3, pal.muted, 1.3);
        drawVec(ctx, frontX, rayY - 3, srcX, rayY - 30, pal.warm, 1.6);
        drawVec(ctx, backX, rayY + 3, srcX + 10, rayY + 32, pal.accent, 1.6);
        ctx.setLineDash([3, 3]); ctx.strokeStyle = pal.muted; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(frontX, rayY - 3); ctx.lineTo(backX, rayY + 3); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = pal.muted; ctx.font = '11px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText('drag the back surface', (frontX + backX) / 2, left.y + left.h - 8);

        panelBg(ctx, right, pal, 'the two arrows, added');
        const cy = right.y + right.h * 0.46;
        const ar = [arrow(Math.PI, A), arrow(delta(d), A)];
        const scale = Math.min(right.w, right.h) * 0.85;
        drawClock(ctx, right.x + right.w * 0.32, right.y + right.h - 40, 15, Math.PI, pal.warm, pal);
        drawClock(ctx, right.x + right.w * 0.64, right.y + right.h - 40, 15, delta(d), pal.accent, pal);
        ctx.fillStyle = pal.muted; ctx.font = '10px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillText('front', right.x + right.w * 0.32, right.y + right.h - 22);
        ctx.fillText('back', right.x + right.w * 0.64, right.y + right.h - 22);
        const startX = right.x + right.w * 0.5 - (ar[0].re + ar[1].re) * scale * 0.5;
        const end = drawChain(ctx, startX, cy, ar, scale, pal.grid, pal.warm);
        const R = ((end.x - startX) ** 2 + (end.y - cy) ** 2) / (scale * scale);

        header(ctx, st, `reflection = ${(R * 100).toFixed(1)}%`, `thickness ${(d / lambda).toFixed(2)} λ`);
      }

      function attach(fig) {
        const { canvas, state: st } = fig;
        const setThick = (e) => {
          const g = st.geo; if (!g) return;
          st.thick = clamp(canvasPos(canvas, e).x - g.frontX, 6, g.maxThick);
          st.dirty = true;
        };
        attachDrag(canvas, {
          down: (e) => {
            const g = st.geo; if (!g) return false;
            const p = canvasPos(canvas, e);
            if (p.x > g.frontX - 10 && p.x < g.frontX + g.maxThick + 60) { st.drag = true; setThick(e); return true; }
            return false;
          },
          move: (e) => { if (st.drag) { setThick(e); return true; } return false; },
          up: () => { st.drag = false; }
        });
      }

      return makeFigure('fig1', 300, init, draw, attach);
    })();
  </script>

  <!-- ACT 2: how fast does the arrow spin?                                -->
  <!-- =================================================================== -->
  <script id="a2-head" type="text/markdown">
    ## 2. How fast does the arrow spin?

    For light, the stopwatch turns at the light's own frequency. For a particle with mass there is no obvious clock, so we borrow one idea from ordinary mechanics. Throw a stone between two fixed events and, of all the worldlines it could trace through space and time, the real one makes the **action** as small as possible. Action is the running tally of kinetic minus potential energy,

    ${tex.block`S=\int (\text{KE}-\text{PE})\,dt.`}

    Try to beat nature at it. The flat "sit still" worldline scores ${tex`S=0`}; arching upward trades a little motion for a lot of negative potential and pushes ${tex`S`} down, until you arch too hard and overshoot.
  </script>

  <script id="a2-fig" type="text/x-typescript">
    const fig2 = (() => {
      const g = 9.8, m = 1, T = 1.0, K = 9;
      const xLo = -0.2, xHi = 1.6;
      const init = { anim: false, nodes: null, drag: -1, Smin: 0 };

      function ensure(st) {
        if (st.nodes) return;
        st.nodes = [];
        for (let i = 0; i < K; i++) st.nodes.push({ t: (T * i) / (K - 1), x: 0 });
        const cl = classicalUniformField(0, 0, 0, T, g);
        st.Smin = actionUniformField(st.nodes.map((nd) => ({ t: nd.t, x: cl(nd.t) })), m, g);
      }

      function geom(st) {
        const pad = 16; const rect = { x: pad, y: HEADER, w: st.w - 2 * pad, h: st.h - HEADER - pad };
        return {
          rect,
          sx: mapLin(0, T, rect.x + 34, rect.x + rect.w - 20),
          sy: mapLin(xLo, xHi, rect.y + rect.h - 24, rect.y + 22),
          syInv: mapLin(rect.y + rect.h - 24, rect.y + 22, xLo, xHi)
        };
      }

      function draw(ctx, st, now) {
        ensure(st);
        const pal = palette;
        ctx.clearRect(0, 0, st.w, st.h);
        const { rect, sx, sy } = geom(st);
        panelBg(ctx, rect, pal, 'worldline of a thrown stone  (time →, height ↑)');
        ctx.strokeStyle = pal.grid; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sx(0), sy(0)); ctx.lineTo(sx(T), sy(0)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sx(0), sy(xLo)); ctx.lineTo(sx(0), sy(xHi)); ctx.stroke();

        const S = actionUniformField(st.nodes, m, g);
        const near = S < st.Smin + 0.15;
        ctx.beginPath();
        st.nodes.forEach((nd, i) => { const px = sx(nd.t), py = sy(nd.x); if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); });
        ctx.strokeStyle = near ? pal.good : pal.accent; ctx.lineWidth = 2.2; ctx.stroke();
        st.nodes.forEach((nd, i) => {
          const fixed = i === 0 || i === K - 1;
          ctx.beginPath(); ctx.arc(sx(nd.t), sy(nd.x), fixed ? 4 : 6, 0, 2 * Math.PI);
          ctx.fillStyle = fixed ? pal.muted : (near ? pal.good : pal.accent);
          ctx.fill(); ctx.strokeStyle = pal.bg; ctx.lineWidth = 1.5; ctx.stroke();
        });

        header(ctx, st, `action S = ${S.toFixed(2)}`, near ? 'least action — the classical path' : `least possible ≈ ${st.Smin.toFixed(2)}`, near ? pal.good : pal.fg, near ? pal.good : pal.muted);
      }

      function attach(fig) {
        const { canvas, state: st } = fig;
        attachDrag(canvas, {
          down: (e) => {
            if (!st.nodes) return false;
            const p = canvasPos(canvas, e); const { sx, sy } = geom(st);
            let best = -1, bd = 20 * 20;
            st.nodes.forEach((nd, i) => {
              if (i === 0 || i === st.nodes.length - 1) return;
              const dx = p.x - sx(nd.t), dy = p.y - sy(nd.x); const dd = dx * dx + dy * dy;
              if (dd < bd) { bd = dd; best = i; }
            });
            if (best >= 0) { st.drag = best; st.dirty = true; return true; }
            return false;
          },
          move: (e) => {
            if (st.drag < 0) return false;
            const { syInv } = geom(st);
            st.nodes[st.drag].x = clamp(syInv(canvasPos(canvas, e).y), xLo, xHi);
            st.dirty = true; return true;
          },
          up: () => { st.drag = -1; }
        });
      }

      return makeFigure('fig2', 340, init, draw, attach);
    })();
  </script>

  <script id="a2-tail" type="text/markdown">
    That gives us the missing clock. Feynman's one postulate is that a particle's stopwatch turns by exactly its action, ${tex`S/\hbar`}, along whatever path it takes. The arrow now has a well-defined rate for anything, massive or not. So let it loose on every path at once.
  </script>

  <script id="a3-head" type="text/markdown">
    ## 3. Every path at once

    Scroll through the sum being built. One electron, one question — reach ${tex`B`} from ${tex`A`} — and the same stopwatch, applied to every worldline between them.
  </script>

  <script id="stage-render" type="text/x-typescript">
    const renderStage = (ctx, s, w, h) => {
      const pal = palette;
      const cw = Math.min(w - 48, 1000), ch = Math.min(h - 48, 640);
      const ox = (w - cw) / 2, oy = (h - ch) / 2;
      const gap = 48;
      const stW = Math.max(220, cw * 0.5), spW = cw - stW - gap;
      const stp = { x: ox, y: oy, w: stW, h: ch };
      const size = Math.min(spW, ch * 0.92);
      const spi = { x: ox + stW + gap, y: oy + (ch - size) / 2, w: size, h: size };

      const T = 1, etaMax = 3.4;
      const m = Math.exp(s.logMass);
      const nPaths = Math.max(1, Math.round(s.paths));
      const pencil = Math.sqrt((Math.PI * T) / (2 * m));
      const sx = mapLin(-etaMax, etaMax, stp.x + 30, stp.x + stp.w - 30);
      const sy = mapLin(0, T, stp.y + stp.h - 46, stp.y + 46);

      const etas = [];
      if (nPaths === 1) etas.push(0);
      else for (let i = 0; i < nPaths; i++) etas.push(-etaMax + (2 * etaMax * i) / (nPaths - 1));

      // worldlines
      for (const eta of etas) {
        const inP = Math.abs(eta) <= pencil;
        const hot = nPaths === 1 || (s.highlight > 0.5 && inP);
        ctx.strokeStyle = nPaths === 1 ? pal.warm : (hot ? pal.accent : pal.faint);
        ctx.lineWidth = hot ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(sx(0), sy(0)); ctx.lineTo(sx(eta), sy(T / 2)); ctx.lineTo(sx(0), sy(T));
        ctx.stroke();
      }
      if (nPaths > 1) {
        ctx.strokeStyle = pal.warm; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(sx(0), sy(0)); ctx.lineTo(sx(0), sy(T)); ctx.stroke();
      }

      // stopwatch arrows on a sample of paths
      if (s.arrows > 0.01) {
        const showN = Math.min(etas.length, 9);
        ctx.globalAlpha = clamp(s.arrows, 0, 1);
        for (let j = 0; j < showN; j++) {
          const eta = etas[Math.round((j * (etas.length - 1)) / (showN - 1))];
          drawClock(ctx, sx(eta), sy(T / 2), 9, (2 * m * eta * eta) / T, pal.accent, pal);
        }
        ctx.globalAlpha = 1;
      }

      // endpoints + labels
      for (const tt of [0, T]) { ctx.beginPath(); ctx.arc(sx(0), sy(tt), 5, 0, 2 * Math.PI); ctx.fillStyle = pal.fg; ctx.fill(); }
      ctx.fillStyle = pal.fg; ctx.font = '600 15px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.textBaseline = 'top'; ctx.fillText('B', sx(0), sy(T) + 9);
      ctx.textBaseline = 'bottom'; ctx.fillText('A', sx(0), sy(0) - 9);

      // arrow chain (Cornu spiral), revealed by s.sum
      if (s.sum > 0.01) {
        const full = etas.map((eta) => arrow((2 * m * eta * eta) / T));
        const kk = Math.max(1, Math.floor(full.length * clamp(s.sum, 0, 1)));
        const ar = full.slice(0, kk);
        const scale = (spi.w * 0.8) / Math.max(6, Math.sqrt(full.length) * 1.7);
        let cxr = 0, cyr = 0; for (const a of full) { cxr += a.re; cyr += a.im; }
        const oxs = spi.x + spi.w / 2 - (cxr * scale) / 2;
        const oys = spi.y + spi.h / 2 + (cyr * scale) / 2;
        drawChain(ctx, oxs, oys, ar, scale, pal.accent, pal.warm);
        ctx.fillStyle = pal.muted; ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillText('add every arrow, tip to tail', spi.x + spi.w / 2, spi.y + spi.h + 22);
      }
    };
  </script>

  <script id="a3-tail" type="text/markdown">
    That last step is the whole reason the everyday world looks classical. Nothing switched off; the heavy particle's action is simply enormous in units of ${tex`\hbar`}, so its arrows spin so fast that every path but the least-action one cancels against its neighbor. Drive the mass yourself and watch the bundle of surviving paths tighten to a single line.

  <script id="a3-fig" type="text/x-typescript">
    const fig3 = (() => {
      const T = 1, etaMax = 3.2, NP = 121, mLo = 0.4, mHi = 60;

      function draw(ctx, st, now) {

        const m = Math.exp(st.logm);
        const etas = [];
        for (let i = 0; i < NP; i++) etas.push(-etaMax + (2 * etaMax * i) / (NP - 1));
        const pencil = Math.sqrt((Math.PI * T) / (2 * m));

        panelBg(ctx, stp, pal, 'worldlines  (space →, time ↑)');
        const sx = mapLin(-etaMax, etaMax, stp.x + 16, stp.x + stp.w - 16);

        ctx.beginPath(); ctx.moveTo(sx(0), sy(0)); ctx.lineTo(sx(0), sy(T)); ctx.stroke();
        for (const tt of [0, T]) { ctx.beginPath(); ctx.arc(sx(0), sy(tt), 4, 0, 2 * Math.PI); ctx.fillStyle = pal.fg; ctx.fill(); }

        const trkY = stp.y + stp.h - 12, trkX0 = stp.x + 16, trkX1 = stp.x + stp.w - 16;

        ctx.beginPath(); ctx.arc(mt(st.logm), trkY, 6, 0, 2 * Math.PI); ctx.fillStyle = pal.accent; ctx.fill();

  <!-- ACT 4: from one arrow to a field of them                            -->
  <!-- =================================================================== -->
  <script id="a4-head" type="text/markdown">
    ## 4. From one arrow to a wavefunction

    So far we asked about one destination ${tex`B`}. Ask instead for the arrow at *every* place at a given time, and that whole row of arrows is the **wavefunction**. Its squared length at each point is the probability of finding the particle there. One rule, the **propagator**, marches the entire row forward: to make each new arrow, sum the contributions arriving from all the old ones. For a free particle it can be written exactly, and it sends a packet drifting and spreading.
  </script>

  <script id="a4-fig" type="text/x-typescript">
    const fig4 = (() => {
      const N = 161, Lx = 32, dx = Lx / (N - 1);
      const xs = Array.from({ length: N }, (_, i) => -Lx / 2 + i * dx);
      const s0 = 1.6, k0 = 1.3, m = 1, tMin = 1.2, tMax = 9;
      const init = { anim: true, x0: -9, drag: false };

      const psi0 = (x0) => xs.map((x) => {
        const g = Math.exp(-((x - x0) ** 2) / (4 * s0 * s0));
        return { re: g * Math.cos(k0 * x), im: g * Math.sin(k0 * x) };
      });

      function draw(ctx, st, now) {
        const pal = palette;
        const { w, h } = st;
        ctx.clearRect(0, 0, w, h);
        const pad = 16;
        const rect = { x: pad, y: HEADER, w: w - 2 * pad, h: h - HEADER - pad };
        panelBg(ctx, rect, pal, 'wavefunction ψ(x) marched forward by the propagator');
        const frac = 0.5 - 0.5 * Math.cos((2 * Math.PI * st.tSim) / 6);
        const T = tMin + (tMax - tMin) * frac;

        const psi = propagateFreeUniform(psi0(st.x0), dx, T, m);
        const sx = mapLin(-Lx / 2, Lx / 2, rect.x + 14, rect.x + rect.w - 14);
        const baseY = rect.y + rect.h * 0.62;
        let mx = 1e-6; for (const p of psi) mx = Math.max(mx, Math.hypot(p.re, p.im));
        const aScale = (rect.h * 0.28) / mx, dScale = (rect.h * 0.32) / (mx * mx);

        ctx.save(); roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 7); ctx.clip();
        ctx.strokeStyle = pal.faint; ctx.beginPath(); ctx.moveTo(sx(-Lx / 2), baseY); ctx.lineTo(sx(Lx / 2), baseY); ctx.stroke();
        ctx.beginPath();
        for (let i = 0; i < N; i++) { const d2 = psi[i].re ** 2 + psi[i].im ** 2; const px = sx(xs[i]), py = baseY - d2 * dScale; if (i === 0) ctx.moveTo(px, baseY); ctx.lineTo(px, py); }
        ctx.lineTo(sx(Lx / 2), baseY); ctx.closePath(); ctx.fillStyle = pal.accentSoft; ctx.fill();
        for (let i = 2; i < N; i += 3) {
          const p = psi[i], len = Math.hypot(p.re, p.im); if (len < mx * 0.06) continue;
          const ang = Math.atan2(p.im, p.re);
          drawVec(ctx, sx(xs[i]), baseY, sx(xs[i]) + Math.cos(ang) * len * aScale, baseY - Math.sin(ang) * len * aScale, pal.accent, 1.4);
        }
        ctx.strokeStyle = pal.warm; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(sx(st.x0), rect.y + 22); ctx.lineTo(sx(st.x0), rect.y + rect.h - 8); ctx.stroke(); ctx.setLineDash([]);
        ctx.restore();

        header(ctx, st, `elapsed time T = ${T.toFixed(1)}`, 'drag to relaunch');
      }

      function attach(fig) {
        const { canvas, state: st } = fig;
        const setX0 = (e) => {
          const pad = 16;
          const sxi = mapLin(pad + 14, st.w - pad - 14, -Lx / 2, Lx / 2);
          st.x0 = clamp(sxi(canvasPos(canvas, e).x), -Lx / 2 + 3, 0);
        };
        canvas.style.cursor = 'ew-resize';
        attachDrag(canvas, {
          down: (e) => { st.drag = true; setX0(e); return true; },
          move: (e) => { if (st.drag) { setX0(e); return true; } return false; },
          up: () => { st.drag = false; }
        });
      }

      return makeFigure('fig4', 300, init, draw, attach);
    })();
  </script>

      <figcaption><span class="youtry">try it</span> — drag to relaunch the packet. The arrows are the wavefunction; the propagator winds and marches them, so the packet drifts and spreads.</figcaption></figure>`, {
      id: 'wavefunction', width: Math.min(width, 720), height: 300, state: fig4.ui,
      onResize(el, w, h) { setupCanvas(fig4.canvas, fig4.ctx, w, h); fig4.state.w = w; fig4.state.h = h; fig4.state.dirty = true; }

  </script>

  <script id="a4-tail" type="text/markdown">
    A packet of finite size always spreads, because its shape has curvature the propagator turns into motion. Asking which shapes refuse to spread is the doorway to the Schrödinger equation, and to the last idea here.
  </script>

  <!-- ACT 5: standing arrows and discrete energy                          -->
  <!-- =================================================================== -->
  <script id="a5-head" type="text/markdown">
    ## 5. Standing arrows

    Trap the particle in a bowl-shaped potential. Most starting shapes slosh around forever. But a few special ones hold their shape: every arrow in the wavefunction rotates in perfect unison, so the probabilities never move. These are the **stationary states**. The twist is that only certain shapes rotate cleanly, and shapes with more wiggles must spin faster. Faster spin means more energy, so the allowed energies come in a **discrete ladder** — the reason atoms have sharp spectral lines.
  </script>

  <script id="a5-fig" type="text/x-typescript">
    const fig5 = (() => {
      const nMax = 6;
      const init = { anim: true, active: [1], rungs: [] };

      function draw(ctx, st, now) {
        const pal = palette;
        const { w, h } = st;
        ctx.clearRect(0, 0, w, h);
        const pad = 14, gap = 14, top = HEADER;
        const ladderW = Math.min(120, w * 0.2);
        const lad = { x: pad, y: top, w: ladderW, h: h - top - pad };
        const rect = { x: pad + ladderW + gap, y: top, w: w - 2 * pad - ladderW - gap, h: h - top - pad };
        const t = st.tSim;

        panelBg(ctx, lad, pal, 'energy');
        const eMax = nMax + 1.4;
        const ey = mapLin(0, eMax, lad.y + lad.h - 12, lad.y + 26);
        st.rungs = [];
        for (let n = 0; n <= nMax; n++) {
          const y = ey(n + 0.5), on = st.active.includes(n);
          st.rungs.push({ n, y, x0: lad.x + 12, x1: lad.x + lad.w - 10 });
          ctx.beginPath(); ctx.moveTo(lad.x + 12, y); ctx.lineTo(lad.x + lad.w - 10, y);
          ctx.strokeStyle = on ? pal.accent : pal.grid; ctx.lineWidth = on ? 2.5 : 1; ctx.stroke();
          ctx.fillStyle = on ? pal.accent : pal.muted; ctx.font = '10px system-ui, sans-serif';
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('n=' + n, lad.x + 12, y - 8);
        }

        panelBg(ctx, rect, pal, 'ψ(x, t) as rotating arrows');
        const active = st.active.length ? st.active : [0];
        const c = 1 / Math.sqrt(active.length);
        const W = 5.5;
        const sx = mapLin(-W, W, rect.x + 14, rect.x + rect.w - 14);
        const baseY = rect.y + rect.h * 0.58;
        const NPP = 160;
        const psiAt = (x) => {
          let re = 0, im = 0;
          for (const n of active) { const ph = -energyN(n) * t, a = c * psiN(n, x); re += a * Math.cos(ph); im += a * Math.sin(ph); }
          return { re, im };
        };
        let mx = 1e-6; const vals = [];
        for (let i = 0; i <= NPP; i++) { const x = -W + (2 * W * i) / NPP; const p = psiAt(x); vals.push(p); mx = Math.max(mx, Math.hypot(p.re, p.im)); }
        const dScale = (rect.h * 0.32) / (mx * mx), aScale = (rect.h * 0.24) / mx;
        ctx.save(); roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 7); ctx.clip();
        ctx.strokeStyle = pal.faint; ctx.beginPath(); ctx.moveTo(sx(-W), baseY); ctx.lineTo(sx(W), baseY); ctx.stroke();
        ctx.beginPath();
        for (let i = 0; i <= NPP; i++) { const x = -W + (2 * W * i) / NPP; const d2 = vals[i].re ** 2 + vals[i].im ** 2; const px = sx(x), py = baseY - d2 * dScale; if (i === 0) ctx.moveTo(px, baseY); ctx.lineTo(px, py); }
        ctx.lineTo(sx(W), baseY); ctx.closePath(); ctx.fillStyle = pal.accentSoft; ctx.fill();
        for (let i = 6; i <= NPP; i += 8) {
          const x = -W + (2 * W * i) / NPP, p = vals[i], len = Math.hypot(p.re, p.im); if (len < mx * 0.08) continue;
          const ang = Math.atan2(p.im, p.re);
          drawVec(ctx, sx(x), baseY, sx(x) + Math.cos(ang) * len * aScale, baseY - Math.sin(ang) * len * aScale, pal.accent, 1.4);
        }
        ctx.restore();

        header(ctx, st, active.length === 1
          ? 'one level → arrows turn in unison → |ψ|² stands still'
          : 'two levels → rates mismatch → |ψ|² sloshes', null,
          active.length === 1 ? pal.good : pal.warm);
      }

      function attach(fig) {
        const { canvas, state: st } = fig;
        canvas.style.cursor = 'pointer';
        attachDrag(canvas, {
          down: (e) => {
            const p = canvasPos(canvas, e);
            for (const r of st.rungs) {
              if (p.x >= r.x0 - 6 && p.x <= r.x1 + 6 && Math.abs(p.y - r.y) < 14) {
                const i = st.active.indexOf(r.n);
                if (i >= 0) { if (st.active.length > 1) st.active.splice(i, 1); }
                else { if (st.active.length >= 2) st.active = [r.n]; else st.active.push(r.n); }
                st.dirty = true; return true;
              }
            }
            return false;
          }
        });
      }

      return makeFigure('fig5', 340, init, draw, attach);
    })();
  </script>

      <figcaption><span class="youtry">try it</span> — click a rung for a stationary state (arrows in unison). Click a second rung to superpose two and watch it slosh.</figcaption></figure>`, {
      id: 'stationary-states', width: Math.min(width, 720), height: 340, state: fig5.ui,

  <script id="closing" type="text/markdown">
    ## One picture, all the way down

    Trace it back. A single rule — explore every path, each carrying a stopwatch arrow, then add the arrows — gave us the interference of light, the classical principle of least action, the reason heavy things move on definite trajectories, the wavefunction and its spreading, and the discrete energies of trapped particles. Barely an equation, one picture.

    And it does not stop. The propagator is a Green's function; "add the arrows for all paths" is the path integral; and once the paths are allowed to create and destroy particles, you are doing quantum field theory with Feynman diagrams. But the seed of all of it is the arrow you have been dragging around above.

    Built after E. F. Taylor, S. Vokos, J. M. O'Meara, and N. S. Thornber, *Teaching Feynman's sum-over-paths quantum theory*, Computers in Physics **12**, 190 (1998). The path and propagator math lives in [`spq.js`](./spq.js), checked numerically before use.
  </script>
