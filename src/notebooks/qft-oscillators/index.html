  <title>Coupled Oscillators to Quantum Fields</title>

  <script id="title" type="text/markdown">
    # Coupled Oscillators to Quantum Fields
  </script>

  <script id="intro-1" type="text/markdown">
    Every quantum field theory course opens the same way. A line of masses and springs is split into normal modes and taken to a continuum, and out falls a field. That much is ordinary mechanics you can watch happen. The step that follows, quantizing those modes, is where a field starts to behave like a real quantum theory, with particles, a restless vacuum, and discrete energy.

    This is a walk through that step in one dimension, using the pictures the subject is normally taught with: a potential well, its ladder of energy levels, and wavefunctions. Each figure makes one point, and you drive it by dragging or clicking directly on the figure rather than through a bank of sliders.
  </script>

  <script id="imports" type="text/x-typescript">
    import { expandable } from './lib/expandable.js'
    import { createFrameLoop } from './lib/frame-loop.js'
    import { observeTheme } from './lib/theme.js'
    import { psiN, wignerNumber, wignerCoherent, coherentPsi } from './qho.js'
  </script>

  <script id="palette" type="text/x-typescript">
    // Stable theme-aware palette plus a registry of redraw callbacks, so a theme
    // switch repaints the figures without tearing down their persistent canvases.
    const palette = {
      isDark: false, fg: '#1b1e23', bg: '#ffffff', panel: '#fbfbfd',
      muted: '#8a9099', faint: '#00000012', grid: '#00000020', border: '#00000022',
      accent: '#3355ee', accentSoft: '#3355ee22', warm: '#c7363e',
      wignerZero: [247, 247, 247]
    };
    const redrawHooks = new Set();
    const stopThemePalette = observeTheme(({ isDark }) => {
      palette.isDark = isDark;
      palette.fg = isDark ? '#e8eaed' : '#1b1e23';
      palette.bg = isDark ? '#0f1216' : '#ffffff';
      palette.panel = isDark ? '#171b21' : '#fbfbfd';
      palette.muted = isDark ? '#868d97' : '#8a9099';
      palette.faint = isDark ? '#ffffff10' : '#00000012';
      palette.grid = isDark ? '#ffffff20' : '#00000020';
      palette.border = isDark ? '#ffffff2a' : '#00000022';
      palette.accent = isDark ? '#7d97ff' : '#3355ee';
      palette.accentSoft = isDark ? '#7d97ff2a' : '#3355ee22';
      palette.warm = isDark ? '#ff6f78' : '#c7363e';
      palette.wignerZero = isDark ? [23, 27, 33] : [247, 247, 247];
      redrawHooks.forEach((fn) => { try { fn(); } catch (e) {} });
    });
    invalidation.then(stopThemePalette);
  </script>

  <script id="draw-helpers" type="text/x-typescript">
    // Shared Canvas 2D helpers. No external dependencies.
    const heatScratch = document.createElement('canvas');
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function mapLin(a0, a1, b0, b1) {
      const s = (b1 - b0) / ((a1 - a0) || 1);
      return (v) => b0 + (v - a0) * s;
    }

    // Pointer position in the canvas's own CSS-pixel coordinates.
    function canvasPos(canvas, e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Diverging blue–neutral–red map for the Wigner function.
    function wignerRGB(v, scale, zero, out) {
      let t = clamp(v / (scale || 1), -1, 1);
      const g = Math.sign(t) * Math.pow(Math.abs(t), 0.8);
      const neg = [46, 92, 196];
      const pos = [201, 52, 60];
      const c = g >= 0 ? pos : neg;
      const u = Math.abs(g);
      out[0] = zero[0] + (c[0] - zero[0]) * u;
      out[1] = zero[1] + (c[1] - zero[1]) * u;
      out[2] = zero[2] + (c[2] - zero[2]) * u;
    }

    function drawHeat(ctx, rect, fn, opts) {
      const res = opts.res || 96;
      const { xmin, xmax, pmin, pmax, scale, zero } = opts;
      if (heatScratch.width !== res) { heatScratch.width = res; heatScratch.height = res; }
      const sctx = heatScratch.getContext('2d');
      const img = sctx.createImageData(res, res);
      const d = img.data;
      const rgb = [0, 0, 0];
      for (let j = 0; j < res; j++) {
        const p = pmax + (pmin - pmax) * (j + 0.5) / res;
        for (let i = 0; i < res; i++) {
          const x = xmin + (xmax - xmin) * (i + 0.5) / res;
          wignerRGB(fn(x, p), scale, zero, rgb);
          const k = 4 * (j * res + i);
          d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = 255;
        }
      }
      sctx.putImageData(img, 0, 0);
      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(heatScratch, rect.x, rect.y, rect.w, rect.h);
      ctx.restore();
    }

    function setupCanvas(canvas, ctx, w, h) {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    // Standard figure scaffold: a persistent canvas + state, wired to a frame
    // loop and a theme redraw hook. draw(ctx, state, now) is called per frame.
    function makeFigure(id, h0, init, draw, attach) {
      const canvas = document.createElement('canvas');
      canvas.id = id + '-canvas';
      const ctx = canvas.getContext('2d');
      const state = Object.assign({ w: 720, h: h0, last: null, tSim: 0, dirty: true, anim: true }, init);
      const fig = { canvas, ctx, state, ui: { expanded: false } };
      function frame(now) {
        if (state.last == null) state.last = now;
        const dt = Math.min(0.05, (now - state.last) / 1000);
        state.last = now;
        if (state.anim && !state.frozen) state.tSim += dt;
        else if (!state.dirty) return;
        state.dirty = false;
        draw(ctx, state, now);
      }
      const loop = createFrameLoop(frame);
      invalidation.then(() => loop.cancel());
      const redraw = () => { state.dirty = true; };
      redrawHooks.add(redraw);
      invalidation.then(() => redrawHooks.delete(redraw));
      if (attach) attach(fig);
      return fig;
    }
  </script>

  <!-- ==================== FIGURE 1 ==================== -->
  <script id="s1-head" type="text/markdown">
    ## 1. A field is a stack of oscillators

    Pin a string at both ends and pluck it. Whatever shape you pull it into, its motion is the sum of a fixed set of standing waves, the normal modes, each vibrating on its own at its own rate. The row of little oscillators underneath is that decomposition: together they add up to the string above, and a field is nothing more exotic than this, one oscillator per mode.

    **Drag the string to pluck it.**
  </script>

  <script id="s1-fig" type="text/x-typescript">
    const fig1 = (() => {
      const M = 8;                 // modes shown
      const baseW = 1.15;          // fundamental angular frequency
      const omega = (m) => m * baseW;

      function pluckAmps(xd, yd) {
        // Project a tent peaked at xd (height yd, in pixels) onto sine modes.
        const a = new Array(M).fill(0);
        const S = 128;
        for (let m = 1; m <= M; m++) {
          let s = 0;
          for (let i = 1; i < S; i++) {
            const x = i / S;
            const tent = x < xd ? (yd * x) / xd : (yd * (1 - x)) / (1 - xd);
            s += tent * Math.sin(m * Math.PI * x);
          }
          a[m - 1] = (2 * s) / S;
        }
        return a;
      }

      const init = {
        amps: pluckAmps(0.32, -46), t0: 0, drag: false,
        mainRect: null
      };

      function draw(ctx, st, now) {
        const pal = palette;
        const { w, h } = st;
        ctx.clearRect(0, 0, w, h);

        const pad = 14;
        const mainH = Math.round((h - 3 * pad) * 0.56);
        const rowH = h - 3 * pad - mainH;
        const main = { x: pad, y: pad, w: w - 2 * pad, h: mainH };
        st.mainRect = main;
        const t = st.tSim - st.t0;

        // amplitude of each mode right now
        const live = st.amps.map((a, i) => a * Math.cos(omega(i + 1) * (st.drag ? 0 : t)));

        // ---- string ----
        roundRect(ctx, main.x, main.y, main.w, main.h, 8);
        ctx.fillStyle = pal.panel; ctx.fill();
        ctx.strokeStyle = pal.border; ctx.lineWidth = 1; ctx.stroke();
        const midY = main.y + main.h / 2;
        const sx = mapLin(0, 1, main.x + 10, main.x + main.w - 10);
        // endpoints
        ctx.fillStyle = pal.muted;
        ctx.fillRect(sx(0) - 3, midY - 14, 5, 28);
        ctx.fillRect(sx(1) - 2, midY - 14, 5, 28);
        // rest line
        ctx.strokeStyle = pal.faint; ctx.beginPath();
        ctx.moveTo(sx(0), midY); ctx.lineTo(sx(1), midY); ctx.stroke();
        // curve
        const shape = (x) => {
          let u = 0;
          for (let m = 1; m <= M; m++) u += live[m - 1] * Math.sin(m * Math.PI * x);
          return u;
        };
        ctx.beginPath();
        const NS = 200;
        for (let s = 0; s <= NS; s++) {
          const x = s / NS;
          const px = sx(x), py = midY + shape(x);
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = pal.accent; ctx.lineWidth = 2.4; ctx.stroke();
        ctx.fillStyle = pal.muted;
        ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(st.drag ? 'release to let it ring' : 'drag anywhere on the string to pluck', main.x + 10, main.y + 8);

        // ---- mode row ----
        const cellW = (w - 2 * pad) / M;
        const rowY = main.y + main.h + pad;
        for (let m = 1; m <= M; m++) {
          const cx = pad + (m - 1) * cellW;
          const cell = { x: cx + 3, y: rowY, w: cellW - 6, h: rowH };
          roundRect(ctx, cell.x, cell.y, cell.w, cell.h, 5);
          ctx.fillStyle = pal.panel; ctx.fill();
          ctx.strokeStyle = pal.border; ctx.lineWidth = 1; ctx.stroke();
          const cmy = cell.y + cell.h * 0.5;
          const csx = mapLin(0, 1, cell.x + 5, cell.x + cell.w - 5);
          const amp = clamp(cell.h * 0.32, 6, 40);
          ctx.beginPath();
          for (let s = 0; s <= 40; s++) {
            const x = s / 40;
            const val = Math.sin(m * Math.PI * x) * (live[m - 1] / 46);
            const px = csx(x), py = cmy + val * amp;
            if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.strokeStyle = pal.accent; ctx.lineWidth = 1.6; ctx.stroke();
          ctx.fillStyle = pal.muted;
          ctx.font = '10px system-ui, sans-serif';
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText('mode ' + m, cell.x + cell.w / 2, cell.y + cell.h - 3);
        }
      }

      function attach(fig) {
        const { canvas, state: st } = fig;
        const setFromPointer = (e) => {
          const main = st.mainRect; if (!main) return;
          const p = canvasPos(canvas, e);
          const xd = clamp((p.x - (main.x + 10)) / (main.w - 20), 0.04, 0.96);
          const yd = clamp(p.y - (main.y + main.h / 2), -main.h * 0.42, main.h * 0.42);
          st.amps = pluckAmps(xd, yd);
        };
        const down = (e) => {
          const main = st.mainRect; if (!main) return;
          const p = canvasPos(canvas, e);
          if (p.x < main.x || p.x > main.x + main.w || p.y < main.y || p.y > main.y + main.h) return;
          st.drag = true; st.frozen = true; setFromPointer(e); st.dirty = true; e.preventDefault();
        };
        const move = (e) => { if (st.drag) { setFromPointer(e); st.dirty = true; } };
        const up = () => { if (st.drag) { st.drag = false; st.frozen = false; st.t0 = st.tSim; } };
        canvas.addEventListener('pointerdown', down);
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
        invalidation.then(() => {
          canvas.removeEventListener('pointerdown', down);
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        });
      }

      return makeFigure('fig1', 300, init, draw, attach);
    })();
  </script>

  <script id="s1-display" type="text/x-typescript">
    display(expandable(html`<figure>${fig1.canvas}
      <figcaption>Pluck the string; the row below is the independent standing-wave modes it is built from, each ringing at its own frequency.</figcaption></figure>`, {
      id: 'string', width: Math.min(width, 720), height: 300, state: fig1.ui,
      onResize(el, w, h) { setupCanvas(fig1.canvas, fig1.ctx, w, h); fig1.state.w = w; fig1.state.h = h; fig1.state.dirty = true; }
    }));
  </script>

  <script id="s1-tail" type="text/markdown">
    Nothing here is quantum. Each mode is an ordinary oscillator with its own frequency, and the field is just the rule that adds them back into a shape. To go further we zoom all the way in, onto a single one of these oscillators, and quantize it.
  </script>

  <!-- ==================== FIGURE 2 ==================== -->
  <script id="s2-head" type="text/markdown">
    ## 2. Quantizing one oscillator

    A classical oscillator can hold any energy at all, and can sit perfectly still at the bottom of its well. Quantizing it changes two things at once. Its energy is now restricted to a ladder of equally spaced rungs, ${tex`E_n=\hbar\omega\big(n+\tfrac12\big)`}, and the lowest rung sits *above* the bottom of the well, so even the ground state is never quite at rest. Each rung holds a whole number of identical quanta, and those quanta are what we will end up calling particles.

    **Click a rung to put the oscillator in that state.** The curve on the occupied rung is its wavefunction ${tex`\psi_n(x)`}.
  </script>

  <script id="s2-fig" type="text/x-typescript">
    const fig2 = (() => {
      const nMax = 7;
      const init = { n: 2, anim: false, rungs: [], hover: -1 };

      function draw(ctx, st, now) {
        const pal = palette;
        const { w, h } = st;
        ctx.clearRect(0, 0, w, h);
        const pad = 16;
        const rect = { x: pad, y: pad, w: w - 2 * pad, h: h - 2 * pad };
        roundRect(ctx, rect.x, rect.y, rect.w, rect.h, 8);
        ctx.fillStyle = pal.panel; ctx.fill();
        ctx.strokeStyle = pal.border; ctx.lineWidth = 1; ctx.stroke();

        const eMax = nMax + 1.4;
        const A = Math.sqrt(2 * eMax);              // half-width in x at top energy
        const xw = A * 1.12;
        const sx = mapLin(-xw, xw, rect.x + 20, rect.x + rect.w - 20);
        const sy = mapLin(0, eMax, rect.y + rect.h - 24, rect.y + 22);

        // potential well V(x) = x^2 / 2
        ctx.beginPath();
        for (let s = 0; s <= 120; s++) {
          const x = -xw + (2 * xw * s) / 120;
          const px = sx(x), py = sy(Math.min(eMax, 0.5 * x * x));
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = pal.muted; ctx.lineWidth = 1.5; ctx.stroke();

        // classical "at rest" marker at the bottom
        ctx.beginPath(); ctx.arc(sx(0), sy(0), 3.5, 0, 2 * Math.PI);
        ctx.fillStyle = pal.muted; ctx.fill();
        ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillStyle = pal.muted;
        ctx.fillText('a classical oscillator can rest here at E = 0', sx(0), sy(0) + 6);

        // rungs
        st.rungs = [];
        for (let n = 0; n <= nMax; n++) {
          const E = n + 0.5;
          const xt = Math.sqrt(2 * E);
          const y = sy(E);
          const occ = n === st.n;
          st.rungs.push({ n, y, x0: sx(-xt), x1: sx(xt) });
          ctx.beginPath(); ctx.moveTo(sx(-xt), y); ctx.lineTo(sx(xt), y);
          ctx.strokeStyle = occ ? pal.accent : (n === st.hover ? pal.warm : pal.grid);
          ctx.lineWidth = occ ? 2.5 : 1;
          ctx.stroke();
          if (!occ) {
            ctx.fillStyle = pal.muted; ctx.font = '10px system-ui, sans-serif';
            ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
            ctx.fillText('n=' + n, sx(xt) + 4, y);
          }
        }

        // wavefunction on the occupied rung
        const n = st.n;
        const E = n + 0.5;
        const y0 = sy(E);
        const psiAmp = Math.min(28, (sy(0) - sy(1)) * 0.9);
        let maxA = 0.3;
        for (let s = 0; s <= 160; s++) { const x = -xw + (2 * xw * s) / 160; maxA = Math.max(maxA, Math.abs(psiN(n, x))); }
        ctx.beginPath();
        for (let s = 0; s <= 200; s++) {
          const x = -xw + (2 * xw * s) / 200;
          const px = sx(x), py = y0 - (psiN(n, x) / maxA) * psiAmp;
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.strokeStyle = pal.accent; ctx.lineWidth = 2; ctx.stroke();

        // labels
        ctx.fillStyle = pal.fg; ctx.font = '13px system-ui, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText(`n = ${n}  →  ${n} ${n === 1 ? 'quantum' : 'quanta'} (particles),  E = ${(n + 0.5).toFixed(1)} ℏω`, rect.x + 14, rect.y + 10);
        if (n === 0) {
          ctx.fillStyle = pal.warm; ctx.font = '12px system-ui, sans-serif';
          ctx.fillText('the floor is ½ℏω, not zero — zero-point energy', rect.x + 14, rect.y + 30);
        }
      }

      function attach(fig) {
        const { canvas, state: st } = fig;
        const pick = (e) => {
          const p = canvasPos(canvas, e);
          let best = -1, bd = 1e9;
          for (const r of st.rungs) {
            if (p.x < r.x0 - 6 || p.x > r.x1 + 24) continue;
            const d = Math.abs(p.y - r.y);
            if (d < bd) { bd = d; best = r.n; }
          }
          return bd < 16 ? best : -1;
        };
        const move = (e) => { const n = pick(e); if (n !== st.hover) { st.hover = n; st.dirty = true; canvas.style.cursor = n >= 0 ? 'pointer' : 'default'; } };
        const down = (e) => { const n = pick(e); if (n >= 0) { st.n = n; st.dirty = true; e.preventDefault(); } };
        canvas.addEventListener('pointermove', move);
        canvas.addEventListener('pointerdown', down);
        const leave = () => { st.hover = -1; st.dirty = true; };
        canvas.addEventListener('pointerleave', leave);
        invalidation.then(() => {
          canvas.removeEventListener('pointermove', move);
          canvas.removeEventListener('pointerdown', down);
          canvas.removeEventListener('pointerleave', leave);
        });
      }

      return makeFigure('fig2', 340, init, draw, attach);
    })();
  </script>

  <script id="s2-display" type="text/x-typescript">
    display(expandable(html`<figure>${fig2.canvas}
      <figcaption>The energy of a quantized oscillator is a ladder of equal steps whose lowest rung floats above the bottom of the well. Click a rung to occupy it.</figcaption></figure>`, {
      id: 'ladder', width: Math.min(width, 720), height: 340, state: fig2.ui,
      onResize(el, w, h) { setupCanvas(fig2.canvas, fig2.ctx, w, h); fig2.state.w = w; fig2.state.h = h; fig2.state.dirty = true; }
    }));
  </script>

  <script id="s2-tail" type="text/markdown">
    So a state of definite energy is a state of a definite number of quanta. That integer is the whole origin of particles. But notice that a number state does not look like anything moving: its ${tex`\psi_n`} just sits there, spread symmetrically across the well. If particles are frozen standing patterns, where do ordinary moving waves come from?
  </script>

  <!-- ==================== FIGURE 3 ==================== -->
  <script id="s3-head" type="text/markdown">
    ## 3. Particles and waves are different questions

    Here is the one place a second picture earns its keep. On the left is the same oscillator drawn in its phase plane ${tex`(x,p)`}, where a classical state is a point and a quantum state is a fuzzy patch. On the right is ${tex`|\psi(x)|^2`}, the probability of finding it at each position.

    A state of **definite number** is a ring: exact energy, exact particle count, but its phase is completely unknown, so ${tex`|\psi|^2`} just sits there. A state of **definite phase**, a coherent state, is a compact patch that swings around the origin, and its ${tex`|\psi|^2`} sloshes side to side exactly like a classical oscillator. A coherent state is many quanta stacked with a common phase, and it is the closest a quantum oscillator comes to a classical wave. Light is made of these.

    **Switch the tab, and drag in the phase plane** to set the amount.
  </script>

  <script id="s3-fig" type="text/x-typescript">
    const fig3 = (() => {
      const W = 6;                         // phase-plane half-extent
      const init = { mode: 'phase', n: 3, cx: 3.0, cy: 0, phaseRef: 0, ampRef: 3.0, t0anim: 0, tabs: [], phaseRect: null };

      function draw(ctx, st, now) {
        const pal = palette;
        const { w, h } = st;
        ctx.clearRect(0, 0, w, h);
        const pad = 14, tabH = 30, gap = 14;
        const top = pad + tabH + 8;
        const colW = (w - 2 * pad - gap) / 2;
        const size = Math.min(colW, h - top - pad);
        const yc = top + (h - top - pad - size) / 2;
        const phase = { x: pad + (colW - size) / 2, y: yc, w: size, h: size };
        const dens = { x: pad + colW + gap, y: yc, w: colW, h: size };
        st.phaseRect = phase;

        // tabs
        const labels = [['phase', 'definite phase  (coherent)'], ['number', 'definite number  (Fock)']];
        st.tabs = [];
        let tx = pad;
        ctx.font = '12px system-ui, sans-serif'; ctx.textBaseline = 'middle';
        for (const [key, text] of labels) {
          const tw = ctx.measureText(text).width + 24;
          const active = st.mode === key;
          roundRect(ctx, tx, pad, tw, tabH, 6);
          ctx.fillStyle = active ? pal.accentSoft : pal.panel; ctx.fill();
          ctx.strokeStyle = active ? pal.accent : pal.border; ctx.lineWidth = active ? 1.5 : 1; ctx.stroke();
          ctx.fillStyle = active ? pal.accent : pal.muted; ctx.textAlign = 'center';
          ctx.fillText(text, tx + tw / 2, pad + tabH / 2);
          st.tabs.push({ key, x: tx, y: pad, w: tw, h: tabH });
          tx += tw + 8;
        }

        // current state
        const coherent = st.mode === 'phase';
        let wigFn, cx, cy, nShown;
        if (coherent) {
          const r = st.ampRef;
          const a = st.phaseRef - (st.tSim - (st.t0anim || 0)) * 1.3;
          cx = st.frozen ? st.cx : r * Math.cos(a);
          cy = st.frozen ? st.cy : r * Math.sin(a);
          wigFn = (x, p) => wignerCoherent(x, p, cx, cy);
        } else {
          nShown = st.n;
          wigFn = (x, p) => wignerNumber(nShown, x, p);
        }

        // phase panel
        roundRect(ctx, phase.x, phase.y, phase.w, phase.h, 7);
        ctx.save(); ctx.fillStyle = pal.panel; ctx.fill(); ctx.restore();
        drawHeat(ctx, phase, wigFn, { xmin: -W, xmax: W, pmin: -W, pmax: W, res: 104, scale: 1 / Math.PI, zero: pal.wignerZero });
        roundRect(ctx, phase.x, phase.y, phase.w, phase.h, 7);
        ctx.save(); ctx.clip();
        const mx = mapLin(-W, W, phase.x, phase.x + phase.w);
        const my = mapLin(-W, W, phase.y + phase.h, phase.y);
        ctx.strokeStyle = pal.isDark ? '#ffffff2c' : '#00000024'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(mx(-W), my(0)); ctx.lineTo(mx(W), my(0)); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(mx(0), my(-W)); ctx.lineTo(mx(0), my(W)); ctx.stroke();
        if (coherent) {
          ctx.beginPath(); ctx.arc(mx(cx), my(cy), 4, 0, 2 * Math.PI);
          ctx.fillStyle = pal.fg; ctx.strokeStyle = pal.bg; ctx.lineWidth = 1.5; ctx.fill(); ctx.stroke();
        }
        ctx.restore();
        roundRect(ctx, phase.x, phase.y, phase.w, phase.h, 7);
        ctx.strokeStyle = pal.border; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = pal.muted; ctx.font = '11px system-ui, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('phase space  (x, p)', phase.x + 8, phase.y + 7);
        ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
        ctx.fillText('drag to set', phase.x + phase.w - 8, phase.y + phase.h - 6);

        // density panel
        roundRect(ctx, dens.x, dens.y, dens.w, dens.h, 7);
        ctx.fillStyle = pal.panel; ctx.fill();
        ctx.strokeStyle = pal.border; ctx.lineWidth = 1; ctx.stroke();
        const dsx = mapLin(-W, W, dens.x + 8, dens.x + dens.w - 8);
        const baseY = dens.y + dens.h - 26;
        ctx.save(); roundRect(ctx, dens.x, dens.y, dens.w, dens.h, 7); ctx.clip();
        ctx.strokeStyle = pal.faint; ctx.beginPath(); ctx.moveTo(dsx(-W), baseY); ctx.lineTo(dsx(W), baseY); ctx.stroke();
        const NPP = 200;
        let maxD = 0.1;
        const vals = [];
        for (let s = 0; s <= NPP; s++) {
          const x = -W + (2 * W * s) / NPP;
          let d;
          if (coherent) { const psi = coherentPsi(x, cx, cy); d = psi.re * psi.re + psi.im * psi.im; }
          else { const v = psiN(nShown, x); d = v * v; }
          vals.push(d); maxD = Math.max(maxD, d);
        }
        const dScale = (dens.h * 0.7) / maxD;
        ctx.beginPath();
        for (let s = 0; s <= NPP; s++) {
          const x = -W + (2 * W * s) / NPP;
          const px = dsx(x), py = baseY - vals[s] * dScale;
          if (s === 0) ctx.moveTo(px, baseY);
          ctx.lineTo(px, py);
        }
        ctx.lineTo(dsx(W), baseY); ctx.closePath();
        ctx.fillStyle = pal.accentSoft; ctx.fill();
        ctx.restore();
        ctx.fillStyle = pal.muted; ctx.font = '11px system-ui, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('|ψ(x)|²', dens.x + 8, dens.y + 7);
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillStyle = coherent ? pal.accent : pal.muted;
        ctx.fillText(coherent ? 'sloshes like a classical wave' : 'sits still — no waveform',
          dens.x + dens.w / 2, dens.y + dens.h - 7);

        // readout
        ctx.fillStyle = pal.fg; ctx.font = '13px system-ui, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        const txt = coherent
          ? `coherent: n̄ = ${(st.ampRef * st.ampRef / 2).toFixed(1)} quanta, definite phase`
          : `Fock: exactly n = ${nShown} ${nShown === 1 ? 'quantum' : 'quanta'}, phase unknown`;
        ctx.fillText(txt, phase.x, phase.y - 8);
      }

      function attach(fig) {
        const { canvas, state: st } = fig;
        const inRect = (p, r) => r && p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
        const applyDrag = (e) => {
          const r = st.phaseRect; if (!r) return;
          const p = canvasPos(canvas, e);
          const x = ((p.x - r.x) / r.w) * 2 * W - W;
          const y = W - ((p.y - r.y) / r.h) * 2 * W;
          if (st.mode === 'phase') {
            st.cx = clamp(x, -W + 0.5, W - 0.5); st.cy = clamp(y, -W + 0.5, W - 0.5);
            st.ampRef = Math.hypot(st.cx, st.cy); st.phaseRef = Math.atan2(st.cy, st.cx);
          } else {
            const rr = Math.hypot(x, y);
            st.n = clamp(Math.round((rr * rr) / 2), 0, 8);
          }
          st.dirty = true;
        };
        const down = (e) => {
          const p = canvasPos(canvas, e);
          for (const tb of st.tabs) {
            if (inRect(p, tb)) { st.mode = tb.key; st.anim = tb.key === 'phase'; st.frozen = false; st.t0anim = st.tSim; st.dirty = true; e.preventDefault(); return; }
          }
          if (inRect(p, st.phaseRect)) { st.drag = true; st.frozen = true; applyDrag(e); e.preventDefault(); }
        };
        const move = (e) => { if (st.drag) applyDrag(e); };
        const up = () => { if (st.drag) { st.drag = false; if (st.mode === 'phase') { st.frozen = false; st.t0anim = st.tSim; } } };
        canvas.addEventListener('pointerdown', down);
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
        invalidation.then(() => {
          canvas.removeEventListener('pointerdown', down);
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
        });
      }

      return makeFigure('fig3', 360, init, draw, attach);
    })();
  </script>

    display(expandable(html`<figure>${fig3.canvas}
      <figcaption>Definite number (a ring, no waveform) versus definite phase (a swinging patch whose |ψ|² sloshes like a classical wave). Switch tabs and drag in the phase plane.</figcaption></figure>`, {
      id: 'number-vs-phase', width: Math.min(width, 720), height: 360, state: fig3.ui,
      onResize(el, w, h) { setupCanvas(fig3.canvas, fig3.ctx, w, h); fig3.state.w = w; fig3.state.h = h; fig3.state.dirty = true; }

  <script id="s3-tail" type="text/markdown">
    That is the trade the quantization forced on us. You can pin down a mode's particle number or its phase, but not both, and a classical-looking wave is what you get when phase wins. Now put every mode back together.
  </script>

  <!-- ==================== FIGURE 4 ==================== -->
  <script id="s4-head" type="text/markdown">
    ## 4. The field, quantized

    Hand every mode its own ladder and its own quanta, and the string from the first figure becomes a quantum field. The stack on the left is the modes; the panel on the right is the field they build over space, drawn as its average shape (the line) wrapped in the range it fluctuates over (the band).

    **Click a mode** to cycle it through empty, a coherent wave, and a single quantum. Watch what each does to the field.
  </script>

  <script id="s4-fig" type="text/x-typescript">
    const fig4 = (() => {
      const K = 6;
      const L = Math.PI;
      const omega = (m) => m;                       // massless: ω_m = k_m = m
      const u = (m, x) => Math.sqrt(2 / L) * Math.sin(m * x);

      const init = {
        modes: Array.from({ length: K }, () => ({ kind: 'vac', amp: 0, n: 0 })),
        rows: [], resetBtn: null
      };

      function qMean(md, m, t) { return md.kind === 'coh' ? md.amp * Math.cos(omega(m) * t) : 0; }
      function qVar(md) { return md.kind === 'num' ? md.n + 0.5 : 0.5; }

      function draw(ctx, st, now) {
        const pal = palette;
        const { w, h } = st;
        ctx.clearRect(0, 0, w, h);
        const pad = 14, gap = 14;
        const colW = Math.min((w - 2 * pad - gap) * 0.42, 300);
        const listX = pad, fieldX = pad + colW + gap;
        const t = st.tSim;

        // header + reset
        ctx.fillStyle = pal.muted; ctx.font = '12px system-ui, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('modes — click to cycle: empty → wave → particle', listX + 2, 2);
        const rbW = 54, rbH = 20;
        st.resetBtn = { x: listX + colW - rbW, y: 0, w: rbW, h: rbH };
        roundRect(ctx, st.resetBtn.x, st.resetBtn.y, rbW, rbH, 5);
        ctx.fillStyle = pal.panel; ctx.fill(); ctx.strokeStyle = pal.border; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = pal.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('reset', st.resetBtn.x + rbW / 2, st.resetBtn.y + rbH / 2 + 1);

        // mode rows
        const top = 28;
        const rowH = (h - top - pad) / K - 6;
        st.rows = [];
        for (let i = 0; i < K; i++) {
          const m = i + 1;
          const md = st.modes[i];
          const ry = top + i * (rowH + 6);
          const row = { x: listX, y: ry, w: colW, h: rowH, i };
          st.rows.push(row);
          const active = md.kind !== 'vac';
          roundRect(ctx, row.x, row.y, row.w, row.h, 6);
          ctx.fillStyle = active ? pal.accentSoft : pal.panel; ctx.fill();
          ctx.strokeStyle = active ? pal.accent : pal.border; ctx.lineWidth = 1; ctx.stroke();
          // mini standing wave
          const cmy = row.y + row.h / 2;
          const wx0 = row.x + 40, wx1 = row.x + row.w - 64;
          const amp = row.h * 0.32;
          ctx.beginPath();
          for (let s = 0; s <= 48; s++) {
            const x = (s / 48) * L;
            let val = 0;
            if (md.kind === 'coh') val = md.amp * Math.sin(m * x) * Math.cos(omega(m) * t) / 3;
            else if (md.kind === 'num') val = 0.6 * Math.sin(m * x); // frozen envelope
            const px = wx0 + (wx1 - wx0) * (s / 48), py = cmy - val * amp;
            if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.strokeStyle = md.kind === 'num' ? pal.warm : (md.kind === 'coh' ? pal.accent : pal.grid);
          ctx.lineWidth = 1.6;
          if (md.kind === 'num') ctx.setLineDash([3, 3]);
          ctx.stroke(); ctx.setLineDash([]);
          // label
          ctx.fillStyle = pal.muted; ctx.font = '11px system-ui, sans-serif';
          ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
          ctx.fillText('k=' + m, row.x + 10, cmy);
          const tag = md.kind === 'vac' ? 'empty' : md.kind === 'coh' ? 'wave' : md.n + 'q particle';
          ctx.textAlign = 'right';
          ctx.fillStyle = md.kind === 'num' ? pal.warm : (md.kind === 'coh' ? pal.accent : pal.muted);
          ctx.fillText(tag, row.x + row.w - 10, cmy);
        }

        // field panel
        const fp = { x: fieldX, y: top, w: w - fieldX - pad, h: h - top - pad };
        roundRect(ctx, fp.x, fp.y, fp.w, fp.h, 7);
        ctx.fillStyle = pal.panel; ctx.fill(); ctx.strokeStyle = pal.border; ctx.lineWidth = 1; ctx.stroke();
        const fsx = mapLin(0, L, fp.x + 12, fp.x + fp.w - 12);
        const midY = fp.y + fp.h * 0.52;
        const vScale = fp.h * 0.15;
        const NPTS = 160;
        const mean = [], sd = [];
        for (let s = 0; s <= NPTS; s++) {
          const x = (L * s) / NPTS;
          let mu = 0, vr = 0;
          for (let i = 0; i < K; i++) { const m = i + 1; const uu = u(m, x); mu += uu * qMean(st.modes[i], m, t); vr += uu * uu * qVar(st.modes[i]); }
          mean.push(mu); sd.push(Math.sqrt(vr));
        }
        ctx.save(); roundRect(ctx, fp.x, fp.y, fp.w, fp.h, 7); ctx.clip();
        ctx.strokeStyle = pal.faint; ctx.beginPath(); ctx.moveTo(fsx(0), midY); ctx.lineTo(fsx(L), midY); ctx.stroke();
        // band
        ctx.beginPath();
        for (let s = 0; s <= NPTS; s++) ctx.lineTo(fsx((L * s) / NPTS), midY - (mean[s] + sd[s]) * vScale);
        for (let s = NPTS; s >= 0; s--) ctx.lineTo(fsx((L * s) / NPTS), midY - (mean[s] - sd[s]) * vScale);
        ctx.closePath(); ctx.fillStyle = pal.isDark ? '#9aa4b820' : '#5560701c'; ctx.fill();
        // mean
        ctx.beginPath();
        for (let s = 0; s <= NPTS; s++) { const px = fsx((L * s) / NPTS), py = midY - mean[s] * vScale; if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
        ctx.strokeStyle = pal.accent; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
        ctx.fillStyle = pal.muted; ctx.font = '11px system-ui, sans-serif';
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        ctx.fillText('field φ(x): average (line) and fluctuation band', fp.x + 10, fp.y + 8);
        ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText('empty modes still leave a band — the vacuum hums', fp.x + 10, fp.y + fp.h - 7);
      }

      function attach(fig) {
        const { canvas, state: st } = fig;
        const down = (e) => {
          const p = canvasPos(canvas, e);
          const rb = st.resetBtn;
          if (rb && p.x >= rb.x && p.x <= rb.x + rb.w && p.y >= rb.y && p.y <= rb.y + rb.h) {
            st.modes.forEach((md) => { md.kind = 'vac'; md.amp = 0; md.n = 0; });
            st.dirty = true; e.preventDefault(); return;
          }
          for (const row of st.rows) {
            if (p.x >= row.x && p.x <= row.x + row.w && p.y >= row.y && p.y <= row.y + row.h) {
              const md = st.modes[row.i];
              if (md.kind === 'vac') { md.kind = 'coh'; md.amp = 2.4; }
              else if (md.kind === 'coh') { md.kind = 'num'; md.n = 1; }
              else { md.kind = 'vac'; md.amp = 0; md.n = 0; }
              st.dirty = true; e.preventDefault(); break;
            }
          }
        };
        canvas.style.cursor = 'pointer';
        canvas.addEventListener('pointerdown', down);
        invalidation.then(() => canvas.removeEventListener('pointerdown', down));
      }

      return makeFigure('fig4', 320, init, draw, attach);
    })();
  </script>

  <script id="s4-display" type="text/x-typescript">
    display(expandable(html`<figure>${fig4.canvas}
      <figcaption>Each mode is its own oscillator. Coherent modes build a classical wave; a lone quantum leaves the average flat but fattens the band; empty space still fluctuates.</figcaption></figure>`, {
      id: 'field', width: Math.min(width, 720), height: 320, state: fig4.ui,
      onResize(el, w, h) { setupCanvas(fig4.canvas, fig4.ctx, w, h); fig4.state.w = w; fig4.state.h = h; fig4.state.dirty = true; }
    }));
  </script>

  <script id="s4-tail" type="text/markdown">
    Three things to try. Make a couple of modes coherent and the field's average is a clean oscillating wave, the classical field you already trust. Put a single quantum in one mode and the average goes flat while the band swells: the particle is unmistakably there, carrying energy, but it has no waveform and no location, spread across all of space. And leave every mode empty and the band never closes, because each mode's lowest rung still jiggles. That residual hum is the zero-point energy of the vacuum.
  </script>

  <script id="closing" type="text/markdown">
    ## Where the magic went

    Read backwards, the leap is short. Splitting a field into modes was ordinary mechanics. Quantizing was one harmonic oscillator, the same one, repeated per mode, and its ladder of equal steps is what we count as particles. Coherent states glued those quanta back into the classical waves we started from, and the ground state that refuses to sit still is why empty space is never empty.

    Two honest omissions. This is all the *free* field, exactly solvable because the modes never interact. Real theories add couplings between modes, and that is where scattering and most of the actual difficulty of QFT begin. And a properly relativistic field needs a complex or multi-component version to carry antiparticles and spin. But the part that usually feels magical, the jump from springs to particles, is just the oscillator.

    The oscillator and Wigner-function math lives in a small companion module, [`qho.js`](./qho.js); its closed forms were checked against direct numerical integration before being used here.
  </script>
