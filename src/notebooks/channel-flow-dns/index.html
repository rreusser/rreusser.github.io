  <title>Channel Flow</title>

  <script id="intro" type="text/markdown">
    # Channel Flow

    This notebook simulates the flow of an incompressible fluid between two parallel walls and follows it from the laminar state through transition to turbulence. It is a direct numerical simulation, which means that the Navier–Stokes equations are solved as they stand, with no turbulence model and no numerical smoothing. Every eddy in the flow has to be carried by the grid, and the only dissipation is that of the fluid's own viscosity.

    The simulation runs on the GPU through WebGPU. The method is of the kind used by research codes for this problem. Fourier series represent the flow in the two periodic directions, energy-conserving differences on a staggered grid represent it across the channel, an explicit Runge–Kutta scheme advances it in time, and the pressure equation is solved directly after every stage. What follows first is the simulation itself. The sections after it describe the flow, the ways it becomes turbulent, the numerical method and its implementation, and the tests the code has to pass.
  </script>

  <script id="simulation-text" type="text/markdown">
    ## Simulation

    Three starting points are offered. Each is described in more detail in the section on transition below.

    **K-type transition** starts from laminar flow carrying a plane wave of a few percent amplitude and a much weaker pair of oblique waves. Little is visible for about 150 time units while the oblique waves grow. Then Λ-shaped vortices appear, lift away from the walls, and the flow breaks down.

    **Localized disturbance** starts from laminar flow with one pair of counter-rotating vortices next to the lower wall. The pair lifts slow fluid into a streak, and a train of hairpin vortices forms along it within about ten time units.

    **Turbulent channel** starts from a strongly disturbed profile that breaks down almost at once, and settles into sustained turbulence at the chosen friction Reynolds number.
  </script>

      { label: 'Scenario', value: 'ktype' }
    ));
    const method = view(Inputs.radio(
      new Map([
        ['Fourier in x and z', 'fourier'],
        ['Second-order differences', 'finite-difference'],
      ]),
      { label: 'Method', value: 'fourier' }

  </script>

              ['Small channel, 128 × 128 × 128', { Nx: 128, Ny: 128, Nz: 128, Lx: 2 * Math.PI, Lz: Math.PI }],
              ['Full channel, 256 × 160 × 256', { Nx: 256, Ny: 160, Nz: 256, Lx: 4 * Math.PI, Lz: (4 * Math.PI) / 3 }],

  <script id="simulation-controls" type="module">
    const running = view(Inputs.toggle({ label: 'Run', value: true }));
    const stepsPerFrame = view(Inputs.range([1, 20], { label: 'Steps per frame', step: 1, value: 4 }));
    const sliceComponent = view(Inputs.radio(['u', 'v', 'w', 'p'], { label: 'Show', value: 'u' }));
    const planHeight = view(Inputs.range([0.01, 1], { label: 'Plan view height above the wall', step: 0.01, value: scenario === 'turbulent' ? 0.08 : 0.3 }));
    const showVortices = view(Inputs.toggle({ label: 'Show vortices', value: true }));
    // Q is in wall units for the turbulent channel, where Q nu^2 / u_tau^4
    // of order 0.01 marks the near-wall vortices, and in outer units
    // (centreline velocity / half-height)^2 for the laminar case.
    const qLevel = view(scenario === 'turbulent'
      ? Inputs.range([0.001, 0.05], { label: 'Q threshold (wall units)', step: 0.0005, value: 0.006 })
      : Inputs.range([0.001, 1], { label: 'Q threshold', step: 0.001, value: scenario === 'ktype' ? 0.01 : 0.05 }));
  </script>

  <script id="simulation-state" type="module">
    // Everything created here is released when the cell is invalidated,
    // including when that happens while it is still waiting below.
    const owned = [];
    invalidation.then(() => {
      for (const resource of owned.reverse()) resource.destroy();
    });
    const createFlow = method === 'fourier' ? createSpectralChannelFlow : createChannelFlow;
    const flow = createFlow(device,
      scenario === 'turbulent' ? channelOptions({ reTau: setup.reynolds, ...setup.grid })
      : scenario === 'ktype' ? kTypeOptions({ re: setup.reynolds, alpha: setup.alpha, beta: setup.beta, ...setup.grid })
      : laminarOptions({ re: setup.reynolds, ...setup.grid }));
    // The eigenmodes that seed the K-type run, for the stability section below.
    const waves = scenario === 'ktype'
      ? kTypeDisturbance(flow, {
          re: setup.reynolds, alpha: setup.alpha, beta: setup.beta,
          amplitude2d: setup.amplitude2d, amplitude3d: setup.amplitude3d,
        })
      : null;
    flow.setState(
      scenario === 'turbulent' ? perturbedChannel(flow, { amplitude: setup.amplitude })
      : scenario === 'ktype' ? waves.state
      : localizedDisturbance(flow, { amplitude: setup.amplitude, lx: setup.lx, lz: setup.lz }));
    owned.push(flow);
    flow.project();
    const sliceView = createSliceView(device, flow, canvasFormat);
    const vortices = createQCriterion(device, flow);
    const vortexView = createIsosurfaceView(device, flow, vortices, canvasFormat);
    owned.push(sliceView, vortices, vortexView);
    // Mutated by the frame loop; read by the plots.
    const firstStats = await flow.statistics();
    // Null means this run was replaced by a newer one while it waited. The
    // newer one owns the page now, so this one simply never finishes.
    if (!firstStats) await new Promise(() => {});
    const live = { stats: firstStats, history: [], failed: false, triangles: 0 };
    // Scales that differ between the scenarios. The nominal friction Reynolds
    // number is the one at which the wall shear balances the initial driving
    // force. The laminar case runs at fixed mass flux, the turbulent one at
    // fixed pressure gradient.
    const scales = {
      drive: flow.sim.forcing,
      reTau: Math.sqrt(flow.sim.forcing) / flow.sim.nu,
      qScale: scenario === 'turbulent' ? setup.reynolds ** 2 : 1,
      fluxTarget: scenario === 'turbulent' ? null : live.stats.bulkVelocity,
    };
  </script>

  <script id="simulation-resolution" type="module">

      domain ${units.LxPlus.toFixed(0)} × ${(2 * scales.reTau).toFixed(0)} × ${units.LzPlus.toFixed(0)} wall units;
      spacing Δx⁺ = ${units.dxPlus.toFixed(1)}, Δz⁺ = ${units.dzPlus.toFixed(1)},
      Δy⁺ = ${units.dyWallPlus.toFixed(2)} at the wall to ${units.dyCentrePlus.toFixed(1)} at the centre.
    </p>`);
  </script>

  <script id="vortices-text" type="text/markdown">
    The three-dimensional view shows a surface of constant ${tex`Q`}, a quantity that is positive where the fluid rotates more than it strains and which therefore marks vortex cores. It is defined in the section on seeing vortices below. Drag to rotate the view and scroll to zoom. The two slices below it show one velocity component or the pressure on a vertical plane through the middle of the span and on a horizontal plane near the lower wall.
  </script>

  <script id="simulation-figure" type="module">
    const figureWidth = Math.min(width, 640);
    const makeCanvas = (id, aspect) => {
      const canvas = html`<canvas id="${id}" style="width: 100%; display: block; image-rendering: pixelated"></canvas>`;
      canvas.width = Math.round(figureWidth * devicePixelRatio);
      canvas.height = Math.max(1, Math.round(canvas.width * aspect));
      const context = canvas.getContext('webgpu');
      context.configure({ device, format: canvasFormat, alphaMode: 'opaque' });
      return { canvas, context };
    };
    const vortexCanvas = makeCanvas('channel-vortices', 0.62);
    // Drag to orbit, scroll to zoom. The outer container, not the canvas,
    // carries touch-action so that a touch drag does not scroll the page.
    const camera = createUnifiedCamera(vortexCanvas.canvas, {
      mode: 'orbit',
      center: [0.5 * flow.Lx, -0.1, 0.5 * flow.Lz],
      distance: 1.1 * Math.hypot(flow.Lx, 2, flow.Lz) + 0.5,
      phi: 2.25,
      theta: 0.43,
      fov: Math.PI / 5,
      near: 0.05,
      far: 200,
      renderContinuously: false,
      // The canvas keeps the size given above; the camera must not resize it.
      observeResize: false,
    });
    invalidation.then(() => camera.destroy());
    const sideView = makeCanvas('channel-side-view', 2 / flow.Lx);
    const planView = makeCanvas('channel-plan-view', flow.Lz / flow.Lx);
    const statusLine = html`<div id="channel-status" style="font: 12px var(--monospace, monospace); white-space: pre-wrap"></div>`;
    display(html`<figure id="channel-figure" style="max-width: ${figureWidth}px">
      <div style="font-size: 0.8em">Vortices: isosurface of Q, coloured by streamwise velocity</div>
      <div id="channel-vortices-container" style="touch-action: none">${vortexCanvas.canvas}</div>
      <div style="font-size: 0.8em; margin-top: 6px">Side view (x–y) at mid-span</div>
      ${sideView.canvas}
      <div style="font-size: 0.8em; margin-top: 6px">Plan view (x–z)</div>
      ${planView.canvas}
      ${statusLine}
    </figure>`);
  </script>

  <script id="simulation-loop" type="module">
    // Row nearest the requested distance from the lower wall, in half-heights.
    const planRow = (() => {
      const distance = (j) => Math.abs(flow.yCenters[j] - flow.yFaces[0] - planHeight);
      let best = 0;
      for (let j = 0; j < flow.Ny / 2; j++) if (distance(j) < distance(best)) best = j;
      return best;
    })();

    const colourRange = (stats) => {
      const centre = stats.u[flow.Ny >> 1];
      const rms = (a) => Math.sqrt(Math.max(...a));
      if (sliceComponent === 'u') return { lo: 0, hi: 1.15 * centre, diverging: false };
      if (sliceComponent === 'v') return { lo: -3 * rms(stats.vv) - 1e-3, hi: 3 * rms(stats.vv) + 1e-3, diverging: true };
      if (sliceComponent === 'w') return { lo: -3 * rms(stats.ww) - 1e-3, hi: 3 * rms(stats.ww) + 1e-3, diverging: true };
      return { lo: -0.03 * centre * centre, hi: 0.03 * centre * centre, diverging: true };
    };

    // Grid spacing in wall units from the current wall shear, and how close
    // the streamwise velocity is to the grid scale (see the text).
    const resolutionLine = (stats) => {
      const uTau = Math.sqrt(Math.max(0.5 * (stats.wallShear[0] + stats.wallShear[1]), 0));
      const plus = uTau / flow.sim.nu;
      const g = stats.gridScale;
      const coarse = Math.max(g.x, g.z) > 0.5;
      return `Δx⁺ ${(flow.dx * plus).toFixed(1)}   Δz⁺ ${(flow.dz * plus).toFixed(1)}   ` +
        `Δy⁺ ${(Math.min(...flow.heights) * plus).toFixed(2)} at the wall\n` +
        `grid-scale content: x ${g.x.toFixed(2)}, z ${g.z.toFixed(2)}` +
        (coarse ? '   (under-resolved: above 0.5)' : '');
    };

    // Nothing is drawn unless something changed: the flow advanced, the
    // camera moved, a canvas scrolled into view, or this cell re-ran because
    // a control or the theme changed. Canvases that are off screen are
    // skipped, though the flow itself keeps advancing while it is running.
    const view = { dirty: true };
    const markDirty = () => { view.dirty = true; };
    camera.on('render', markDirty);
    const onScreen = new Map([vortexCanvas, sideView, planView].map((c) => [c.canvas, true]));
    const visibility = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        onScreen.set(entry.target, entry.isIntersecting);
        if (entry.isIntersecting) markDirty();
      }
    });
    for (const canvas of onScreen.keys()) visibility.observe(canvas);

    const updateStatus = () => {
      const stats = live.stats;
      statusLine.textContent = live.failed
        ? 'The solution became non-finite. Restart with a finer grid or a smaller disturbance.'
        : `t = ${stats.time.toFixed(3)}   step ${flow.steps}   dt = ${(flow.sim.dt || 0).toExponential(2)}   ` +
          `${pace.stepsPerSecond.toFixed(0)} steps/s\n` +
          `bulk velocity ${stats.bulkVelocity.toFixed(3)}   wall shear / initial drive ` +
          `${(stats.wallShear[0] / scales.drive).toFixed(3)}, ${(stats.wallShear[1] / scales.drive).toFixed(3)}   ` +
          `max |div| ${stats.maxDivergence.toExponential(1)}\n` +
          resolutionLine(stats) +
          (showVortices
            ? `\n${Math.round(live.triangles).toLocaleString()} triangles` +
              (3 * live.triangles > vortices.capacity ? ' (truncated: raise the threshold)' : '')
            : '');
    };

    // The GPU runs behind the commands sent to it. If a batch of time steps
    // were sent every frame regardless, a GPU that cannot finish a batch in
    // one frame would fall further and further behind: statistics would
    // never come back and a paused view could not be redrawn until the
    // backlog cleared. So a new batch is sent only once the previous one has
    // finished, and the achieved rate is whatever the GPU can sustain.
    const pace = { busy: false, sent: performance.now(), stepsPerSecond: 0 };

    let frame = 0;
    let pending = false;
    const loop = createFrameLoop(() => {
      const advancing = running && !live.failed;
      if (advancing && !pace.busy) {
        flow.advance(flow.stableTimeStep(live.stats, 0.5), stepsPerFrame);
        pace.busy = true;
        device.queue.onSubmittedWorkDone().then(() => {
          const now = performance.now();
          const rate = (1000 * stepsPerFrame) / Math.max(now - pace.sent, 1);
          pace.stepsPerSecond = pace.stepsPerSecond ? 0.9 * pace.stepsPerSecond + 0.1 * rate : rate;
          pace.sent = now;
          pace.busy = false;
        });
        markDirty();
      }
      // Statistics lag the state by a few frames; the time step has enough
      // margin to absorb that. While paused they are fetched once, when this
      // cell starts, so that they describe the state being shown.
      if ((advancing || frame === 0) && !pending && frame % 5 === 0) {
        pending = true;
        flow.statistics().then((next) => {
          pending = false;
          if (!next) return;
          if (!Number.isFinite(next.maxCfl) || !Number.isFinite(next.kineticEnergy)) {
            live.failed = true;
            updateStatus();
            return;
          }
          live.stats = next;
          if (scales.fluxTarget !== null) flow.sim.forcing = fluxForcing(next, scales.fluxTarget, 1);
          const last = live.history[live.history.length - 1];
          if (!last || next.time > last.time) {
            live.history.push({
              time: next.time,
              lower: next.wallShear[0] / scales.drive,
              upper: next.wallShear[1] / scales.drive,
              bulk: next.bulkVelocity,
            });
            if (live.history.length > 4000) live.history.splice(0, 2000);
          }
          // The colour ranges follow the statistics.
          markDirty();
        });
      }

      if (view.dirty) {
        view.dirty = false;
        const stats = live.stats;
        const range = colourRange(stats);
        const encoder = device.createCommandEncoder();
        let drawn = false;
        if (onScreen.get(sideView.canvas)) {
          sliceView.draw(encoder, sideView.context.getCurrentTexture().createView(), {
            plane: 'xy', index: flow.Nz >> 1, component: sliceComponent, ...range,
          });
          drawn = true;
        }
        if (onScreen.get(planView.canvas)) {
          sliceView.draw(encoder, planView.context.getCurrentTexture().createView(), {
            plane: 'xz', index: planRow, component: sliceComponent, ...range,
          });
          drawn = true;
        }
        const drawVortices = showVortices && onScreen.get(vortexCanvas.canvas);
        if (drawVortices) {
          const { canvas, context } = vortexCanvas;
          const { projView, eye } = camera.update(canvas.width / canvas.height);
          vortices.extract(encoder, qLevel * scales.qScale);
          vortexView.draw(encoder, context.getCurrentTexture().createView(), canvas.width, canvas.height, {
            projView, eye, lo: 0, hi: 1.1 * stats.u[flow.Ny >> 1],
            background: theme.background, foreground: theme.foreground,
          });
          drawn = true;
        }
        if (drawn) device.queue.submit([encoder.finish()]);
        if (drawVortices && (!advancing || frame % 30 === 0)) {
          vortices.vertexCount().then((n) => {
            if (n === null) return;
            live.triangles = n / 3;
            if (!advancing) updateStatus();
          });
        }
        if (!advancing || frame % 10 === 0) updateStatus();
      }
      frame++;
    });
    invalidation.then(() => {
      loop.cancel();
      visibility.disconnect();
      camera.off('render', markDirty);
    });
  </script>

  <script id="statistics-heading" type="text/markdown">
    ### Statistics

    The mean velocity profile is an average over the two homogeneous directions and both halves of the channel at the current instant, not over time, so it fluctuates. The dashed lines are the viscous sublayer ${tex`u^+ = y^+`} and the logarithmic law ${tex`u^+ = \ln(y^+)/0.41 + 5.2`}. The wall shear stress is shown relative to the force that drove the flow at the start, so it is one for a flow in balance with that force; it rises above one when a laminar flow held at fixed mass flux starts to break down.
  </script>

  <script id="statistics-plots" type="module">
    const plotHolder = display(html`<div id="channel-statistics"></div>`);
    const drawPlots = () => {
      const stats = live.stats;
      const half = flow.Ny >> 1;
      const uTau = Math.sqrt(Math.max(0.5 * (stats.wallShear[0] + stats.wallShear[1]), 1e-12));
      const profile = Array.from({ length: half }, (_, j) => ({
        yPlus: ((flow.yCenters[j] - flow.yFaces[0]) * uTau) / flow.sim.nu,
        uPlus: (0.5 * (stats.u[j] + stats.u[flow.Ny - 1 - j])) / uTau,
      }));
      const sublayer = d3.range(0.5, 12, 0.5).map((y) => ({ yPlus: y, uPlus: y }));
      const reNow = uTau / flow.sim.nu;
      const logLaw = d3.range(10, Math.max(reNow, 15), 5).map((y) => ({ yPlus: y, uPlus: Math.log(y) / 0.41 + 5.2 }));
      const plotWidth = Math.min(width, 640);
      plotHolder.replaceChildren(
        Plot.plot({
          width: plotWidth,
          height: 280,
          x: { type: 'log', label: 'y⁺', domain: [0.5, Math.max(reNow, 15)] },
          y: { label: 'u⁺', domain: [0, Math.max(25, 1.05 * d3.max(profile, (d) => d.uPlus))] },
          marks: [
            Plot.line(sublayer, { x: 'yPlus', y: 'uPlus', strokeDasharray: '4 3', stroke: ink, strokeOpacity: 0.5 }),
            Plot.line(logLaw, { x: 'yPlus', y: 'uPlus', strokeDasharray: '4 3', stroke: ink, strokeOpacity: 0.5 }),
            Plot.line(profile, { x: 'yPlus', y: 'uPlus', stroke: palette[0], strokeWidth: 2 }),
          ],
        }),
        Plot.plot({
          width: plotWidth,
          height: 200,
          x: { label: 'time' },
          y: { label: 'wall shear stress / initial driving force' },
          marks: [
            Plot.ruleY([1], { strokeOpacity: 0.4 }),
            Plot.line(live.history, { x: 'time', y: 'lower', stroke: palette[0] }),
            Plot.line(live.history, { x: 'time', y: 'upper', stroke: palette[1] }),
          ],
        })
      );
    };
    drawPlots();
    // Redraw once a second, but only if there are new statistics and the
    // plots are on screen.
    let plotted = live.stats.time;
    const plotTimer = setInterval(() => {
      if (live.stats.time === plotted) return;
      const box = plotHolder.getBoundingClientRect();
      if (box.bottom < 0 || box.top > window.innerHeight) return;
      plotted = live.stats.time;
      drawPlots();
    }, 1000);
    invalidation.then(() => clearInterval(plotTimer));
  </script>

  <script id="flow-heading" type="text/markdown">
    ## The flow

    The fluid fills the gap between two flat walls at ${tex`y = \pm 1`}. Lengths are measured in units of the half-height of the channel. The mean flow is along ${tex`x`}, the streamwise direction, and ${tex`z`} runs across the span. The velocity components in the three directions are ${tex`u`}, ${tex`v`} and ${tex`w`}.
  </script>

  <script id="flow-figure" type="module">
    const channelFigure = html`<figure id="channel-diagram"></figure>`;
    channelFigure.innerHTML = channelDiagram({ ink, accent: palette[0] }) +
      '<figcaption>The channel seen from the side, with the laminar velocity profile.</figcaption>';
    display(channelFigure);
  </script>

  <script id="flow-equations" type="text/markdown">
    The motion obeys the incompressible Navier–Stokes equations,

    ${tex.block`\frac{\partial \mathbf{u}}{\partial t} + \nabla \cdot (\mathbf{u}\mathbf{u}) = -\nabla p + \frac{1}{Re}\nabla^2 \mathbf{u} + f\,\mathbf{e}_x, \qquad \nabla \cdot \mathbf{u} = 0,`}

    with ${tex`\mathbf{u} = 0`} on both walls. The first equation is Newton's second law for a fluid particle. The second says that the fluid neither piles up nor thins out anywhere. Pressure has no equation of its own. It takes whatever value is needed at each instant to keep the velocity field free of divergence, and most of the difficulty of solving these equations comes from that constraint.
  </script>

  <script id="flow-periodic" type="text/markdown">
    The domain is periodic in ${tex`x`} and ${tex`z`}, so fluid that leaves through one end re-enters through the other. A real channel has an inlet and an outlet, and a disturbance in it develops as it travels downstream. In the periodic box the same disturbance develops in time instead, while the box travels with it. This is called a temporal simulation. It gives up a faithful picture of the streamwise development in exchange for a domain a few wavelengths long instead of hundreds of channel heights, and it is the setting of most of the classical channel simulations.

    Because the pressure is periodic too, it cannot carry the pressure drop that pushes the fluid along a real channel. The uniform body force ${tex`f`} stands in for that pressure gradient.
  </script>

  <script id="flow-laminar" type="text/markdown">
    The equations have a steady solution in which the fluid moves in parallel layers, ${tex`u = U(y) = 1 - y^2`}, driven by ${tex`f = 2/Re`}. This is plane Poiseuille flow. Its centreline velocity is the unit of velocity for the two laminar starting points, and the Reynolds number ${tex`Re = U_c\,\delta/\nu`} is built from that velocity, the half-height ${tex`\delta`} and the kinematic viscosity ${tex`\nu`}. The Reynolds number measures how weak viscosity is compared with inertia, and it is the only parameter of the problem.

    Poiseuille flow exists at every Reynolds number. Whether it is what one observes depends on what happens to disturbances.
  </script>

  <script id="transition-heading" type="text/markdown">
    ## From laminar to turbulent

    A laminar flow becomes turbulent when disturbances to it grow rather than decay. The simplest question to ask is what happens to disturbances so small that their effect on one another can be neglected.
  </script>

  <script id="stability-text" type="text/markdown">
    ### Linear stability

    A small disturbance to Poiseuille flow can be written as a sum of waves, each proportional to ${tex`e^{i(\alpha x + \beta z - \alpha c t)}`}, with wavenumbers ${tex`\alpha`} and ${tex`\beta`} along and across the stream. Substituting one such wave into the equations and discarding products of small quantities leaves a single equation for the shape ${tex`\hat v(y)`} of its wall-normal velocity, the Orr–Sommerfeld equation,

    ${tex.block`\left[(U - c)\left(D^2 - k^2\right) - U''\right]\hat v - \frac{1}{i \alpha Re}\left(D^2 - k^2\right)^2 \hat v = 0, \qquad k^2 = \alpha^2 + \beta^2,`}

    where ${tex`D`} denotes differentiation in ${tex`y`} and ${tex`\hat v`} and its derivative vanish at the walls. Only certain complex values of the phase speed ${tex`c`} allow a solution, so this is an eigenvalue problem. The real part of ${tex`c`} is the speed at which the wave travels, and the wave grows if the imaginary part is positive.
  </script>

  <script id="stability-inputs" type="module">
    const stabilityRe = view(Inputs.range([1000, 20000], { label: 'Reynolds number', step: 100, value: 5000 }));
    const stabilityAlpha = view(Inputs.range([0.5, 1.5], { label: 'Streamwise wavenumber α', step: 0.01, value: 1.12 }));
  </script>

  <script id="stability-plot" type="module">
    const spectrum = orrSommerfeldSpectrum({ re: stabilityRe, alpha: stabilityAlpha });
    const leading = spectrum.find((c) => c.re < 0.6);
    display(html`<p style="font-size: 0.9em">
      Tollmien–Schlichting wave: c = ${leading.re.toFixed(6)} ${leading.im < 0 ? '−' : '+'} ${Math.abs(leading.im).toFixed(6)} i,
      amplitude growth rate ${(stabilityAlpha * leading.im).toExponential(3)} per time unit
      (${leading.im > 0 ? 'unstable' : 'stable'}).
    </p>`);
    display(Plot.plot({
      width: Math.min(width, 640),
      height: 320,
      x: { label: 'Re c', domain: [0, 1] },
      y: { label: 'Im c', domain: [-1, 0.1] },
      marks: [
        Plot.ruleY([0], { strokeOpacity: 0.4 }),
        Plot.dot(spectrum, { x: 're', y: 'im', r: 2.5, fill: palette[0] }),
        Plot.dot([leading], { x: 're', y: 'im', r: 5, stroke: palette[1], strokeWidth: 2 }),
      ],
    }));
  </script>

  <script id="stability-spectrum-text" type="text/markdown">
    The plot shows the eigenvalues for a plane wave, ${tex`\beta = 0`}. They fall on three branches that meet in a Y. The modes on the left branch are concentrated near the walls and travel slowly. Those on the right branch live near the centreline and travel at nearly the centreline speed. The vertical branch is heavily damped. One eigenvalue at the top of the left branch stands apart from the rest. This is the Tollmien–Schlichting wave, and it is the only mode that ever becomes unstable. It does so at ${tex`Re = 5772`} for ${tex`\alpha = 1.02`}, the critical Reynolds number of the flow.
  </script>

  <script id="stability-eigenfunction" type="module">
    const waveShape = orrSommerfeldMode({ re: stabilityRe, alpha: stabilityAlpha });
    const shapeData = Array.from(waveShape.y, (y, j) => [
      { y, value: Math.hypot(waveShape.u[0][j], waveShape.u[1][j]), component: 'streamwise velocity' },
      { y, value: Math.hypot(waveShape.v[0][j], waveShape.v[1][j]), component: 'wall-normal velocity' },
    ]).flat();
    // Heights where the wave travels with the fluid, U(y) = Re c.
    const criticalHeight = Math.sqrt(Math.max(1 - waveShape.c.re, 0));
    display(Plot.plot({
      width: Math.min(width, 640),
      height: 320,
      color: { legend: true, range: palette },
      x: { label: 'amplitude of the Tollmien–Schlichting wave' },
      y: { label: 'y', domain: [-1, 1] },
      marks: [
        Plot.ruleY([-criticalHeight, criticalHeight], { stroke: ink, strokeDasharray: '4 3', strokeOpacity: 0.6 }),
        Plot.line(shapeData, { x: 'value', y: 'y', stroke: 'component', z: 'component' }),
      ],
    }));
  </script>

  <script id="stability-eigenfunction-text" type="text/markdown">
    The shape of the wave explains why it is so delicate. Its streamwise velocity peaks close to each wall, at about the height where the wave travels at the local speed of the fluid, shown by the dashed lines. Energy is fed to the wave in a thin layer around that height and removed by viscosity at the wall, and the growth rate is the small difference between the two. Viscosity is what makes the instability possible, since an inviscid parabolic profile is stable, and the wave needs hundreds of time units to grow by a factor of ${tex`e`}.
  </script>

  <script id="stability-waves" type="module">
    if (waves) {
      const describe = (m) => `c = ${m.c.re.toFixed(5)} ${m.c.im < 0 ? '−' : '+'} ${Math.abs(m.c.im).toFixed(5)} i`;
      display(html`<p style="font-size: 0.9em">
        Waves seeding the current run: plane wave ${describe(waves.plane)}; oblique pair ${describe(waves.oblique)}.
        Both are damped on their own at this Reynolds number; the oblique pair grows only because of the plane wave.
      </p>`);
    }
  </script>

  <script id="stability-squire" type="text/markdown">
    Oblique waves need no separate treatment at this level. Squire's theorem states that an oblique wave behaves like a plane wave at a lower Reynolds number, so the first wave to become unstable as the Reynolds number rises is always a plane one. The oblique waves matter for what comes next.
  </script>

  <script id="subcritical-text" type="text/markdown">
    ### Why the linear theory is not enough

    In experiments, channel flow becomes turbulent at Reynolds numbers between one and two thousand, far below the critical value, and far too quickly for a Tollmien–Schlichting wave to be responsible. The linear theory describes what happens to infinitesimal disturbances. Real ones have finite size, and two mechanisms let them grow where the linear theory predicts decay.
  </script>

  <script id="secondary-text" type="text/markdown">
    ### Secondary instability and K-type transition

    The first mechanism starts from a plane wave that has reached an amplitude of about one percent of the centreline velocity. Seen from a frame moving with the wave, the flow is then steady and periodic in ${tex`x`}, a row of weak spanwise rollers. This modulated flow is unstable to three-dimensional disturbances, and the instability is fast. It grows on the time scale of the flow itself, not on the slow viscous scale of the plane wave, and it operates well below the critical Reynolds number. Orszag and Patera identified it in 1983 and Herbert developed the theory.

    The form the instability takes depends on the oblique waves present. If they have the same streamwise wavelength as the plane wave, the three lock together and the spanwise vortex lines of the wave bend downstream at fixed positions across the span. The result is a row of Λ-shaped vortices, one behind another, each with its tip pointing downstream and lifted away from the wall. This is K-type transition, after Klebanoff, whose hot-wire measurements in 1962 revealed the alternating spanwise positions of strong and weak disturbance that the vortices produce. If the oblique waves have twice the wavelength of the plane wave, the vortices form a staggered pattern instead, known as H-type.
  </script>

  <script id="secondary-breakdown-text" type="text/markdown">
    What follows is rapid. The two legs of each Λ vortex are stretched by the shear and intensify. Between them, slow fluid is pumped away from the wall, and a thin layer of intense shear forms above the lifted fluid. That layer rolls up into a succession of small vortices that connect across the tip, which gives the hairpin or horseshoe shape. Each roll-up appears to a fixed probe as a sharp spike in the velocity signal. Within a few periods of the original wave the structures have multiplied, the wall shear has risen sharply, and the flow is turbulent.

    The K-type scenario here follows this route with the parameters of the simulations of Gilbert and Kleiser, a plane wave of three percent and an oblique pair of a tenth of a percent at ${tex`Re = 5000`}, ${tex`\alpha = 1.12`} and ${tex`\beta = 2.1`}. The box holds exactly one wavelength in each direction.
  </script>

  <script id="bypass-text" type="text/markdown">
    ### Lift-up and bypass transition

    The second mechanism does not involve the Tollmien–Schlichting wave at all, and is said to bypass it. A weak vortex aligned with the stream moves fluid across the mean shear. Slow fluid from near the wall is carried outwards on one side of the vortex and fast fluid inwards on the other, which produces long streaks of low and high streamwise velocity. The streaks can become far stronger than the vortices that create them, because a small wall-normal displacement taps the large velocity difference across the channel. This is the lift-up effect. It grows in proportion to time, not exponentially, and it occurs even though every individual eigenmode decays. The eigenmodes of a shear flow are far from orthogonal, and a sum of decaying modes can grow for a long while before it decays.

    A low-speed streak is capped by a layer of strong shear where the lifted slow fluid meets the faster stream above it. That layer is unstable in the same way as the one above a Λ vortex, and it rolls up into a train of hairpins that straddle the streak. Acarlar and Smith produced such trains in the laboratory by placing a small hemisphere on a wall. The localized-disturbance scenario does it with a pair of counter-rotating vortices, in the spirit of the initial conditions of Henningson, Lundbladh and Johansson.
  </script>

  <script id="turbulence-text" type="text/markdown">
    ### The turbulent state

    Once the flow is turbulent the orderly sequence is gone, but the same ingredients persist near the walls. Streaks of slow fluid are created by streamwise vortices, become unstable, and regenerate the vortices. This self-sustaining cycle needs no input from the rest of the flow. Jiménez and Moin showed that turbulence survives in a periodic box only just large enough to hold one streak and one pair of vortices, and dies out in anything smaller.
  </script>

  <script id="wall-units-text" type="text/markdown">
    The size of these structures is set by the wall, not by the channel. The natural velocity scale is the friction velocity ${tex`u_\tau = \sqrt{\tau_w / \rho}`}, built from the shear stress ${tex`\tau_w`} that the fluid exerts on the wall, and the natural length is ${tex`\nu / u_\tau`}. Quantities measured in these wall units carry a superscript plus. The streaks are about ${tex`100`} wall units apart, and the smallest box that sustains turbulence is about that wide and three times as long.

    The ratio of the half-height to the viscous length is the friction Reynolds number ${tex`Re_\tau = u_\tau \delta / \nu`}. In a steady state the force on the fluid balances the friction on the two walls, which gives ${tex`\tau_w = f\,\delta`}. The turbulent scenario uses wall units throughout, so that ${tex`f = 1`}, ${tex`\nu = 1/Re_\tau`}, and the wall shear stress settles to one. Its default, ${tex`Re_\tau = 180`}, is the case computed by Kim, Moin and Moser in 1987, which has served as the reference for wall turbulence since.
  </script>

  <script id="law-of-the-wall-text" type="text/markdown">
    In wall units the mean velocity near the wall follows a profile that is the same for every wall-bounded turbulent flow. Within about five wall units of the wall, viscosity dominates and ${tex`u^+ = y^+`}. Beyond about thirty, the velocity rises as the logarithm of the distance, ${tex`u^+ = \ln(y^+)/\kappa + B`} with ${tex`\kappa \approx 0.41`} and ${tex`B \approx 5.2`}. The statistics plot under the simulation compares the computed profile with both. A laminar profile lies far above the logarithmic line, and the collapse onto it is a clear sign that the flow has become turbulent.
  </script>

  <script id="method-heading" type="text/markdown">
    ## The numerical method

    The methods used to animate fluids in computer graphics are built to never fail. They trace the flow backwards along its path and interpolate, and they treat everything else implicitly, so that any time step is stable. The interpolation acts as a diffusion whose strength depends on the grid and the time step, and on an affordable grid it usually exceeds the viscosity of the fluid. The result looks like a fluid, but its effective Reynolds number is unknown and much lower than intended. Upwind differencing has the same character, since its leading error is a diffusion proportional to the grid spacing.

    Transition and turbulence are decided by the balance between the growth of disturbances and their viscous decay, so a simulation of them cannot afford dissipation that is not physical. The method here has none. The price is that nothing smooths over an under-resolved flow. If the grid is too coarse the solution shows grid-scale oscillations, which is at least an honest signal, and stability has to come from the structure of the scheme.
  </script>

  <script id="method-variants" type="text/markdown">
    Two discretisations are offered, and they differ only in the periodic directions. The default represents the flow there by Fourier series, which differentiate exactly. The alternative uses second-order central differences in all three directions. Across the channel both use the same staggered differences, so the description starts with the difference scheme and then turns to what the Fourier series change.
  </script>

  <script id="staggered-text" type="text/markdown">
    ### The staggered grid

    The domain is divided into cells, uniform in ${tex`x`} and ${tex`z`} and of varying height in ${tex`y`}. The unknowns are not all stored at the same place. Pressure sits at the centre of each cell, and each velocity component sits at the centre of the faces it crosses, so that ${tex`u`} lives on the faces normal to ${tex`x`}, and so on. Harlow and Welch introduced this arrangement in 1965.
  </script>

  <script id="staggered-figure" type="module">
    const staggeredFigure = html`<figure id="staggered-diagram"></figure>`;
    staggeredFigure.innerHTML = staggeredCellDiagram({ ink, accent: palette[0], accent2: palette[1] }) +
      '<figcaption>One cell in the x–y plane. The third component, w, sits on the faces normal to z in the same way.</figcaption>';
    display(staggeredFigure);
  </script>

  <script id="staggered-why" type="text/markdown">
    The arrangement makes the two operators that involve pressure as compact as they can be. The net outflow from a cell is the difference of the velocities on opposite faces, and the pressure gradient that acts on a face velocity is the difference of the two pressures on either side of it. If everything were stored at cell centres, a centred pressure gradient would skip the centre value and connect only alternate cells, and a checkerboard pattern of pressure would go unnoticed by the velocity. On the staggered grid no such pattern exists, and the discrete divergence of the discrete gradient is the ordinary seven-point Laplacian.

    The wall-normal cells are made thinner towards the walls with a hyperbolic tangent, because the gradients there are the steepest in the flow. In the turbulent scenario the first cell is about one wall unit high.
  </script>

  <script id="conservation-text" type="text/markdown">
    ### Convection that conserves energy

    The convective term is written as the divergence of a momentum flux, ${tex`\nabla \cdot (\mathbf{u}\mathbf{u})`}. Each velocity component has its own control volume, centred on the face where it lives and shaded in the figure for ${tex`u`}. The flux through each face of that volume is the product of the volume of fluid crossing the face and the value of the component it carries, each obtained by averaging the two nearest stored values.

    With this choice the momentum that leaves one control volume enters its neighbour, so momentum is conserved exactly. Less obviously, kinetic energy is conserved too. In the exact equations the convective term moves energy around without creating or destroying any, which follows from integrating by parts and using ${tex`\nabla \cdot \mathbf{u} = 0`}. The discrete operator built from plain averages has the same property, because summation by parts works for it in the same way, provided the discrete velocity is free of divergence. On a stretched grid the property survives if the carried value is the unweighted mean of its two neighbours and the carrying flux is weighted by cell height, as Verstappen and Veldman showed.

    This is what replaces numerical dissipation as the source of stability. The total kinetic energy cannot grow except through the forcing, whatever the grid, so the nonlinear term cannot make the solution blow up.
  </script>

  <script id="wavenumber-text" type="text/markdown">
    ### Resolution

    Central differences are second-order accurate, which means that halving the grid spacing ${tex`h`} divides the error by four. A more telling measure is what a difference does to a single wave ${tex`e^{ikx}`}. The exact derivative multiplies the wave by ${tex`ik`}. A difference multiplies it by ${tex`ik'`}, where the modified wavenumber ${tex`k'`} falls below ${tex`k`} as the wave becomes short compared with the grid.
  </script>

  <script id="wavenumber-figure" type="module">
    const wavenumberData = d3.range(0, 1.0001, 0.01).flatMap((s) => {
      const kh = Math.PI * s;
      return [
        { kh, value: kh, scheme: 'exact, and Fourier' },
        { kh, value: 2 * Math.sin(kh / 2), scheme: 'difference across one cell (staggered)' },
        { kh, value: Math.sin(kh), scheme: 'difference across two cells' },
      ];
    });
    display(Plot.plot({
      width: Math.min(width, 640),
      height: 300,
      color: { legend: true, range: [ink, palette[0], palette[1]] },
      x: { label: 'k h', ticks: [0, Math.PI / 4, Math.PI / 2, (3 * Math.PI) / 4, Math.PI], tickFormat: (d) => ['0', 'π/4', 'π/2', '3π/4', 'π'][Math.round((4 * d) / Math.PI)] },
      y: { label: 'k′ h' },
      marks: [
        Plot.line(wavenumberData, { x: 'kh', y: 'value', stroke: 'scheme', z: 'scheme' }),
      ],
    }));
  </script>

  <script id="wavenumber-after" type="text/markdown">
    The shortest wave a grid can hold has two points per wavelength, ${tex`kh = \pi`}. A wave with eight points per wavelength, ${tex`kh = \pi/4`}, is differentiated with an error of 2.6 percent by a difference across one cell and 10 percent by a difference across two. The staggered grid uses the first kind for the pressure gradient and the divergence, and the convective term mixes the two. A spectral method makes no such error at any resolved wavenumber, so a second-order code needs roughly twice as many points in each direction to reach the same fidelity. That is the main cost of second-order differences, and the reason for the alternative described next.
  </script>

  <script id="fourier-text" type="text/markdown">
    ### Fourier series in the periodic directions

    In a periodic direction there is a better option than differences. A periodic function on ${tex`N`} grid points is a sum of ${tex`N`} waves ${tex`e^{ikx}`}, and the fast Fourier transform converts between the grid values and the amplitudes of the waves. Differentiating a wave multiplies its amplitude by ${tex`ik`}, exactly. So if the unknowns are the amplitudes instead of the grid values, derivatives in ${tex`x`} and ${tex`z`} carry no error at all for any wave the grid can hold. In the plot above this method lies on the exact line.

    The Fourier method here stores, for every row of the channel, the amplitudes of each velocity component in ${tex`x`} and ${tex`z`}. Across the channel it keeps the staggered differences, with ${tex`v`} on the faces between rows.
  </script>

  <script id="fourier-products-text" type="text/markdown">
    The difficulty is the nonlinear term. A product of two fields is simple on the grid, where it is a multiplication at each point, and awkward in terms of amplitudes, where it is a sum over all pairs of waves. So the products are formed on the grid. The velocity is transformed to grid values, the products ${tex`uu`}, ${tex`uw`} and so on are taken point by point, and the results are transformed back. Only their derivatives are then evaluated on the amplitudes. This is the pseudo-spectral method of Orszag and Patterson.

    It has one trap. The product of two waves with wavenumbers ${tex`k_1`} and ${tex`k_2`} is a wave with wavenumber ${tex`k_1 + k_2`}, which may be shorter than anything the grid can hold. On the grid such a wave is indistinguishable from a longer one, and its energy is silently credited to that longer wave. This is aliasing, and left alone it feeds spurious energy into the resolved scales. The standard cure is to keep only the lowest two thirds of the wavenumbers in each direction. The sum of any two retained wavenumbers then either is itself retained and correct, or aliases onto a wavenumber that is discarded anyway. The price is that a grid of ${tex`N`} points carries ${tex`2N/3`} waves.
  </script>

  <script id="fourier-consequences-text" type="text/markdown">
    With the products exact in this sense, the convective term conserves kinetic energy just as the difference scheme does, and for the same reason, since integration by parts now holds exactly in ${tex`x`} and ${tex`z`}. The inviscid test confirms it.

    Two costs come with the gain. Each stage of a time step needs eleven two-dimensional transforms where the difference scheme needs two, so a step costs about three times as much on the same grid. And the largest retained wavenumber, ${tex`2\pi/(3\,\Delta x)`}, is about twice the largest effective wavenumber of a second-order difference, so the convective limit on the time step is about half as large. In return, a given accuracy in ${tex`x`} and ${tex`z`} needs far fewer points.

    The wall-normal direction is untouched by all this, and it is still second-order. For flows whose fine structure lies across the channel, such as the Tollmien–Schlichting wave, it is the wall-normal grid that sets the accuracy, whichever method is used in the other two directions.
  </script>

  <script id="underresolved-text" type="text/markdown">
    ### When the grid is too coarse

    It is fair to ask what protects a simulation like this from quietly turning into one with numerical dissipation as the Reynolds number rises and the grid falls behind. The answer has two parts.

    The absence of numerical dissipation does not depend on resolution. The convective operator conserves energy because of how its fluxes are formed, and the property holds on any grid, however coarse. The inviscid test below verifies it on a deliberately coarse, stretched grid. So an under-resolved run cannot dissipate energy numerically. The only sink remains the viscous term.

    That does not make an under-resolved run correct. It fails in a different way. Turbulence passes energy from large eddies to smaller ones until the eddies are small enough for viscosity to turn their motion into heat. The size at which this happens is the Kolmogorov length ${tex`\eta = (\nu^3/\varepsilon)^{1/4}`}, where ${tex`\varepsilon`} is the rate of dissipation. In a channel at this Reynolds number it is about one and a half wall units near the wall and about four at the centre. If the grid cannot hold eddies of a few times that size, the energy arriving at the smallest resolved scale has nowhere to go. A dissipative scheme would remove it and hide the problem. This scheme leaves it there, and it accumulates as oscillations at the scale of the grid. The total energy stays bounded, so the run does not blow up, but the small scales are wrong, and through them the wall friction and everything else.
  </script>

  <script id="resolution-cost-text" type="text/markdown">
    The practical rule for this kind of code is a streamwise spacing of about ten wall units, a spanwise spacing of about five, and a first cell of about one wall unit at the wall. Since the wall unit shrinks as the Reynolds number rises, the number of grid points needed grows roughly as ${tex`Re_\tau^{9/4}`}. Going from ${tex`Re_\tau = 180`} to ${tex`400`} in the same box takes about six times as many points, and a smaller time step as well. The friction Reynolds number slider goes further than the grids offered can follow, on purpose, so that the failure can be seen.

    Two indicators under the figure show where a run stands. The first is the grid spacing in wall units, computed from the wall shear stress the flow has at that moment. The second measures the solution itself. For a single wave of wavenumber ${tex`k`}, the ratio of the mean squared second difference to the mean squared first difference is ${tex`\tan^2(kh/2)`}. Applied to the streamwise velocity, the same ratio gives a typical wavenumber of the field, weighted towards the short waves that carry the gradients, and it is reported as a fraction of the largest wavenumber the grid can hold. A value of ${tex`0.25`} means the gradients are carried by waves of eight points. Above about ${tex`0.5`}, waves of fewer than four points dominate and the run should not be trusted. The modified-wavenumber plot above shows why those are the natural thresholds.
  </script>

  <script id="time-text" type="text/markdown">
    ### Advancing in time

    With the spatial terms evaluated, each velocity value obeys an ordinary differential equation in time. These are advanced with a three-stage Runge–Kutta scheme due to Wray. Writing ${tex`\mathbf{R}(\mathbf{u})`} for the convective, viscous and forcing terms together, each stage is

    ${tex.block`\mathbf{u}^{(s)} = \mathbf{u}^{(s-1)} + \Delta t\left[\gamma_s\,\mathbf{R}\big(\mathbf{u}^{(s-1)}\big) + \zeta_s\,\mathbf{R}\big(\mathbf{u}^{(s-2)}\big)\right] - \Delta t\,(\gamma_s + \zeta_s)\,\nabla p^{(s)},`}

    with ${tex`\gamma = \left(\tfrac{8}{15}, \tfrac{5}{12}, \tfrac{3}{4}\right)`} and ${tex`\zeta = \left(0, -\tfrac{17}{60}, -\tfrac{5}{12}\right)`}. Each stage needs only the current velocity and the right-hand side of the stage before, so the scheme takes two arrays of storage however many stages it has. It is third-order accurate.
  </script>

  <script id="time-stability-text" type="text/markdown">
    The choice of scheme is tied to the choice of central differences. An explicit scheme is stable for a term of the equations if the product of the time step and each eigenvalue ${tex`\lambda`} of that term lies inside the scheme's stability region in the complex plane. Diffusion has negative real eigenvalues. Convection discretised without dissipation has purely imaginary ones, since it only moves things around. The forward Euler scheme and the second-order Runge–Kutta scheme have stability regions that do not contain any part of the imaginary axis, so they amplify every convected wave. The three-stage scheme covers the imaginary axis up to ${tex`\sqrt{3}`} and the real axis down to ${tex`-2.51`}.
  </script>

  <script id="time-stability-figure" type="module">
    const stabilityNames = ['', 'forward Euler', 'Runge–Kutta 2', 'Runge–Kutta 3'];
    const stabilityData = [1, 2, 3].flatMap((s) =>
      rungeKuttaStabilityBoundary(s).map((point) => ({ ...point, method: stabilityNames[s] })));
    display(Plot.plot({
      width: Math.min(width, 480),
      aspectRatio: 1,
      color: { legend: true, domain: stabilityNames.slice(1), range: [palette[2], palette[1], palette[0]] },
      x: { label: 'Re(λ Δt)', domain: [-3, 0.8] },
      y: { label: 'Im(λ Δt)', domain: [-2.7, 2.7] },
      marks: [
        Plot.ruleX([0], { stroke: ink, strokeOpacity: 0.4 }),
        Plot.ruleY([0], { stroke: ink, strokeOpacity: 0.4 }),
        Plot.line(stabilityData, { x: 're', y: 'im', stroke: 'method', z: 'method' }),
        Plot.dot([{ re: 0, im: Math.sqrt(3) }, { re: 0, im: -Math.sqrt(3) }], { x: 're', y: 'im', r: 3, fill: ink }),
      ],
    }));
  </script>

  <script id="time-step-text" type="text/markdown">
    Each curve encloses the region where that scheme is stable. The dots mark the limit of the three-stage scheme on the imaginary axis. These two limits translate into two bounds on the time step,

    ${tex.block`\Delta t\left(\frac{|u|}{\Delta x} + \frac{|v|}{\Delta y} + \frac{|w|}{\Delta z}\right) \le \sqrt{3}, \qquad 4\,\nu\,\Delta t\left(\frac{1}{\Delta x^2} + \frac{1}{\Delta y^2} + \frac{1}{\Delta z^2}\right) \le 2.51,`}

    the first from convection and the second from diffusion. The simulation measures the left-hand sides on the GPU as it runs and takes half the largest step they allow. In the turbulent scenario the two bounds are comparable, because the wall cells are thin. That is why the viscous term is treated explicitly here, where larger simulations treat it implicitly.
  </script>

  <script id="projection-text" type="text/markdown">
    ### Keeping the velocity free of divergence

    The stage formula above contains the pressure at the new stage, which is not yet known. It is found by splitting the stage in two. First the velocity is advanced without the pressure term, giving a provisional field ${tex`\mathbf{u}^*`} that has some divergence. Then the gradient of a pressure is subtracted, chosen so that the divergence of the result is zero. Taking the divergence of the stage formula gives the equation the pressure must satisfy,

    ${tex.block`\nabla^2 p^{(s)} = \frac{\nabla \cdot \mathbf{u}^*}{(\gamma_s + \zeta_s)\,\Delta t},`}

    a Poisson equation, with the condition that the pressure gradient normal to a wall is zero because the provisional velocity already vanishes there. This is the projection method of Chorin. The correction removes exactly the part of ${tex`\mathbf{u}^*`} that is a gradient and leaves the rest untouched.

    Projection methods usually introduce an error of their own, because the pressure and viscous terms are advanced separately. Here they do not. Every term is explicit, each stage starts from a field without divergence, and the projection is a linear operation, so the result is identical to applying the Runge–Kutta scheme directly to the constrained equations.
  </script>

  <script id="poisson-text" type="text/markdown">
    ### Solving for the pressure

    The Poisson equation couples every cell to every other and has to be solved three times per time step, so it dominates the cost. Iterative methods such as multigrid solve it to a tolerance, and whatever error remains is left in the velocity as divergence. The geometry of the channel allows something better.

    Because the grid is uniform and periodic in ${tex`x`} and ${tex`z`}, a discrete Fourier transform in those two directions turns the differences there into multiplications. For each pair of wavenumbers ${tex`(k_x, k_z)`} the transformed pressure ${tex`\hat p_j`} on row ${tex`j`} satisfies

    ${tex.block`a_j\,\hat p_{j-1} - \left(a_j + c_j + \lambda_x + \lambda_z\right)\hat p_j + c_j\,\hat p_{j+1} = \hat f_j, \qquad \lambda_x = \frac{2 - 2\cos(2\pi k_x / N_x)}{\Delta x^2},`}

    where ${tex`a_j`} and ${tex`c_j`} come from the cell heights and ${tex`\lambda_z`} is defined like ${tex`\lambda_x`}. The numbers ${tex`\lambda`} are the eigenvalues of the second difference, the discrete counterpart of ${tex`k^2`}. Using them, and not ${tex`k^2`} itself, is what makes the solution satisfy the discrete equation exactly. What remains is one tridiagonal system in ${tex`y`} for each wavenumber pair, which is solved directly by elimination. The inverse transforms then return the pressure.

    In the Fourier method the velocity is already held as amplitudes, so no transform is needed for this step, and the gradient and divergence in ${tex`x`} and ${tex`z`} are exact. The numbers ${tex`\lambda`} are then simply ${tex`k_x^2`} and ${tex`k_z^2`}.

    The solution is exact up to rounding. The mode with ${tex`k_x = k_z = 0`} needs one exception, since the pressure is determined only up to a constant and that system is singular. One of its equations is replaced by a condition fixing the constant.
  </script>

  <script id="precision-text" type="text/markdown">
    ### Single precision

    WebGPU offers only single-precision arithmetic, about seven significant digits, where research codes normally use sixteen. The method tolerates this well. The divergence left after a time step is around ${tex`10^{-7}`} of the velocity gradients, and the growth rates and conservation properties tested below are unaffected. Quantities that are small differences of large numbers are the weak point. The factors of the tridiagonal systems and the trigonometric tables of the transforms are therefore computed in double precision on the CPU and stored, and an arbitrary initial condition is projected twice, since a single solve leaves a residual proportional to the size of the correction.
  </script>

  <script id="gpu-text" type="text/markdown">
    ### On the GPU

    A GPU runs the same small program on thousands of threads at once and is limited mostly by how fast it can move data to and from memory. The implementation is organised around touching memory as few times as possible, and in order.

    The state is one array holding ${tex`(u, v, w, p)`} for each cell, ordered so that ${tex`x`} varies fastest and each horizontal plane is a contiguous block. With second-order differences, one Runge–Kutta stage is eight passes over this data.

    | Pass | Work |
    |---|---|
    | 1 | Convective, viscous and forcing terms, and the provisional velocity |
    | 2 | Divergence of the provisional velocity |
    | 3 | Fourier transform in ${tex`x`}, real to complex |
    | 4 | Fourier transform in ${tex`z`} |
    | 5 | Tridiagonal solves in ${tex`y`} |
    | 6 | Inverse transform in ${tex`z`} |
    | 7 | Inverse transform in ${tex`x`}, complex to real |
    | 8 | Subtraction of the pressure gradient |
  </script>

  <script id="gpu-fft-text" type="text/markdown">
    In the transforms, each group of threads takes one line of the grid, copies it into a small block of fast memory that the group shares, performs every stage of the fast Fourier transform there, and writes the line back once. A line that runs along ${tex`z`} is not contiguous in memory, but it is read and written with a stride, so the data are never rearranged between passes. The input is real, so only half of the spectrum is computed and stored.

    The tridiagonal elimination is sequential along ${tex`y`} but independent for each wavenumber pair, so one thread handles each pair and marches from one wall to the other and back. At every step the threads together read and write exactly one plane.

    Statistics are reduced on the GPU as well. The plane averages, the largest divergence and the quantities that set the time step come back to the CPU as a few hundred numbers. The velocity field itself is never copied back.
  </script>

  <script id="gpu-fourier-text" type="text/markdown">
    The Fourier method reorganises the stage around the transforms. Eight products are transformed forward, and each is formed from the grid values as they are loaded into the transform, so the products never exist as arrays of their own. One pass then assembles the right-hand side and the provisional velocity for every wavenumber and row. A second pass does the whole projection with one thread per wavenumber pair, eliminating down the column and substituting back up it. Three inverse transforms return the velocity to the grid for the next stage, which is also what the figures and statistics read. Wavenumbers beyond the retained two thirds are skipped wherever a pass can skip them.
  </script>

  <script id="q-heading" type="text/markdown">
    ## Seeing vortices

    A vortex is easy to recognise and hard to define. Vorticity, the curl of the velocity, measures the local rate of rotation of the fluid, but it is large in any shear flow whether or not anything is swirling. The laminar flow next to a wall has strong vorticity and no vortices.

    A more selective measure comes from the velocity gradient ${tex`\partial u_i / \partial x_j`}. Its symmetric part ${tex`\mathbf{S}`} describes the rate at which a fluid element is stretched and sheared, and its antisymmetric part ${tex`\boldsymbol{\Omega}`} the rate at which it rotates. Hunt, Wray and Moin proposed marking as a vortex the regions where rotation exceeds strain,

    ${tex.block`Q = \tfrac{1}{2}\left(\lVert\boldsymbol{\Omega}\rVert^2 - \lVert\mathbf{S}\rVert^2\right) = -\tfrac{1}{2}\,\frac{\partial u_i}{\partial x_j}\frac{\partial u_j}{\partial x_i} > 0.`}

    In a pure shear the two parts are equal and ${tex`Q`} vanishes, so the mean flow by itself contributes nothing. In practice one draws the surface on which ${tex`Q`} equals some positive threshold. The threshold is a free choice, and the picture depends on it. A high value shows only the strongest cores, and a low one fills the view. For the turbulent scenario the threshold is given in wall units.
  </script>

  <script id="marching-text" type="text/markdown">
    The surface is extracted with marching cubes, the algorithm of Lorensen and Cline. Take ${tex`Q`} at the centres of eight neighbouring cells as the corners of a small cube. Each corner is either above the threshold or below it, which gives 256 possible patterns. For each pattern a table lists the triangles that separate the corners above from those below, and the vertices of the triangles are placed along the edges of the cube where linear interpolation says the threshold is crossed. Cubes that the surface misses produce nothing.

    On the GPU one thread examines each cube. A thread whose cube is crossed reserves space for its triangles in a shared buffer by incrementing a counter atomically, then writes them. The number of vertices goes straight into the arguments of the draw call, so neither the geometry nor its size returns to the CPU. The surface is shaded with the gradient of ${tex`Q`} as its normal, which keeps it smooth where the triangles are coarse, and coloured by the streamwise velocity, so that structures in slow fluid near the wall appear dark and those reaching into the fast stream appear bright.
  </script>

  <script id="validation-heading" type="text/markdown">
    ## Validation

    A simulation that is meant to be accurate has to be tested against things that are known. The tests below can be run here, on your own GPU. Each compares the single-precision result with an exact solution or with a reference computed in double precision.
  </script>

  <script id="flow-validation-text" type="text/markdown">
    ### The flow solver

    Each group of tests isolates one part of the method.

    | Test | What it establishes |
    |---|---|
    | Projection | The velocity is free of divergence to rounding error, initially and after stepping |
    | Taylor–Green vortex | An exact decaying solution in the periodic directions is reproduced, with error falling as the square of the grid spacing |
    | Inviscid energy | Without viscosity the kinetic energy is conserved on a stretched grid between walls. The remaining drift comes from the time scheme and falls as the cube of the time step |
    | Poiseuille flow | The forced laminar profile is steady |
    | Start-up from rest | The approach to that profile under a constant force follows the exact series solution |
    | Orr–Sommerfeld eigenvalue | The stability solver agrees with the value published by Orszag in 1971 |
    | Tollmien–Schlichting wave | A small wave grows in the flow solver at the rate linear theory predicts |
    | Q of an analytic field | The vortex measure is computed to second order |
    | Marching cubes on a sphere | The extracted surface is closed, has the right area, and has outward normals |

    The Tollmien–Schlichting test is the most demanding. The growth of the wave is a small difference between production and viscous loss, and any numerical dissipation turns it into decay, which is why it has long been used to judge Navier–Stokes codes. The two grids in the test give errors of 27 and 7 percent in the growth rate. The error falls by a factor of four between them, as it should for a method that is second-order across the channel. It is the same for both methods, because the wave is a smooth sinusoid along the stream and all of its fine structure lies across the channel. Refining the streamwise grid alone changes the error by only a few percentage points.

    The Taylor–Green test shows the other side. With differences its error falls from half a percent on 16 points to three hundredths of a percent on 64. With Fourier series it is at the level of rounding error on every grid.
  </script>

  <script id="limitations-text" type="text/markdown">
    ## Limitations

    The simulation is honest about what it resolves, but several things separate it from a research calculation.

    Across the channel the scheme is second-order, so it needs a fine wall-normal grid, and with the difference method the same is true of the other two directions. The default grids are chosen to run interactively and are coarser than a careful study would use, particularly for the late stages of transition, where thin shear layers form. Grid-scale oscillations in the slices are the sign that a run has outgrown its grid.

    The periodic box replaces development along the channel with development in time. The two are related but not identical, and a box one wavelength long cannot represent anything longer than itself. The smallest boxes offered for the turbulent scenario are close to the minimal size that sustains turbulence, and the statistics of such boxes differ from those of a large channel away from the walls.

    The statistics shown are instantaneous averages over planes. Comparison with published profiles requires averaging over a long time as well, which the notebook does not yet do.

    Arithmetic is single precision. Nothing tested here is limited by it, but very small disturbances, below about ${tex`10^{-5}`} of the mean flow, cannot be followed accurately.
  </script>
