  <title>Channel Flow</title>

  <script id="intro" type="text/markdown">
    # Channel Flow

    A direct simulation of incompressible flow between two parallel walls, periodic in the streamwise (${tex`x`}) and spanwise (${tex`z`}) directions.

    The method favours accuracy over robustness. Space is discretised with second-order central differences on a staggered grid, in a form that conserves kinetic energy exactly in the absence of viscosity, so nothing is dissipated except by the viscous term. Time is advanced with a three-stage Runge–Kutta scheme, and after every stage the velocity is projected onto the divergence-free fields by solving the pressure Poisson equation directly, with Fourier transforms in ${tex`x`} and ${tex`z`} and a tridiagonal solve in ${tex`y`}.
  </script>

  <script id="imports" type="module">
    import { createWebGPUContext } from './lib/webgpu-canvas.js';
    import { createFrameLoop } from './lib/frame-loop.js';
    import { createUnifiedCamera } from './lib/unified-camera.js';
    import { tanhFaces } from './lib/webgpu-poisson/channel-poisson.js';
    import { validateChannelPoisson, benchmarkChannelPoisson } from './lib/webgpu-poisson/validation.js';
    import { createChannelFlow } from './lib/channel-flow/channel-flow.js';
    import {
      channelOptions, laminarOptions, kTypeOptions, wallUnits,
      perturbedChannel, localizedDisturbance, kTypeDisturbance, fluxForcing,
    } from './lib/channel-flow/channel-setup.js';
    import { orrSommerfeldSpectrum } from './lib/channel-flow/orr-sommerfeld.js';
    import { createSliceView } from './lib/channel-flow/slice-view.js';
    import { createQCriterion } from './lib/channel-flow/q-criterion.js';
    import { createIsosurfaceView } from './lib/channel-flow/isosurface-view.js';
    import { validateChannelFlow, validateQCriterion } from './lib/channel-flow/validation.js';
  </script>

  <script id="context" type="module">
    const { device, canvasFormat } = await createWebGPUContext({
      optionalFeatures: ['timestamp-query'],

    invalidation.then(() => device.destroy());
  </script>

  <script id="simulation-text" type="text/markdown">
    ## Simulation

    Plane Poiseuille flow is linearly stable below a Reynolds number of 5772, and above it the unstable waves grow very slowly, so it does not become turbulent by itself: a disturbance has to be large enough to trigger a faster route. Three starting points are offered.

    **K-type transition.** The classical controlled route, named after Klebanoff. The laminar flow carries a two-dimensional Tollmien–Schlichting wave of a few percent amplitude, plus a pair of oblique waves a thousandth of the centreline velocity, all three computed from the Orr–Sommerfeld equation. The plane wave hardly changes on its own, but its presence makes the flow unstable to the oblique pair, which grows exponentially for about 150 time units with nothing visible happening. Then the spanwise vortex lines of the wave bend into Λ-shaped vortices at fixed spanwise positions, the tips lift away from the wall, and the flow breaks down. The box is one wavelength long and wide.

    **Localized disturbance.** Laminar flow with a single pair of counter-rotating streamwise vortices placed next to the lower wall. Between the vortices fluid moves away from the wall and carries slow fluid up into the faster stream. The vortices are stretched and tilted by the shear into a long, lifted pair, with a low-speed streak between them capped by a thin shear layer. That shear layer is unstable, and it rolls up into a train of arch-shaped vortices straddling the streak: hairpins. Lengths are in channel half-heights and velocities in units of the laminar centreline velocity, and the mass flux is held fixed.

    **Turbulent channel.** A parabolic profile carrying the bulk velocity of the turbulent state, plus streamwise vortices and a few oblique waves of large amplitude, which breaks down within about one time unit. Here velocities are in friction velocities, so the viscosity is ${tex`1/Re_\tau`} and the pressure gradient that drives the flow is one.
  </script>

  <script id="vortices-text" type="text/markdown">
    The three-dimensional view shows an isosurface of the Q-criterion,

    ${tex.block`Q = \tfrac{1}{2}\left(\lVert\boldsymbol{\Omega}\rVert^2 - \lVert\mathbf{S}\rVert^2\right) = -\tfrac{1}{2}\,\frac{\partial u_i}{\partial x_j}\frac{\partial u_j}{\partial x_i},`}

    which is positive where rotation outweighs strain and so picks out vortex cores. The surface is extracted on the GPU every frame with marching cubes and drawn without the geometry ever leaving the GPU.
  </script>

  <script id="scenario-input" type="module">

        ['Localized disturbance in laminar flow', 'localized'],

  </script>

              ['8π × 2 × 2π, 512 × 96 × 256', { Nx: 512, Ny: 96, Nz: 256, Lx: 8 * Math.PI, Lz: 2 * Math.PI }],
            ]),
            { label: 'Domain and grid' }
          ),

          amplitude: Inputs.range([0, 0.4], { label: 'Peak wall-normal velocity', step: 0.01, value: 0.15 }),

  <script id="simulation-controls" type="module">
    const running = view(Inputs.toggle({ label: 'Run', value: true }));
    const stepsPerFrame = view(Inputs.range([1, 20], { label: 'Steps per frame', step: 1, value: 4 }));
    const sliceComponent = view(Inputs.radio(['u', 'v', 'w', 'p'], { label: 'Show', value: 'u' }));
    const planHeight = view(Inputs.range([0.01, 1], { label: 'Plan view height above the wall', step: 0.01, value: scenario === 'turbulent' ? 0.08 : 0.3 }));
    const showVortices = view(Inputs.toggle({ label: 'Show vortices', value: true }));
    // Q is in wall units for the turbulent channel, where Q nu^2 / u_tau^4
    // of order 0.01 marks the near-wall vortices, and in outer units
    // (centreline velocity / half-height)^2 for the laminar case.
    const qLevel = view(scenario === 'turbulent'
      ? Inputs.range([0.001, 0.05], { label: 'Q threshold (wall units)', step: 0.0005, value: 0.006 })
      : Inputs.range([0.001, 1], { label: 'Q threshold', step: 0.001, value: scenario === 'ktype' ? 0.01 : 0.05 }));
  </script>

  <script id="simulation-state" type="module">
    restart;
    const flow = createChannelFlow(device,
      scenario === 'turbulent' ? channelOptions({ reTau: setup.reynolds, ...setup.grid })
      : scenario === 'ktype' ? kTypeOptions({ re: setup.reynolds, alpha: setup.alpha, beta: setup.beta, ...setup.grid })
      : laminarOptions({ re: setup.reynolds, ...setup.grid }));
    // The eigenmodes that seed the K-type run, for the stability section below.
    const waves = scenario === 'ktype'
      ? kTypeDisturbance(flow, {
          re: setup.reynolds, alpha: setup.alpha, beta: setup.beta,
          amplitude2d: setup.amplitude2d, amplitude3d: setup.amplitude3d,
        })
      : null;
    flow.setState(
      scenario === 'turbulent' ? perturbedChannel(flow, { amplitude: setup.amplitude })
      : scenario === 'ktype' ? waves.state
      : localizedDisturbance(flow, { amplitude: setup.amplitude, lx: setup.lx, lz: setup.lz }));
    flow.project();
    const sliceView = createSliceView(device, flow, canvasFormat);
    const vortices = createQCriterion(device, flow);
    const vortexView = createIsosurfaceView(device, flow, vortices, canvasFormat);
    // Mutated by the frame loop; read by the plots.
    const live = { stats: await flow.statistics(), history: [], failed: false, triangles: 0 };
    // Scales that differ between the scenarios. The nominal friction Reynolds
    // number is the one at which the wall shear balances the initial driving
    // force. The laminar case runs at fixed mass flux, the turbulent one at
    // fixed pressure gradient.
    const scales = {
      drive: flow.sim.forcing,
      reTau: Math.sqrt(flow.sim.forcing) / flow.sim.nu,
      qScale: scenario === 'turbulent' ? setup.reynolds ** 2 : 1,
      fluxTarget: scenario === 'turbulent' ? null : live.stats.bulkVelocity,
    };
    invalidation.then(() => {
      vortexView.destroy();
      vortices.destroy();
      sliceView.destroy();
      flow.destroy();
    });
  </script>

  <script id="simulation-resolution" type="module">
    const units = wallUnits(flow, scales.reTau);
    display(html`<p style="font-size: 0.9em">
      ${(flow.cells / 1e6).toFixed(2)} million cells, ${((flow.bytes + vortices.bytes) / 2 ** 20).toFixed(0)} MB.
      Nominal friction Reynolds number ${scales.reTau.toFixed(0)}:
      domain ${units.LxPlus.toFixed(0)} × ${(2 * scales.reTau).toFixed(0)} × ${units.LzPlus.toFixed(0)} wall units;
      spacing Δx⁺ = ${units.dxPlus.toFixed(1)}, Δz⁺ = ${units.dzPlus.toFixed(1)},
      Δy⁺ = ${units.dyWallPlus.toFixed(2)} at the wall to ${units.dyCentrePlus.toFixed(1)} at the centre.
    </p>`);
  </script>

  <script id="simulation-figure" type="module">
    const figureWidth = Math.min(width, 640);
    const makeCanvas = (id, aspect) => {
      const canvas = html`<canvas id="${id}" style="width: 100%; display: block; image-rendering: pixelated"></canvas>`;
      canvas.width = Math.round(figureWidth * devicePixelRatio);
      canvas.height = Math.max(1, Math.round(canvas.width * aspect));
      const context = canvas.getContext('webgpu');
      context.configure({ device, format: canvasFormat, alphaMode: 'opaque' });
      return { canvas, context };
    };
    const vortexCanvas = makeCanvas('channel-vortices', 0.62);
    // Drag to orbit, scroll to zoom. The outer container, not the canvas,
    // carries touch-action so that a touch drag does not scroll the page.
    const camera = createUnifiedCamera(vortexCanvas.canvas, {
      mode: 'orbit',
      center: [0.5 * flow.Lx, -0.1, 0.5 * flow.Lz],
      distance: 1.1 * Math.hypot(flow.Lx, 2, flow.Lz) + 0.5,
      phi: 2.25,
      theta: 0.43,
      fov: Math.PI / 5,
      near: 0.05,
      far: 200,
      renderContinuously: true,
    });
    invalidation.then(() => camera.destroy());
    const sideView = makeCanvas('channel-side-view', 2 / flow.Lx);
    const planView = makeCanvas('channel-plan-view', flow.Lz / flow.Lx);
    const statusLine = html`<div id="channel-status" style="font: 12px var(--monospace, monospace); white-space: pre-wrap"></div>`;
    display(html`<figure id="channel-figure" style="max-width: ${figureWidth}px">
      <div style="font-size: 0.8em">Vortices: isosurface of Q, coloured by streamwise velocity</div>
      <div id="channel-vortices-container" style="touch-action: none">${vortexCanvas.canvas}</div>
      <div style="font-size: 0.8em; margin-top: 6px">Side view (x–y) at mid-span</div>
      ${sideView.canvas}
      <div style="font-size: 0.8em; margin-top: 6px">Plan view (x–z)</div>
      ${planView.canvas}
      ${statusLine}
    </figure>`);
  </script>

  <script id="simulation-loop" type="module">
    // Row nearest the requested distance from the lower wall, in half-heights.
    const planRow = (() => {
      const distance = (j) => Math.abs(flow.yCenters[j] - flow.yFaces[0] - planHeight);
      let best = 0;
      for (let j = 0; j < flow.Ny / 2; j++) if (distance(j) < distance(best)) best = j;
      return best;
    })();

    const colourRange = (stats) => {
      const centre = stats.u[flow.Ny >> 1];
      const rms = (a) => Math.sqrt(Math.max(...a));
      if (sliceComponent === 'u') return { lo: 0, hi: 1.15 * centre, diverging: false };
      if (sliceComponent === 'v') return { lo: -3 * rms(stats.vv) - 1e-3, hi: 3 * rms(stats.vv) + 1e-3, diverging: true };
      if (sliceComponent === 'w') return { lo: -3 * rms(stats.ww) - 1e-3, hi: 3 * rms(stats.ww) + 1e-3, diverging: true };
      return { lo: -0.03 * centre * centre, hi: 0.03 * centre * centre, diverging: true };
    };

    let frame = 0;
    let pending = false;
    const loop = createFrameLoop(() => {
      const stats = live.stats;
      if (running && !live.failed) {
        flow.advance(flow.stableTimeStep(stats, 0.5), stepsPerFrame);
      }
      // Statistics lag the state by a few frames; the time step has enough
      // margin to absorb that.
      if (!pending && frame % 5 === 0) {
        pending = true;
        flow.statistics().then((next) => {
          pending = false;
          if (!next) return;
          if (!Number.isFinite(next.maxCfl) || !Number.isFinite(next.kineticEnergy)) {
            live.failed = true;
            return;
          }
          live.stats = next;
          if (scales.fluxTarget !== null) flow.sim.forcing = fluxForcing(next, scales.fluxTarget, 1);
          const last = live.history[live.history.length - 1];
          if (!last || next.time > last.time) {
            live.history.push({
              time: next.time,
              lower: next.wallShear[0] / scales.drive,
              upper: next.wallShear[1] / scales.drive,
              bulk: next.bulkVelocity,
            });
            if (live.history.length > 4000) live.history.splice(0, 2000);
          }
        });
      }
      const range = colourRange(stats);
      const encoder = device.createCommandEncoder();
      sliceView.draw(encoder, sideView.context.getCurrentTexture().createView(), {
        plane: 'xy', index: flow.Nz >> 1, component: sliceComponent, ...range,
      });
      sliceView.draw(encoder, planView.context.getCurrentTexture().createView(), {
        plane: 'xz', index: planRow, component: sliceComponent, ...range,
      });
      if (showVortices) {
        const { canvas, context } = vortexCanvas;
        const { projView, eye } = camera.update(canvas.width / canvas.height);
        vortices.extract(encoder, qLevel * scales.qScale);
        vortexView.draw(encoder, context.getCurrentTexture().createView(), canvas.width, canvas.height, {
          projView, eye, lo: 0, hi: 1.1 * stats.u[flow.Ny >> 1],
        });
      }
      device.queue.submit([encoder.finish()]);
      if (showVortices && frame % 30 === 0) {
        vortices.vertexCount().then((n) => {
          if (n !== null) live.triangles = n / 3;
        });
      }
      if (frame % 10 === 0) {
        statusLine.textContent = live.failed
          ? 'The solution became non-finite. Restart with a finer grid or a smaller disturbance.'
          : `t = ${stats.time.toFixed(3)}   step ${flow.steps}   dt = ${(flow.sim.dt || 0).toExponential(2)}\n` +
            `bulk velocity ${stats.bulkVelocity.toFixed(3)}   wall shear / initial drive ` +
            `${(stats.wallShear[0] / scales.drive).toFixed(3)}, ${(stats.wallShear[1] / scales.drive).toFixed(3)}   ` +
            `max |div| ${stats.maxDivergence.toExponential(1)}` +
            (showVortices
              ? `\n${Math.round(live.triangles).toLocaleString()} triangles` +
                (3 * live.triangles > vortices.capacity ? ' (truncated: raise the threshold)' : '')
              : '');
      }
      frame++;
    });
    invalidation.then(() => loop.cancel());
  </script>

  <script id="statistics-heading" type="text/markdown">
    ### Statistics

    The mean velocity profile is an average over the two homogeneous directions and both halves of the channel at the current instant, not over time, so it fluctuates. The dashed lines are the viscous sublayer ${tex`u^+ = y^+`} and the logarithmic law ${tex`u^+ = \ln(y^+)/0.41 + 5.2`}. The wall shear stress is shown relative to the force that drove the flow at the start, so it is one for a flow in balance with that force; it rises above one when a laminar flow held at fixed mass flux starts to break down.
  </script>

  <script id="statistics-plots" type="module">
    const plotHolder = display(html`<div id="channel-statistics"></div>`);
    const drawPlots = () => {
      const stats = live.stats;
      const half = flow.Ny >> 1;
      const uTau = Math.sqrt(Math.max(0.5 * (stats.wallShear[0] + stats.wallShear[1]), 1e-12));
      const profile = Array.from({ length: half }, (_, j) => ({
        yPlus: ((flow.yCenters[j] - flow.yFaces[0]) * uTau) / flow.sim.nu,
        uPlus: (0.5 * (stats.u[j] + stats.u[flow.Ny - 1 - j])) / uTau,
      }));
      const sublayer = d3.range(0.5, 12, 0.5).map((y) => ({ yPlus: y, uPlus: y }));
      const reNow = uTau / flow.sim.nu;
      const logLaw = d3.range(10, Math.max(reNow, 15), 5).map((y) => ({ yPlus: y, uPlus: Math.log(y) / 0.41 + 5.2 }));
      const plotWidth = Math.min(width, 640);
      plotHolder.replaceChildren(
        Plot.plot({
          width: plotWidth,
          height: 280,
          x: { type: 'log', label: 'y⁺', domain: [0.5, Math.max(reNow, 15)] },
          y: { label: 'u⁺', domain: [0, Math.max(25, 1.05 * d3.max(profile, (d) => d.uPlus))] },
          marks: [
            Plot.line(sublayer, { x: 'yPlus', y: 'uPlus', strokeDasharray: '4 3', stroke: 'currentColor', strokeOpacity: 0.5 }),
            Plot.line(logLaw, { x: 'yPlus', y: 'uPlus', strokeDasharray: '4 3', stroke: 'currentColor', strokeOpacity: 0.5 }),
            Plot.line(profile, { x: 'yPlus', y: 'uPlus', stroke: 'steelblue', strokeWidth: 2 }),
          ],
        }),
        Plot.plot({
          width: plotWidth,
          height: 200,
          x: { label: 'time' },
          y: { label: 'wall shear stress / initial driving force' },
          marks: [
            Plot.ruleY([1], { strokeOpacity: 0.4 }),
            Plot.line(live.history, { x: 'time', y: 'lower', stroke: 'steelblue' }),
            Plot.line(live.history, { x: 'time', y: 'upper', stroke: 'tomato' }),
          ],
        })
      );
    };
    drawPlots();
    const plotTimer = setInterval(drawPlots, 1000);
    invalidation.then(() => clearInterval(plotTimer));
  </script>

  <script id="stability-text" type="text/markdown">
    ## Linear stability

    A wave proportional to ${tex`e^{i(\alpha x + \beta z - \alpha c t)}`} on the parabolic profile has a wall-normal velocity that satisfies the Orr–Sommerfeld equation,

    ${tex.block`\left[(U - c)\left(D^2 - k^2\right) - U''\right]\hat v - \frac{1}{i \alpha Re}\left(D^2 - k^2\right)^2 \hat v = 0, \qquad k^2 = \alpha^2 + \beta^2,`}

    an eigenvalue problem for the complex phase speed ${tex`c`}. The wave grows when ${tex`\operatorname{Im} c > 0`}. It is solved here by Chebyshev collocation. The plot shows the spectrum for the plane wave; the Tollmien–Schlichting wave is the isolated eigenvalue at the top left, and it is the only one that ever crosses into the upper half-plane.
  </script>

  <script id="stability-inputs" type="module">
    const stabilityRe = view(Inputs.range([1000, 20000], { label: 'Reynolds number', step: 100, value: 5000 }));
    const stabilityAlpha = view(Inputs.range([0.5, 1.5], { label: 'Streamwise wavenumber α', step: 0.01, value: 1.12 }));
  </script>

  <script id="stability-plot" type="module">
    const spectrum = orrSommerfeldSpectrum({ re: stabilityRe, alpha: stabilityAlpha });
    const leading = spectrum.find((c) => c.re < 0.6);
    display(html`<p style="font-size: 0.9em">
      Tollmien–Schlichting wave: c = ${leading.re.toFixed(6)} ${leading.im < 0 ? '−' : '+'} ${Math.abs(leading.im).toFixed(6)} i,
      amplitude growth rate ${(stabilityAlpha * leading.im).toExponential(3)} per time unit
      (${leading.im > 0 ? 'unstable' : 'stable'}).
    </p>`);
    display(Plot.plot({
      width: Math.min(width, 640),
      height: 320,
      x: { label: 'Re c', domain: [0, 1] },
      y: { label: 'Im c', domain: [-1, 0.1] },
      marks: [
        Plot.ruleY([0], { strokeOpacity: 0.4 }),
        Plot.dot(spectrum, { x: 're', y: 'im', r: 2.5, fill: 'steelblue' }),
        Plot.dot([leading], { x: 're', y: 'im', r: 5, stroke: 'tomato' }),
      ],
    }));
  </script>

  <script id="stability-waves" type="module">
    if (waves) {
      const describe = (m) => `c = ${m.c.re.toFixed(5)} ${m.c.im < 0 ? '−' : '+'} ${Math.abs(m.c.im).toFixed(5)} i`;
      display(html`<p style="font-size: 0.9em">
        Waves seeding the current run: plane wave ${describe(waves.plane)}; oblique pair ${describe(waves.oblique)}.
        Both are damped on their own at this Reynolds number; the oblique pair grows only because of the plane wave.
      </p>`);
    }
  </script>

  <script id="flow-validation-text" type="text/markdown">
    ## Flow solver validation

    Exact solutions and conservation properties, with double-precision references. The Taylor–Green vortex tests the periodic directions and the spatial order; the inviscid run tests that the convective terms conserve energy on a stretched grid, leaving only the third-order error of the time integrator; the two laminar channel cases test the walls, the wall-normal diffusion and the forcing. The Tollmien–Schlichting rows check the stability solver against a published eigenvalue, and that a small wave in the flow solver grows at the rate the linear theory predicts, which any numerical dissipation would spoil. The last rows check the Q field against an analytic one, and that marching cubes turns a sphere into a closed surface of the right area.
  </script>

  <script id="flow-validation-run" type="module">
    const flowValidationRun = view(Inputs.button('Run flow validation'));
  </script>

  <script id="flow-validation" type="module">
    if (flowValidationRun > 0) {
      const flowRows = [...(await validateChannelFlow(device)), ...(await validateQCriterion(device))];
      display(Inputs.table(flowRows, {
        columns: ['pass', 'test', 'grid', 'value', 'limit'],
        format: {
          pass: (d) => (d ? '✓' : '✗'),
          value: (d) => d.toExponential(2),
          limit: (d) => d.toExponential(0),
        },
        width: { pass: 40, value: 80, limit: 60 },
        rows: 30,
        select: false,
      }));
    }
  </script>

  <script id="validation-text" type="text/markdown">
    ## Pressure solver validation

    Each row compares the single-precision GPU result with a double-precision reference computed on the CPU. The projection rows subtract the pressure gradient from a random staggered velocity field and report how much of its divergence survives.
  </script>

  <script id="validation-run" type="module">
    const validationRun = view(Inputs.button('Run pressure solver validation'));
  </script>

  <script id="validation" type="module">
    if (validationRun > 0) {
    const validationRows = await validateChannelPoisson(device);
    display(Inputs.table(validationRows, {
      columns: ['pass', 'test', 'grid', 'value', 'limit'],
      format: {
        pass: (d) => (d ? '✓' : '✗'),
        value: (d) => d.toExponential(2),
        limit: (d) => d.toExponential(0),
      },
      width: { pass: 40, value: 80, limit: 60 },
      rows: 30,
      select: false,
    }));
    }
  </script>

  <script id="benchmark-text" type="text/markdown">
    ## Pressure solver timing

    Per-pass GPU time, averaged over repeated solves. Per-pass times need the `timestamp-query` feature; without it only the wall-clock total is reported.
  </script>

  <script id="benchmark-inputs" type="module">
    const benchNx = view(Inputs.select([64, 128, 256, 512], { label: 'Nx', value: 256 }));
    const benchNy = view(Inputs.select([64, 96, 128, 160, 192, 256], { label: 'Ny', value: 128 }));
    const benchNz = view(Inputs.select([32, 64, 128, 256], { label: 'Nz', value: 128 }));
    const benchInvocations = view(Inputs.select([32, 64, 128, 256], {
      label: 'Max FFT workgroup size',
      value: 256,
    }));
    const benchRun = view(Inputs.button('Run benchmark'));
  </script>

  <script id="benchmark" type="module">
    if (benchRun > 0) {
    const benchResult = await benchmarkChannelPoisson(device, {
      Nx: benchNx,
      Ny: benchNy,
      Nz: benchNz,
      Lx: 4 * Math.PI,
      Lz: 2 * Math.PI,
      yFaces: tanhFaces(benchNy, 2),
      maxInvocations: benchInvocations,
    });
    const mcells = benchResult.cells / 1e6;
    display(html`<p>
      ${mcells.toFixed(2)} million cells,
      ${(benchResult.bytes / 2 ** 20).toFixed(0)} MB of solver buffers,
      ${benchResult.totalMs.toFixed(2)} ms per solve
      (${(benchResult.totalMs / mcells).toFixed(2)} ms per million cells, ${benchResult.method}).
    </p>`);
    if (benchResult.stages.length) {
      display(Inputs.table(benchResult.stages, {
        columns: ['label', 'ms'],
        header: { label: 'pass', ms: 'ms' },
        format: { ms: (d) => d.toFixed(3) },
        select: false,
      }));
    }
    }
  </script>
